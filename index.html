          gs.transformOrigin = (rootBox.w / 2 - minX) + "vmin " + (rootBox.h / 2 - minY) + "vmin";
          const moves = [];
          if (root.dx || root.dy) moves.push("translate(" + root.dx + "vw, " + root.dy + "vh)");
          if (root.rotation) moves.push("rotate(" + root.rotation + "deg)");
          gs.transform = moves.join(" ");

          const kids = view.group.children;
          g.boxes.slice().sort((a, b) => order.get(a.wm.id) - order.get(b.wm.id)).forEach((b, i) => {
            const node = watermarkNodeFor(b.wm);
            const ns = node.style;
            ns.left = (b.x - minX) + "vmin";
            ns.top = (b.y - minY) + "vmin";
            // O texto tem a largura do próprio conteúdo (white-space: pre).
            if (!isTextMark(b.wm)) {
              ns.width = b.w + "vmin";
              ns.height = b.h + "vmin";
            }
            if (kids[i] !== node) view.group.insertBefore(node, kids[i] || null);
            placed.add(b.wm.id);
          });
          while (kids.length > g.boxes.length) kids[kids.length - 1].remove();
        });
        // Marca escondida sai do DOM, mas o elemento fica guardado (a
        // imagem com o src); marca apagada solta a data URL de vez.
        wmNodes.forEach((node, id) => {
          if (placed.has(id)) return;
          node.remove();
          if (order.has(id)) return;
          wmNodes.delete(id);
          wmShown.delete(id);
        });
        watermarkEl.hidden = !placed.size;
      }

      // --- Fontes do Google Fonts --------------------------------------------
      // Um <link> por família, só das que estão em uso em algum texto do
      // mapa — quem só consulta o mapa não baixa o catálogo inteiro. Com o
      // painel de aparência aberto, entram todas (`all`), para a lista de
      // fontes mostrar cada uma no próprio desenho e a troca ser imediata.
      // Os links só são acrescentados; a exportação leva apenas os das
      // fontes em uso (ver withPristineDom).
      function fontsInUse() {
        const used = new Set([
          theme.coreText.font, theme.title.font, theme.subtitle.font,
          theme.searchText.font, theme.searchHint.font,
        ]);
        theme.watermarks.forEach((wm) => { if (isTextMark(wm)) used.add(wm.font); });
        return used;
      }

      function loadFonts(all) {
        const wanted = all ? new Set(Object.keys(FONTS)) : fontsInUse();
        wanted.forEach((key) => {
          const font = FONTS[key];
          if (!font || !font.google || document.head.querySelector('link[data-font="' + key + '"]')) return;
          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.dataset.font = key;
          link.href = "https://fonts.googleapis.com/css2?family=" + font.google + "&display=swap";
          document.head.appendChild(link);
        });
      }

      // --- Tamanho do tronco ------------------------------------------------
      // O círculo cresce para caber o texto formatado, sem deixar de ser
      // círculo, e nunca fica menor que o do jogo de medidas (M.coreR). O
      // teste é geométrico: cada linha do rótulo é um retângulo, e o canto
      // mais afastado de todos tem de ficar dentro do círculo, com folga.
      // Medir a caixa do rótulo inteira não serviria — ela é retangular, e
      // o círculo corta os cantos dela muito antes de o texto encostar na
      // borda.
      //
      // Crescer pode fazer o texto requebrar em menos linhas e mais longas,
      // que pedem outro tamanho; por isso a conta se repete até assentar.
      // Quem manda na posição do mapa é ROOT.r, então ele muda junto; a
      // função devolve true quando o raio mudou, e quem chama decide se o
      // mapa precisa se reacomodar.
      //
      // A variável do CSS é escrita sempre que diverge do que foi escrito
      // por último, e não só quando o raio muda: um HTML exportado no
      // celular chega com o --core-size de lá embutido no <html>.
      let coreSizeWritten = 0;
      function fitCoreSize() {
        const base = M.coreR * 2;
        const max = base * 3;
        const s = coreButton.style;
        let size = base;
        for (let i = 0; i < 24; i += 1) {
          // Inline só durante a medição: mexer na variável do :root a cada
          // tentativa recalcularia o estilo da página inteira.
          s.width = size + "px";
          s.minHeight = size + "px";
          const need = Math.ceil(2 * (coreTextReach() + M.coreTextPad));
          if (need <= size || size >= max) break;
          size = Math.min(max, Math.max(size + 2, need));
        }
        s.width = "";
        s.minHeight = "";
        if (coreSizeWritten !== size) {
          document.documentElement.style.setProperty("--core-size", size + "px");
          coreSizeWritten = size;
        }
        if (ROOT.r === size / 2) return false;
        ROOT.r = size / 2;
        return true;
      }

      // Distância do centro do círculo até o canto de texto mais afastado,
      // em px do layout. getClientRects() devolve uma caixa por linha, mas
      // já com o zoom da câmera (e o scale do hover) aplicado; a razão
      // entre a caixa na tela e offsetWidth desfaz isso.
      function coreTextReach() {
        const box = coreButton.getBoundingClientRect();
        const k = coreButton.offsetWidth ? box.width / coreButton.offsetWidth : 0;
        if (!k) return 0;
        const cx = box.left + box.width / 2;
        const cy = box.top + box.height / 2;
        const range = document.createRange();
        range.selectNodeContents(coreLabel);
        let reach = 0;
        Array.prototype.forEach.call(range.getClientRects(), (r) => {
          const dx = Math.max(Math.abs(r.left - cx), Math.abs(r.right - cx));
          const dy = Math.max(Math.abs(r.top - cy), Math.abs(r.bottom - cy));
          reach = Math.max(reach, Math.hypot(dx, dy) / k);
        });
        return reach;
      }

      // Depois de mexer no rótulo do tronco: se o círculo mudou de tamanho,
      // o mapa se reacomoda em volta dele. Antes do primeiro render não há
      // nada montado para mover — o render já sai com o raio novo. Devolve
      // true quando reacomodou (e, com isso, já reenquadrou a câmera).
      function refreshCoreSize() {
        if (!fitCoreSize() || !nodeById.size) return false;
        relayout(0);
        autoFit(0);
        return true;
      }

      // Repinta os nós já montados sem reconstruir a árvore: mudar cor não
      // mexe em tamanho nem em posição, então não há por que remedir.
      function applyNodeColors() {
        nodeById.forEach((node) => {
          if (node.depth === 0 || !node.el) return;
          const button = node.el.querySelector(".branch-button");
          if (!button) return;
          const color = colorFor(node);
          button.style.background = color.bg;
          button.style.color = color.fg;
          const name = button.querySelector(".branch-name");
          if (name) name.style.color = color.fg;
        });
      }

      // --- Categorias ---------------------------------------------------
      // "node"    : galho. Nasce de qualquer nó e continua a árvore.
      // "subnode" : folha do galho. Só nasce de um nó-folha (um nó que
      //             ainda não tem nenhum filho do tipo "node") e é sempre
      //             terminal — não recebe filhos de espécie alguma.
      // Consequência das duas regras juntas: um nó ou continua o galho com
      // nós, ou o encerra com subnós. Nunca as duas coisas ao mesmo tempo.
      const NODE = "node";
      const SUBNODE = "subnode";

      const treeData = {
        root: {
          id: "root", label: "BUCAREIN", url: "", type: NODE,
          children: [
            {
              id: "objective", label: "Objetivo", url: "", type: NODE, children: [
                { id: "objective-sub-1", label: "Resultado desejado", url: "", type: SUBNODE, children: [] },
                { id: "objective-sub-2", label: "Critério de sucesso", url: "", type: SUBNODE, children: [] },
              ],
            },
            {
              id: "ideas", label: "Ideias", url: "", type: NODE, children: [
                { id: "ideas-sub-1", label: "Possibilidades", url: "", type: SUBNODE, children: [] },
                { id: "ideas-sub-2", label: "Perguntas-chave", url: "", type: SUBNODE, children: [] },
              ],
            },
            {
              id: "resources", label: "Recursos", url: "", type: NODE, children: [
                { id: "resources-sub-1", label: "Pessoas e apoio", url: "", type: SUBNODE, children: [] },
                { id: "resources-sub-2", label: "Ferramentas", url: "", type: SUBNODE, children: [] },
              ],
            },
            {
              id: "next", label: "Próximos passos", url: "", type: NODE, children: [
                { id: "next-sub-1", label: "Primeira ação", url: "", type: SUBNODE, children: [] },
                { id: "next-sub-2", label: "Prazo e revisão", url: "", type: SUBNODE, children: [] },
              ],
            },
          ],
        },
      };

      function isSub(node) {
        return node.type === SUBNODE;
      }

      function hasNodeChild(node) {
        return node.children.some((child) => !isSub(child));
      }

      function hasSubChild(node) {
        return node.children.some(isSub);
      }

      // Um nó aceita novos nós enquanto não tiver encerrado o galho com
      // subnós. Subnós nunca aceitam filhos.
      function canAddNode(node) {
        return !isSub(node) && !hasSubChild(node);
      }

      // Subnós só pendem da ponta de um galho. A raiz é o tronco: ela
      // sempre inicia galhos, nunca recebe folhagem direto.
      function canAddSub(node) {
        return !isSub(node) && node !== treeData.root && !hasNodeChild(node);
      }

      // Meia-largura e meia-altura da caixa. A altura do subnó depende do
      // texto renderizado, então vem de measureNodes(); as constantes só
      // valem como estimativa antes da primeira medição.
      function halfW(node) {
        return node.depth === 0 ? ROOT.r : (node.w || M.nodeW) / 2;
      }

      function halfH(node) {
        if (node.depth === 0) return ROOT.r;
        return (node.h || (isSub(node) ? M.subMinH : M.nodeMinH)) / 2;
      }

      function countWords(text) {
        const trimmed = String(text).trim();
        return trimmed ? trimmed.split(/\s+/).length : 0;
      }

      // Rótulos de subnó podem ter centenas de palavras; onde o texto é lido
      // fora da caixa (leitor de tela, aviso de remoção) entra só um resumo.
      function shortLabel(node, max) {
        const limit = max || 60;
        const flat = String(node.label).replace(/\s+/g, " ").trim();
        return flat.length > limit ? flat.slice(0, limit - 1) + "…" : flat;
      }

      let nodeById = new Map();
      let nodeCounter = 0;
      function newNodeId() {
        nodeCounter += 1;
        return "node-" + Date.now().toString(36) + "-" + nodeCounter;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, (ch) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[ch]));
      }

      // --- Persistência: nenhuma no navegador. Toda abertura parte do mapa
      // embutido no próprio arquivo (o seed — o que está no servidor), e o
      // que o modo dev muda vale só até fechar ou recarregar a aba. O mapa
      // sai por exportação, em .json ou em .html autocontido. ---
      const MAP_FORMAT = "mapaPOPs";
      // v4: cor do texto por nó (textColor) e, no tema, textos, tronco,
      // título e marca d'água. v5: subtítulo, formatação da pesquisa,
      // várias marcas d'água (a `watermark` única da v4 vira a primeira da
      // lista), marcas de texto e fontes do Google Fonts. Arquivos antigos
      // abrem normalmente — o que falta neles volta ao padrão no saneamento.
      const MAP_FORMAT_VERSION = 5;

      function serializeNode(node) {
        return {
          id: node.id,
          label: node.label,
          url: node.url || "",
          pdf: node.pdf || "",
          color: node.color || "",
          textColor: node.textColor || "",
          type: isSub(node) ? SUBNODE : NODE,
          children: node.children.map(serializeNode),
        };
      }

      // Há edição que ainda não saiu em nenhum arquivo exportado. Enquanto
      // houver, fechar ou recarregar a aba pede confirmação: sem rascunho no
      // navegador, ela se perderia ali. Exportar zera.
      let unsavedChanges = false;
      function markChanged() {
        unsavedChanges = true;
      }

      // O navegador mostra a pergunta dele (o texto de um site é ignorado);
      // returnValue é para os navegadores mais antigos.
      window.addEventListener("beforeunload", (event) => {
        if (!unsavedChanges) return;
        event.preventDefault();
        event.returnValue = "";
      });

      // As versões anteriores guardavam um rascunho do mapa no localStorage
      // (árvore, tema, imagens das marcas d'água e o carimbo do seed), todo
      // sob chaves "mapaPOPs.". Nada disso é lido mais: apagar devolve o
      // espaço a quem abriu a página antes.
      function clearOldDrafts() {
        try {
          const old = [];
          for (let i = 0; i < localStorage.length; i += 1) {
            const key = localStorage.key(i);
            if (key && key.indexOf(MAP_FORMAT + ".") === 0) old.push(key);
          }
          old.forEach((key) => localStorage.removeItem(key));
        } catch (e) {
          // localStorage indisponível (ex.: navegação privada): nada a limpar.
        }
      }

      // Cor em hexadecimal normalizada para #rrggbb, ou "" se não for uma.
      function cleanHex(value) {
        return typeof value === "string" && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(value.trim())
          ? rgbToHex(hexToRgb(value))
          : "";
      }

      // Só data URL de imagem, e em base64 — é o que o envio produz. Nada de
      // endereço externo: a marca d'água tem de viajar dentro do arquivo.
      const IMAGE_DATA_URL = /^data:image\/(png|jpeg|webp|gif|svg\+xml);base64,[a-z0-9+/]+=*$/i;

      // Id de uma marca d'água: vira parte do caminho dos controles do
      // painel, então fica curto e simples.
      const WATERMARK_ID = /^[a-z0-9-]{1,40}$/i;
      const WATERMARK_NAME_LIMIT = 40;

      // Chaves de texto dos grupos aninhados do tema, e o que cada uma
      // aceita. Devolver undefined mantém o padrão. As de "watermark" valem
      // para cada entrada da lista de marcas d'água.
      const fontRule = (v) => (hasOwn(FONTS, v) ? v : undefined);
      const autoColorRule = (v) => (v === "" ? "" : cleanHex(v) || undefined);
      const TEXT_RULES = {
        "coreText.font": fontRule,
        "coreText.color": autoColorRule,
        "coreText.align": (v) => (["left", "center", "right"].indexOf(v) >= 0 ? v : undefined),
        "coreShadow.color": (v) => cleanHex(v) || undefined,
        "title.text": (v) => v.slice(0, TITLE_CHAR_LIMIT),
        "title.font": fontRule,
        "title.color": autoColorRule,
        "subtitle.text": (v) => v.slice(0, SUBTITLE_CHAR_LIMIT),
        "subtitle.font": fontRule,
        "subtitle.color": autoColorRule,
        "subtitle.place": (v) => (v === "above" || v === "below" ? v : undefined),
        "searchBox.placeholder": (v) => v.slice(0, SEARCH_HINT_LIMIT),
        "searchBox.background": autoColorRule,
        "searchBox.border": autoColorRule,
        "searchBox.icon": autoColorRule,
        "searchText.font": fontRule,
        "searchText.color": autoColorRule,
        "searchHint.font": fontRule,
        "searchHint.color": autoColorRule,
        "watermark.id": (v) => (WATERMARK_ID.test(v) ? v : undefined),
        "watermark.name": (v) => v.slice(0, WATERMARK_NAME_LIMIT),
        "watermark.image": (v) => (v === "" || IMAGE_DATA_URL.test(v) ? v : undefined),
        "watermark.position": (v) => (hasOwn(GRID_POSITIONS, v) ? v : undefined),
        "watermark.to": (v) => (v === "" || WATERMARK_ID.test(v) ? v : undefined),
        "watermark.side": (v) => (WATERMARK_SIDES.indexOf(v) >= 0 ? v : undefined),
        "watermark.align": (v) => (WATERMARK_ALIGNS.indexOf(v) >= 0 ? v : undefined),
        "watermark.kind": (v) => (v === "image" || v === "text" ? v : undefined),
        "watermark.text": (v) => v.slice(0, WATERMARK_TEXT_LIMIT),
        "watermark.font": fontRule,
        "watermark.color": (v) => cleanHex(v) || undefined,
        "watermark.textAlign": (v) => (["left", "center", "right"].indexOf(v) >= 0 ? v : undefined),
        "watermark.bgColor": (v) => cleanHex(v) || undefined,
        "watermark.strokeColor": (v) => cleanHex(v) || undefined,
        "watermark.shadowColor": (v) => cleanHex(v) || undefined,
      };

      // Uma chave de grupo: número preso à faixa do controle, booleano, ou
      // texto pela regra própria. Tipo errado mantém o padrão.
      function sanitizeSetting(group, key, value) {
        const limits = LIMITS[group] && LIMITS[group][key];
        if (limits) {
          return typeof value === "number" && isFinite(value)
            ? clamp(value, limits[0], limits[1])
            : undefined;
        }
        const defaults = group === "watermark" ? WATERMARK_DEFAULTS : DEFAULT_THEME[group];
        if (typeof defaults[key] === "boolean") {
          return typeof value === "boolean" ? value : undefined;
        }
        const rule = TEXT_RULES[group + "." + key];
        return rule && typeof value === "string" ? rule(value) : undefined;
      }

      let watermarkCounter = 0;
      function newWatermarkId() {
        watermarkCounter += 1;
        return "wm-" + Date.now().toString(36) + "-" + watermarkCounter;
      }

      // As marcas d'água de um tema vindo de fora. Um tema da v4 traz uma
      // `watermark` só, que vira a primeira da lista. Marca de imagem sem
      // imagem válida sai (as grudadas nela ocupam o lugar dela), `to` que
      // não aponta para outra marca vira solta, e um ciclo de grudadas é
      // cortado — nenhum deles teria como ser desenhado. Um texto vazio
      // fica: é só não aparecer até ganhar texto.
      function sanitizeWatermarks(raw) {
        const source = Array.isArray(raw.watermarks) ? raw.watermarks
          : raw.watermark && typeof raw.watermark === "object"
            ? [Object.assign({}, raw.watermark, { id: "wm-0" })]
            : [];
        let list = [];
        const ids = new Set();
        source.slice(0, WATERMARK_MAX).forEach((src) => {
          if (!src || typeof src !== "object") return;
          const wm = watermarkDefaults(src.kind === "text" ? "text" : "image");
          Object.keys(wm).forEach((key) => {
            const value = sanitizeSetting("watermark", key, src[key]);
            if (value !== undefined) wm[key] = value;
          });
          if (!wm.id || ids.has(wm.id)) wm.id = newWatermarkId();
          ids.add(wm.id);
          list.push(wm);
        });
        list.forEach((wm) => {
          if (wm.to === wm.id || !ids.has(wm.to)) wm.to = "";
        });
        const byId = new Map(list.map((wm) => [wm.id, wm]));
        list.forEach((wm) => {
          const path = new Set([wm.id]);
          for (let cur = wm; cur.to; cur = byId.get(cur.to)) {
            if (path.has(cur.to)) {
              cur.to = "";
              break;
            }
            path.add(cur.to);
          }
        });
        list.filter((wm) => !isTextMark(wm) && !wm.image).forEach((wm) => {
          list = removeWatermark(list, wm.id);
        });
        return list;
      }

      // Tira uma marca da lista, e as grudadas nela ocupam o lugar dela. Se
      // ela estava grudada em outra, as grudadas passam a grudar nessa
      // outra. Se era solta, a primeira grudada fica solta onde ela estava
      // — com a transparência e o giro que o conjunto já tinha — e as
      // outras passam a grudar nessa primeira, cada uma no seu lado. Assim
      // nenhuma imagem se perde e o conjunto muda o mínimo.
      function removeWatermark(list, id) {
        const gone = list.find((wm) => wm.id === id);
        if (!gone) return list;
        const rest = list.filter((wm) => wm !== gone);
        const orphans = rest.filter((wm) => wm.to === id);
        if (gone.to) {
          orphans.forEach((wm) => { wm.to = gone.to; });
        } else if (orphans.length) {
          const heir = orphans[0];
          ["position", "margin", "dx", "dy", "transparency", "rotation"].forEach((key) => {
            heir[key] = gone[key];
          });
          heir.to = "";
          orphans.slice(1).forEach((wm) => { wm.to = heir.id; });
        }
        return rest;
      }

      // O tema é guardado à parte da árvore: são coisas com ciclos de vida
      // diferentes (importar um mapa não precisa levar junto as cores de
      // quem exportou, mas pode). Só sobrevivem as chaves conhecidas.
      function sanitizeTheme(raw) {
        const clean = defaultTheme();
        if (!raw || typeof raw !== "object") return clean;
        ["background", "core", "coreEnd", "line", "blobA", "blobB"].forEach((key) => {
          clean[key] = cleanHex(raw[key]) || clean[key];
        });
        if (typeof raw.blobs === "boolean") clean.blobs = raw.blobs;
        if (raw.branches && typeof raw.branches === "object") {
          Object.keys(raw.branches).forEach((id) => {
            const value = cleanHex(raw.branches[id]);
            if (value && id !== "__proto__") clean.branches[id] = value;
          });
        }
        clean.nodeText = cleanHex(raw.nodeText);
        clean.subText = cleanHex(raw.subText);
        if (raw.branchText && typeof raw.branchText === "object") {
          Object.keys(raw.branchText).forEach((id) => {
            const entry = raw.branchText[id];
            if (!entry || typeof entry !== "object" || id === "__proto__") return;
            const pair = {};
            if (cleanHex(entry.node)) pair.node = cleanHex(entry.node);
            if (cleanHex(entry.sub)) pair.sub = cleanHex(entry.sub);
            if (pair.node || pair.sub) clean.branchText[id] = pair;
          });
        }
        ["coreText", "coreShadow", "title", "subtitle", "searchBox", "searchText", "searchHint"].forEach((group) => {
          const src = raw[group];
          if (!src || typeof src !== "object") return;
          Object.keys(clean[group]).forEach((key) => {
            const value = sanitizeSetting(group, key, src[key]);
            if (value !== undefined) clean[group][key] = value;
          });
        });
        clean.watermarks = sanitizeWatermarks(raw);
        if (raw.hud && typeof raw.hud === "object") {
          Object.keys(clean.hud).forEach((item) => {
            const src = raw.hud[item];
            if (!src || typeof src !== "object") return;
            const cfg = clean.hud[item];
            if (typeof src.show === "boolean") cfg.show = src.show;
            if (typeof src.position === "string" && hasOwn(GRID_POSITIONS, src.position)) {
              cfg.position = src.position;
            }
            ["offset", "scale"].forEach((key) => {
              const lim = LIMITS.hud[key];
              if (hasOwn(cfg, key) && typeof src[key] === "number" && isFinite(src[key])) {
                cfg[key] = clamp(src[key], lim[0], lim[1]);
              }
            });
          });
        }
        return clean;
      }

      // Mapas salvos antes das categorias não têm `type`. Nesses casos a
      // categoria é inferida da aparência que o nó já tinha: da segunda
      // geração em diante, quem não tinha filhos era desenhado na cor
      // clara — ou seja, já era um subnó na prática.
      function reviveChildren(list, depth) {
        if (!Array.isArray(list)) return [];
        return list.map((n) => {
          const children = reviveChildren(n && n.children, depth + 1);
          let type = n && (n.type === SUBNODE || n.type === NODE) ? n.type : null;
          if (!type) type = depth >= 2 && children.length === 0 ? SUBNODE : NODE;
          if (children.length) type = NODE; // subnó é sempre terminal
          return {
            id: (n && n.id) || newNodeId(),
            label: (n && n.label) || "",
            url: (n && n.url) || "",
            pdf: (n && n.pdf) || "",
            color: cleanHex(n && n.color),
            textColor: cleanHex(n && n.textColor),
            type: type,
            children: children,
          };
        });
      }

      // Garante a exclusividade entre as categorias em dados antigos: se um
      // nó ficou com filhos das duas espécies, os subnós são promovidos a
      // nós — assim nada some do mapa e a regra volta a valer.
      function normalizeTypes(node) {
        if (node.children.length && hasNodeChild(node)) {
          node.children.forEach((child) => { child.type = NODE; });
        }
        node.children.forEach(normalizeTypes);
      }

      // Aceita tanto o envelope de exportação quanto um nó solto — que era o
      // formato do rascunho que as versões anteriores gravavam no
      // localStorage. Assim um mapa antigo continua abrindo sem conversão.
      function readEnvelope(parsed) {
        if (!parsed || typeof parsed !== "object") return null;
        if (parsed.format === MAP_FORMAT && parsed.root && typeof parsed.root === "object") {
          return parsed.root;
        }
        if (Array.isArray(parsed.children) || typeof parsed.label === "string") return parsed;
        return null;
      }

      function buildEnvelope() {
        return {
          format: MAP_FORMAT,
          version: MAP_FORMAT_VERSION,
          exportedAt: new Date().toISOString(),
          theme: theme,
          root: serializeNode(treeData.root),
        };
      }

      // O tema viaja no envelope, mas só é adotado se vier de fato — mapas
      // da v2 não têm esse campo e devem manter as cores de quem importa.
      function adoptTheme(envelope) {
        if (!envelope || typeof envelope !== "object" || !envelope.theme) return false;
        theme = sanitizeTheme(envelope.theme);
        applyTheme();
        return true;
      }

      // Substitui a árvore inteira por um nó-raiz vindo de arquivo ou do
      // seed embutido, passando pelo mesmo saneamento do carregamento
      // normal (tipos inferidos e exclusividade nó/subnó reimposta).
      function adoptRoot(rootData) {
        treeData.root.label = rootData.label || treeData.root.label;
        treeData.root.url = "";
        treeData.root.pdf = "";
        treeData.root.type = NODE;
        treeData.root.children = reviveChildren(rootData.children, 1);
        normalizeTypes(treeData.root);
        coreLabel.textContent = treeData.root.label;
      }

      function readSeed() {
        const el = document.getElementById("map-seed");
        if (!el || !el.textContent.trim()) return null;
        try {
          return JSON.parse(el.textContent);
        } catch (e) {
          return null;
        }
      }

      function downloadFile(filename, mime, text) {
        const blob = new Blob([text], { type: mime });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function stamp() {
        const d = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      }

      // --- Layout: leque em arco, galhos lineares --------------------------
      // O tronco fica no meio e os setores se apoiam num arco à direita e à
      // esquerda dele. De cada setor para dentro o galho cresce na
      // horizontal, para o lado em que nasceu, com os irmãos empilhados na
      // vertical — assim a largura do galho não depende de onde ele nasceu
      // (uma caixa tem 214px de largura contra 70px de altura: empilhada de
      // lado ficaria três vezes mais larga).
      //
      // POR QUE OS GALHOS NÃO SE SOBREPÕEM MAIS
      // O anel de 360° escolhia o ângulo de cada setor por uma estimativa
      // (W·|sen θ| + H·|cos θ|) e errava por um fator de cos²: o vão entre
      // dois vizinhos vale arco·|cos θ|, mas a estimativa já tinha dividido
      // a altura por |cos θ| — o cosseno entrava duas vezes e sobrava menos
      // espaço do que o galho pedia. Dois galhos grandes no mesmo quadrante
      // se invadiam, e nenhum ajuste de folga resolvia, porque o erro era da
      // fórmula e não do tamanho da folga.
      //
      // Agora a garantia é estrutural, e não estimada:
      //   1. cada galho é medido pela caixa EXATA que envolve a subárvore
      //      visível (branchBox), percorrendo as mesmas contas que depois
      //      posicionam os nós — medir e posicionar não podem divergir;
      //   2. dentro de um lado os galhos são empilhados na vertical, um
      //      abaixo do outro: as faixas de y ficam disjuntas por construção;
      //   3. um lado nunca cruza o outro: toda caixa da direita começa em
      //      x ≥ coreGap e toda caixa da esquerda termina em x ≤ −coreGap.
      // Duas caixas quaisquer ou estão em lados opostos (separadas em x) ou
      // no mesmo lado (separadas em y). Não existe terceiro caso — é isso
      // que faz "nunca se sobrepõem" ser uma propriedade do algoritmo.
      //
      // O QUE SE MOVE
      // Duas coisas respondem ao tamanho dos galhos. A volta continua sendo
      // a mesma volta de sempre, mas ela é um anel: o par (por onde começa,
      // onde troca de lado) é reescolhido a cada desenho para equilibrar a
      // altura dos dois lados, então abrir um galho gigante gira o anel até
      // ele caber sozinho de um lado, com os fechados juntinhos do outro.
      // E o quanto cada setor se afasta do tronco
      // sai da distância vertical entre a faixa dele e a linha do tronco: os
      // de cima e os de baixo vêm para perto do eixo, os do meio se abrem —
      // é o arco que devolve a silhueta de anel do layout antigo. O arco é
      // só aparência e não pode criar sobreposição: empurrar um setor para
      // dentro ou para fora não muda a faixa de y dele.
      //
      // Só nós VISÍVEIS ocupam espaço: quem está fechado não reserva lugar,
      // e nós ocultos herdam a posição do pai para emergirem de dentro dele
      // quando abrem.
      //
      // As caixas não giram: rótulo inclinado seria ilegível.
      // ---------------------------------------------------------------------
      function layoutTree() {
        nodeById = new Map();

        // Índice e parentesco primeiro: computeVisibility() e colorFor()
        // dependem de depth/parent, e as duas rodam antes do posicionamento.
        (function index(node, depth, parent) {
          node.depth = depth;
          node.parent = parent;
          nodeById.set(node.id, node);
          node.children.forEach((child) => index(child, depth + 1, node));
        })(treeData.root, 0, null);

        computeVisibility();

        function visibleChildren(node) {
          return node.children.filter((child) => child.visible);
        }

        // Altura que o galho ocupa na vertical, empilhando irmãos visíveis.
        // O cache existe porque cada galho é percorrido duas vezes (uma para
        // medir, outra para posicionar) e sem ele a recursão viraria
        // quadrática num mapa de centenas de nós.
        const heightCache = new Map();
        function branchHeight(node) {
          const cached = heightCache.get(node);
          if (cached !== undefined) return cached;
          const kids = visibleChildren(node);
          const own = node.h || (isSub(node) ? M.subMinH : M.nodeMinH);
          let value = own;
          if (kids.length) {
            const total = kids.reduce((sum, kid) => sum + branchHeight(kid), 0)
              + M.siblingGap * (kids.length - 1);
            value = Math.max(own, total);
          }
          heightCache.set(node, value);
          return value;
        }

        // Percorre o galho inteiro entregando a posição RELATIVA ao nó de
        // origem, que fica em (0,0). Medir e posicionar saem daqui, das
        // mesmas contas — é o que impede a medida de um galho de discordar
        // de onde os nós dele realmente vão parar.
        function eachInBranch(node, dir, visit) {
          (function walk(n, rx, ry) {
            visit(n, rx, ry);
            const kids = visibleChildren(n);
            if (!kids.length) return;
            const heights = kids.map(branchHeight);
            const total = heights.reduce((a, b) => a + b, 0)
              + M.siblingGap * (kids.length - 1);
            let cursor = ry - total / 2;
            kids.forEach((kid, i) => {
              walk(kid, rx + dir * M.stepX, cursor + heights[i] / 2);
              cursor += heights[i] + M.siblingGap;
            });
          })(node, 0, 0);
        }

        // Caixa exata que envolve a subárvore visível, relativa ao setor.
        function branchBox(node, dir) {
          const box = { l: Infinity, r: -Infinity, t: Infinity, b: -Infinity };
          eachInBranch(node, dir, (n, rx, ry) => {
            box.l = Math.min(box.l, rx - halfW(n));
            box.r = Math.max(box.r, rx + halfW(n));
            box.t = Math.min(box.t, ry - halfH(n));
            box.b = Math.max(box.b, ry + halfH(n));
          });
          return box;
        }

        // Escreve as posições do galho, agora que o setor já tem a sua.
        function placeBranch(node, dir) {
          eachInBranch(node, dir, (n, rx, ry) => {
            if (n === node) return;
            n.x = node.x + rx;
            n.y = node.y + ry;
          });
        }

        // Altura de uma pilha de galhos, com as folgas entre eles.
        function stackHeight(list) {
          if (!list.length) return 0;
          return list.reduce((a, b) => a + b, 0) + M.sectorGap * (list.length - 1);
        }

        // Onde a caixa do setor começa, medido do centro do tronco. Quanto
        // mais longe da linha do tronco a faixa do setor estiver, mais para
        // dentro ele pode vir — daí o arco. O segundo termo é a garantia de
        // que nenhuma caixa encoste no círculo do tronco, mesmo que o arco
        // um dia seja configurado menor que ele.
        // Onde a caixa do setor começa, medido do centro do tronco.
        //
        // O bojo é uma meia-elipse NORMALIZADA PELA PRÓPRIA PILHA: o setor
        // do meio se afasta o máximo do tronco e os das pontas encostam no
        // eixo, quantos setores existam. Normalizar é o que mantém o anel
        // redondo — com um raio de arco fixo, todo setor cuja faixa caísse
        // além dele recebia o mesmo bojo zero, e as pontas do anel viravam
        // uma coluna reta assim que o tronco ganhava setores novos.
        //
        // `span` nunca desce abaixo de M.arcR: num lado com um ou dois
        // setores, a pilha inteira cabe dentro do arco e eles ficariam
        // achatados contra o eixo sem esse piso.
        //
        // O segundo termo é a garantia dura: enquanto a FAIXA do setor
        // cruzar a altura do tronco, a caixa começa depois dele inteiro.
        // Ele olha a faixa, e não o centro do setor, porque é a faixa que
        // pode encostar no tronco — um galho alto tem o nó no meio dele,
        // longe de onde a caixa realmente passa.
        function innerOffset(y0, y1, centerY, span) {
          const t = centerY / span;
          const bulge = M.arcR * Math.sqrt(Math.max(0, 1 - t * t));
          const dy = y0 > 0 ? y0 : (y1 < 0 ? -y1 : 0);
          const clear = dy < ROOT.r ? ROOT.r : 0;
          return M.coreGap + Math.max(bulge, clear);
        }

        treeData.root.x = 0;
        treeData.root.y = 0;

        const sectors = treeData.root.children.filter((node) => node.visible);
        const boxes = sectors.map((node) => branchBox(node, 1));
        const heights = boxes.map((box) => box.b - box.t);

        // Onde a volta troca de lado, e por qual setor ela começa. Os
        // setores continuam na mesma volta de sempre — desce por um lado e
        // sobe pelo outro —, mas a volta é um ANEL e não uma fila: pode
        // começar em qualquer um deles. Escolher o começo junto com o ponto
        // de corte é o que deixa um galho gigante ficar sozinho de um lado,
        // com os fechados todos juntinhos do outro. Preso ao começo fixo, o
        // corte só sabia cortar depois do gigante, e arrastava os vizinhos
        // de antes dele para o alto do mapa, longe do tronco e ligados por
        // conectores que atravessavam tudo.
        //
        // É daqui que vem o movimento: abrir ou fechar um galho muda as
        // alturas, o par (começo, corte) é reescolhido, e os setores giram
        // no anel para acomodar quem cresceu.
        function ringSplit(list) {
          const count = list.length;
          let bestStart = 0;
          let bestCut = Math.ceil(count / 2);
          if (count > 1) {
            // As duas pilhas juntas somam sempre a mesma coisa, então basta
            // acumular a da direita e subtrair.
            const totalBoth = list.reduce((a, b) => a + b, 0) + M.sectorGap * (count - 2);
            let best = Infinity;
            for (let start = 0; start < count; start += 1) {
              let acc = 0;
              for (let k = 1; k < count; k += 1) {
                acc += list[(start + k - 1) % count] + (k > 1 ? M.sectorGap : 0);
                const diff = Math.abs(acc - (totalBoth - acc));
                // Só troca por uma melhora de verdade: no empate — que é o
                // caso de todo mundo fechado — vence o começo canônico, e o
                // anel fica exatamente onde o usuário está acostumado a vê-lo.
                if (diff < best - 0.5) { best = diff; bestStart = start; bestCut = k; }
              }
            }
          }
          return { start: bestStart, cut: bestCut };
        }

        const n = sectors.length;
        const split = ringSplit(heights);
        const right = [];
        const left = [];
        for (let i = 0; i < n; i += 1) {
          const idx = (split.start + i) % n;
          (i < split.cut ? right : left).push(idx);
        }
        left.reverse();

        // Um galho por vez: com um setor só à vista, ele fica do lado em que
        // mora quando estão todos fechados. Sozinho no anel ele iria sempre
        // para a direita, e cada setor aberto do lado esquerdo pularia de
        // lado — o olho perderia o galho que acabou de clicar.
        const all = treeData.root.children;
        if (n === 1 && all.length > 1) {
          const home = ringSplit(all.map((s) => s.h || M.nodeMinH));
          const turn = (all.indexOf(sectors[0]) - home.start + all.length) % all.length;
          if (turn >= home.cut) left.push(right.pop());
        }

        [[1, right], [-1, left]].forEach((entry) => {
          const dir = entry[0];
          const idxs = entry[1];
          if (!idxs.length) return;

          // A vertical primeiro: o empilhamento não depende do arco, e o
          // arco precisa saber de antemão até onde a pilha vai.
          const linha = [];
          let cursor = -stackHeight(idxs.map((i) => heights[i])) / 2;
          idxs.forEach((i) => {
            // A caixa foi medida crescendo para a direita; do lado esquerdo
            // ela é a mesma, espelhada — a altura não muda com o lado.
            const box = dir > 0 ? boxes[i]
              : { l: -boxes[i].r, r: -boxes[i].l, t: boxes[i].t, b: boxes[i].b };
            const top = cursor;
            const bottom = top + heights[i];
            sectors[i].y = top - box.t;
            linha.push({ node: sectors[i], box: box, top: top, bottom: bottom });
            cursor = bottom + M.sectorGap;
          });

          // Agora a horizontal, com a pilha inteira já conhecida.
          const span = Math.max(
            M.arcR,
            linha.reduce((max, l) => Math.max(max, Math.abs(l.node.y)), 0)
          );
          linha.forEach((l) => {
            const inner = innerOffset(l.top, l.bottom, l.node.y, span);
            l.node.x = dir > 0 ? inner - l.box.l : -inner - l.box.r;
            placeBranch(l.node, dir);
          });
        });

        // Quem está oculto nasce e morre na posição do pai.
        (function settleHidden(node) {
          node.children.forEach((child) => {
            if (!child.visible) {
              child.x = node.x;
              child.y = node.y;
            }
            settleHidden(child);
          });
        })(treeData.root);

        // Desloca tudo para o canvas ficar em números positivos; o centro se
        // move conforme o mapa abre e fecha.
        let minX = -ROOT.r;
        let minY = -ROOT.r;
        nodeById.forEach((node) => {
          if (node.depth === 0 || !node.visible) return;
          minX = Math.min(minX, node.x - halfW(node));
          minY = Math.min(minY, node.y - halfH(node));
        });

        const offsetX = WORLD_MARGIN - minX;
        const offsetY = WORLD_MARGIN - minY;
        nodeById.forEach((node) => {
          node.x += offsetX;
          node.y += offsetY;
        });
      }

      // O setor (galho) a que o nó pertence: o ancestral logo abaixo do
      // tronco. É ele quem carrega a cor no painel de aparência.
      function sectorOf(node) {
        let top = node;
        while (top.depth > 1) top = top.parent;
        return top;
      }

      function paletteForSector(sector) {
        const custom = sector && theme.branches[sector.id];
        if (custom) return derivePalette(custom);
        const idx = Math.max(0, treeData.root.children.indexOf(sector));
        return PALETTE[idx % PALETTE.length];
      }

      // A cor vem do galho a que o nó pertence; a categoria escolhe entre a
      // versão forte (nó) e a clara (subnó) dessa mesma cor.
      // Um nó pode ter cor própria (node.color): ela vale para ele e para os
      // descendentes, até que outro descendente declare a sua. Ou seja, o
      // dono da cor é o ancestral mais próximo que tiver escolhido uma —
      // sem ninguém na linhagem, manda a paleta do setor.
      function colorFor(node) {
        let owner = node;
        while (owner && owner.depth > 0 && !owner.color) owner = owner.parent;
        const palette = owner && owner.depth > 0 && owner.color
          ? derivePalette(owner.color)
          : paletteForSector(sectorOf(node));
        const fg = textColorFor(node);
        return isSub(node)
          ? { bg: palette.subBg, fg: fg || palette.subFg }
          : { bg: palette.bg, fg: fg || palette.fg };
      }

      // Cor do texto escolhida à mão, da mais específica para a mais geral:
      // a do próprio nó (só dele — não passa para os descendentes, porque
      // nó e subnó têm fundos opostos e uma cor só não serve aos dois), a
      // do galho, a do mapa inteiro. Vazio = automática, a da paleta.
      function textColorFor(node) {
        if (node.textColor) return node.textColor;
        const kind = isSub(node) ? "sub" : "node";
        const sector = sectorOf(node);
        const perBranch = sector && hasOwn(theme.branchText, sector.id) && theme.branchText[sector.id];
        if (perBranch && perBranch[kind]) return perBranch[kind];
        return isSub(node) ? theme.subText : theme.nodeText;
      }

      // Onde a reta centro→centro cruza a borda da caixa. No radial os nós
      // se ligam em qualquer direção, então não dá para fixar "sai pela
      // direita, entra pela esquerda" como no layout anterior.
      function borderPoint(node, towardX, towardY) {
        const dx = towardX - node.x;
        const dy = towardY - node.y;
        if (!dx && !dy) return { x: node.x, y: node.y };

        if (node.depth === 0) {
          const len = Math.hypot(dx, dy);
          return { x: node.x + (dx / len) * ROOT.r, y: node.y + (dy / len) * ROOT.r };
        }

        const hw = halfW(node);
        const hh = halfH(node);
        const scaleX = dx ? hw / Math.abs(dx) : Infinity;
        const scaleY = dy ? hh / Math.abs(dy) : Infinity;
        const s = Math.min(scaleX, scaleY);
        return { x: node.x + dx * s, y: node.y + dy * s };
      }

      function refreshAriaControls() {
        coreButton.setAttribute(
          "aria-controls",
          treeData.root.children.map((c) => "node-" + c.id).join(" ")
        );
      }

      function refreshWorldSize() {
        let maxX = treeData.root.x + ROOT.r;
        let maxY = treeData.root.y + ROOT.r;
        nodeById.forEach((node) => {
          if (node.depth === 0) return;
          maxX = Math.max(maxX, node.x + halfW(node));
          maxY = Math.max(maxY, node.y + halfH(node));
        });
        world.style.width = Math.max(1040, maxX + WORLD_MARGIN) + "px";
        world.style.height = Math.max(920, maxY + WORLD_MARGIN) + "px";
      }

      // O conector é criado uma vez e depois só tem o `d` reescrito. Recriar
      // trinta paths a cada quadro da reacomodação seria desperdício, e o
      // comprimento — que a animação de traçado precisa — sai de um hypot,
      // já que a linha é reta: getTotalLength() num laço de animação custa
      // caro à toa.
      function addConnectorFor(node) {
        if (!node.parent) return;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("id", "line-" + node.id);
        path.setAttribute("class", "connector" + (isSub(node) ? " is-subnode" : ""));
        connectorsSvg.appendChild(path);
        node.path = path;
      }

      function drawConnector(node) {
        const parent = node.parent;
        if (!parent || !node.path) return;
        const start = borderPoint(parent, node.x, node.y);
        const end = borderPoint(node, parent.x, parent.y);
        const length = Math.hypot(end.x - start.x, end.y - start.y);
        const d = "M " + start.x + " " + start.y + " L " + end.x + " " + end.y;
        // Mesma regra das caixas: só escreve o que mudou.
        const path = node.path;
        if (path.lastD !== d) { path.setAttribute("d", d); path.lastD = d; }
        node.lineLength = length;
        const dash = String(length);
        const offset = node.visible ? "0" : dash;
        if (path.lastDash !== dash) { path.style.strokeDasharray = dash; path.lastDash = dash; }
        if (path.lastOffset !== offset) { path.style.strokeDashoffset = offset; path.lastOffset = offset; }
      }

      // Os botões de criação aparecem só quando a regra da categoria
      // permite: o de "novo nó" some depois que o galho foi encerrado com
      // subnós, e o de "novo subnó" só existe na ponta de um galho. A regra
      // vira algo que se lê na tela, em vez de virar mensagem de erro.
      function buildDevControls(node) {
        const actions = [{ action: "edit", icon: "pencil", title: "Editar" }];
        if (canAddNode(node)) {
          actions.push({ action: "add-node", icon: "git-branch", title: "Novo nó (continua o galho)" });
        }
        if (canAddSub(node)) {
          actions.push({ action: "add-subnode", icon: "plus", title: "Novo subnó (folha do galho)", sub: true });
        }
        if (node !== treeData.root) {
          actions.push({ action: "delete", icon: "trash-2", title: "Remover", danger: true });
        }

        const wrap = document.createElement("div");
        wrap.className = "dev-node-controls";
        actions.forEach((a) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "dev-node-btn"
            + (a.danger ? " dev-node-btn-danger" : "")
            + (a.sub ? " dev-node-btn-sub" : "");
          btn.dataset.devAction = a.action;
          btn.dataset.nodeId = node.id;
          btn.title = a.title;
          btn.setAttribute("aria-label", a.title);

          const icon = document.createElement("i");
          icon.setAttribute("data-lucide", a.icon);
          icon.setAttribute("width", "13");
          icon.setAttribute("height", "13");
          icon.setAttribute("aria-hidden", "true");
          btn.appendChild(icon);

          wrap.appendChild(btn);
        });
        return wrap;
      }

      function mountNodeEl(node) {
        const article = document.createElement("article");
        article.id = "node-" + node.id;
        article.className = "branch" + (isSub(node) ? " is-subnode" : "");
        article.setAttribute("aria-label", (isSub(node) ? "Subnó " : "Nó ") + shortLabel(node));
        // Escalonamento da entrada por nível. Vai numa variável, e não em
        // transition-delay direto: um atraso inline valeria para todas as
        // propriedades, inclusive o visibility, que precisa do seu próprio.
        article.style.setProperty("--enter-delay", (20 + Math.min(node.depth, 6) * 40) + "ms");

        const button = document.createElement("button");
        button.type = "button";
        button.className = "canva-button branch-button";
        button.setAttribute("aria-expanded", "false");
        const color = colorFor(node);
        button.style.background = color.bg;
        button.style.color = color.fg;

        const nameSpan = document.createElement("span");
        nameSpan.className = "canva-text branch-name";
        nameSpan.style.color = color.fg;
        nameSpan.textContent = node.label;
        button.appendChild(nameSpan);

        if (node.children.length > 0) {
          const icon = document.createElement("i");
          icon.className = "branch-toggle-icon";
          icon.setAttribute("data-lucide", "plus");
          icon.setAttribute("aria-hidden", "true");
          icon.setAttribute("width", "19");
          icon.setAttribute("height", "19");
          button.appendChild(icon);
        } else if (node.pdf) {
          const icon = document.createElement("i");
          icon.setAttribute("data-lucide", "file-text");
          icon.setAttribute("aria-hidden", "true");
          icon.setAttribute("width", "16");
          icon.setAttribute("height", "16");
          button.appendChild(icon);
        } else if (node.url) {
          const icon = document.createElement("i");
          icon.setAttribute("data-lucide", "external-link");
          icon.setAttribute("aria-hidden", "true");
          icon.setAttribute("width", "16");
          icon.setAttribute("height", "16");
          button.appendChild(icon);
        }

        article.appendChild(button);
        article.appendChild(buildDevControls(node));
        branchesLayer.appendChild(article);

        node.el = article;
      }

      function mountChildren(node) {
        node.children.forEach((child) => {
          mountNodeEl(child);
          mountChildren(child);
        });
      }

      // === Pipeline de desenho ============================================
      // A altura de um subnó depende do texto já renderizado, então a ordem
      // é montar → medir → posicionar. Inverter isso (posicionar com alturas
      // constantes, como fazia a v05) faz o layout radial errar o raio dos
      // anéis e os conectores pararem na borda errada.
      // ====================================================================

      function measureNodes() {
        // Duas passadas de propósito: primeiro só leituras, depois só
        // escritas. Intercalar as duas obriga o navegador a refazer o
        // layout a cada nó para responder à medida seguinte, e aqui são
        // centenas de nós.
        //
        // As duas classes são puramente cosméticas ou de gesto: nenhuma
        // muda a altura da caixa, então escrevê-las não obriga a remedir.
        const marcas = [];
        nodeById.forEach((node) => {
          if (node.depth === 0 || !node.el) return;
          node.w = node.el.offsetWidth || M.nodeW;
          node.h = node.el.offsetHeight || (isSub(node) ? M.subMinH : M.nodeMinH);
          if (!isSub(node)) return;
          const box = node.el.querySelector(".branch-button");
          marcas.push([
            node.el,
            node.h > SUB_TALL_AT,
            // Só a caixa com texto sobrando devolve o eixo vertical ao
            // navegador (ver .is-scrollable no CSS); nas outras o dedo
            // continua arrastando o mapa.
            !!box && box.scrollHeight - box.clientHeight > 1,
          ]);
        });
        marcas.forEach((m) => {
          m[0].classList.toggle("is-tall", m[1]);
          m[0].classList.toggle("is-scrollable", m[2]);
        });
      }

      // Escreve na tela a posição EXIBIDA (dx, dy), que durante a
      // reacomodação fica atrás da posição alvo (x, y) calculada pelo layout.
      //
      // Só o que está NA TELA é escrito: nós visíveis e os que estão saindo
      // de cena nesta reacomodação (node.onScreen, ainda ligado enquanto a
      // caixa esmaece). Com um galho grande aberto são dezenas de caixas
      // visíveis contra quase quatrocentas no mapa — escrever todas a cada
      // quadro fazia o navegador recalcular estilo, layout e pintura de
      // centenas de caixas invisíveis, e os conectores ocultos, cujo
      // comprimento muda a cada quadro, reiniciavam a própria transição
      // CSS a cada quadro. Era isso o engasgo das animações.
      //
      // Quem fica de fora continua com a posição certa no modelo (dx/dy):
      // quando voltar a aparecer, o primeiro quadro da animação escreve a
      // posição dele antes de qualquer pintura. `full` força escrever tudo
      // — é o que render() usa, com as caixas acabadas de montar.
      function applyPositions(full) {
        const root = treeData.root;
        coreArea.style.left = ((root.dx === undefined ? root.x : root.dx) - ROOT.r) + "px";
        coreArea.style.top = ((root.dy === undefined ? root.y : root.dy) - ROOT.r) + "px";
        coreArea.style.width = (ROOT.r * 2) + "px";

        const live = [];
        nodeById.forEach((node) => {
          if (node.depth === 0 || !node.el) return;
          if (!full && !node.visible && !node.onScreen) return;
          live.push(node);
          // Escreve só quando muda: uma caixa parada durante a animação
          // dos vizinhos não deve invalidar nada. O último valor escrito
          // fica no próprio elemento (o navegador reformata o que lê de
          // volta, e comparar com ele nunca bateria), e some junto quando
          // render() monta elementos novos.
          const pos = (node.dx - halfW(node)) + "px " + (node.dy - halfH(node)) + "px";
          if (node.el.lastPos !== pos) { node.el.style.translate = pos; node.el.lastPos = pos; }
        });
        // Os conectores leem dx/dy pelas mesmas propriedades x/y que
        // borderPoint() consulta, então a troca acontece aqui dentro.
        withDisplayedCoords(() => {
          live.forEach((node) => drawConnector(node));
        });
      }

      // Fim de uma reacomodação: quem terminou oculto sai da lista de
      // escrita. Enquanto uma animação está em curso ninguém sai — uma
      // caixa que esmaece precisa acompanhar o pai até o fim.
      function settleOnScreen() {
        nodeById.forEach((node) => { node.onScreen = !!node.visible; });
      }

      // borderPoint() e refreshWorldSize() falam em node.x/node.y. Durante o
      // tween o que vale é a posição exibida, então x/y são trocados pelo par
      // exibido só enquanto o desenho acontece, e devolvidos em seguida.
      function withDisplayedCoords(fn) {
        const saved = [];
        nodeById.forEach((node) => {
          saved.push([node, node.x, node.y]);
          if (node.dx !== undefined) node.x = node.dx;
          if (node.dy !== undefined) node.y = node.dy;
        });
        try {
          fn();
        } finally {
          saved.forEach((entry) => { entry[0].x = entry[1]; entry[0].y = entry[2]; });
        }
      }

      function snapDisplayed() {
        nodeById.forEach((node) => { node.dx = node.x; node.dy = node.y; });
      }

      // Reacomodação animada: as caixas deslizam até a posição nova e os
      // conectores são redesenhados no MESMO quadro, senão linha e caixa se
      // descolam durante o movimento. Um tween só por vez — abrir outro nó no
      // meio cancela o anterior e parte de onde as caixas estão.
      let tweenFrame = null;
      function tweenTo(duration) {
        if (tweenFrame) cancelAnimationFrame(tweenFrame);
        const from = [];
        nodeById.forEach((node) => {
          if (node.dx === undefined) { node.dx = node.x; node.dy = node.y; }
          from.push([node, node.dx, node.dy]);
        });
        if (!duration) {
          snapDisplayed();
          applyPositions();
          settleOnScreen();
          return;
        }

        const t0 = performance.now();
        const step = (now) => {
          const p = Math.min(1, (now - t0) / duration);
          const e = 1 - Math.pow(1 - p, 3); // desaceleração cúbica
          from.forEach((entry) => {
            const node = entry[0];
            node.dx = entry[1] + (node.x - entry[1]) * e;
            node.dy = entry[2] + (node.y - entry[2]) * e;
          });
          applyPositions();
          if (p < 1) {
            tweenFrame = requestAnimationFrame(step);
          } else {
            tweenFrame = null;
            snapDisplayed();
            applyPositions();
            settleOnScreen();
          }
        };
        tweenFrame = requestAnimationFrame(step);
      }

      // Recalcula o layout com a visibilidade atual e desliza até ele.
      function relayout(duration) {
        measureNodes();
        layoutTree();
        refreshWorldSize();   // sai das posições-alvo: uma vez por layout basta
        tweenTo(duration);
      }

      function render() {
        branchesLayer.innerHTML = "";
        connectorsSvg.innerHTML = "";
        if (tweenFrame) { cancelAnimationFrame(tweenFrame); tweenFrame = null; }
        layoutTree();            // 1ª passada: registra nodeById, depth e parent
        mountChildren(treeData.root);
        lucide.createIcons();    // antes de medir: os ícones entram no fluxo
        measureNodes();
        layoutTree();            // 2ª passada: agora com as alturas reais
        snapDisplayed();
        nodeById.forEach((node) => addConnectorFor(node));
        refreshWorldSize();
        applyPositions(true);   // caixas recém-montadas: todas recebem posição
        settleOnScreen();
        refreshAriaControls();
      }

      // As fontes chegam depois do primeiro desenho e mudam a quebra de
      // linha; sem remedir, subnós longos ficam com a altura errada — e o
      // círculo do tronco, com o tamanho medido na fonte provisória.
      function remeasureOnFontsReady() {
        if (!document.fonts || !document.fonts.ready) return;
        document.fonts.ready.then(() => {
          fitCoreSize();
          relayout(0);
          updateVisibility();
          autoFit(0);
          applyWatermarks();
        });
        // Fonte do Google Fonts escolhida depois (no painel, ou baixada só
        // quando o tema pede): quando ela chega, os textos das marcas d'água
        // são medidos de novo, o tronco pode mudar de raio e o título, de
        // altura. A espera junta as fontes que chegam em sequência.
        let fontsTimer = null;
        document.fonts.addEventListener("loadingdone", () => {
          clearTimeout(fontsTimer);
          fontsTimer = setTimeout(() => {
            applyWatermarks();
            if (!refreshCoreSize() && nodeById.size) autoFit(0);
          }, 60);
        });
      }

      // A expansão vive no dado (`node.expanded`) e não mais numa classe do
      // DOM. O layout precisa saber quem está visível para não reservar
      // espaço a quem está fechado, e ler isso de volta do DOM tornaria a
      // ordem entre desenhar e posicionar frágil. A classe continua, só que
      // como reflexo, para o CSS.
      function computeVisibility() {
        const isOpen = stage.classList.contains("is-open");
        const single = oneBranchMode();
        function walk(node, parentVisible) {
          node.visible = node.depth === 0 ? true : parentVisible;
          const childrenVisible = node.depth === 0 ? isOpen : (node.visible && !!node.expanded);
          // Um galho por vez: com um filho aberto, os irmãos dele saem de
          // cena. Um nó "aberto" sem filhos (o último filho foi apagado) não
          // conta — não há o que mostrar no lugar dos irmãos.
          const open = single ? node.children.find((c) => c.expanded && c.children.length) : null;
          node.children.forEach((child) => walk(child, childrenVisible && (!open || child === open)));
        }
        walk(treeData.root, true);
      }

      // --- Um galho por vez ---------------------------------------------------
      // Fora do modo dev, abrir um galho fecha e esconde os irmãos dele, em
      // todos os níveis: fica na tela só o caminho do tronco até o galho
      // aberto, mais os filhos dele. Clicar no galho aberto o fecha e devolve
      // os irmãos. É o que impede a árvore inteira de ser aberta de uma vez.
      // No modo dev volta o comportamento livre, com vários galhos abertos:
      // religar um nó entre galhos exige ver os dois.
      // ---------------------------------------------------------------------
      function oneBranchMode() {
        return !devUnlocked;
      }

      // O último nó aberto. Quando o cadeado fecha com vários galhos abertos,
      // é o caminho dele que sobra.
      let lastExpanded = null;

      // Fecha o nó e tudo o que estava aberto dentro dele: um galho que sai
      // de cena e volta depois volta fechado, e não no fundo de onde parou.
      function collapseTree(node) {
        node.expanded = false;
        const btn = node.el && node.el.querySelector(".branch-button");
        if (btn) btn.setAttribute("aria-expanded", "false");
        node.children.forEach(collapseTree);
      }

      // Fecha os irmãos abertos do nó. Devolve true se fechou algum.
      function closeSiblings(node) {
        if (!node.parent) return false;
        let closed = false;
        node.parent.children.forEach((sibling) => {
          if (sibling !== node && sibling.expanded) {
            collapseTree(sibling);
            closed = true;
          }
        });
        return closed;
      }

      // Cadeado fechado: sobra só o caminho do último nó aberto, se ele ainda
      // estiver aberto e à vista; o resto fecha. Sem caminho válido, fecha
      // tudo — o tronco continua aberto, com todos os setores à vista.
      function keepSinglePath() {
        let keep = lastExpanded && nodeById.get(lastExpanded.id) === lastExpanded ? lastExpanded : null;
        for (let n = keep; n && n.depth > 0; n = n.parent) {
          if (!n.expanded) { keep = null; break; }
        }
        const path = new Set();
        for (let n = keep; n && n.depth > 0; n = n.parent) path.add(n);
        nodeById.forEach((node) => {
          if (node.depth > 0 && node.expanded && !path.has(node)) collapseTree(node);
        });
        lastExpanded = keep;
      }

      function updateVisibility() {
        computeVisibility();
        nodeById.forEach((node) => {
          if (node.depth === 0) return;
          if (node.el) {
            node.el.classList.toggle("is-visible", node.visible);
            node.el.classList.toggle("is-expanded", !!node.expanded);
          }
          if (node.path) {
            node.path.classList.toggle("is-visible", node.visible);
            const offset = node.visible ? "0" : String(node.lineLength || 0);
            node.path.style.strokeDashoffset = offset;
            node.path.lastOffset = offset;   // mantém o cache de drawConnector em dia
          }
        });
      }

      // =====================================================================
      // Câmera
      // ---------------------------------------------------------------------
      // A câmera deixou de ser derivada do conteúdo e passou a ter estado
      // próprio: `camera` guarda o deslocamento e a escala, e o transform do
      // #world é apenas o reflexo desse estado. Enquanto o usuário não
      // encosta nela, o mapa continua se enquadrando sozinho ao abrir e
      // fechar; no primeiro gesto (roda, arrasto ou +/−) o enquadramento
      // automático se desliga e só volta pelo botão "recentrar".
      // =====================================================================
      // O piso de escala é menor no celular porque lá a tela é que é
      // pequena: com 0.2 um mapa inteiro aberto simplesmente não cabe, e o
      // enquadramento automático desistia cortando metade dele.
      const MIN_SCALE = 0.2;
      const MOBILE_MIN_SCALE = 0.08;
      const MAX_SCALE = 2.5;
      const FIT_MAX_SCALE = 1.2;

      function minScale() {
        return M === METRICS.narrow ? MOBILE_MIN_SCALE : MIN_SCALE;
      }

      // Folga do enquadramento e quanto do mapa é obrigado a ficar na tela.
      // Ambas em fração da viewport: 120px fixos comem um terço da largura
      // de um celular e deixavam o mapa preso longe da borda.
      function fitPad() {
        return Math.max(18, Math.min(60, viewport.clientWidth * 0.06));
      }

      function keepOnScreen() {
        return Math.max(56, Math.min(120, Math.min(viewport.clientWidth, viewport.clientHeight) * 0.22));
      }

      // Limiar para o gesto virar arrasto. O toque-para-clicar do touchpad
      // se apresenta como "mouse" no Windows e tem pouco tremor; dedo e
      // caneta precisam de folga maior para não virar arrasto sem querer.
      const DRAG_THRESHOLD_MOUSE = 4;
      const DRAG_THRESHOLD_TOUCH = 10;

      // A pinça do touchpad chega como wheel com ctrlKey e deltaY pequeno
      // (ordem de 1 a 10), enquanto a rodinha manda ~100 por entalhe. Cada
      // gesto precisa da sua própria sensibilidade para os dois darem a
      // mesma sensação de zoom.
      const WHEEL_ZOOM_SENS = 0.0015;
      const PINCH_ZOOM_SENS = 0.012;
      const MAX_ZOOM_STEP = 1.35;

      const camera = { x: 0, y: 0, scale: 1 };
      let cameraIsManual = false;

      function applyCamera(ms) {
        world.style.transition = ms ? "transform " + ms + "ms cubic-bezier(.22,.8,.28,1)" : "none";
        world.style.transform = "translate(" + camera.x + "px, " + camera.y + "px) scale(" + camera.scale + ")";
        zoomReadout.textContent = Math.round(camera.scale * 100) + "%";
      }

      // Caixa que envolve tudo o que está visível agora. `pad` é a folga
      // usada ao enquadrar; para travar o arrasto usamos pad 0.
      function boxOf(node) {
        return {
          l: node.x - halfW(node), r: node.x + halfW(node),
          t: node.y - halfH(node), b: node.y + halfH(node),
        };
      }

      function unionBox(boxes, pad) {
        return {
          l: Math.min.apply(null, boxes.map((b) => b.l)) - pad,
          r: Math.max.apply(null, boxes.map((b) => b.r)) + pad,
          t: Math.min.apply(null, boxes.map((b) => b.t)) - pad,
          b: Math.max.apply(null, boxes.map((b) => b.b)) + pad,
        };
      }

      function getActiveBox(pad) {
        const p = pad === undefined ? fitPad() : pad;
        const root = treeData.root;
        const boxes = [{
          l: root.x - ROOT.r, r: root.x + ROOT.r,
          t: root.y - ROOT.r, b: root.y + ROOT.r,
        }];
        nodeById.forEach((node) => {
          if (node.depth === 0 || !node.visible) return;
          boxes.push(boxOf(node));
        });
        return {
          l: Math.min.apply(null, boxes.map((b) => b.l)) - p,
          r: Math.max.apply(null, boxes.map((b) => b.r)) + p,
          t: Math.min.apply(null, boxes.map((b) => b.t)) - p,
          b: Math.max.apply(null, boxes.map((b) => b.b)) + p,
        };
      }

      // Trava suave: o usuário pode arrastar à vontade, mas nunca a ponto de
      // jogar o mapa inteiro para fora da tela.
      function clampCamera() {
        const box = getActiveBox(0);
        const vw = viewport.clientWidth;
        const vh = viewport.clientHeight;
        const keep = keepOnScreen();
        camera.x = clamp(camera.x, keep - box.r * camera.scale, vw - keep - box.l * camera.scale);
        camera.y = clamp(camera.y, keep - box.b * camera.scale, vh - keep - box.t * camera.scale);
      }

      // O título (com o subtítulo) e a pesquisa flutuam sobre o mapa, no
      // alto ou embaixo, conforme a vaga. Enquadrar sem descontá-los faz o
      // nó da ponta nascer embaixo deles — no celular, onde a pesquisa
      // ocupa a largura inteira, isso escondia um setor inteiro. Zoom e
      // legenda são pequenos e ficam de fora da conta, como sempre ficaram;
      // nas vagas do meio, nada é descontado. Da pesquisa conta só o campo:
      // a lista de resultados abre e fecha, e a câmera não deve pular junto.
      function hudInsets() {
        const box = viewport.getBoundingClientRect();
        let top = 0;
        let bottom = 0;
        [headingEl, document.querySelector(".search-field")].forEach((el) => {
          const item = el && el.closest(".hud-item");
          if (!item || item.classList.contains("is-off")) return;
          const r = el.getBoundingClientRect();
          if (!r.height) return;
          const slot = item.parentElement.dataset.slot || "";
          if (slot.indexOf("top") === 0) top = Math.max(top, r.bottom - box.top + 8);
          else if (slot.indexOf("bottom") === 0) bottom = Math.max(bottom, box.bottom - r.top + 8);
        });
        const cap = viewport.clientHeight * 0.3;
        return { top: clamp(top, 0, cap), bottom: clamp(bottom, 0, cap) };
      }

      function fitCamera(ms) {
        const box = getActiveBox();
        const inset = hudInsets();
        const vw = viewport.clientWidth;
        const vh = viewport.clientHeight - inset.top - inset.bottom;
        const scale = clamp(
          Math.min(vw / (box.r - box.l), vh / (box.b - box.t)),
          minScale(),
          FIT_MAX_SCALE
        );
        camera.scale = scale;
        camera.x = vw / 2 - ((box.l + box.r) / 2) * scale;
        camera.y = inset.top + vh / 2 - ((box.t + box.b) / 2) * scale;
        applyCamera(ms);
      }

      // Leva a câmera até o nó recém-aberto e o que ele acabou de revelar,
      // ajustando o zoom nos dois sentidos: aproxima quando o grupo é
      // pequeno, afasta quando é grande. Num mapa de 14 setores a visão
      // geral fica perto do piso de escala, e é este enquadramento que
      // devolve a legibilidade ao abrir um galho.
      // Roda mesmo com cameraIsManual ligado: clicar num nó é um pedido
      // explícito de atenção, diferente do reenquadramento passivo.
      function focusOn(node, ms) {
        if (!node) return;
        const boxes = [node.depth === 0
          ? { l: node.x - ROOT.r, r: node.x + ROOT.r, t: node.y - ROOT.r, b: node.y + ROOT.r }
          : boxOf(node)];
        node.children.forEach((child) => {
          if (child.visible) boxes.push(boxOf(child));
        });

        const box = unionBox(boxes, Math.max(36, fitPad() * 1.5));
        const inset = hudInsets();
        const vw = viewport.clientWidth;
        const vh = viewport.clientHeight - inset.top - inset.bottom;
        camera.scale = clamp(
          Math.min(vw / (box.r - box.l), vh / (box.b - box.t)),
          minScale(),
          FIT_MAX_SCALE
        );

        camera.x = vw / 2 - ((box.l + box.r) / 2) * camera.scale;
        camera.y = inset.top + vh / 2 - ((box.t + box.b) / 2) * camera.scale;
        clampCamera();
        applyCamera(ms);
      }

      // Zoom ancorado num ponto da viewport: o que estava sob o cursor
      // continua sob o cursor depois da mudança de escala.
      function zoomAt(px, py, factor, ms) {
        const next = clamp(camera.scale * factor, minScale(), MAX_SCALE);
        if (next === camera.scale) return;
        const worldX = (px - camera.x) / camera.scale;
        const worldY = (py - camera.y) / camera.scale;
        camera.scale = next;
        camera.x = px - worldX * next;
        camera.y = py - worldY * next;
        clampCamera();
        applyCamera(ms);
      }

      function takeCameraControl() {
        if (cameraIsManual) return;
        cameraIsManual = true;
        fitBtn.classList.add("is-active");
        fitBtn.title = "Recentrar o mapa e voltar ao enquadramento automático (tecla 0)";
      }

      function releaseCameraControl() {
        cameraIsManual = false;
        fitBtn.classList.remove("is-active");
        fitBtn.title = "Recentrar o mapa (tecla 0)";
      }

      // Chamado depois de abrir/fechar/expandir/reconstruir: reenquadra
      // enquanto a câmera for automática, e apenas revalida a trava quando
      // ela já pertence ao usuário.
      function autoFit(ms) {
        if (cameraIsManual) {
          clampCamera();
          applyCamera(ms);
          return;
        }
        fitCamera(ms);
      }

      function zoomFromCenter(factor) {
        takeCameraControl();
        zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, factor, 220);
      }

      zoomInBtn.addEventListener("click", () => zoomFromCenter(1.25));
      zoomOutBtn.addEventListener("click", () => zoomFromCenter(1 / 1.25));
      fitBtn.addEventListener("click", () => {
        releaseCameraControl();
        fitCamera(420);
        status.textContent = "Mapa recentrado.";
      });

      // Zoom por rodinha (mouse), por dois dedos e por pinça (touchpad). O
      // preventDefault é incondicional de propósito: sem ele o navegador dá
      // zoom na página inteira na pinça e no Ctrl+rolagem.
      // deltaX é ignorado: num gesto diagonal, misturar deslocamento lateral
      // com zoom deixaria o movimento errático.
      // Um subnó longo rola por dentro. Enquanto ele ainda tiver texto para
      // percorrer naquela direção, a roda pertence ao texto e não ao zoom;
      // ao chegar ao fim, o zoom volta a assumir.
      function scrollableUnder(event) {
        const box = event.target.closest(".branch.is-subnode .branch-button");
        if (!box) return false;
        const room = box.scrollHeight - box.clientHeight;
        if (room <= 1) return false;
        if (event.deltaY < 0) return box.scrollTop > 0;
        if (event.deltaY > 0) return box.scrollTop < room - 1;
        return false;
      }

      viewport.addEventListener("wheel", (event) => {
        if (scrollableUnder(event)) return;
        event.preventDefault();
        takeCameraControl();

        let delta = event.deltaY;
        if (event.deltaMode === 1) delta *= 16;          // roda em linhas
        else if (event.deltaMode === 2) delta *= viewport.clientHeight; // em páginas

        const sens = event.ctrlKey ? PINCH_ZOOM_SENS : WHEEL_ZOOM_SENS;
        // O limite fica no fator, e não no delta: o touchpad manda muitos
        // eventos minúsculos e a rodinha manda poucos e grandes: limitar o
        // resultado aproxima a sensação dos dois sem travar nenhum.
        const factor = clamp(Math.exp(-delta * sens), 1 / MAX_ZOOM_STEP, MAX_ZOOM_STEP);

        const rect = viewport.getBoundingClientRect();
        zoomAt(event.clientX - rect.left, event.clientY - rect.top, factor, 0);
      }, { passive: false });

      // Arrasto: começa em qualquer ponto da viewport, inclusive em cima de
      // um nó, mas só vira arrasto depois do limiar de alguns pixels — abaixo
      // disso continua sendo um clique normal no nó. O clique que o navegador
      // dispara ao fim de um arrasto é engolido na fase de captura, senão
      // arrastar por cima de um nó acabaria expandindo ou abrindo o link.
      //
      // IMPORTANTE: a captura do ponteiro é feita só quando o gesto vira
      // arrasto de fato, nunca no pointerdown. Enquanto um elemento tem o
      // ponteiro capturado, o navegador redireciona para ele também o
      // "click" — o evento chegaria com target = #camera-viewport e nunca
      // com o botão do nó, o que faz o clique no tronco (listener no próprio
      // botão) e o clique nos demais nós (delegado por closest) pararem de
      // funcionar. Mover esta chamada de volta para o pointerdown reintroduz
      // exatamente esse bug.
      let activePointerId = null;
      let dragOrigin = null;
      let didDrag = false;

      // --- Pinça de dois dedos (tela sensível ao toque) --------------------
      // A viewport tem touch-action:none para o arrasto funcionar, o que
      // também desliga a pinça nativa do navegador — sem este bloco não
      // existiria NENHUMA forma de dar zoom no celular além dos botões
      // + e −. O gesto move e amplia ao mesmo tempo: o ponto do mapa que
      // estava sob o meio dos dedos continua lá durante todo o gesto, então
      // afastar os dedos amplia, girar a mão não faz nada, e deslizar os
      // dois juntos arrasta o mapa — é o que o dedo espera.
      //
      // Os ponteiros ativos são contados aqui e não no bloco de arrasto
      // porque o segundo dedo tem de CANCELAR o arrasto de um dedo que já
      // estava em curso, senão o mapa ampliaria e escorregaria junto.
      const pointers = new Map();
      let pinch = null;

      function pinchCenter() {
        const list = Array.from(pointers.values());
        return {
          x: (list[0].x + list[1].x) / 2,
          y: (list[0].y + list[1].y) / 2,
          d: Math.hypot(list[0].x - list[1].x, list[0].y - list[1].y),
        };
      }

      function startPinch() {
        const rect = viewport.getBoundingClientRect();
        const c = pinchCenter();
        if (c.d < 1) return;
        takeCameraControl();
        const px = c.x - rect.left;
        const py = c.y - rect.top;
        pinch = {
          d0: c.d,
          scale0: camera.scale,
          // Ponto do mundo sob o meio dos dedos: é ele que fica parado.
          wx: (px - camera.x) / camera.scale,
          wy: (py - camera.y) / camera.scale,
        };
        didDrag = true;   // o clique que fecha o gesto é engolido
      }

      function movePinch() {
        if (!pinch || pointers.size < 2) return;
        const rect = viewport.getBoundingClientRect();
        const c = pinchCenter();
        if (c.d < 1) return;
        camera.scale = clamp(pinch.scale0 * (c.d / pinch.d0), minScale(), MAX_SCALE);
        camera.x = (c.x - rect.left) - pinch.wx * camera.scale;
        camera.y = (c.y - rect.top) - pinch.wy * camera.scale;
        clampCamera();
        applyCamera(0);
      }

      // Tirou um dedo. O gesto não pode continuar de onde estava — a conta
      // da pinça parte da distância inicial entre os dois —, então ele
      // recomeça do zero na posição atual: com dois dedos ainda na tela,
      // volta a ser pinça; com um, o que sobrou assume o arrasto sem
      // precisar ser levantado e tocado de novo.
      function endPinch() {
        pinch = null;
        dragOrigin = null;
        if (pointers.size === 2) {
          startPinch();
          return;
        }
        if (pointers.size !== 1) return;
        const entry = Array.from(pointers.entries())[0];
        activePointerId = entry[0];
        dragOrigin = {
          px: entry[1].x,
          py: entry[1].y,
          cx: camera.x,
          cy: camera.y,
          threshold: 0,   // o gesto já é um arrasto: não há limiar a vencer
        };
        didDrag = true;   // e o clique ao fim dele continua sendo engolido
      }

      // Soltar a captura do ponteiro é sempre a mesma dança, e esquecê-la
      // deixa o mapa preso ao cursor.
      function releaseCapture() {
        if (activePointerId === null) return;
        try {
          if (viewport.hasPointerCapture(activePointerId)) {
