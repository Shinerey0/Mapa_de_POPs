  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --ink: #0b1736;
      --paper: #edf3ff;
      --line: rgba(160, 190, 255, 0.56);
      --focus: #ffffff;
      /* Os dois borrões decorativos do fundo. Viram variáveis porque moram
         em pseudo-elementos, onde não dá para escrever estilo inline. */
      --blob-a: rgba(25, 183, 187, 0.24);
      --blob-b: rgba(245, 177, 75, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100%;
      /* No celular, 100vh conta a barra do navegador que aparece e some ao
         rolar, e o pé do mapa fica atrás dela. dvh resolve nos navegadores
         atuais; a linha de cima cobre o resto, com --vh escrito pelo JS a
         cada resize. A ordem importa: se dvh não existir, a declaração é
         descartada e a anterior volta a valer. */
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      min-height: 100dvh;
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
      /* Sem isto o "puxar para atualizar" do celular rouba o gesto de
         arrastar o mapa, e a rolagem elástica descola o mapa da tela. */
      overscroll-behavior: none;
    }

    button {
      font: inherit;
    }

    .mindmap-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      min-height: 100dvh;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.25rem 1.25rem;
    }

    .mindmap-shell::before,
    .mindmap-shell::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: -1;
      border-radius: 999px;
      filter: blur(2px);
    }

    .mindmap-shell::before {
      width: 29rem;
      height: 29rem;
      top: -16rem;
      right: -10rem;
      background: radial-gradient(circle, var(--blob-a), transparent 69%);
    }

    .mindmap-shell::after {
      width: 26rem;
      height: 26rem;
      bottom: -14rem;
      left: -9rem;
      background: radial-gradient(circle, var(--blob-b), transparent 69%);
    }

    body.no-blobs .mindmap-shell::before,
    body.no-blobs .mindmap-shell::after {
      display: none;
    }

    /* Fundo claro: o que é escrito diretamente sobre o fundo troca de cor
       para não sumir. A instrução do tronco carrega cor inline vinda do
       template, e por isso precisa do !important. */
    body.on-light .eyebrow {
      color: rgba(11, 23, 54, 0.75);
    }

    body.on-light .instruction {
      color: rgba(11, 23, 54, 0.72) !important;
    }

    body.on-light .camera-legend {
      color: rgba(11, 23, 54, 0.6);
    }

    body.on-light .dev-toggle {
      color: rgba(11, 23, 54, 0.8);
      border-color: rgba(11, 23, 54, 0.22);
      background: rgba(11, 23, 54, 0.06);
    }

    body.on-light .dev-toggle:hover,
    body.on-light .dev-toggle:focus-visible {
      background: rgba(11, 23, 54, 0.12);
    }

    .eyebrow {
      position: absolute;
      top: 1.65rem;
      left: 1.8rem;
      z-index: 20;
      color: rgba(231, 240, 255, 0.78);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: 700;
      pointer-events: none;
    }

    .map-stage {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
    }

    .camera-viewport {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .world {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      transition: transform 700ms cubic-bezier(.22, .8, .28, 1);
      will-change: transform;
    }

    .connectors {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
      z-index: 1;
    }

    .connector {
      fill: none;
      stroke: var(--line);
      stroke-width: 2.5px;
      opacity: 0;
      /* Mesma regra das caixas: a linha oculta sai da pintura de vez, só
         que depois de a animação de recolher o traço terminar. */
      visibility: hidden;
      transition:
        opacity 320ms ease,
        stroke-dashoffset 700ms cubic-bezier(.22, .8, .28, 1),
        visibility 0s linear 700ms;
    }

    .connector.is-visible {
      opacity: 1;
      visibility: visible;
      transition-delay: 0s, 0s, 0s;
    }

    .core-area {
      position: absolute;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
    }

    .dev-node-controls {
      position: absolute;
      top: -10px;
      right: -10px;
      display: flex;
      gap: 4px;
      z-index: 6;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 200ms ease, transform 200ms ease;
    }

    body.dev-mode .dev-node-controls {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .dev-node-btn {
      width: 24px;
      height: 24px;
      min-width: 24px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: #101d40;
      color: rgb(230, 238, 255);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      transition: transform 160ms ease, background 160ms ease;
    }

    .dev-node-btn:hover,
    .dev-node-btn:focus-visible {
      transform: scale(1.12);
      background: #16244d;
    }

    .dev-node-btn-danger {
      color: rgb(255, 150, 150);
      border-color: rgba(255, 120, 120, 0.45);
    }

    /* --- Religar galho: arrastar um nó por cima de outro troca o pai. ---
       Só existe no modo dev. */
    body.dev-mode .branch-button {
      cursor: grab;
    }

    /* Enquanto arrasta, o texto não deve ser selecionado em lugar nenhum
       (o gesto passa por cima de rótulos longos de subnó). */
    body.is-reparenting,
    body.is-reparenting .branch-button {
      user-select: none;
    }

    .core-button,
    .branch-button {
      border: 0;
      cursor: pointer;
      transition: transform 260ms ease, box-shadow 260ms ease, filter 260ms ease;
    }

    .core-button {
      width: var(--core-size, 168px);
      min-height: var(--core-size, 168px);
      padding: 1.2rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      box-shadow: 0 18px 0 rgba(2, 9, 31, 0.13), 0 22px 45px rgba(2, 9, 31, 0.38);
      position: relative;
    }

    .core-button::after {
      content: "";
      position: absolute;
      inset: -10px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: inherit;
      transition: transform 300ms ease, opacity 300ms ease;
    }

    .core-button:hover,
    .core-button:focus-visible {
      transform: translateY(-5px) scale(1.02);
      filter: brightness(1.08);
    }

    .core-button:hover::after,
    .core-button:focus-visible::after {
      transform: scale(1.08);
      opacity: 0.8;
    }

    .node-label {
      font-family: "Fraunces", serif;
      text-align: center;
      line-height: 1.05;
    }

    .instruction {
      color: rgba(235, 243, 255, 0.76);
      font-size: 0.82rem;
      letter-spacing: 0.025em;
      white-space: nowrap;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .map-stage.is-open .instruction {
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
    }

    /* A posição vem de `translate` (escrito pelo JS a cada quadro da
       reacomodação), e não de left/top: mover por left/top obriga o
       navegador a refazer o layout a cada quadro, o translate não. É a
       propriedade avulsa, e não transform, para não brigar com o scale()
       da entrada logo abaixo — o scale continua girando em torno do
       centro da caixa. */
    .branch {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 2;
      width: var(--node-w, 214px);
      opacity: 0;
      pointer-events: none;
      /* Cresce a partir do próprio centro: no layout radial os galhos saem
         em qualquer direção, então nenhum deslocamento lateral serviria. */
      transform: scale(0.82);
      /* Oculto = visibility:hidden, e não só opacity:0. Com opacidade zero
         o navegador ainda PINTA a caixa (sombra, texto, tudo) a cada quadro
         em que algo se mexe; num mapa com ~400 nós e só dezenas à vista,
         isso era a maior parte do engasgo das animações. O visibility só
         vira hidden DEPOIS que o esmaecimento termina (o atraso dele soma o
         escalonamento por nível com a duração do scale), então a saída de
         cena continua animada. --enter-delay é o escalonamento por nível,
         escrito pelo JS em cada caixa. */
      visibility: hidden;
      transition:
        opacity 420ms ease var(--enter-delay, 0ms),
        transform 480ms cubic-bezier(.2, .8, .2, 1) var(--enter-delay, 0ms),
        visibility 0s linear calc(var(--enter-delay, 0ms) + 480ms);
    }

    .branch.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      /* Na entrada, visível já no primeiro quadro: quem aparece aos poucos
         é a opacidade. */
      visibility: visible;
      transition-delay: var(--enter-delay, 0ms), var(--enter-delay, 0ms), 0s;
    }

    /* --- Nó em arrasto (religar galho) ---------------------------------
       Precisa vir DEPOIS de .branch.is-visible: as duas regras têm a mesma
       especificidade, então quem ganha o pointer-events é a última escrita.
       O nó arrastado tem de ficar transparente ao ponteiro para que o
       elementFromPoint enxergue o alvo embaixo dele, e sai das transições
       para acompanhar o cursor em vez de deslizar atrás dele. */
    .branch.is-dragging {
      z-index: 40;
      pointer-events: none;
      transition: none !important;
      cursor: grabbing;
    }

    /* pointer-events:none no pai não alcança um filho que pede "auto" — e
       os botões de edição pedem. */
    .branch.is-dragging .dev-node-controls {
      pointer-events: none;
    }

    .branch.is-dragging .branch-button {
      transform: scale(1.04);
      box-shadow: 0 18px 38px rgba(2, 9, 31, 0.55);
      opacity: 0.9;
    }

    .branch.is-drop-ok .branch-button,
    .core-area.is-drop-ok .core-button {
      outline: 3px solid rgb(120, 235, 170);
      outline-offset: 3px;
    }

    .branch.is-drop-blocked .branch-button,
    .core-area.is-drop-blocked .core-button {
      outline: 3px solid rgb(255, 120, 120);
      outline-offset: 3px;
    }

    /* Ordem: a barra na borda de cima ou de baixo diz em que posição entre
       os irmãos o nó vai entrar. Usa box-shadow inset para acompanhar o
       arredondamento da caixa sem mexer no layout. */
    .branch.is-drop-before .branch-button {
      box-shadow: inset 0 6px 0 rgb(120, 235, 170), 0 8px 18px rgba(1, 10, 31, 0.18);
    }

    .branch.is-drop-after .branch-button {
      box-shadow: inset 0 -6px 0 rgb(120, 235, 170), 0 8px 18px rgba(1, 10, 31, 0.18);
    }

    /* Legenda do arrasto: diz o que vai acontecer ao soltar. Fica presa ao
       topo da viewport e é transparente ao ponteiro, para nunca virar ela
       própria o alvo do elementFromPoint. */
    .drag-hint {
      position: absolute;
      top: 0.9rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      pointer-events: none;
      max-width: min(90%, 460px);
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      background: rgba(10, 20, 48, 0.9);
      border: 1px solid rgba(120, 235, 170, 0.55);
      color: rgb(231, 240, 255);
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 10px 24px rgba(2, 9, 31, 0.45);
    }

    .drag-hint.is-blocked {
      border-color: rgba(255, 120, 120, 0.65);
      color: rgb(255, 197, 197);
    }

    .branch-button {
      width: 100%;
      min-height: var(--node-min-h, 70px);
      border-radius: 18px;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      box-shadow: 0 12px 25px rgba(1, 10, 31, 0.24);
    }

    .branch-button:hover,
    .branch-button:focus-visible {
      transform: translateY(-3px);
      filter: brightness(1.08);
    }

    .branch-button svg {
      flex: 0 0 auto;
      transition: transform 240ms ease;
    }

    .branch.is-expanded .branch-button svg {
      transform: rotate(45deg);
    }

    .branch-name {
      font-weight: 700;
      font-size: var(--name-size, 1rem);
      line-height: 1.15;
    }

    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    .screen-reader-status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .dev-toggle {
      position: absolute;
      top: 1.5rem;
      right: 1.8rem;
      z-index: 20;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      color: rgba(231, 240, 255, 0.85);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 200ms ease, transform 200ms ease, color 200ms ease, border-color 200ms ease;
    }

    .dev-toggle:hover,
    .dev-toggle:focus-visible {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    .dev-toggle.is-unlocked {
      border-color: rgba(120, 220, 160, 0.6);
      color: rgb(150, 240, 190);
    }

    .dev-toggle-icon-unlocked {
      display: none;
    }

    .dev-toggle.is-unlocked .dev-toggle-icon-locked {
      display: none;
    }

    .dev-toggle.is-unlocked .dev-toggle-icon-unlocked {
      display: block;
    }

    .dev-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 20, 0.66);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1.25rem;
    }

    .dev-overlay[hidden] {
      display: none;
    }

    .dev-modal {
      position: relative;
      width: min(100%, 380px);
      max-height: 88vh;
      overflow-y: auto;
      background: #101d40;
      border: 1px solid rgba(160, 190, 255, 0.28);
      border-radius: 20px;
      padding: 1.6rem 1.5rem 1.5rem;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
      color: rgb(230, 238, 255);
    }

    .dev-modal-close {
      position: absolute;
      top: 0.7rem;
      right: 0.8rem;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: transparent;
      color: rgba(230, 238, 255, 0.7);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      border: 0;
    }

    .dev-modal-close:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .dev-modal-title {
      font-family: "Fraunces", serif;
      font-size: 1.25rem;
      margin: 0 0 0.4rem;
    }

    .dev-modal-desc {
      font-size: 0.85rem;
      color: rgba(230, 238, 255, 0.7);
      margin: 0 0 1.1rem;
    }

    .dev-form {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .dev-label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(230, 238, 255, 0.8);
    }

    .dev-input {
      font: inherit;
      padding: 0.55rem 0.7rem;
      border-radius: 10px;
      border: 1px solid rgba(160, 190, 255, 0.35);
      background: rgba(255, 255, 255, 0.06);
      color: rgb(240, 245, 255);
      resize: vertical;
    }

    .dev-input:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .dev-btn {
      font: inherit;
      font-weight: 700;
      padding: 0.65rem 1rem;
      border-radius: 12px;
      border: 0;
      cursor: pointer;
      transition: transform 200ms ease, filter 200ms ease;
    }

    .dev-btn:hover,
    .dev-btn:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .dev-btn-primary {
      background: linear-gradient(135deg, rgb(246, 190, 88), rgb(239, 136, 84));
      color: rgb(11, 23, 54);
    }

    .dev-error {
      color: rgb(255, 150, 150);
      font-size: 0.8rem;
      margin: 0;
    }

    /* --- Câmera controlada pelo usuário: roda do mouse, arrasto e botões.
       O #world recebe um transform escrito em JS a partir do estado
       `camera`; a transição é ligada/desligada inline conforme o
       movimento seja programático (enquadrar) ou manual (arrastar). --- */
    .camera-viewport {
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .camera-viewport.is-panning {
      cursor: grabbing;
    }

    .camera-controls {
      position: absolute;
      right: 0.85rem;
      bottom: 0.85rem;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 0.2rem;
      padding: 0.28rem;
      border-radius: 999px;
      background: rgba(10, 20, 48, 0.72);
      border: 1px solid rgba(160, 190, 255, 0.28);
      box-shadow: 0 10px 24px rgba(2, 9, 31, 0.4);
      backdrop-filter: blur(6px);
    }

    .camera-btn {
      width: 30px;
      height: 30px;
      min-width: 30px;
      padding: 0;
      border-radius: 50%;
      border: 0;
      background: transparent;
      color: rgba(231, 240, 255, 0.85);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .camera-btn:hover,
    .camera-btn:focus-visible {
      background: rgba(255, 255, 255, 0.14);
      color: rgb(255, 255, 255);
      transform: translateY(-1px);
    }

    .camera-btn.is-active {
      color: rgb(150, 240, 190);
    }

    .camera-zoom-readout {
      min-width: 44px;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: rgba(231, 240, 255, 0.8);
      font-variant-numeric: tabular-nums;
    }

    .camera-legend {
      position: absolute;
      left: 1rem;
      bottom: 1.1rem;
      z-index: 30;
      display: flex;
      gap: 0.9rem;
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(231, 240, 255, 0.5);
      pointer-events: none;
    }

    .camera-legend span {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .camera-legend b {
      width: 11px;
      height: 11px;
      flex: none;
      border-radius: 3px;
      background: rgb(72, 111, 197);
    }

    .camera-legend .legend-sub b {
      border-radius: 999px;
      background: rgb(224, 233, 255);
    }

    /* --- Subnós: a folhagem do galho. Mesma largura dos nós, na cor clara
       da paleta do galho. A caixa cresce com o texto (até 400 palavras) e
       rola por dentro depois do teto; enquanto for curta mantém o formato
       de pílula, que vira um oval feio quando a caixa fica alta. --- */
    .branch.is-subnode .branch-button {
      min-height: var(--sub-min-h, 54px);
      max-height: var(--sub-max-h, 320px);
      overflow-y: auto;
      overscroll-behavior: contain;
      align-items: flex-start;
      border-radius: 999px;
      padding: 0.6rem 1.15rem;
      box-shadow: 0 8px 18px rgba(1, 10, 31, 0.18);
    }

    /* Só o raio muda: mexer no padding alteraria a altura já medida por
       measureNodes() e obrigaria a remedir. */
    .branch.is-subnode.is-tall .branch-button {
      border-radius: 18px;
    }

    .branch.is-subnode .branch-name {
      font-size: var(--sub-size, 0.92rem);
      font-weight: 600;
      white-space: pre-wrap;
      text-align: left;
      /* min-width:0 é o que deixa o texto realmente quebrar dentro do flex,
         em vez de esticar a caixa até caber a maior palavra. */
      flex: 1 1 auto;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .connector.is-subnode {
      stroke-width: 1.6px;
    }

    .connector.is-subnode.is-visible {
      opacity: 0.72;
    }

    /* O botão que cria subnós usa a própria aparência de subnó, para que a
       categoria se aprenda olhando, sem precisar de legenda no botão. */
    .dev-node-btn-sub {
      background: rgb(226, 235, 255);
      color: rgb(23, 52, 105);
      border-color: rgba(255, 255, 255, 0.6);
    }

    .dev-node-btn-sub:hover,
    .dev-node-btn-sub:focus-visible {
      background: rgb(255, 255, 255);
    }

    /* --- Dados do mapa: exportar/importar. Fica ao lado do cadeado e só
       aparece no modo dev, porque importar substitui o mapa inteiro. --- */
    .data-toggle {
      right: 4.4rem;
      display: none;
    }

    body.dev-mode .data-toggle {
      display: grid;
    }

    /* Aparência: mesmo padrão do botão de dados, uma posição adiante. */
    .theme-toggle {
      right: 7.3rem;
      display: none;
    }

    body.dev-mode .theme-toggle {
      display: grid;
    }

    .dev-btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(160, 190, 255, 0.35);
      color: rgb(230, 238, 255);
    }

    .dev-data-actions {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .dev-data-hint {
      font-size: 0.76rem;
      color: rgba(230, 238, 255, 0.6);
      margin: 0.1rem 0 0.6rem;
      line-height: 1.4;
    }

    .dev-word-count {
      font-size: 0.74rem;
      font-weight: 600;
      color: rgba(230, 238, 255, 0.6);
      margin: -0.5rem 0 0;
      font-variant-numeric: tabular-nums;
    }

    .dev-word-count.is-over {
      color: rgb(255, 150, 150);
    }

    .dev-input-long {
      min-height: 190px;
      line-height: 1.45;
    }

    .dev-file-input {
      display: none;
    }

    /* --- Painel de aparência: uma linha por item colorível. O <input
       type=color> é pequeno e sem moldura em quase todo navegador, então
       ganha uma caixa própria para virar um alvo de clique decente. --- */
    .dev-color-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.32rem 0;
    }

    .dev-color-row .dev-color-name {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 0.82rem;
      color: rgba(230, 238, 255, 0.9);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dev-color-swatch {
      width: 40px;
      height: 26px;
      flex: none;
      padding: 0;
      border: 1px solid rgba(160, 190, 255, 0.4);
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
    }

    .dev-color-swatch::-webkit-color-swatch-wrapper {
      padding: 2px;
    }

    .dev-color-swatch::-webkit-color-swatch {
      border: 0;
      border-radius: 4px;
    }

    .dev-color-swatch::-moz-color-swatch {
      border: 0;
      border-radius: 4px;
    }

    .dev-reset-btn {
      flex: none;
      padding: 0.2rem 0.5rem;
      font-size: 0.7rem;
      border-radius: 6px;
      border: 1px solid rgba(160, 190, 255, 0.3);
      background: transparent;
      color: rgba(230, 238, 255, 0.65);
      cursor: pointer;
    }

    .dev-reset-btn:hover:not(:disabled),
    .dev-reset-btn:focus-visible:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
      color: rgb(255, 255, 255);
    }

    .dev-reset-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .dev-section-title {
      margin: 1rem 0 0.2rem;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(230, 238, 255, 0.55);
    }

    .dev-check {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: rgba(230, 238, 255, 0.9);
      cursor: pointer;
      padding: 0.32rem 0;
    }

    /* A lista de galhos pode passar de uma dezena: rola por dentro em vez
       de esticar o modal para fora da tela. */
    .dev-branch-list {
      max-height: 240px;
      overflow-y: auto;
      overscroll-behavior: contain;
      margin: 0;
      padding-right: 0.2rem;
    }

    /* --- Pesquisa ------------------------------------------------------
       Mora fora do #map-stage de propósito: assim nem o arrasto nem a roda
       da câmera enxergam os gestos feitos na caixa ou na lista. --- */
    .search {
      position: absolute;
      top: 3.05rem;
      left: 1.8rem;
      z-index: 25;
      width: min(340px, calc(100% - 3.6rem));
    }

    .search-field {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0 0.8rem;
      height: 40px;
      border-radius: 999px;
      background: rgba(10, 20, 48, 0.72);
      border: 1px solid rgba(160, 190, 255, 0.28);
      box-shadow: 0 10px 24px rgba(2, 9, 31, 0.35);
      backdrop-filter: blur(6px);
      color: rgba(231, 240, 255, 0.7);
      cursor: text;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .search-field:focus-within {
      border-color: rgba(160, 190, 255, 0.7);
      background: rgba(10, 20, 48, 0.9);
    }

    .search-icon {
      flex: none;
    }

    .search-input {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: rgb(240, 245, 255);
      font: inherit;
      font-size: 0.88rem;
    }

    .search-input::placeholder {
      color: rgba(231, 240, 255, 0.5);
    }

    /* O "x" nativo do type=search some: Esc já limpa, e o do Chrome é
       cinza sobre azul-escuro, quase invisível. */
    .search-input::-webkit-search-cancel-button {
      -webkit-appearance: none;
    }

    .search-results {
      list-style: none;
      margin: 0.4rem 0 0;
      padding: 0.3rem;
      max-height: min(360px, 55dvh);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(160, 190, 255, 0.35) transparent;
      border-radius: 16px;
      background: rgba(10, 20, 48, 0.94);
      border: 1px solid rgba(160, 190, 255, 0.28);
      box-shadow: 0 18px 38px rgba(2, 9, 31, 0.5);
      backdrop-filter: blur(6px);
    }

    .search-results::-webkit-scrollbar {
      width: 6px;
    }

    .search-results::-webkit-scrollbar-thumb {
      background: rgba(160, 190, 255, 0.35);
      border-radius: 999px;
    }

    .search-item {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      padding: 0.5rem 0.6rem;
      border-radius: 11px;
      cursor: pointer;
      color: rgb(236, 242, 255);
    }

    .search-item.is-active {
      background: rgba(160, 190, 255, 0.16);
    }

    /* A cor do galho, para reconhecer o resultado antes de ler o caminho;
       quadrado para nó e bolinha para subnó, como na legenda. */
    .search-dot {
      flex: none;
      width: 10px;
      height: 10px;
      margin-top: 0.3rem;
      border-radius: 3px;
    }

    .search-item.is-sub .search-dot {
      border-radius: 999px;
    }

    .search-text {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .search-label {
      font-size: 0.84rem;
      font-weight: 700;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .search-item.is-sub .search-label {
      font-weight: 500;
    }

    .search-path {
      font-size: 0.72rem;
      color: rgba(231, 240, 255, 0.55);
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .search-label mark,
    .search-path mark {
      background: rgba(246, 190, 88, 0.3);
      color: inherit;
      border-radius: 3px;
      padding: 0 1px;
    }

    .search-empty,
    .search-more {
      padding: 0.55rem 0.7rem;
      font-size: 0.78rem;
      color: rgba(231, 240, 255, 0.6);
      cursor: default;
    }

    .search-more {
      font-size: 0.72rem;
      border-top: 1px solid rgba(160, 190, 255, 0.14);
      margin-top: 0.2rem;
    }

    body.on-light .eyebrow + .search .search-field {
      box-shadow: 0 8px 20px rgba(11, 23, 54, 0.18);
    }

    /* Nó encontrado: um contorno que pulsa algumas vezes e some sozinho,
       para o olho achar a caixa depois que a câmera chega. */
    /* O foco do teclado vai para o nó encontrado; sem o :focus-visible
       aqui o anel branco do foco cobriria o destaque. */
    .branch.is-found .branch-button,
    .branch.is-found .branch-button:focus-visible {
      outline: 3px solid rgb(246, 190, 88);
      outline-offset: 4px;
      animation: found-pulse 900ms ease-out 3;
    }

    @keyframes found-pulse {
      0% { box-shadow: 0 0 0 0 rgba(246, 190, 88, 0.75), 0 12px 25px rgba(1, 10, 31, 0.24); }
      100% { box-shadow: 0 0 0 22px rgba(246, 190, 88, 0), 0 12px 25px rgba(1, 10, 31, 0.24); }
    }

    /* === Celular =======================================================
       Pende de body.is-compact, que applyMetrics() liga junto com as
       medidas do layout — e não de uma media query própria, que poderia
       discordar do JS e deixar caixas de 214px com passos de 194px.

       .mindmap-shell NUNCA pode ter min-height:auto aqui: todos os filhos
       dele são absolutos, então sem altura própria o shell desabaria para a
       altura do padding e a área do mapa ficaria com uns 100px de altura.
       =================================================================== */
    body.is-compact .mindmap-shell {
      padding: 3.6rem 0.75rem 1.5rem;
    }

    body.is-compact .eyebrow {
      top: 1.1rem;
      left: 1.1rem;
      font-size: 0.62rem;
    }

    /* No celular a caixa ocupa a largura toda, abaixo da fila do cadeado —
       no modo dev essa fila tem três botões e não sobra canto livre. */
    body.is-compact .search {
      top: 4rem;
      left: 0.75rem;
      right: 0.75rem;
      width: auto;
    }

    /* 16px: menos que isso e o iOS dá zoom sozinho ao focar o campo. */
    body.is-compact .search-input {
      font-size: 16px;
    }

    /* O círculo do tronco encolheu, mas o tamanho do rótulo dele vem
       inline do template — daí o !important, como já acontece com a
       instrução. Sem isto o nome da unidade vaza para fora do círculo. */
    body.is-compact .core-button {
      padding: 0.7rem;
    }

    body.is-compact .core-button .node-label {
      font-size: 15px !important;
    }

    body.is-compact .instruction {
      font-size: 0.74rem;
    }

    body.is-compact .branch-button {
      border-radius: 15px;
      padding: 0.7rem 0.8rem;
    }

    body.is-compact .branch.is-subnode .branch-button {
      padding: 0.5rem 0.9rem;
    }

    body.is-compact .camera-controls {
      right: 0.6rem;
      bottom: max(0.6rem, env(safe-area-inset-bottom, 0px));
    }

    body.is-compact .camera-legend {
      left: 0.75rem;
      bottom: max(0.85rem, env(safe-area-inset-bottom, 0px));
      font-size: 0.6rem;
      gap: 0.6rem;
    }

    body.is-compact .dev-toggle {
      top: 1rem;
      right: 1rem;
    }

    body.is-compact .data-toggle {
      right: 3.9rem;
    }

    body.is-compact .theme-toggle {
      right: 6.8rem;
    }

    body.is-compact .dev-modal {
      width: 100%;
      max-height: 88dvh;
      border-radius: 18px;
      padding: 1.4rem 1.1rem 1.2rem;
    }

    body.is-compact .dev-overlay {
      padding: 0.75rem;
      align-items: flex-end;
    }

    /* 16px é o mínimo que o iOS aceita sem dar zoom sozinho no campo ao
       receber o foco — e o zoom automático deixa o mapa fora de lugar. */
    body.is-compact .dev-input {
      font-size: 16px;
    }

    body.is-compact .drag-hint {
      font-size: 0.72rem;
      max-width: calc(100% - 1.5rem);
    }

    /* Não sobra largura para os dois cantos de baixo ao mesmo tempo. */
    @media (max-width: 460px) {
      .camera-legend {
        display: none;
      }
    }

    /* === Ponteiro grosso (dedo) =======================================
       Vale para o tablet também, onde a largura não denuncia o toque. Alvo
       de 44px é o mínimo confortável; os botões desenhados continuam do
       mesmo tamanho, o que cresce é a área que responde ao toque.
       ================================================================== */
    @media (pointer: coarse) {
      .camera-btn {
        width: 40px;
        height: 40px;
        min-width: 40px;
      }

      .dev-toggle {
        width: 44px;
        height: 44px;
      }

      .dev-node-btn {
        width: 30px;
        height: 30px;
        min-width: 30px;
      }

      /* O "+" decide entre abrir o galho e abrir o PDF: com 19px de ícone,
         o dedo erra. A área cresce para fora sem mexer no desenho. */
      .branch-toggle-icon {
        padding: 10px;
        margin: -10px;
        box-sizing: content-box;
        overflow: visible;
      }

      /* Sem hover no toque, o realce ao passar o dedo fica grudado no
         último nó tocado. */
      .branch-button:hover,
      .core-button:hover {
        transform: none;
        filter: none;
      }

      .branch-button:active {
        filter: brightness(1.1);
      }
    }

    /* Um subnó longo rola por dentro. A viewport tem touch-action:none para
       o mapa reagir à pinça e ao arrasto, e isso mataria a rolagem do texto:
       só a caixa que REALMENTE tem texto sobrando devolve o eixo vertical ao
       navegador. measureNodes() liga e desliga a classe. */
    .branch.is-subnode.is-scrollable .branch-button {
      touch-action: pan-y;
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

  <script src="/_sdk/0b5911494a4ff060.editing_sdk.js" integrity="sha512-/vyQ+jNH4Q/uooDsnMcX6o3IxIcmA7RW0TJmBR88seymBCMyLn9QjvQ8qpBP5hx5JmcAoEFUTuGK9amUMyPFpA=="></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const stage = document.getElementById("map-stage");
      const viewport = document.getElementById("camera-viewport");
      const world = document.getElementById("world");
      const branchesLayer = document.getElementById("branches-layer");
      const connectorsSvg = document.querySelector(".connectors");
      const coreArea = document.getElementById("core-area");
      const coreButton = document.getElementById("core-button");
      const coreLabel = coreButton.querySelector(".node-label");
      const status = document.getElementById("map-status");

      const zoomInBtn = document.getElementById("camera-zoom-in");
      const zoomOutBtn = document.getElementById("camera-zoom-out");
      const fitBtn = document.getElementById("camera-fit");
      const zoomReadout = document.getElementById("camera-zoom-readout");
      const dragHint = document.getElementById("drag-hint");

      const DEV_PASSWORD = "2387";
      const devToggle = document.getElementById("dev-toggle");
      const dataToggle = document.getElementById("data-toggle");
      const themeToggle = document.getElementById("theme-toggle");
      const importFile = document.getElementById("import-file");
      const devOverlay = document.getElementById("dev-overlay");
      const devModalClose = document.getElementById("dev-modal-close");
      const devModalBody = document.getElementById("dev-modal-body");
      let devUnlocked = false;

      // --- PDFs do projeto: cada subnó pode apontar para um arquivo salvo
      // em pdfs/ na raiz do site. Como a página é estática, não há como
      // listar a pasta em tempo real — pdfs/manifest.json funciona como o
      // índice: um array de nomes de arquivo, atualizado à mão sempre que
      // um PDF novo é colocado na pasta. O campo de PDF no formulário
      // aceita qualquer nome digitado (funciona mesmo sem o manifesto,
      // como ao abrir o arquivo direto do disco), e usa esse índice só
      // para sugerir os nomes já conhecidos via <datalist>.
      let pdfLibrary = [];
      function refreshPdfDatalist() {
        const list = document.getElementById("pdf-library-list");
        if (!list) return;
        list.innerHTML = pdfLibrary.map(
          (name) => `<option value="${escapeHtml(name)}"></option>`
        ).join("");
      }
      fetch("pdfs/manifest.json")
        .then((res) => (res.ok ? res.json() : []))
        .then((list) => {
          pdfLibrary = Array.isArray(list) ? list : [];
          refreshPdfDatalist();
        })
        .catch(() => { pdfLibrary = []; });

      // Geometria: o tronco fica no meio e os setores se apoiam num arco à
      // direita e à esquerda dele. Dali para dentro, cada galho cresce na
      // horizontal para o lado em que nasceu, com os irmãos empilhados na
      // vertical — é o que mantém a largura do galho independente de onde
      // ele nasceu. Só nós visíveis ocupam espaço: quem está fechado não
      // reserva lugar nenhum.
      //
      // As medidas vivem em METRICS e não em constantes soltas porque o
      // celular usa um jogo menor. Encolher só o CSS ou só o layout
      // desalinharia caixa e conector: o layout mede a caixa pelo
      // offsetWidth (que vem do CSS) mas dá o passo pela constante, então
      // os dois lados têm de sair do mesmo lugar. applyMetrics() escreve
      // as variáveis que o CSS lê e atualiza ROOT.r de uma vez só.
      const METRICS = {
        wide: {
          nodeW: 214, coreR: 84, nodeMinH: 70, subMinH: 54, subMaxH: 320,
          stepX: 254,      // avanço horizontal por geração dentro do galho
          siblingGap: 24,  // folga vertical entre irmãos dentro do galho
          sectorGap: 40,   // folga vertical entre galhos vizinhos do mesmo lado
          arcR: 168,       // quanto o arco dos setores se abre a partir do tronco
          coreGap: 46,     // menor distância entre o tronco e a caixa de um setor
          nameSize: 1, subSize: 0.92,
        },
        narrow: {
          nodeW: 168, coreR: 62, nodeMinH: 58, subMinH: 46, subMaxH: 210,
          stepX: 194, siblingGap: 16, sectorGap: 28, arcR: 110, coreGap: 28,
          nameSize: 0.88, subSize: 0.84,
        },
      };
      const NARROW_AT = 700;       // largura a partir da qual as caixas encolhem
      const SHORT_AT = 460;        // altura idem — é o celular deitado
      let M = METRICS.wide;

      const ROOT = { x: 0, y: 0, r: M.coreR };
      const WORLD_MARGIN = 160;
      const TWEEN_MS = 450;        // duração da reacomodação do mapa

      const SUB_TALL_AT = 96;      // acima disso o subnó perde o formato de pílula
      const SUB_WORD_LIMIT = 400;
      const NODE_CHAR_LIMIT = 80;

      // Escolhe o jogo de medidas e publica no CSS. Devolve true quando o
      // jogo mudou — aí o mapa precisa ser medido e desenhado de novo, e
      // não só reenquadrado.
      //
      // Esta função é a ÚNICA dona do ponto de virada. O CSS compacto pende
      // de body.is-compact e não de uma media query própria: com dois
      // limiares independentes, um celular deitado (844x390) cairia no
      // compacto pelo JS e no normal pelo CSS, e o layout daria passos de
      // 194px entre caixas de 214px — colunas sobrepostas.
      function applyMetrics() {
        const narrow = window.innerWidth <= NARROW_AT || window.innerHeight <= SHORT_AT;
        const next = narrow ? METRICS.narrow : METRICS.wide;
        const changed = next !== M;
        M = next;
        ROOT.r = M.coreR;
        const css = document.documentElement.style;
        css.setProperty("--node-w", M.nodeW + "px");
        css.setProperty("--core-size", (M.coreR * 2) + "px");
        css.setProperty("--node-min-h", M.nodeMinH + "px");
        css.setProperty("--sub-min-h", M.subMinH + "px");
        css.setProperty("--sub-max-h", M.subMaxH + "px");
        css.setProperty("--name-size", M.nameSize + "rem");
        css.setProperty("--sub-size", M.subSize + "rem");
        document.body.classList.toggle("is-compact", narrow);
        return changed;
      }

      const PALETTE = [
        { bg: "rgb(26, 157, 158)", fg: "rgb(255, 255, 255)", subBg: "rgb(217, 245, 241)", subFg: "rgb(18, 60, 66)" },
        { bg: "rgb(72, 111, 197)", fg: "rgb(255, 255, 255)", subBg: "rgb(224, 233, 255)", subFg: "rgb(23, 52, 105)" },
        { bg: "rgb(164, 74, 119)", fg: "rgb(255, 255, 255)", subBg: "rgb(249, 225, 235)", subFg: "rgb(100, 33, 63)" },
        { bg: "rgb(214, 109, 64)", fg: "rgb(255, 255, 255)", subBg: "rgb(255, 233, 216)", subFg: "rgb(109, 43, 23)" },
        { bg: "rgb(90, 150, 90)", fg: "rgb(255, 255, 255)", subBg: "rgb(224, 245, 224)", subFg: "rgb(30, 80, 30)" },
        { bg: "rgb(120, 90, 190)", fg: "rgb(255, 255, 255)", subBg: "rgb(232, 224, 250)", subFg: "rgb(55, 30, 100)" },
      ];

      // === Aparência ======================================================
      // O tema guarda só o que foge do padrão. Enquanto um galho não tem cor
      // escolhida, ele segue a PALETTE pelo índice — é assim que o mapa
      // continua com exatamente as mesmas cores de antes deste recurso.
      // As cores dos galhos são indexadas pelo id do nó do setor, e não pela
      // posição: apagar ou criar um setor não deve embaralhar as cores dos
      // outros.
      // ====================================================================
      const DEFAULT_THEME = {
        background: "#0b1736",
        core: "#f6be58",       // primeira parada do gradiente do tronco
        coreEnd: "#ef8854",    // segunda parada
        line: "#a0beff",       // conectores (aplicados com o alfa de --line)
        blobA: "#19b7bb",
        blobB: "#f5b14b",
        blobs: true,
        branches: {},          // { [id do setor]: "#rrggbb" }
      };
      const LINE_ALPHA = 0.56;
      const BLOB_A_ALPHA = 0.24;
      const BLOB_B_ALPHA = 0.18;

      let theme = Object.assign({}, DEFAULT_THEME, { branches: {} });

      // --- Aritmética de cor ----------------------------------------------
      function hexToRgb(hex) {
        const clean = String(hex || "").trim().replace("#", "");
        const full = clean.length === 3
          ? clean[0] + clean[0] + clean[1] + clean[1] + clean[2] + clean[2]
          : clean;
        const num = parseInt(full, 16);
        if (full.length !== 6 || isNaN(num)) return { r: 0, g: 0, b: 0 };
        return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
      }

      function rgbToHex(c) {
        const part = (v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, "0");
        return "#" + part(c.r) + part(c.g) + part(c.b);
      }

      function rgbCss(c, alpha) {
        const r = Math.round(c.r), g = Math.round(c.g), b = Math.round(c.b);
        return alpha === undefined
          ? `rgb(${r}, ${g}, ${b})`
          : `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      function mixRgb(a, b, t) {
        return {
          r: a.r + (b.r - a.r) * t,
          g: a.g + (b.g - a.g) * t,
          b: a.b + (b.b - a.b) * t,
        };
      }

      // Luminância relativa (WCAG) — decide entre texto branco e texto
      // escuro por cima da cor escolhida, para o rótulo nunca sumir.
      function luminance(c) {
        const chan = (v) => {
          const s = v / 255;
          return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
        };
        return 0.2126 * chan(c.r) + 0.7152 * chan(c.g) + 0.0722 * chan(c.b);
      }

      const WHITE = { r: 255, g: 255, b: 255 };
      const BLACK = { r: 0, g: 0, b: 0 };
      const INK_RGB = { r: 11, g: 23, b: 54 };
      const INK = rgbCss(INK_RGB);     // o azul-tinta do tema, para texto escuro

      function contrast(a, b) {
        const la = luminance(a);
        const lb = luminance(b);
        return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
      }

      // Texto por cima de uma cor escolhida à mão. O branco tem preferência
      // — é o que a paleta padrão usa, e trocá-lo à toa deixaria um galho
      // personalizado destoando dos outros —, mas cede para a tinta quando
      // não alcança 4.5:1, o mínimo legível para texto desse tamanho.
      function textOver(bg) {
        const onWhite = contrast(WHITE, bg);
        if (onWhite >= 4.5) return rgbCss(WHITE);
        return contrast(INK_RGB, bg) > onWhite ? INK : rgbCss(WHITE);
      }

      // Deriva as quatro cores de um galho a partir de uma cor só: a forte
      // do nó, o texto que a acompanha, e o par claro usado pelos subnós.
      function derivePalette(hex) {
        const base = hexToRgb(hex);
        return {
          bg: rgbCss(base),
          fg: textOver(base),
          subBg: rgbCss(mixRgb(base, WHITE, 0.86)),
          subFg: rgbCss(mixRgb(base, BLACK, 0.62)),
        };
      }

      // Escreve o tema na página. Tudo o que o tema toca vira estilo inline
      // ou variável CSS — nada some quando o mapa é reconstruído, e o HTML
      // exportado já nasce com as cores certas, antes mesmo do script rodar.
      function applyTheme() {
        const rootStyle = document.documentElement.style;
        const bg = hexToRgb(theme.background);
        document.body.style.background = rgbCss(bg);
        // Fundo claro inverte os textos que vivem por cima dele (eyebrow,
        // legenda, instrução, botões do topo), senão eles somem.
        document.body.classList.toggle("on-light", luminance(bg) > 0.45);

        rootStyle.setProperty("--line", rgbCss(hexToRgb(theme.line), LINE_ALPHA));
        rootStyle.setProperty("--blob-a", rgbCss(hexToRgb(theme.blobA), BLOB_A_ALPHA));
        rootStyle.setProperty("--blob-b", rgbCss(hexToRgb(theme.blobB), BLOB_B_ALPHA));
        document.body.classList.toggle("no-blobs", !theme.blobs);

        const coreA = hexToRgb(theme.core);
        const coreB = hexToRgb(theme.coreEnd);
        coreButton.style.background =
          "linear-gradient(135deg, " + rgbCss(coreA) + ", " + rgbCss(coreB) + ")";
        const coreFg = textOver(mixRgb(coreA, coreB, 0.5));
        coreButton.style.color = coreFg;
        coreLabel.style.color = coreFg;

        applyNodeColors();
      }

      // Repinta os nós já montados sem reconstruir a árvore: mudar cor não
      // mexe em tamanho nem em posição, então não há por que remedir.
      function applyNodeColors() {
        nodeById.forEach((node) => {
          if (node.depth === 0 || !node.el) return;
          const button = node.el.querySelector(".branch-button");
          if (!button) return;
          const color = colorFor(node);
          button.style.background = color.bg;
          button.style.color = color.fg;
          const name = button.querySelector(".branch-name");
          if (name) name.style.color = color.fg;
        });
      }

      // --- Categorias ---------------------------------------------------
      // "node"    : galho. Nasce de qualquer nó e continua a árvore.
      // "subnode" : folha do galho. Só nasce de um nó-folha (um nó que
      //             ainda não tem nenhum filho do tipo "node") e é sempre
      //             terminal — não recebe filhos de espécie alguma.
      // Consequência das duas regras juntas: um nó ou continua o galho com
      // nós, ou o encerra com subnós. Nunca as duas coisas ao mesmo tempo.
      const NODE = "node";
      const SUBNODE = "subnode";

      const treeData = {
        root: {
          id: "root", label: "BUCAREIN", url: "", type: NODE,
          children: [
            {
              id: "objective", label: "Objetivo", url: "", type: NODE, children: [
                { id: "objective-sub-1", label: "Resultado desejado", url: "", type: SUBNODE, children: [] },
                { id: "objective-sub-2", label: "Critério de sucesso", url: "", type: SUBNODE, children: [] },
              ],
            },
            {
              id: "ideas", label: "Ideias", url: "", type: NODE, children: [
                { id: "ideas-sub-1", label: "Possibilidades", url: "", type: SUBNODE, children: [] },
                { id: "ideas-sub-2", label: "Perguntas-chave", url: "", type: SUBNODE, children: [] },
              ],
            },
            {
              id: "resources", label: "Recursos", url: "", type: NODE, children: [
                { id: "resources-sub-1", label: "Pessoas e apoio", url: "", type: SUBNODE, children: [] },
                { id: "resources-sub-2", label: "Ferramentas", url: "", type: SUBNODE, children: [] },
              ],
            },
            {
              id: "next", label: "Próximos passos", url: "", type: NODE, children: [
                { id: "next-sub-1", label: "Primeira ação", url: "", type: SUBNODE, children: [] },
                { id: "next-sub-2", label: "Prazo e revisão", url: "", type: SUBNODE, children: [] },
              ],
            },
          ],
        },
      };

      function isSub(node) {
        return node.type === SUBNODE;
      }

      function hasNodeChild(node) {
        return node.children.some((child) => !isSub(child));
      }

      function hasSubChild(node) {
        return node.children.some(isSub);
      }

      // Um nó aceita novos nós enquanto não tiver encerrado o galho com
      // subnós. Subnós nunca aceitam filhos.
      function canAddNode(node) {
        return !isSub(node) && !hasSubChild(node);
      }

      // Subnós só pendem da ponta de um galho. A raiz é o tronco: ela
      // sempre inicia galhos, nunca recebe folhagem direto.
      function canAddSub(node) {
        return !isSub(node) && node !== treeData.root && !hasNodeChild(node);
      }

      // Meia-largura e meia-altura da caixa. A altura do subnó depende do
      // texto renderizado, então vem de measureNodes(); as constantes só
      // valem como estimativa antes da primeira medição.
      function halfW(node) {
        return node.depth === 0 ? ROOT.r : (node.w || M.nodeW) / 2;
      }

      function halfH(node) {
        if (node.depth === 0) return ROOT.r;
        return (node.h || (isSub(node) ? M.subMinH : M.nodeMinH)) / 2;
      }

      function countWords(text) {
        const trimmed = String(text).trim();
        return trimmed ? trimmed.split(/\s+/).length : 0;
      }

      // Rótulos de subnó podem ter centenas de palavras; onde o texto é lido
      // fora da caixa (leitor de tela, aviso de remoção) entra só um resumo.
      function shortLabel(node, max) {
        const limit = max || 60;
        const flat = String(node.label).replace(/\s+/g, " ").trim();
        return flat.length > limit ? flat.slice(0, limit - 1) + "…" : flat;
      }

      let nodeById = new Map();
      let nodeCounter = 0;
      function newNodeId() {
        nodeCounter += 1;
        return "node-" + Date.now().toString(36) + "-" + nodeCounter;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, (ch) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[ch]));
      }

      // --- Persistência: o localStorage é o rascunho automático (salva a
      // cada mudança do modo dev, no mesmo navegador/perfil). O mapa
      // portátil sai por exportação, em .json ou em .html autocontido. ---
      const STORAGE_KEY = "mapaPOPs.treeData.v1";
      const THEME_KEY = "mapaPOPs.theme.v1";
      const SEED_STAMP_KEY = "mapaPOPs.seedStamp.v1";
      const MAP_FORMAT = "mapaPOPs";
      const MAP_FORMAT_VERSION = 3;

      function serializeNode(node) {
        return {
          id: node.id,
          label: node.label,
          url: node.url || "",
          pdf: node.pdf || "",
          color: node.color || "",
          type: isSub(node) ? SUBNODE : NODE,
          children: node.children.map(serializeNode),
        };
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeNode(treeData.root)));
        } catch (e) {
          // localStorage indisponível (ex.: navegação privada) — ignora.
        }
      }

      // O tema é guardado à parte da árvore: são coisas com ciclos de vida
      // diferentes (importar um mapa não precisa levar junto as cores de
      // quem exportou, mas pode). Só sobrevivem as chaves conhecidas.
      function sanitizeTheme(raw) {
        const clean = Object.assign({}, DEFAULT_THEME, { branches: {} });
        if (!raw || typeof raw !== "object") return clean;
        ["background", "core", "coreEnd", "line", "blobA", "blobB"].forEach((key) => {
          if (typeof raw[key] === "string" && /^#[0-9a-f]{3,6}$/i.test(raw[key].trim())) {
            clean[key] = rgbToHex(hexToRgb(raw[key]));
          }
        });
        if (typeof raw.blobs === "boolean") clean.blobs = raw.blobs;
        if (raw.branches && typeof raw.branches === "object") {
          Object.keys(raw.branches).forEach((id) => {
            const value = raw.branches[id];
            if (typeof value === "string" && /^#[0-9a-f]{3,6}$/i.test(value.trim())) {
              clean.branches[id] = rgbToHex(hexToRgb(value));
            }
          });
        }
        return clean;
      }

      function saveTheme() {
        try {
          localStorage.setItem(THEME_KEY, JSON.stringify(theme));
        } catch (e) {
          // sem localStorage o tema vale só para esta sessão.
        }
      }

      function loadTheme() {
        try {
          const raw = localStorage.getItem(THEME_KEY);
          return raw ? sanitizeTheme(JSON.parse(raw)) : null;
        } catch (e) {
          return null;
        }
      }

      // Mapas salvos antes das categorias não têm `type`. Nesses casos a
      // categoria é inferida da aparência que o nó já tinha: da segunda
      // geração em diante, quem não tinha filhos era desenhado na cor
      // clara — ou seja, já era um subnó na prática.
      function reviveChildren(list, depth) {
        if (!Array.isArray(list)) return [];
        return list.map((n) => {
          const children = reviveChildren(n && n.children, depth + 1);
          let type = n && (n.type === SUBNODE || n.type === NODE) ? n.type : null;
          if (!type) type = depth >= 2 && children.length === 0 ? SUBNODE : NODE;
          if (children.length) type = NODE; // subnó é sempre terminal
          return {
            id: (n && n.id) || newNodeId(),
            label: (n && n.label) || "",
            url: (n && n.url) || "",
            pdf: (n && n.pdf) || "",
            color: (n && typeof n.color === "string" && /^#[0-9a-f]{3,6}$/i.test(n.color.trim()))
              ? rgbToHex(hexToRgb(n.color))
              : "",
            type: type,
            children: children,
          };
        });
      }

      // Garante a exclusividade entre as categorias em dados antigos: se um
      // nó ficou com filhos das duas espécies, os subnós são promovidos a
      // nós — assim nada some do mapa e a regra volta a valer.
      function normalizeTypes(node) {
        if (node.children.length && hasNodeChild(node)) {
          node.children.forEach((child) => { child.type = NODE; });
        }
        node.children.forEach(normalizeTypes);
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return null;
          return parsed;
        } catch (e) {
          return null;
        }
      }

      // Aceita tanto o envelope de exportação quanto um nó solto — que é o
      // formato gravado no localStorage desde a v05. Assim um mapa antigo
      // continua abrindo sem conversão.
      function readEnvelope(parsed) {
        if (!parsed || typeof parsed !== "object") return null;
        if (parsed.format === MAP_FORMAT && parsed.root && typeof parsed.root === "object") {
          return parsed.root;
        }
        if (Array.isArray(parsed.children) || typeof parsed.label === "string") return parsed;
        return null;
      }

      function buildEnvelope() {
        return {
          format: MAP_FORMAT,
          version: MAP_FORMAT_VERSION,
          exportedAt: new Date().toISOString(),
          theme: theme,
          root: serializeNode(treeData.root),
        };
      }

      // O tema viaja no envelope, mas só é adotado se vier de fato — mapas
      // da v2 não têm esse campo e devem manter as cores de quem importa.
      function adoptTheme(envelope) {
        if (!envelope || typeof envelope !== "object" || !envelope.theme) return false;
        theme = sanitizeTheme(envelope.theme);
        applyTheme();
        saveTheme();
        return true;
      }

      // Substitui a árvore inteira por um nó-raiz vindo de arquivo ou do
      // seed embutido, passando pelo mesmo saneamento do carregamento
      // normal (tipos inferidos e exclusividade nó/subnó reimposta).
      function adoptRoot(rootData) {
        treeData.root.label = rootData.label || treeData.root.label;
        treeData.root.url = "";
        treeData.root.pdf = "";
        treeData.root.type = NODE;
        treeData.root.children = reviveChildren(rootData.children, 1);
        normalizeTypes(treeData.root);
        coreLabel.textContent = treeData.root.label;
      }

      function readSeed() {
        const el = document.getElementById("map-seed");
        if (!el || !el.textContent.trim()) return null;
        try {
          return JSON.parse(el.textContent);
        } catch (e) {
          return null;
        }
      }

      function downloadFile(filename, mime, text) {
        const blob = new Blob([text], { type: mime });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function stamp() {
        const d = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      }

      // --- Layout: leque em arco, galhos lineares --------------------------
      // O tronco fica no meio e os setores se apoiam num arco à direita e à
      // esquerda dele. De cada setor para dentro o galho cresce na
      // horizontal, para o lado em que nasceu, com os irmãos empilhados na
      // vertical — assim a largura do galho não depende de onde ele nasceu
      // (uma caixa tem 214px de largura contra 70px de altura: empilhada de
      // lado ficaria três vezes mais larga).
      //
      // POR QUE OS GALHOS NÃO SE SOBREPÕEM MAIS
      // O anel de 360° escolhia o ângulo de cada setor por uma estimativa
      // (W·|sen θ| + H·|cos θ|) e errava por um fator de cos²: o vão entre
      // dois vizinhos vale arco·|cos θ|, mas a estimativa já tinha dividido
      // a altura por |cos θ| — o cosseno entrava duas vezes e sobrava menos
      // espaço do que o galho pedia. Dois galhos grandes no mesmo quadrante
      // se invadiam, e nenhum ajuste de folga resolvia, porque o erro era da
      // fórmula e não do tamanho da folga.
      //
      // Agora a garantia é estrutural, e não estimada:
      //   1. cada galho é medido pela caixa EXATA que envolve a subárvore
      //      visível (branchBox), percorrendo as mesmas contas que depois
      //      posicionam os nós — medir e posicionar não podem divergir;
      //   2. dentro de um lado os galhos são empilhados na vertical, um
      //      abaixo do outro: as faixas de y ficam disjuntas por construção;
      //   3. um lado nunca cruza o outro: toda caixa da direita começa em
      //      x ≥ coreGap e toda caixa da esquerda termina em x ≤ −coreGap.
      // Duas caixas quaisquer ou estão em lados opostos (separadas em x) ou
      // no mesmo lado (separadas em y). Não existe terceiro caso — é isso
      // que faz "nunca se sobrepõem" ser uma propriedade do algoritmo.
      //
      // O QUE SE MOVE
      // Duas coisas respondem ao tamanho dos galhos. A volta continua sendo
      // a mesma volta de sempre, mas ela é um anel: o par (por onde começa,
      // onde troca de lado) é reescolhido a cada desenho para equilibrar a
      // altura dos dois lados, então abrir um galho gigante gira o anel até
      // ele caber sozinho de um lado, com os fechados juntinhos do outro.
      // E o quanto cada setor se afasta do tronco
      // sai da distância vertical entre a faixa dele e a linha do tronco: os
      // de cima e os de baixo vêm para perto do eixo, os do meio se abrem —
      // é o arco que devolve a silhueta de anel do layout antigo. O arco é
      // só aparência e não pode criar sobreposição: empurrar um setor para
      // dentro ou para fora não muda a faixa de y dele.
      //
      // Só nós VISÍVEIS ocupam espaço: quem está fechado não reserva lugar,
      // e nós ocultos herdam a posição do pai para emergirem de dentro dele
      // quando abrem.
      //
      // As caixas não giram: rótulo inclinado seria ilegível.
      // ---------------------------------------------------------------------
      function layoutTree() {
        nodeById = new Map();

        // Índice e parentesco primeiro: computeVisibility() e colorFor()
        // dependem de depth/parent, e as duas rodam antes do posicionamento.
        (function index(node, depth, parent) {
          node.depth = depth;
          node.parent = parent;
          nodeById.set(node.id, node);
          node.children.forEach((child) => index(child, depth + 1, node));
        })(treeData.root, 0, null);

        computeVisibility();

        function visibleChildren(node) {
          return node.children.filter((child) => child.visible);
        }

        // Altura que o galho ocupa na vertical, empilhando irmãos visíveis.
        // O cache existe porque cada galho é percorrido duas vezes (uma para
        // medir, outra para posicionar) e sem ele a recursão viraria
        // quadrática num mapa de centenas de nós.
        const heightCache = new Map();
        function branchHeight(node) {
          const cached = heightCache.get(node);
          if (cached !== undefined) return cached;
          const kids = visibleChildren(node);
          const own = node.h || (isSub(node) ? M.subMinH : M.nodeMinH);
          let value = own;
          if (kids.length) {
            const total = kids.reduce((sum, kid) => sum + branchHeight(kid), 0)
              + M.siblingGap * (kids.length - 1);
            value = Math.max(own, total);
          }
          heightCache.set(node, value);
          return value;
        }

        // Percorre o galho inteiro entregando a posição RELATIVA ao nó de
        // origem, que fica em (0,0). Medir e posicionar saem daqui, das
        // mesmas contas — é o que impede a medida de um galho de discordar
        // de onde os nós dele realmente vão parar.
        function eachInBranch(node, dir, visit) {
          (function walk(n, rx, ry) {
            visit(n, rx, ry);
            const kids = visibleChildren(n);
            if (!kids.length) return;
            const heights = kids.map(branchHeight);
            const total = heights.reduce((a, b) => a + b, 0)
              + M.siblingGap * (kids.length - 1);
            let cursor = ry - total / 2;
            kids.forEach((kid, i) => {
              walk(kid, rx + dir * M.stepX, cursor + heights[i] / 2);
              cursor += heights[i] + M.siblingGap;
            });
          })(node, 0, 0);
        }

        // Caixa exata que envolve a subárvore visível, relativa ao setor.
        function branchBox(node, dir) {
          const box = { l: Infinity, r: -Infinity, t: Infinity, b: -Infinity };
          eachInBranch(node, dir, (n, rx, ry) => {
            box.l = Math.min(box.l, rx - halfW(n));
            box.r = Math.max(box.r, rx + halfW(n));
            box.t = Math.min(box.t, ry - halfH(n));
            box.b = Math.max(box.b, ry + halfH(n));
          });
          return box;
        }

        // Escreve as posições do galho, agora que o setor já tem a sua.
        function placeBranch(node, dir) {
          eachInBranch(node, dir, (n, rx, ry) => {
            if (n === node) return;
            n.x = node.x + rx;
            n.y = node.y + ry;
          });
        }

        // Altura de uma pilha de galhos, com as folgas entre eles.
        function stackHeight(list) {
          if (!list.length) return 0;
          return list.reduce((a, b) => a + b, 0) + M.sectorGap * (list.length - 1);
        }

        // Onde a caixa do setor começa, medido do centro do tronco. Quanto
        // mais longe da linha do tronco a faixa do setor estiver, mais para
        // dentro ele pode vir — daí o arco. O segundo termo é a garantia de
        // que nenhuma caixa encoste no círculo do tronco, mesmo que o arco
        // um dia seja configurado menor que ele.
        // Onde a caixa do setor começa, medido do centro do tronco.
        //
        // O bojo é uma meia-elipse NORMALIZADA PELA PRÓPRIA PILHA: o setor
        // do meio se afasta o máximo do tronco e os das pontas encostam no
        // eixo, quantos setores existam. Normalizar é o que mantém o anel
        // redondo — com um raio de arco fixo, todo setor cuja faixa caísse
        // além dele recebia o mesmo bojo zero, e as pontas do anel viravam
        // uma coluna reta assim que o tronco ganhava setores novos.
        //
        // `span` nunca desce abaixo de M.arcR: num lado com um ou dois
        // setores, a pilha inteira cabe dentro do arco e eles ficariam
        // achatados contra o eixo sem esse piso.
        //
        // O segundo termo é a garantia dura: enquanto a FAIXA do setor
        // cruzar a altura do tronco, a caixa começa depois dele inteiro.
        // Ele olha a faixa, e não o centro do setor, porque é a faixa que
        // pode encostar no tronco — um galho alto tem o nó no meio dele,
        // longe de onde a caixa realmente passa.
        function innerOffset(y0, y1, centerY, span) {
          const t = centerY / span;
          const bulge = M.arcR * Math.sqrt(Math.max(0, 1 - t * t));
          const dy = y0 > 0 ? y0 : (y1 < 0 ? -y1 : 0);
          const clear = dy < ROOT.r ? ROOT.r : 0;
          return M.coreGap + Math.max(bulge, clear);
        }

        treeData.root.x = 0;
        treeData.root.y = 0;

        const sectors = treeData.root.children.filter((node) => node.visible);
        const boxes = sectors.map((node) => branchBox(node, 1));
        const heights = boxes.map((box) => box.b - box.t);

        // Onde a volta troca de lado, e por qual setor ela começa. Os
        // setores continuam na mesma volta de sempre — desce por um lado e
        // sobe pelo outro —, mas a volta é um ANEL e não uma fila: pode
        // começar em qualquer um deles. Escolher o começo junto com o ponto
        // de corte é o que deixa um galho gigante ficar sozinho de um lado,
        // com os fechados todos juntinhos do outro. Preso ao começo fixo, o
        // corte só sabia cortar depois do gigante, e arrastava os vizinhos
        // de antes dele para o alto do mapa, longe do tronco e ligados por
        // conectores que atravessavam tudo.
        //
        // É daqui que vem o movimento: abrir ou fechar um galho muda as
        // alturas, o par (começo, corte) é reescolhido, e os setores giram
        // no anel para acomodar quem cresceu.
        const n = sectors.length;
        let bestStart = 0;
        let bestCut = Math.ceil(n / 2);
        if (n > 1) {
          // As duas pilhas juntas somam sempre a mesma coisa, então basta
          // acumular a da direita e subtrair.
          const totalBoth = heights.reduce((a, b) => a + b, 0) + M.sectorGap * (n - 2);
          let best = Infinity;
          for (let start = 0; start < n; start += 1) {
            let acc = 0;
            for (let k = 1; k < n; k += 1) {
              acc += heights[(start + k - 1) % n] + (k > 1 ? M.sectorGap : 0);
              const diff = Math.abs(acc - (totalBoth - acc));
              // Só troca por uma melhora de verdade: no empate — que é o
              // caso de todo mundo fechado — vence o começo canônico, e o
              // anel fica exatamente onde o usuário está acostumado a vê-lo.
              if (diff < best - 0.5) { best = diff; bestStart = start; bestCut = k; }
            }
          }
        }

        const right = [];
        const left = [];
        for (let i = 0; i < n; i += 1) {
          const idx = (bestStart + i) % n;
          (i < bestCut ? right : left).push(idx);
        }
        left.reverse();

        [[1, right], [-1, left]].forEach((entry) => {
          const dir = entry[0];
          const idxs = entry[1];
          if (!idxs.length) return;

          // A vertical primeiro: o empilhamento não depende do arco, e o
          // arco precisa saber de antemão até onde a pilha vai.
          const linha = [];
          let cursor = -stackHeight(idxs.map((i) => heights[i])) / 2;
          idxs.forEach((i) => {
            // A caixa foi medida crescendo para a direita; do lado esquerdo
            // ela é a mesma, espelhada — a altura não muda com o lado.
            const box = dir > 0 ? boxes[i]
              : { l: -boxes[i].r, r: -boxes[i].l, t: boxes[i].t, b: boxes[i].b };
            const top = cursor;
            const bottom = top + heights[i];
            sectors[i].y = top - box.t;
            linha.push({ node: sectors[i], box: box, top: top, bottom: bottom });
            cursor = bottom + M.sectorGap;
          });

          // Agora a horizontal, com a pilha inteira já conhecida.
          const span = Math.max(
            M.arcR,
            linha.reduce((max, l) => Math.max(max, Math.abs(l.node.y)), 0)
          );
          linha.forEach((l) => {
            const inner = innerOffset(l.top, l.bottom, l.node.y, span);
            l.node.x = dir > 0 ? inner - l.box.l : -inner - l.box.r;
            placeBranch(l.node, dir);
          });
        });

        // Quem está oculto nasce e morre na posição do pai.
        (function settleHidden(node) {
          node.children.forEach((child) => {
            if (!child.visible) {
              child.x = node.x;
              child.y = node.y;
            }
            settleHidden(child);
          });
        })(treeData.root);

        // Desloca tudo para o canvas ficar em números positivos; o centro se
        // move conforme o mapa abre e fecha.
        let minX = -ROOT.r;
        let minY = -ROOT.r;
        nodeById.forEach((node) => {
          if (node.depth === 0 || !node.visible) return;
          minX = Math.min(minX, node.x - halfW(node));
          minY = Math.min(minY, node.y - halfH(node));
        });

        const offsetX = WORLD_MARGIN - minX;
        const offsetY = WORLD_MARGIN - minY;
        nodeById.forEach((node) => {
          node.x += offsetX;
          node.y += offsetY;
        });
      }

      // O setor (galho) a que o nó pertence: o ancestral logo abaixo do
      // tronco. É ele quem carrega a cor no painel de aparência.
      function sectorOf(node) {
        let top = node;
        while (top.depth > 1) top = top.parent;
        return top;
      }

      function paletteForSector(sector) {
        const custom = sector && theme.branches[sector.id];
        if (custom) return derivePalette(custom);
        const idx = Math.max(0, treeData.root.children.indexOf(sector));
        return PALETTE[idx % PALETTE.length];
      }

      // A cor vem do galho a que o nó pertence; a categoria escolhe entre a
      // versão forte (nó) e a clara (subnó) dessa mesma cor.
      // Um nó pode ter cor própria (node.color): ela vale para ele e para os
      // descendentes, até que outro descendente declare a sua. Ou seja, o
      // dono da cor é o ancestral mais próximo que tiver escolhido uma —
      // sem ninguém na linhagem, manda a paleta do setor.
      function colorFor(node) {
        let owner = node;
        while (owner && owner.depth > 0 && !owner.color) owner = owner.parent;
        const palette = owner && owner.depth > 0 && owner.color
          ? derivePalette(owner.color)
          : paletteForSector(sectorOf(node));
        return isSub(node)
          ? { bg: palette.subBg, fg: palette.subFg }
          : { bg: palette.bg, fg: palette.fg };
      }

      // Onde a reta centro→centro cruza a borda da caixa. No radial os nós
      // se ligam em qualquer direção, então não dá para fixar "sai pela
      // direita, entra pela esquerda" como no layout anterior.
      function borderPoint(node, towardX, towardY) {
        const dx = towardX - node.x;
        const dy = towardY - node.y;
        if (!dx && !dy) return { x: node.x, y: node.y };

        if (node.depth === 0) {
          const len = Math.hypot(dx, dy);
          return { x: node.x + (dx / len) * ROOT.r, y: node.y + (dy / len) * ROOT.r };
        }

        const hw = halfW(node);
        const hh = halfH(node);
        const scaleX = dx ? hw / Math.abs(dx) : Infinity;
        const scaleY = dy ? hh / Math.abs(dy) : Infinity;
        const s = Math.min(scaleX, scaleY);
        return { x: node.x + dx * s, y: node.y + dy * s };
      }

      function refreshAriaControls() {
        coreButton.setAttribute(
          "aria-controls",
          treeData.root.children.map((c) => "node-" + c.id).join(" ")
        );
      }

      function refreshWorldSize() {
        let maxX = treeData.root.x + ROOT.r;
        let maxY = treeData.root.y + ROOT.r;
        nodeById.forEach((node) => {
          if (node.depth === 0) return;
          maxX = Math.max(maxX, node.x + halfW(node));
          maxY = Math.max(maxY, node.y + halfH(node));
        });
        world.style.width = Math.max(1040, maxX + WORLD_MARGIN) + "px";
        world.style.height = Math.max(920, maxY + WORLD_MARGIN) + "px";
      }

      // O conector é criado uma vez e depois só tem o `d` reescrito. Recriar
      // trinta paths a cada quadro da reacomodação seria desperdício, e o
      // comprimento — que a animação de traçado precisa — sai de um hypot,
      // já que a linha é reta: getTotalLength() num laço de animação custa
      // caro à toa.
      function addConnectorFor(node) {
        if (!node.parent) return;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("id", "line-" + node.id);
        path.setAttribute("class", "connector" + (isSub(node) ? " is-subnode" : ""));
        connectorsSvg.appendChild(path);
        node.path = path;
      }

      function drawConnector(node) {
        const parent = node.parent;
        if (!parent || !node.path) return;
        const start = borderPoint(parent, node.x, node.y);
        const end = borderPoint(node, parent.x, parent.y);
        const length = Math.hypot(end.x - start.x, end.y - start.y);
        const d = "M " + start.x + " " + start.y + " L " + end.x + " " + end.y;
        // Mesma regra das caixas: só escreve o que mudou.
        const path = node.path;
        if (path.lastD !== d) { path.setAttribute("d", d); path.lastD = d; }
        node.lineLength = length;
        const dash = String(length);
        const offset = node.visible ? "0" : dash;
        if (path.lastDash !== dash) { path.style.strokeDasharray = dash; path.lastDash = dash; }
        if (path.lastOffset !== offset) { path.style.strokeDashoffset = offset; path.lastOffset = offset; }
      }

      // Os botões de criação aparecem só quando a regra da categoria
      // permite: o de "novo nó" some depois que o galho foi encerrado com
      // subnós, e o de "novo subnó" só existe na ponta de um galho. A regra
      // vira algo que se lê na tela, em vez de virar mensagem de erro.
      function buildDevControls(node) {
        const actions = [{ action: "edit", icon: "pencil", title: "Editar" }];
        if (canAddNode(node)) {
          actions.push({ action: "add-node", icon: "git-branch", title: "Novo nó (continua o galho)" });
        }
        if (canAddSub(node)) {
          actions.push({ action: "add-subnode", icon: "plus", title: "Novo subnó (folha do galho)", sub: true });
        }
        if (node !== treeData.root) {
          actions.push({ action: "delete", icon: "trash-2", title: "Remover", danger: true });
        }

        const wrap = document.createElement("div");
        wrap.className = "dev-node-controls";
        actions.forEach((a) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "dev-node-btn"
            + (a.danger ? " dev-node-btn-danger" : "")
            + (a.sub ? " dev-node-btn-sub" : "");
          btn.dataset.devAction = a.action;
          btn.dataset.nodeId = node.id;
          btn.title = a.title;
          btn.setAttribute("aria-label", a.title);

          const icon = document.createElement("i");
          icon.setAttribute("data-lucide", a.icon);
          icon.setAttribute("width", "13");
          icon.setAttribute("height", "13");
          icon.setAttribute("aria-hidden", "true");
          btn.appendChild(icon);

          wrap.appendChild(btn);
        });
        return wrap;
      }

      function mountNodeEl(node) {
        const article = document.createElement("article");
        article.id = "node-" + node.id;
        article.className = "branch" + (isSub(node) ? " is-subnode" : "");
        article.setAttribute("aria-label", (isSub(node) ? "Subnó " : "Nó ") + shortLabel(node));
        // Escalonamento da entrada por nível. Vai numa variável, e não em
        // transition-delay direto: um atraso inline valeria para todas as
        // propriedades, inclusive o visibility, que precisa do seu próprio.
        article.style.setProperty("--enter-delay", (20 + Math.min(node.depth, 6) * 40) + "ms");

        const button = document.createElement("button");
        button.type = "button";
        button.className = "canva-button branch-button";
        button.setAttribute("aria-expanded", "false");
        const color = colorFor(node);
        button.style.background = color.bg;
        button.style.color = color.fg;

        const nameSpan = document.createElement("span");
        nameSpan.className = "canva-text branch-name";
        nameSpan.style.color = color.fg;
        nameSpan.textContent = node.label;
        button.appendChild(nameSpan);

        if (node.children.length > 0) {
          const icon = document.createElement("i");
          icon.className = "branch-toggle-icon";
          icon.setAttribute("data-lucide", "plus");
          icon.setAttribute("aria-hidden", "true");
          icon.setAttribute("width", "19");
          icon.setAttribute("height", "19");
          button.appendChild(icon);
        } else if (node.pdf) {
          const icon = document.createElement("i");
          icon.setAttribute("data-lucide", "file-text");
          icon.setAttribute("aria-hidden", "true");
          icon.setAttribute("width", "16");
          icon.setAttribute("height", "16");
          button.appendChild(icon);
        } else if (node.url) {
          const icon = document.createElement("i");
          icon.setAttribute("data-lucide", "external-link");
          icon.setAttribute("aria-hidden", "true");
          icon.setAttribute("width", "16");
          icon.setAttribute("height", "16");
          button.appendChild(icon);
        }

        article.appendChild(button);
        article.appendChild(buildDevControls(node));
        branchesLayer.appendChild(article);

        node.el = article;
      }

      function mountChildren(node) {
