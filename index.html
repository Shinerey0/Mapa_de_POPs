  <title>Organização de POPs</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --ink: #0b1736;
      --paper: #edf3ff;
      --line: rgba(160, 190, 255, 0.56);
      --focus: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    .mindmap-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      position: relative;
      overflow: hidden;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.25rem 1.25rem;
    }

    .mindmap-shell::before,
    .mindmap-shell::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: -1;
      border-radius: 999px;
      filter: blur(2px);
    }

    .mindmap-shell::before {
      width: 29rem;
      height: 29rem;
      top: -16rem;
      right: -10rem;
      background: radial-gradient(circle, rgba(25, 183, 187, 0.24), transparent 69%);
    }

    .mindmap-shell::after {
      width: 26rem;
      height: 26rem;
      bottom: -14rem;
      left: -9rem;
      background: radial-gradient(circle, rgba(245, 177, 75, 0.18), transparent 69%);
    }

    .eyebrow {
      position: absolute;
      top: 1.65rem;
      left: 1.8rem;
      color: rgba(231, 240, 255, 0.78);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .map-stage {
      width: 100%;
      max-width: 1040px;
      position: relative;
    }

    .camera-viewport {
      width: 100%;
      height: min(78vh, 640px);
      min-height: 440px;
      position: relative;
      overflow: hidden;
      border-radius: 28px;
    }

    .world {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      transition: transform 700ms cubic-bezier(.22, .8, .28, 1);
      will-change: transform;
    }

    .connectors {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
      z-index: 1;
    }

    .connector {
      fill: none;
      stroke: var(--line);
      stroke-width: 2.5px;
      opacity: 0;
      transition: opacity 320ms ease, stroke-dashoffset 700ms cubic-bezier(.22, .8, .28, 1);
    }

    .connector.is-visible {
      opacity: 1;
    }

    .core-area {
      position: absolute;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
    }

    .dev-node-controls {
      position: absolute;
      top: -10px;
      right: -10px;
      display: flex;
      gap: 4px;
      z-index: 6;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 200ms ease, transform 200ms ease;
    }

    body.dev-mode .dev-node-controls {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .dev-node-btn {
      width: 24px;
      height: 24px;
      min-width: 24px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: #101d40;
      color: rgb(230, 238, 255);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      transition: transform 160ms ease, background 160ms ease;
    }

    .dev-node-btn:hover,
    .dev-node-btn:focus-visible {
      transform: scale(1.12);
      background: #16244d;
    }

    .dev-node-btn-danger {
      color: rgb(255, 150, 150);
      border-color: rgba(255, 120, 120, 0.45);
    }

    .core-button,
    .branch-button {
      border: 0;
      cursor: pointer;
      transition: transform 260ms ease, box-shadow 260ms ease, filter 260ms ease;
    }

    .core-button {
      width: 168px;
      min-height: 168px;
      padding: 1.2rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      box-shadow: 0 18px 0 rgba(2, 9, 31, 0.13), 0 22px 45px rgba(2, 9, 31, 0.38);
      position: relative;
    }

    .core-button::after {
      content: "";
      position: absolute;
      inset: -10px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: inherit;
      transition: transform 300ms ease, opacity 300ms ease;
    }

    .core-button:hover,
    .core-button:focus-visible {
      transform: translateY(-5px) scale(1.02);
      filter: brightness(1.08);
    }

    .core-button:hover::after,
    .core-button:focus-visible::after {
      transform: scale(1.08);
      opacity: 0.8;
    }

    .node-label {
      font-family: "Fraunces", serif;
      text-align: center;
      line-height: 1.05;
    }

    .instruction {
      color: rgba(235, 243, 255, 0.76);
      font-size: 0.82rem;
      letter-spacing: 0.025em;
      white-space: nowrap;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .map-stage.is-open .instruction {
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
    }

    .branch {
      position: absolute;
      z-index: 2;
      width: 214px;
      opacity: 0;
      pointer-events: none;
      /* Cresce a partir do próprio centro: no layout radial os galhos saem
         em qualquer direção, então nenhum deslocamento lateral serviria. */
      transform: scale(0.82);
      transition: opacity 420ms ease, transform 480ms cubic-bezier(.2, .8, .2, 1);
    }

    .branch.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .branch-button {
      width: 100%;
      min-height: 70px;
      border-radius: 18px;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      box-shadow: 0 12px 25px rgba(1, 10, 31, 0.24);
    }

    .branch-button:hover,
    .branch-button:focus-visible {
      transform: translateY(-3px);
      filter: brightness(1.08);
    }

    .branch-button svg {
      flex: 0 0 auto;
      transition: transform 240ms ease;
    }

    .branch.is-expanded .branch-button svg {
      transform: rotate(45deg);
    }

    .branch-name {
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.15;
    }

    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    .screen-reader-status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .dev-toggle {
      position: absolute;
      top: 1.5rem;
      right: 1.8rem;
      z-index: 20;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      color: rgba(231, 240, 255, 0.85);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 200ms ease, transform 200ms ease, color 200ms ease, border-color 200ms ease;
    }

    .dev-toggle:hover,
    .dev-toggle:focus-visible {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    .dev-toggle.is-unlocked {
      border-color: rgba(120, 220, 160, 0.6);
      color: rgb(150, 240, 190);
    }

    .dev-toggle-icon-unlocked {
      display: none;
    }

    .dev-toggle.is-unlocked .dev-toggle-icon-locked {
      display: none;
    }

    .dev-toggle.is-unlocked .dev-toggle-icon-unlocked {
      display: block;
    }

    .dev-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 20, 0.66);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1.25rem;
    }

    .dev-overlay[hidden] {
      display: none;
    }

    .dev-modal {
      position: relative;
      width: min(100%, 380px);
      max-height: 88vh;
      overflow-y: auto;
      background: #101d40;
      border: 1px solid rgba(160, 190, 255, 0.28);
      border-radius: 20px;
      padding: 1.6rem 1.5rem 1.5rem;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
      color: rgb(230, 238, 255);
    }

    .dev-modal-close {
      position: absolute;
      top: 0.7rem;
      right: 0.8rem;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: transparent;
      color: rgba(230, 238, 255, 0.7);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      border: 0;
    }

    .dev-modal-close:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .dev-modal-title {
      font-family: "Fraunces", serif;
      font-size: 1.25rem;
      margin: 0 0 0.4rem;
    }

    .dev-modal-desc {
      font-size: 0.85rem;
      color: rgba(230, 238, 255, 0.7);
      margin: 0 0 1.1rem;
    }

    .dev-form {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .dev-label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(230, 238, 255, 0.8);
    }

    .dev-input {
      font: inherit;
      padding: 0.55rem 0.7rem;
      border-radius: 10px;
      border: 1px solid rgba(160, 190, 255, 0.35);
      background: rgba(255, 255, 255, 0.06);
      color: rgb(240, 245, 255);
      resize: vertical;
    }

    .dev-input:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .dev-btn {
      font: inherit;
      font-weight: 700;
      padding: 0.65rem 1rem;
      border-radius: 12px;
      border: 0;
      cursor: pointer;
      transition: transform 200ms ease, filter 200ms ease;
    }

    .dev-btn:hover,
    .dev-btn:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .dev-btn-primary {
      background: linear-gradient(135deg, rgb(246, 190, 88), rgb(239, 136, 84));
      color: rgb(11, 23, 54);
    }

    .dev-error {
      color: rgb(255, 150, 150);
      font-size: 0.8rem;
      margin: 0;
    }

    /* --- Câmera controlada pelo usuário: roda do mouse, arrasto e botões.
       O #world recebe um transform escrito em JS a partir do estado
       `camera`; a transição é ligada/desligada inline conforme o
       movimento seja programático (enquadrar) ou manual (arrastar). --- */
    .camera-viewport {
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .camera-viewport.is-panning {
      cursor: grabbing;
    }

    .camera-controls {
      position: absolute;
      right: 0.85rem;
      bottom: 0.85rem;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 0.2rem;
      padding: 0.28rem;
      border-radius: 999px;
      background: rgba(10, 20, 48, 0.72);
      border: 1px solid rgba(160, 190, 255, 0.28);
      box-shadow: 0 10px 24px rgba(2, 9, 31, 0.4);
      backdrop-filter: blur(6px);
    }

    .camera-btn {
      width: 30px;
      height: 30px;
      min-width: 30px;
      padding: 0;
      border-radius: 50%;
      border: 0;
      background: transparent;
      color: rgba(231, 240, 255, 0.85);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .camera-btn:hover,
    .camera-btn:focus-visible {
      background: rgba(255, 255, 255, 0.14);
      color: rgb(255, 255, 255);
      transform: translateY(-1px);
    }

    .camera-btn.is-active {
      color: rgb(150, 240, 190);
    }

    .camera-zoom-readout {
      min-width: 44px;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: rgba(231, 240, 255, 0.8);
      font-variant-numeric: tabular-nums;
    }

    .camera-legend {
      position: absolute;
      left: 1rem;
      bottom: 1.1rem;
      z-index: 30;
      display: flex;
      gap: 0.9rem;
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(231, 240, 255, 0.5);
      pointer-events: none;
    }

    .camera-legend span {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .camera-legend b {
      width: 11px;
      height: 11px;
      flex: none;
      border-radius: 3px;
      background: rgb(72, 111, 197);
    }

    .camera-legend .legend-sub b {
      border-radius: 999px;
      background: rgb(224, 233, 255);
    }

    /* --- Subnós: a folhagem do galho. Mesma largura dos nós, na cor clara
       da paleta do galho. A caixa cresce com o texto (até 400 palavras) e
       rola por dentro depois do teto; enquanto for curta mantém o formato
       de pílula, que vira um oval feio quando a caixa fica alta. --- */
    .branch.is-subnode .branch-button {
      min-height: 54px;
      max-height: 320px;
      overflow-y: auto;
      overscroll-behavior: contain;
      align-items: flex-start;
      border-radius: 999px;
      padding: 0.6rem 1.15rem;
      box-shadow: 0 8px 18px rgba(1, 10, 31, 0.18);
    }

    /* Só o raio muda: mexer no padding alteraria a altura já medida por
       measureNodes() e obrigaria a remedir. */
    .branch.is-subnode.is-tall .branch-button {
      border-radius: 18px;
    }

    .branch.is-subnode .branch-name {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: pre-wrap;
      text-align: left;
      /* min-width:0 é o que deixa o texto realmente quebrar dentro do flex,
         em vez de esticar a caixa até caber a maior palavra. */
      flex: 1 1 auto;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .connector.is-subnode {
      stroke-width: 1.6px;
    }

    .connector.is-subnode.is-visible {
      opacity: 0.72;
    }

    /* O botão que cria subnós usa a própria aparência de subnó, para que a
       categoria se aprenda olhando, sem precisar de legenda no botão. */
    .dev-node-btn-sub {
      background: rgb(226, 235, 255);
      color: rgb(23, 52, 105);
      border-color: rgba(255, 255, 255, 0.6);
    }

    .dev-node-btn-sub:hover,
    .dev-node-btn-sub:focus-visible {
      background: rgb(255, 255, 255);
    }

    /* --- Dados do mapa: exportar/importar. Fica ao lado do cadeado e só
       aparece no modo dev, porque importar substitui o mapa inteiro. --- */
    .data-toggle {
      right: 4.4rem;
      display: none;
    }

    body.dev-mode .data-toggle {
      display: grid;
    }

    .dev-btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(160, 190, 255, 0.35);
      color: rgb(230, 238, 255);
    }

    .dev-data-actions {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .dev-data-hint {
      font-size: 0.76rem;
      color: rgba(230, 238, 255, 0.6);
      margin: 0.1rem 0 0.6rem;
      line-height: 1.4;
    }

    .dev-word-count {
      font-size: 0.74rem;
      font-weight: 600;
      color: rgba(230, 238, 255, 0.6);
      margin: -0.5rem 0 0;
      font-variant-numeric: tabular-nums;
    }

    .dev-word-count.is-over {
      color: rgb(255, 150, 150);
    }

    .dev-input-long {
      min-height: 190px;
      line-height: 1.45;
    }

    .dev-file-input {
      display: none;
    }

    @media (max-width: 720px) {
      .mindmap-shell {
        min-height: auto;
        padding: 4.4rem 1rem 2rem;
      }

      .eyebrow {
        top: 1.35rem;
        left: 1.2rem;
      }

      .camera-viewport {
        height: min(70vh, 520px);
        min-height: 360px;
        border-radius: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

  <script src="/_sdk/85d8138ba0e9799c.resizing_sdk.js" type="text/javascript"
    integrity="sha512-8dt8XK3OsxyrL/A/AlNWHjY+utLvSBcXg410ejaLzAIOVGDj1jNmEYRbymhdzToKhNo0uO9dxAmMLwHQseh3Lw=="></script>

<body data-template-id="__page-root" style="background: rgb(11, 23, 54);">
  <main class="mindmap-shell" aria-label="Organização de POPs">
    <p class="eyebrow">Mapa de POPs</p>
    <button id="dev-toggle" class="dev-toggle" type="button" aria-haspopup="dialog" aria-label="Modo desenvolvedor" title="Modo desenvolvedor">
      <i data-lucide="lock" class="dev-toggle-icon-locked" aria-hidden="true" width="17" height="17"></i>
      <i data-lucide="unlock" class="dev-toggle-icon-unlocked" aria-hidden="true" width="17" height="17"></i>
    </button>
    <button id="data-toggle" class="dev-toggle data-toggle" type="button" aria-haspopup="dialog" aria-label="Dados do mapa" title="Exportar ou importar o mapa">
      <i data-lucide="database" aria-hidden="true" width="16" height="16"></i>
    </button>
    <input id="import-file" class="dev-file-input" type="file" accept="application/json,.json" />
    <section id="map-stage" class="map-stage" aria-label="Área do mapa de POPs">
     <div id="camera-viewport" class="camera-viewport">
      <div id="world" class="world">
       <svg class="connectors" aria-hidden="true"></svg>
      <div id="core-area" class="core-area"><button id="core-button" data-template-id="core-button" class="canva-button core-button"
          type="button" aria-expanded="false" aria-controls=""
          style="background: linear-gradient(135deg, rgb(246, 190, 88), rgb(239, 136, 84)); color: rgb(11, 23, 54);">
          <span data-template-id="core-label" class="canva-text node-label"
            style="color: rgb(11, 23, 54); font-weight: 700; font-style: normal; font-size: 22px; line-height: 1.1;">BUCAREIN</span> </button>
        <div class="dev-node-controls">
          <button type="button" class="dev-node-btn" data-dev-action="edit" data-node-id="root" title="Editar nó central" aria-label="Editar nó central"><i data-lucide="pencil" width="13" height="13" aria-hidden="true"></i></button>
