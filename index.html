  <!-- Só o que a formatação do tronco e do título pede a mais: Fraunces 400

  <style>
    :root {
      --ink: #0b1736;
      --paper: #edf3ff;
      --line: rgba(160, 190, 255, 0.56);
      --focus: #ffffff;
      /* Os dois borrões decorativos do fundo. Viram variáveis porque moram
         em pseudo-elementos, onde não dá para escrever estilo inline. */
      --blob-a: rgba(25, 183, 187, 0.24);
      --blob-b: rgba(245, 177, 75, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100%;
      /* No celular, 100vh conta a barra do navegador que aparece e some ao
         rolar, e o pé do mapa fica atrás dela. dvh resolve nos navegadores
         atuais; a linha de cima cobre o resto, com --vh escrito pelo JS a
         cada resize. A ordem importa: se dvh não existir, a declaração é
         descartada e a anterior volta a valer. */
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      min-height: 100dvh;
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
      /* Sem isto o "puxar para atualizar" do celular rouba o gesto de
         arrastar o mapa, e a rolagem elástica descola o mapa da tela. */
      overscroll-behavior: none;
    }

    button {
      font: inherit;
    }

    .mindmap-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      min-height: 100dvh;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.25rem 1.25rem;
    }

    .mindmap-shell::before,
    .mindmap-shell::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: -1;
      border-radius: 999px;
      filter: blur(2px);
    }

    .mindmap-shell::before {
      width: 29rem;
      height: 29rem;
      top: -16rem;
      right: -10rem;
      background: radial-gradient(circle, var(--blob-a), transparent 69%);
    }

    .mindmap-shell::after {
      width: 26rem;
      height: 26rem;
      bottom: -14rem;
      left: -9rem;
      background: radial-gradient(circle, var(--blob-b), transparent 69%);
    }

    body.no-blobs .mindmap-shell::before,
    body.no-blobs .mindmap-shell::after {
      display: none;
    }

    /* Fundo claro: o que é escrito diretamente sobre o fundo troca de cor
       para não sumir. A instrução do tronco carrega cor inline vinda do
       template, e por isso precisa do !important. */
    body.on-light .eyebrow {
      color: rgba(11, 23, 54, 0.75);
    }

    body.on-light .eyebrow-sub {
      color: rgba(11, 23, 54, 0.66);
    }

    body.on-light .instruction {
      color: rgba(11, 23, 54, 0.72) !important;
    }

    body.on-light .camera-legend {
      color: rgba(11, 23, 54, 0.6);
    }

    body.on-light .dev-toggle {
      color: rgba(11, 23, 54, 0.8);
      border-color: rgba(11, 23, 54, 0.22);
      background: rgba(11, 23, 54, 0.06);
    }

    body.on-light .dev-toggle:hover,
    body.on-light .dev-toggle:focus-visible {
      background: rgba(11, 23, 54, 0.12);
    }

    /* --- Elementos presos à tela ------------------------------------------
       Nove vagas fixas (cantos, bordas e centro), cada uma uma pilha: quem é
       posto na mesma vaga se empilha em vez de passar por cima do outro — é
       assim que um título maior empurra a pesquisa para baixo. applyHud()
       põe cada elemento (título, pesquisa, zoom, legenda) na vaga escolhida
       no painel; no celular todos voltam à vaga de fábrica. As vagas cobrem
       a largura da tela, mas são transparentes ao ponteiro — só o que é
       clicável dentro delas responde —, senão a faixa vazia roubaria o
       arrasto do mapa. As distâncias das bordas são as de antes das vagas
       existirem, para o mapa de fábrica continuar idêntico. */
    .hud-slot {
      position: absolute;
      left: 1.8rem;
      right: 1.8rem;
      z-index: 25;
      display: flex;
      flex-direction: column;
      /* Com o título padrão, 0.35rem põe a pesquisa exatamente onde ela
         sempre ficou (3.05rem do topo): a linha do título tem 1.5 de
         altura, herdada do reset do Tailwind. */
      gap: 0.35rem;
      pointer-events: none;
    }

    .hud-slot[data-slot$="left"] {
      align-items: flex-start;
    }

    .hud-slot[data-slot$="right"] {
      align-items: flex-end;
    }

    .hud-slot[data-slot="top"],
    .hud-slot[data-slot="center"],
    .hud-slot[data-slot="bottom"] {
      align-items: center;
    }

    .hud-slot[data-slot^="top"] {
      top: 1.65rem;
    }

    /* O canto de cima à direita é do cadeado (e dos botões do modo dev):
       a vaga começa logo abaixo dele. */
    .hud-slot[data-slot="top-right"] {
      top: calc(1.5rem + 52px);
    }

    .hud-slot[data-slot="left"],
    .hud-slot[data-slot="center"],
    .hud-slot[data-slot="right"] {
      top: 50%;
      transform: translateY(-50%);
    }

    .hud-slot[data-slot^="bottom"] {
      bottom: 0.85rem;
    }

    .hud-slot[data-slot="bottom-left"] {
      left: 1rem;
      bottom: 1.1rem;
    }

    .hud-slot[data-slot="bottom-right"] {
      right: 0.85rem;
    }

    .hud-item.is-off {
      display: none !important;
    }

    /* Título e subtítulo formam um elemento só na tela: vão juntos para a
       vaga escolhida e somem juntos. As duas linhas se alinham como a
       vaga: à esquerda, ao centro ou à direita. O max-width guarda o canto
       dos botões do topo, que no modo dev são três. */
    .map-heading {
      display: flex;
      flex-direction: column;
      max-width: calc(100% - 8.5rem);
      pointer-events: none;
    }

    .hud-slot[data-slot$="left"] .map-heading {
      align-items: flex-start;
      text-align: left;
    }

    .hud-slot[data-slot="top"] .map-heading,
    .hud-slot[data-slot="center"] .map-heading,
    .hud-slot[data-slot="bottom"] .map-heading {
      align-items: center;
      text-align: center;
    }

    .hud-slot[data-slot$="right"] .map-heading {
      align-items: flex-end;
      text-align: right;
    }

    /* Tudo aqui é só o padrão: o painel de aparência escreve fonte,
       tamanho, cor e caixa inline (applyTitle). */
    .eyebrow {
      color: rgba(231, 240, 255, 0.78);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: var(--title-size, 0.7rem);
      font-weight: 700;
      overflow-wrap: anywhere;
      pointer-events: none;
    }

    /* Subtítulo: mesmo esquema do título (applySubtitle escreve o resto
       inline), só que mais discreto de fábrica. */
    .eyebrow-sub {
      color: rgba(231, 240, 255, 0.66);
      font-size: var(--subtitle-size, 0.8rem);
      overflow-wrap: anywhere;
      pointer-events: none;
    }

    .eyebrow-sub[hidden] {
      display: none;
    }

    .map-stage {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
    }

    .camera-viewport {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .world {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      transition: transform 700ms cubic-bezier(.22, .8, .28, 1);
      will-change: transform;
    }

    .connectors {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
      z-index: 1;
    }

    .connector {
      fill: none;
      stroke: var(--line);
      stroke-width: 2.5px;
      opacity: 0;
      /* Mesma regra das caixas: a linha oculta sai da pintura de vez, só
         que depois de a animação de recolher o traço terminar. */
      visibility: hidden;
      transition:
        opacity 320ms ease,
        stroke-dashoffset 700ms cubic-bezier(.22, .8, .28, 1),
        visibility 0s linear 700ms;
    }

    .connector.is-visible {
      opacity: 1;
      visibility: visible;
      transition-delay: 0s, 0s, 0s;
    }

    .core-area {
      position: absolute;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
    }

    .dev-node-controls {
      position: absolute;
      top: -10px;
      right: -10px;
      display: flex;
      gap: 4px;
      z-index: 6;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 200ms ease, transform 200ms ease;
    }

    body.dev-mode .dev-node-controls {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .dev-node-btn {
      width: 24px;
      height: 24px;
      min-width: 24px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: #101d40;
      color: rgb(230, 238, 255);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      transition: transform 160ms ease, background 160ms ease;
    }

    .dev-node-btn:hover,
    .dev-node-btn:focus-visible {
      transform: scale(1.12);
      background: #16244d;
    }

    .dev-node-btn-danger {
      color: rgb(255, 150, 150);
      border-color: rgba(255, 120, 120, 0.45);
    }

    /* --- Religar galho: arrastar um nó por cima de outro troca o pai. ---
       Só existe no modo dev. */
    body.dev-mode .branch-button {
      cursor: grab;
    }

    /* Enquanto arrasta, o texto não deve ser selecionado em lugar nenhum
       (o gesto passa por cima de rótulos longos de subnó). */
    body.is-reparenting,
    body.is-reparenting .branch-button {
      user-select: none;
    }

    .core-button,
    .branch-button {
      border: 0;
      cursor: pointer;
      transition: transform 260ms ease, box-shadow 260ms ease, filter 260ms ease;
    }

    /* Sem padding vertical: quem garante que o texto não encoste na borda
       é fitCoreSize(), que mede as linhas contra o círculo. O padding das
       laterais continua porque é ele que decide onde o texto quebra.
       A sombra é só o padrão — applyCoreShadow() escreve a do painel. */
    .core-button {
      width: var(--core-size, 168px);
      min-height: var(--core-size, 168px);
      padding: 0 1.2rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      box-shadow: 0 18px 0 rgba(2, 9, 31, 0.13), 0 22px 45px rgba(2, 9, 31, 0.38);
      position: relative;
    }

    .core-button::after {
      content: "";
      position: absolute;
      inset: -10px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: inherit;
      transition: transform 300ms ease, opacity 300ms ease;
    }

    .core-button:hover,
    .core-button:focus-visible {
      transform: translateY(-5px) scale(1.02);
      filter: brightness(1.08);
    }

    .core-button:hover::after,
    .core-button:focus-visible::after {
      transform: scale(1.08);
      opacity: 0.8;
    }

    .node-label {
      font-family: "Fraunces", serif;
      text-align: center;
      line-height: 1.05;
    }

    /* O tamanho vem de uma variável, e não de font-size inline, porque o
       celular reduz o rótulo na mesma proporção (ver body.is-compact).
       pre-line respeita o Enter digitado no texto do tronco. */
    .core-button .node-label {
      font-size: var(--core-font-size, 22px);
      white-space: pre-line;
      text-underline-offset: 0.12em;
    }

    .instruction {
      color: rgba(235, 243, 255, 0.76);
      font-size: 0.82rem;
      letter-spacing: 0.025em;
      white-space: nowrap;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .map-stage.is-open .instruction {
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
    }

    /* A posição vem de `translate` (escrito pelo JS a cada quadro da
       reacomodação), e não de left/top: mover por left/top obriga o
       navegador a refazer o layout a cada quadro, o translate não. É a
       propriedade avulsa, e não transform, para não brigar com o scale()
       da entrada logo abaixo — o scale continua girando em torno do
       centro da caixa. */
    .branch {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 2;
      width: var(--node-w, 214px);
      opacity: 0;
      pointer-events: none;
      /* Cresce a partir do próprio centro: no layout radial os galhos saem
         em qualquer direção, então nenhum deslocamento lateral serviria. */
      transform: scale(0.82);
      /* Oculto = visibility:hidden, e não só opacity:0. Com opacidade zero
         o navegador ainda PINTA a caixa (sombra, texto, tudo) a cada quadro
         em que algo se mexe; num mapa com ~400 nós e só dezenas à vista,
         isso era a maior parte do engasgo das animações. O visibility só
         vira hidden DEPOIS que o esmaecimento termina (o atraso dele soma o
         escalonamento por nível com a duração do scale), então a saída de
         cena continua animada. --enter-delay é o escalonamento por nível,
         escrito pelo JS em cada caixa. */
      visibility: hidden;
      transition:
        opacity 420ms ease var(--enter-delay, 0ms),
        transform 480ms cubic-bezier(.2, .8, .2, 1) var(--enter-delay, 0ms),
        visibility 0s linear calc(var(--enter-delay, 0ms) + 480ms);
    }

    .branch.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      /* Na entrada, visível já no primeiro quadro: quem aparece aos poucos
         é a opacidade. */
      visibility: visible;
      transition-delay: var(--enter-delay, 0ms), var(--enter-delay, 0ms), 0s;
    }

    /* --- Nó em arrasto (religar galho) ---------------------------------
       Precisa vir DEPOIS de .branch.is-visible: as duas regras têm a mesma
       especificidade, então quem ganha o pointer-events é a última escrita.
       O nó arrastado tem de ficar transparente ao ponteiro para que o
       elementFromPoint enxergue o alvo embaixo dele, e sai das transições
       para acompanhar o cursor em vez de deslizar atrás dele. */
    .branch.is-dragging {
      z-index: 40;
      pointer-events: none;
      transition: none !important;
      cursor: grabbing;
    }

    /* pointer-events:none no pai não alcança um filho que pede "auto" — e
       os botões de edição pedem. */
    .branch.is-dragging .dev-node-controls {
      pointer-events: none;
    }

    .branch.is-dragging .branch-button {
      transform: scale(1.04);
      box-shadow: 0 18px 38px rgba(2, 9, 31, 0.55);
      opacity: 0.9;
    }

    .branch.is-drop-ok .branch-button,
    .core-area.is-drop-ok .core-button {
      outline: 3px solid rgb(120, 235, 170);
      outline-offset: 3px;
    }

    .branch.is-drop-blocked .branch-button,
    .core-area.is-drop-blocked .core-button {
      outline: 3px solid rgb(255, 120, 120);
      outline-offset: 3px;
    }

    /* Ordem: a barra na borda de cima ou de baixo diz em que posição entre
       os irmãos o nó vai entrar. Usa box-shadow inset para acompanhar o
       arredondamento da caixa sem mexer no layout. */
    .branch.is-drop-before .branch-button {
      box-shadow: inset 0 6px 0 rgb(120, 235, 170), 0 8px 18px rgba(1, 10, 31, 0.18);
    }

    .branch.is-drop-after .branch-button {
      box-shadow: inset 0 -6px 0 rgb(120, 235, 170), 0 8px 18px rgba(1, 10, 31, 0.18);
    }

    /* Legenda do arrasto: diz o que vai acontecer ao soltar. Fica presa ao
       topo da viewport e é transparente ao ponteiro, para nunca virar ela
       própria o alvo do elementFromPoint. */
    .drag-hint {
      position: absolute;
      top: 0.9rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      pointer-events: none;
      max-width: min(90%, 460px);
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      background: rgba(10, 20, 48, 0.9);
      border: 1px solid rgba(120, 235, 170, 0.55);
      color: rgb(231, 240, 255);
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 10px 24px rgba(2, 9, 31, 0.45);
    }

    .drag-hint.is-blocked {
      border-color: rgba(255, 120, 120, 0.65);
      color: rgb(255, 197, 197);
    }

    .branch-button {
      width: 100%;
      min-height: var(--node-min-h, 70px);
      border-radius: 18px;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      box-shadow: 0 12px 25px rgba(1, 10, 31, 0.24);
    }

    .branch-button:hover,
    .branch-button:focus-visible {
      transform: translateY(-3px);
      filter: brightness(1.08);
    }

    .branch-button svg {
      flex: 0 0 auto;
      transition: transform 240ms ease;
    }

    .branch.is-expanded .branch-button svg {
      transform: rotate(45deg);
    }

    .branch-name {
      font-weight: 700;
      font-size: var(--name-size, 1rem);
      line-height: 1.15;
    }

    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    .screen-reader-status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .dev-toggle {
      position: absolute;
      top: 1.5rem;
      right: 1.8rem;
      z-index: 20;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      color: rgba(231, 240, 255, 0.85);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 200ms ease, transform 200ms ease, color 200ms ease, border-color 200ms ease;
    }

    .dev-toggle:hover,
    .dev-toggle:focus-visible {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    .dev-toggle.is-unlocked {
      border-color: rgba(120, 220, 160, 0.6);
      color: rgb(150, 240, 190);
    }

    .dev-toggle-icon-unlocked {
      display: none;
    }

    .dev-toggle.is-unlocked .dev-toggle-icon-locked {
      display: none;
    }

    .dev-toggle.is-unlocked .dev-toggle-icon-unlocked {
      display: block;
    }

    .dev-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 20, 0.66);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1.25rem;
    }

    .dev-overlay[hidden] {
      display: none;
    }

    .dev-modal {
      position: relative;
      width: min(100%, 380px);
      max-height: 88vh;
      overflow-y: auto;
      background: #101d40;
      border: 1px solid rgba(160, 190, 255, 0.28);
      border-radius: 20px;
      padding: 1.6rem 1.5rem 1.5rem;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
      color: rgb(230, 238, 255);
      /* Controles nativos (lista de fontes, seletor de cor, controle
         deslizante, barra de rolagem) no tema escuro do modal. */
      color-scheme: dark;
      accent-color: rgb(160, 190, 255);
    }

    .dev-modal-close {
      position: absolute;
      top: 0.7rem;
      right: 0.8rem;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: transparent;
      color: rgba(230, 238, 255, 0.7);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      border: 0;
    }

    .dev-modal-close:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .dev-modal-title {
      font-family: "Fraunces", serif;
      font-size: 1.25rem;
      margin: 0 0 0.4rem;
    }

    .dev-modal-desc {
      font-size: 0.85rem;
      color: rgba(230, 238, 255, 0.7);
      margin: 0 0 1.1rem;
    }

    .dev-form {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .dev-label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(230, 238, 255, 0.8);
    }

    .dev-input {
      font: inherit;
      padding: 0.55rem 0.7rem;
      border-radius: 10px;
      border: 1px solid rgba(160, 190, 255, 0.35);
      background: rgba(255, 255, 255, 0.06);
      color: rgb(240, 245, 255);
      resize: vertical;
    }

    .dev-input:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .dev-btn {
      font: inherit;
      font-weight: 700;
      padding: 0.65rem 1rem;
      border-radius: 12px;
      border: 0;
      cursor: pointer;
      transition: transform 200ms ease, filter 200ms ease;
    }

    .dev-btn:hover,
    .dev-btn:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .dev-btn-primary {
      background: linear-gradient(135deg, rgb(255, 255, 255), rgb(255, 255, 255));
      color: rgb(11, 23, 54);
    }

    .dev-error {
      color: rgb(255, 150, 150);
      font-size: 0.8rem;
      margin: 0;
    }

    /* --- Câmera controlada pelo usuário: roda do mouse, arrasto e botões.
       O #world recebe um transform escrito em JS a partir do estado
       `camera`; a transição é ligada/desligada inline conforme o
       movimento seja programático (enquadrar) ou manual (arrastar). --- */
    .camera-viewport {
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .camera-viewport.is-panning {
      cursor: grabbing;
    }

    /* Posição: é a vaga (.hud-slot) que decide. */
    .camera-controls {
      position: relative;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 0.2rem;
      padding: 0.28rem;
      border-radius: 999px;
      background: rgba(10, 20, 48, 0.72);
      border: 1px solid rgba(160, 190, 255, 0.28);
      box-shadow: 0 10px 24px rgba(2, 9, 31, 0.4);
      backdrop-filter: blur(6px);
    }

    .camera-btn {
      width: 30px;
      height: 30px;
      min-width: 30px;
      padding: 0;
      border-radius: 50%;
      border: 0;
      background: transparent;
      color: rgba(231, 240, 255, 0.85);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .camera-btn:hover,
    .camera-btn:focus-visible {
      background: rgba(255, 255, 255, 0.14);
      color: rgb(255, 255, 255);
      transform: translateY(-1px);
    }

    .camera-btn.is-active {
      color: rgb(150, 240, 190);
    }

    .camera-zoom-readout {
      min-width: 44px;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: rgba(231, 240, 255, 0.8);
      font-variant-numeric: tabular-nums;
    }

    .camera-legend {
      display: flex;
      gap: 0.9rem;
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(231, 240, 255, 0.5);
      pointer-events: none;
    }

    .camera-legend span {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .camera-legend b {
      width: 11px;
      height: 11px;
      flex: none;
      border-radius: 3px;
      background: rgb(72, 111, 197);
    }

    .camera-legend .legend-sub b {
      border-radius: 999px;
      background: rgb(224, 233, 255);
    }

    /* --- Subnós: a folhagem do galho. Mesma largura dos nós, na cor clara
       da paleta do galho. A caixa cresce com o texto (até 400 palavras) e
       rola por dentro depois do teto; enquanto for curta mantém o formato
       de pílula, que vira um oval feio quando a caixa fica alta. --- */
    .branch.is-subnode .branch-button {
      min-height: var(--sub-min-h, 54px);
      max-height: var(--sub-max-h, 320px);
      overflow-y: auto;
      overscroll-behavior: contain;
      align-items: flex-start;
      border-radius: 999px;
      padding: 0.6rem 1.15rem;
      box-shadow: 0 8px 18px rgba(1, 10, 31, 0.18);
    }

    /* Só o raio muda: mexer no padding alteraria a altura já medida por
       measureNodes() e obrigaria a remedir. */
    .branch.is-subnode.is-tall .branch-button {
      border-radius: 18px;
    }

    .branch.is-subnode .branch-name {
      font-size: var(--sub-size, 0.92rem);
      font-weight: 600;
      white-space: pre-wrap;
      text-align: left;
      /* min-width:0 é o que deixa o texto realmente quebrar dentro do flex,
         em vez de esticar a caixa até caber a maior palavra. */
      flex: 1 1 auto;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .connector.is-subnode {
      stroke-width: 1.6px;
    }

    .connector.is-subnode.is-visible {
      opacity: 0.72;
    }

    /* O botão que cria subnós usa a própria aparência de subnó, para que a
       categoria se aprenda olhando, sem precisar de legenda no botão. */
    .dev-node-btn-sub {
      background: rgb(226, 235, 255);
      color: rgb(23, 52, 105);
      border-color: rgba(255, 255, 255, 0.6);
    }

    .dev-node-btn-sub:hover,
    .dev-node-btn-sub:focus-visible {
      background: rgb(255, 255, 255);
    }

    /* --- Dados do mapa: exportar/importar. Fica ao lado do cadeado e só
       aparece no modo dev, porque importar substitui o mapa inteiro. --- */
    .data-toggle {
      right: 4.4rem;
      display: none;
    }

    body.dev-mode .data-toggle {
      display: grid;
    }

    /* Aparência: mesmo padrão do botão de dados, uma posição adiante. */
    .theme-toggle {
      right: 7.3rem;
      display: none;
    }

    body.dev-mode .theme-toggle {
      display: grid;
    }

    .dev-btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(160, 190, 255, 0.35);
      color: rgb(230, 238, 255);
    }

    .dev-data-actions {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .dev-data-hint {
      font-size: 0.76rem;
      color: rgba(230, 238, 255, 0.6);
      margin: 0.1rem 0 0.6rem;
      line-height: 1.4;
    }

    .dev-word-count {
      font-size: 0.74rem;
      font-weight: 600;
      color: rgba(230, 238, 255, 0.6);
      margin: -0.5rem 0 0;
      font-variant-numeric: tabular-nums;
    }

    .dev-word-count.is-over {
      color: rgb(255, 150, 150);
    }

    .dev-input-long {
      min-height: 190px;
      line-height: 1.45;
    }

    .dev-file-input {
      display: none;
    }

    /* --- Painel de aparência: uma linha por item colorível. O <input
       type=color> é pequeno e sem moldura em quase todo navegador, então
       ganha uma caixa própria para virar um alvo de clique decente. --- */
    .dev-color-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.32rem 0;
    }

    .dev-color-row .dev-color-name,
    .dev-field-row .dev-color-name {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 0.82rem;
      color: rgba(230, 238, 255, 0.9);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dev-color-swatch {
      width: 40px;
      height: 26px;
      flex: none;
      padding: 0;
      border: 1px solid rgba(160, 190, 255, 0.4);
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
    }

    .dev-color-swatch::-webkit-color-swatch-wrapper {
      padding: 2px;
    }

    .dev-color-swatch::-webkit-color-swatch {
      border: 0;
      border-radius: 4px;
    }

    .dev-color-swatch::-moz-color-swatch {
      border: 0;
      border-radius: 4px;
    }

    .dev-reset-btn {
      flex: none;
      padding: 0.2rem 0.5rem;
      font-size: 0.7rem;
      border-radius: 6px;
      border: 1px solid rgba(160, 190, 255, 0.3);
      background: transparent;
      color: rgba(230, 238, 255, 0.65);
      cursor: pointer;
    }

    .dev-reset-btn:hover:not(:disabled),
    .dev-reset-btn:focus-visible:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
      color: rgb(255, 255, 255);
    }

    .dev-reset-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .dev-section-title {
      margin: 1rem 0 0.2rem;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(230, 238, 255, 0.55);
    }

    .dev-check {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: rgba(230, 238, 255, 0.9);
      cursor: pointer;
      padding: 0.32rem 0;
    }

    /* A lista de galhos pode passar de uma dezena: rola por dentro em vez
       de esticar o modal para fora da tela. */
    .dev-branch-list {
      max-height: 240px;
      overflow-y: auto;
      overscroll-behavior: contain;
      margin: 0;
      padding-right: 0.2rem;
    }

    /* --- Painel de aparência em folha lateral --------------------------
       Os outros modais cobrem o mapa; este não pode, porque tudo o que ele
       mexe (título, tronco, marca d'água) precisa ser visto enquanto se
       mexe. Fica encostado à direita, com o fundo quase transparente. */
    .dev-overlay.is-side {
      background: rgba(4, 8, 20, 0.2);
      justify-content: flex-end;
    }

    .dev-overlay.is-side .dev-modal {
      width: min(100%, 430px);
      max-height: calc(100vh - 2.5rem);
      max-height: calc(100dvh - 2.5rem);
    }

    .dev-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin: 0 0 0.3rem;
    }

    .dev-tab {
      font-size: 0.76rem;
      font-weight: 700;
      padding: 0.38rem 0.75rem;
      border-radius: 999px;
      border: 1px solid rgba(160, 190, 255, 0.3);
      color: rgba(230, 238, 255, 0.75);
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease;
    }

    .dev-tab:hover,
    .dev-tab:focus-visible {
      background: rgba(255, 255, 255, 0.08);
      color: rgb(255, 255, 255);
    }

    .dev-tab[aria-pressed="true"] {
      background: rgb(230, 238, 255);
      border-color: transparent;
      color: rgb(16, 29, 64);
    }

    /* Nome | controle deslizante | leitura. A leitura tem largura fixa
       para o controle não mudar de tamanho enquanto o valor muda. */
    .dev-range-row {
      display: grid;
      grid-template-columns: minmax(6.5rem, 36%) minmax(0, 1fr) 3.6rem;
      align-items: center;
      gap: 0.6rem;
      padding: 0.3rem 0;
      font-size: 0.82rem;
      color: rgba(230, 238, 255, 0.9);
    }

    .dev-range {
      width: 100%;
      min-width: 0;
      cursor: pointer;
    }

    .dev-range-value {
      font-size: 0.74rem;
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      color: rgba(230, 238, 255, 0.75);
    }

    .dev-field-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 0.6rem;
      padding: 0.32rem 0;
    }

    /* Mesma coluna do nome nas linhas de controle deslizante: fonte,
       estilo e posição começam onde os controles começam. */
    .dev-field-row .dev-color-name {
      flex: 0 0 auto;
      width: 36%;
      min-width: 6.5rem;
    }

    .dev-select {
      flex: 1 1 10rem;
      min-width: 0;
      padding: 0.4rem 0.6rem;
      font-size: 0.82rem;
      cursor: pointer;
    }

    /* A lista aberta do <select> é desenhada pelo sistema: sem isto, o
       texto claro herdado do modal sumiria no fundo branco dela. */
    .dev-select option {
      background: #101d40;
      color: rgb(240, 245, 255);
    }

    .dev-seg-group {
      display: inline-flex;
      gap: 0.25rem;
    }

    .dev-seg {
      width: 34px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid rgba(160, 190, 255, 0.35);
      color: rgba(230, 238, 255, 0.85);
      display: grid;
      place-items: center;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .dev-seg:hover,
    .dev-seg:focus-visible {
      background: rgba(255, 255, 255, 0.1);
    }

    .dev-seg[aria-pressed="true"] {
      background: rgb(230, 238, 255);
      border-color: transparent;
      color: rgb(16, 29, 64);
    }

    /* Amostra "Aa": o texto na cor escolhida sobre o fundo onde ele vai
       aparecer, para o contraste se ver antes de fechar o painel. O
       <input type="color"> fica invisível por cima dela e recebe o
       clique. Quadrada para nó e redonda para subnó, como na legenda. */
    .dev-text-chip {
      position: relative;
      flex: none;
      width: 44px;
      height: 26px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid rgba(160, 190, 255, 0.4);
    }

    .dev-text-chip.is-sub {
      border-radius: 999px;
    }

    .dev-text-chip:focus-within {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .dev-chip-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      opacity: 0;
      cursor: pointer;
    }

    /* Cabeçalho das colunas de amostras, dentro da lista que rola: assim
       ele se alinha às linhas mesmo quando a barra de rolagem aparece. */
    .dev-chip-head {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      justify-content: flex-end;
      gap: 0.7rem;
      padding: 0.1rem 0 0.2rem;
      background: #101d40;
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(230, 238, 255, 0.5);
    }

    .dev-chip-head span {
      width: 44px;
      text-align: center;
    }

    /* Na aba Textos a lista é quase tudo o que há: pode ser mais alta. */
    .dev-branch-list.is-tall {
      max-height: min(440px, 52vh);
    }

    .dev-color-row.is-global {
      margin-bottom: 0.25rem;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid rgba(160, 190, 255, 0.18);
    }

    .dev-color-row.is-global .dev-color-name {
      font-weight: 700;
    }

    .dev-pos-grid {
      display: grid;
      grid-template-columns: repeat(3, 32px);
      gap: 4px;
    }

    .dev-pos-btn {
      width: 32px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid rgba(160, 190, 255, 0.35);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .dev-pos-btn::after {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(230, 238, 255, 0.4);
    }

    .dev-pos-btn:hover,
    .dev-pos-btn:focus-visible {
      background: rgba(255, 255, 255, 0.1);
    }

    .dev-pos-btn[aria-pressed="true"] {
      background: rgba(160, 190, 255, 0.28);
      border-color: rgb(160, 190, 255);
    }

    .dev-pos-btn[aria-pressed="true"]::after {
      background: rgb(255, 255, 255);
    }

    /* Aba Tela: um bloco por elemento preso à tela. */
    .dev-hud-item {
      margin-top: 0.7rem;
      padding: 0.55rem 0.75rem 0.4rem;
      border: 1px solid rgba(160, 190, 255, 0.18);
      border-radius: 12px;
    }

    .dev-hud-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
    }

    .dev-hud-name {
      font-size: 0.86rem;
      font-weight: 700;
    }

    .dev-hud-item.is-off .dev-hud-name {
      color: rgba(230, 238, 255, 0.5);
    }

    .dev-range:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .dev-inline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }

    .dev-inline-actions .dev-btn {
      flex: 1 1 auto;
    }

    .dev-btn-danger {
      color: rgb(255, 160, 160);
      border-color: rgba(255, 120, 120, 0.45);
    }

    /* Botão de estado com palavra em vez de ícone (Acima, Abaixo...). */
    .dev-seg.is-text {
      width: auto;
      min-width: 34px;
      padding: 0 0.6rem;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .dev-seg:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .dev-seg-group.is-wrap {
      flex-wrap: wrap;
    }

    /* Aba Marca d'água: a lista das marcas, com miniatura. Clicar numa
       linha escolhe qual o editor embaixo mostra. */
    .dev-wm-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin: 0.3rem 0 0.5rem;
    }

    .dev-wm-row {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .dev-wm-item {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.3rem 0.5rem 0.3rem 0.3rem;
      border-radius: 10px;
      border: 1px solid rgba(160, 190, 255, 0.25);
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .dev-wm-item:hover,
    .dev-wm-item:focus-visible {
      background: rgba(255, 255, 255, 0.06);
    }

    .dev-wm-item[aria-pressed="true"] {
      background: rgba(160, 190, 255, 0.18);
      border-color: rgb(160, 190, 255);
    }

    /* Xadrez atrás da miniatura: é o que mostra se o PNG tem fundo
       transparente ou não. */
    .dev-wm-thumb {
      flex: none;
      width: 52px;
      height: 34px;
      border-radius: 6px;
      background: repeating-conic-gradient(rgba(255, 255, 255, 0.1) 0% 25%, transparent 0% 50%) 50% / 10px 10px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .dev-wm-thumb img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Miniatura de texto: um "Aa" na fonte e nas cores da marca. */
    .dev-wm-thumb.is-text {
      font-size: 1.05rem;
      line-height: 1;
      color: rgb(255, 255, 255);
    }

    .dev-wm-target .dev-wm-thumb.is-text {
      font-size: 0.8rem;
    }

    /* Seções recolhíveis do editor de texto (fundo, contorno, sombra). */
    .dev-fold {
      margin-top: 0.45rem;
      border: 1px solid rgba(160, 190, 255, 0.18);
      border-radius: 10px;
      padding: 0 0.6rem;
    }

    .dev-fold[open] {
      padding-bottom: 0.35rem;
    }

    .dev-fold summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.45rem 0;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .dev-fold summary::-webkit-details-marker {
      display: none;
    }

    .dev-fold summary::before {
      content: "▸";
      margin-right: -0.2rem;
      color: rgba(230, 238, 255, 0.6);
    }

    .dev-fold[open] summary::before {
      content: "▾";
    }

    .dev-fold summary span:first-of-type {
      flex: 1 1 auto;
    }

    .dev-fold-state {
      font-size: 0.7rem;
      font-weight: 600;
      color: rgba(230, 238, 255, 0.55);
    }

    .dev-wm-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.05rem;
    }

    .dev-wm-name,
    .dev-wm-where {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dev-wm-name {
      font-size: 0.82rem;
      font-weight: 700;
    }

    .dev-wm-where {
      font-size: 0.7rem;
      color: rgba(230, 238, 255, 0.6);
    }

    .dev-wm-item.is-off .dev-wm-name {
      color: rgba(230, 238, 255, 0.5);
    }

    .dev-icon-btn {
      flex: none;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid rgba(160, 190, 255, 0.3);
      color: rgba(230, 238, 255, 0.85);
      display: grid;
      place-items: center;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .dev-icon-btn:hover:not(:disabled),
    .dev-icon-btn:focus-visible:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
    }

    .dev-icon-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .dev-wm-editor {
      margin-top: 0.5rem;
      padding: 0.6rem 0.75rem 0.5rem;
      border: 1px solid rgba(160, 190, 255, 0.18);
      border-radius: 12px;
    }

    /* "Grudada em": uma ficha por marca candidata, com miniatura. */
    .dev-wm-targets {
      flex: 1 1 10rem;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    .dev-wm-target {
      max-width: 100%;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.5rem 0.2rem 0.2rem;
      border-radius: 8px;
      border: 1px solid rgba(160, 190, 255, 0.3);
      color: rgba(230, 238, 255, 0.85);
      font-size: 0.74rem;
      cursor: pointer;
    }

    .dev-wm-target span:last-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dev-wm-target .dev-wm-thumb {
      width: 34px;
      height: 22px;
    }

    .dev-wm-target:hover,
    .dev-wm-target:focus-visible {
      background: rgba(255, 255, 255, 0.08);
    }

    .dev-wm-target[aria-pressed="true"] {
      background: rgba(160, 190, 255, 0.2);
      border-color: rgb(160, 190, 255);
      color: rgb(255, 255, 255);
    }

    /* --- Marcas d'água ------------------------------------------------
       Moram na janela da câmera, e não no #world: ficam paradas enquanto
       o mapa é arrastado ou ampliado. São desenhadas POR CIMA do mapa (só
       os controles da câmera ficam acima delas) e são transparentes ao
       ponteiro — nem o clique, nem o arrasto, nem o elementFromPoint do
       religar galho enxergam elas. Tudo o que muda vem do painel de
       aparência (applyWatermarks).

       Cada conjunto (uma marca solta e as grudadas nela) tem uma vaga do
       tamanho da janela: o flex da vaga põe o conjunto no ponto da grade
       3×3, e o padding é a distância da borda. Dentro do conjunto, cada
       imagem tem posição absoluta, calculada a partir de lado,
       alinhamento e distância. Transparência e giro são do conjunto. */
    .watermark {
      position: absolute;
      inset: 0;
      z-index: 20;
      overflow: hidden;
      pointer-events: none;
    }

    .watermark[hidden] {
      display: none;
    }

    .wm-slot {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .wm-group {
      position: relative;
      flex: none;
    }

    .wm-slot[hidden],
    .wm-img[hidden] {
      display: none;
    }

    /* O max-width do reset do Tailwind espremeria a imagem na largura da
       tela e a deformaria, já que a altura é escrita inline. */
    .wm-img {
      position: absolute;
      max-width: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Marca de texto: só quebra linha onde a pessoa deu Enter, e a caixa
       tem a largura da linha mais longa — é essa caixa que é medida para
       grudar e posicionar. O resto da aparência é inline
       (applyWatermarkText). */
    .wm-text {
      position: absolute;
      width: max-content;
      margin: 0;
      white-space: pre;
      user-select: none;
    }

    /* --- Pesquisa ------------------------------------------------------
       Mora fora do #map-stage de propósito: assim nem o arrasto nem a roda
       da câmera enxergam os gestos feitos na caixa ou na lista. Quem a
       posiciona é a vaga (.hud-slot) em que ela estiver.

       Fonte, cores e texto de exemplo vêm do painel de aparência (aba
       Pesquisa) como variáveis escritas na .search por applySearch(). O
       segundo valor de cada var() é o de fábrica — é ele que vale enquanto
       a variável não existe. A lista de resultados segue a formatação do
       texto digitado. --- */
    .search {
      position: relative;
      width: min(340px, 100%);
      pointer-events: auto;
    }

    /* A caixa cresce com a letra maior (a do texto ou a do exemplo), sem
       nunca ficar menor que os 40px de sempre. */
    .search-field {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0 0.8rem;
      height: max(40px, calc(var(--search-text-size, 0.88rem) * 2.3), calc(var(--search-hint-size, 0.88rem) * 2.3));
      border-radius: 999px;
      background: var(--search-bg, rgba(10, 20, 48, 0.72));
      border: 1px solid var(--search-border, rgba(160, 190, 255, 0.28));
      box-shadow: 0 10px 24px rgba(2, 9, 31, 0.35);
      backdrop-filter: blur(6px);
      color: var(--search-icon, rgba(231, 240, 255, 0.7));
      cursor: text;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .search-field:focus-within {
      border-color: var(--search-border-focus, rgba(160, 190, 255, 0.7));
      background: var(--search-bg-focus, rgba(10, 20, 48, 0.9));
    }

    .search-icon {
      flex: none;
    }

    .search-input {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--search-text-color, rgb(240, 245, 255));
      font: inherit;
      font-family: var(--search-text-font, inherit);
      font-size: var(--search-text-size, 0.88rem);
      font-weight: var(--search-text-weight, inherit);
      font-style: var(--search-text-style, inherit);
      letter-spacing: var(--search-text-spacing, normal);
      text-transform: var(--search-text-case, none);
    }

    .search-input::placeholder {
      color: var(--search-hint-color, rgba(231, 240, 255, 0.5));
      font-family: var(--search-hint-font, inherit);
      font-size: var(--search-hint-size, inherit);
      font-weight: var(--search-hint-weight, inherit);
      font-style: var(--search-hint-style, inherit);
      letter-spacing: var(--search-hint-spacing, normal);
      text-transform: var(--search-hint-case, none);
    }

    /* O "x" nativo do type=search some: Esc já limpa, e o do Chrome é
       cinza sobre azul-escuro, quase invisível. */
    .search-input::-webkit-search-cancel-button {
      -webkit-appearance: none;
    }

    .search-results {
      list-style: none;
      margin: 0.4rem 0 0;
      padding: 0.3rem;
      max-height: min(360px, 55dvh);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(160, 190, 255, 0.35) transparent;
      border-radius: 16px;
      background: var(--search-list-bg, rgba(10, 20, 48, 0.94));
      border: 1px solid var(--search-list-border, rgba(160, 190, 255, 0.28));
      box-shadow: 0 18px 38px rgba(2, 9, 31, 0.5);
      backdrop-filter: blur(6px);
      font-family: var(--search-text-font, inherit);
      font-style: var(--search-text-style, inherit);
      letter-spacing: var(--search-text-spacing, normal);
      text-transform: var(--search-text-case, none);
    }

    .search-results::-webkit-scrollbar {
      width: 6px;
    }

    .search-results::-webkit-scrollbar-thumb {
      background: rgba(160, 190, 255, 0.35);
      border-radius: 999px;
    }

    .search-item {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      padding: 0.5rem 0.6rem;
      border-radius: 11px;
      cursor: pointer;
      color: var(--search-item-color, rgb(236, 242, 255));
    }

    .search-item.is-active {
      background: rgba(160, 190, 255, 0.16);
    }

    /* A cor do galho, para reconhecer o resultado antes de ler o caminho;
       quadrado para nó e bolinha para subnó, como na legenda. */
    .search-dot {
      flex: none;
      width: 10px;
      height: 10px;
      margin-top: 0.3rem;
      border-radius: 3px;
    }

    .search-item.is-sub .search-dot {
      border-radius: 999px;
    }

    .search-text {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    /* Os tamanhos da lista acompanham o do texto digitado, na proporção
       de sempre (0.84rem e 0.72rem para 0.88rem). */
    .search-label {
      font-size: calc(var(--search-text-size, 0.88rem) * 0.84 / 0.88);
      font-weight: 700;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .search-item.is-sub .search-label {
      font-weight: 500;
    }

    .search-path {
      font-size: calc(var(--search-text-size, 0.88rem) * 0.72 / 0.88);
      color: var(--search-path-color, rgba(231, 240, 255, 0.55));
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .search-label mark,
    .search-path mark {
      background: rgba(246, 190, 88, 0.3);
      color: inherit;
      border-radius: 3px;
      padding: 0 1px;
    }

    .search-empty,
    .search-more {
      padding: 0.55rem 0.7rem;
      font-size: calc(var(--search-text-size, 0.88rem) * 0.78 / 0.88);
      color: var(--search-note-color, rgba(231, 240, 255, 0.6));
      cursor: default;
    }

    .search-more {
      font-size: calc(var(--search-text-size, 0.88rem) * 0.72 / 0.88);
      border-top: 1px solid rgba(160, 190, 255, 0.14);
      margin-top: 0.2rem;
    }

    body.on-light .map-heading + .search .search-field {
      box-shadow: 0 8px 20px rgba(11, 23, 54, 0.18);
    }

    /* Nó encontrado: um contorno que pulsa algumas vezes e some sozinho,
       para o olho achar a caixa depois que a câmera chega. */
    /* O foco do teclado vai para o nó encontrado; sem o :focus-visible
       aqui o anel branco do foco cobriria o destaque. */
    .branch.is-found .branch-button,
    .branch.is-found .branch-button:focus-visible {
      outline: 3px solid rgb(246, 190, 88);
      outline-offset: 4px;
      animation: found-pulse 900ms ease-out 3;
    }

    @keyframes found-pulse {
      0% { box-shadow: 0 0 0 0 rgba(246, 190, 88, 0.75), 0 12px 25px rgba(1, 10, 31, 0.24); }
      100% { box-shadow: 0 0 0 22px rgba(246, 190, 88, 0), 0 12px 25px rgba(1, 10, 31, 0.24); }
    }

    /* === Celular =======================================================
       Pende de body.is-compact, que applyMetrics() liga junto com as
       medidas do layout — e não de uma media query própria, que poderia
       discordar do JS e deixar caixas de 214px com passos de 194px.

       .mindmap-shell NUNCA pode ter min-height:auto aqui: todos os filhos
       dele são absolutos, então sem altura própria o shell desabaria para a
       altura do padding e a área do mapa ficaria com uns 100px de altura.
       =================================================================== */
    body.is-compact .mindmap-shell {
      padding: 3.6rem 0.75rem 1.5rem;
    }

    /* No celular as vagas são as de sempre: applyHud() devolve cada
       elemento à vaga de fábrica e ignora posição, distância e tamanho. */
    body.is-compact .hud-slot {
      left: 0.75rem;
      right: 0.75rem;
    }

    body.is-compact .hud-slot[data-slot^="top"] {
      top: 1.1rem;
      gap: 0.6rem;
    }

    body.is-compact .hud-slot[data-slot="bottom-left"] {
      bottom: max(0.85rem, env(safe-area-inset-bottom, 0px));
    }

    body.is-compact .hud-slot[data-slot="bottom-right"] {
      right: 0.6rem;
      bottom: max(0.6rem, env(safe-area-inset-bottom, 0px));
    }

    /* O min-height é o que põe a pesquisa abaixo da fila do cadeado (4rem)
       mesmo com o título curto ou vazio; um título maior empurra mais. */
    body.is-compact .map-heading {
      margin-left: 0.35rem;
      min-height: 2.3rem;
      max-width: calc(100% - 9.3rem);
    }

    body.is-compact .eyebrow {
      font-size: calc(var(--title-size, 0.7rem) * 0.62 / 0.7);
    }

    body.is-compact .eyebrow-sub {
      font-size: calc(var(--subtitle-size, 0.8rem) * 0.62 / 0.7);
    }

    /* Título escondido no celular: some, mas guarda o lugar — sem ele a
       pesquisa, que ocupa a largura toda, subiria para baixo do cadeado. */
    body.is-compact .map-heading.hud-item.is-off {
      display: block !important;
      visibility: hidden;
      height: 2.3rem;
      overflow: hidden;
    }

    /* No celular a caixa ocupa a largura toda, abaixo da fila do cadeado —
       no modo dev essa fila tem três botões e não sobra canto livre. */
    body.is-compact .search {
      width: 100%;
    }

    /* 16px: menos que isso e o iOS dá zoom sozinho ao focar o campo. Uma
       letra escolhida maior que isso continua valendo. */
    body.is-compact .search-field {
      height: max(40px, calc(max(16px, var(--search-text-size, 0.88rem)) * 2.3), calc(max(16px, var(--search-hint-size, 0.88rem)) * 2.3));
    }

    body.is-compact .search-input {
      font-size: max(16px, var(--search-text-size, 0.88rem));
    }

    body.is-compact .search-input::placeholder {
      font-size: max(16px, var(--search-hint-size, 0.88rem));
    }

    /* O círculo do tronco encolheu, e o rótulo encolhe na mesma proporção
       do tamanho escolhido no painel (22px viram os 15px de sempre). O
       !important vence um font-size inline que tenha sobrado de um HTML
       exportado por uma versão anterior. */
    body.is-compact .core-button {
      padding: 0 0.7rem;
    }

    body.is-compact .core-button .node-label {
      font-size: calc(var(--core-font-size, 22px) * 15 / 22) !important;
    }

    /* No celular a folha fica embaixo, na largura toda como os outros
       modais, e mais baixa: o topo do mapa (título, tronco) continua à
       vista enquanto se mexe. */
    body.is-compact .dev-overlay.is-side .dev-modal {
      width: 100%;
      max-height: 60dvh;
    }

    body.is-compact .instruction {
      font-size: 0.74rem;
    }

    body.is-compact .branch-button {
      border-radius: 15px;
      padding: 0.7rem 0.8rem;
    }

    body.is-compact .branch.is-subnode .branch-button {
      padding: 0.5rem 0.9rem;
    }

    body.is-compact .camera-legend {
      font-size: 0.6rem;
      gap: 0.6rem;
    }

    body.is-compact .dev-toggle {
      top: 1rem;
      right: 1rem;
    }

    body.is-compact .data-toggle {
      right: 3.9rem;
    }

    body.is-compact .theme-toggle {
      right: 6.8rem;
    }

    body.is-compact .dev-modal {
      width: 100%;
      max-height: 88dvh;
      border-radius: 18px;
      padding: 1.4rem 1.1rem 1.2rem;
    }

    body.is-compact .dev-overlay {
      padding: 0.75rem;
      align-items: flex-end;
    }

    /* 16px é o mínimo que o iOS aceita sem dar zoom sozinho no campo ao
       receber o foco — e o zoom automático deixa o mapa fora de lugar. */
    body.is-compact .dev-input {
      font-size: 16px;
    }

    body.is-compact .drag-hint {
      font-size: 0.72rem;
      max-width: calc(100% - 1.5rem);
    }

    /* Não sobra largura para os dois cantos de baixo ao mesmo tempo. */
    @media (max-width: 460px) {
      .camera-legend {
        display: none;
      }
    }

    /* === Ponteiro grosso (dedo) =======================================
       Vale para o tablet também, onde a largura não denuncia o toque. Alvo
       de 44px é o mínimo confortável; os botões desenhados continuam do
       mesmo tamanho, o que cresce é a área que responde ao toque.
       ================================================================== */
    @media (pointer: coarse) {
      .camera-btn {
        width: 40px;
        height: 40px;
        min-width: 40px;
      }

      .dev-toggle {
        width: 44px;
        height: 44px;
      }

      .dev-node-btn {
        width: 30px;
        height: 30px;
        min-width: 30px;
      }

      /* O "+" decide entre abrir o galho e abrir o PDF: com 19px de ícone,
         o dedo erra. A área cresce para fora sem mexer no desenho. */
      .branch-toggle-icon {
        padding: 10px;
        margin: -10px;
        box-sizing: content-box;
        overflow: visible;
      }

      /* Sem hover no toque, o realce ao passar o dedo fica grudado no
         último nó tocado. */
      .branch-button:hover,
      .core-button:hover {
        transform: none;
        filter: none;
      }

      .branch-button:active {
        filter: brightness(1.1);
      }
    }

    /* Um subnó longo rola por dentro. A viewport tem touch-action:none para
       o mapa reagir à pinça e ao arrasto, e isso mataria a rolagem do texto:
       só a caixa que REALMENTE tem texto sobrando devolve o eixo vertical ao
       navegador. measureNodes() liga e desliga a classe. */
    .branch.is-subnode.is-scrollable .branch-button {
      touch-action: pan-y;
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

      // --- Aritmética de cor ----------------------------------------------
      function hexToRgb(hex) {
        const clean = String(hex || "").trim().replace("#", "");
        const full = clean.length === 3
          ? clean[0] + clean[0] + clean[1] + clean[1] + clean[2] + clean[2]
          : clean;
        const num = parseInt(full, 16);
        if (full.length !== 6 || isNaN(num)) return { r: 0, g: 0, b: 0 };
        return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
      }

        const part = (v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, "0");
        return "#" + part(c.r) + part(c.g) + part(c.b);
      }

      function rgbCss(c, alpha) {
        const r = Math.round(c.r), g = Math.round(c.g), b = Math.round(c.b);
        return alpha === undefined

          : `rgba(${r}, ${g}, ${b}, ${alpha})`;

      function mixRgb(a, b, t) {
        return {

          g: a.g + (b.g - a.g) * t,
          b: a.b + (b.b - a.b) * t,
        };

      // Luminância relativa (WCAG) — decide entre texto branco e texto
      // escuro por cima da cor escolhida, para o rótulo nunca sumir.
      function luminance(c) {
        const chan = (v) => {
          const s = v / 255;
          return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
        };
        return 0.2126 * chan(c.r) + 0.7152 * chan(c.g) + 0.0722 * chan(c.b);

      const WHITE = { r: 255, g: 255, b: 255 };
      const BLACK = { r: 0, g: 0, b: 0 };
      const INK_RGB = { r: 11, g: 23, b: 54 };

        const la = luminance(a);

      // não alcança 4.5:1, o mínimo legível para texto desse tamanho.

      // Deriva as quatro cores de um galho a partir de uma cor só: a forte
      // do nó, o texto que a acompanha, e o par claro usado pelos subnós.
      function derivePalette(hex) {
        const base = hexToRgb(hex);
        return {
          bg: rgbCss(base),
          fg: textOver(base),
          subBg: rgbCss(mixRgb(base, WHITE, 0.86)),
          subFg: rgbCss(mixRgb(base, BLACK, 0.62)),
        };
      }

      // Escreve o tema na página. Tudo o que o tema toca vira estilo inline
      // ou variável CSS — nada some quando o mapa é reconstruído, e o HTML
      // exportado já nasce com as cores certas, antes mesmo do script rodar.
      function applyTheme() {
        const rootStyle = document.documentElement.style;
        const bg = hexToRgb(theme.background);
        document.body.style.background = rgbCss(bg);
        // Fundo claro inverte os textos que vivem por cima dele (eyebrow,
        // legenda, instrução, botões do topo), senão eles somem.
        document.body.classList.toggle("on-light", luminance(bg) > 0.45);

        rootStyle.setProperty("--line", rgbCss(hexToRgb(theme.line), LINE_ALPHA));
        rootStyle.setProperty("--blob-a", rgbCss(hexToRgb(theme.blobA), BLOB_A_ALPHA));
        rootStyle.setProperty("--blob-b", rgbCss(hexToRgb(theme.blobB), BLOB_B_ALPHA));
        document.body.classList.toggle("no-blobs", !theme.blobs);

        const coreA = hexToRgb(theme.core);
        const coreB = hexToRgb(theme.coreEnd);
        coreButton.style.background =
          "linear-gradient(135deg, " + rgbCss(coreA) + ", " + rgbCss(coreB) + ")";
        applyCoreText(textOver(mixRgb(coreA, coreB, 0.5)));
        applyCoreShadow();
        loadFonts(false);
        applyTitle();
        applySearch();
        applyWatermarks();
        const hudMoved = applyHud();

        applyNodeColors();
        // Título (com o subtítulo) e pesquisa entram no enquadramento
        // (hudInsets): se mudaram de lugar ou de tamanho, a câmera
        // reenquadra — a não ser que o tronco já tenha feito isso ao crescer.
        if (!refreshCoreSize() && hudMoved && nodeById.size) autoFit(0);
      }

      // Põe cada elemento preso à tela na vaga escolhida, com o afastamento
      // e o tamanho escolhidos. No celular (body.is-compact) só o
      // mostrar/esconder vale: cada um volta à vaga e ao tamanho de
      // fábrica, e o layout automático do celular fica como sempre foi.
      // Devolve true quando mudou algo que pesa no enquadramento da câmera.
      const SLOT_EDGES = {
        "top-left": ["Top", "Left"], "top": ["Top"], "top-right": ["Top", "Right"],
        "left": ["Left"], "center": [], "right": ["Right"],
        "bottom-left": ["Bottom", "Left"], "bottom": ["Bottom"], "bottom-right": ["Bottom", "Right"],
      };
      let hudApplied = "";
      function applyHud() {
        const compact = document.body.classList.contains("is-compact");
        const bySlot = {};
        HUD_ORDER.forEach((key) => {
          const cfg = theme.hud[key];
          const el = hudItems[key];
          const position = compact ? DEFAULT_THEME.hud[key].position : cfg.position;
          el.classList.toggle("is-off", !cfg.show);
          // zoom, e não transform: scale — o zoom muda o tamanho que o
          // elemento ocupa, e a pilha da vaga abre espaço para ele.
          const zoom = !compact && cfg.scale ? cfg.scale / 100 : 1;
          el.style.zoom = zoom !== 1 ? String(zoom) : "";
          // Afastar da borda é margem nos lados que dão para a borda da
          // vaga; na vaga do centro não há borda, e ele não faz nada. O
          // zoom amplia a margem junto, daí a divisão: +30px é 30px na tela
          // em qualquer tamanho.
          el.style.margin = "";
          if (!compact && cfg.offset) {
            SLOT_EDGES[position].forEach((side) => { el.style["margin" + side] = (cfg.offset / zoom) + "px"; });
          }
          (bySlot[position] = bySlot[position] || []).push(el);
        });
        // Só mexe no DOM quando a pilha de alguma vaga muda: mover um
        // elemento tira o foco de quem estiver dentro dele (a pesquisa).
        Object.keys(bySlot).forEach((key) => {
          const slot = hudSlots[key];
          const wanted = bySlot[key];
          const current = Array.from(slot.children);
          if (current.length !== wanted.length || wanted.some((el, i) => current[i] !== el)) {
            wanted.forEach((el) => slot.appendChild(el));
          }
        });
        const signature = JSON.stringify([
          compact, theme.title, theme.subtitle, theme.hud.title, theme.hud.search,
          theme.searchText.size, theme.searchHint.size,
        ]);
        const changed = signature !== hudApplied;
        hudApplied = signature;
        return changed;
      }

      // Formatação do rótulo do tronco — vale para o texto inteiro.
      // `autoFg` é a cor automática, calculada sobre o gradiente.
      function applyCoreText(autoFg) {
        const t = theme.coreText;
        const fg = t.color || autoFg;
        coreButton.style.color = fg;
        const s = coreLabel.style;
        s.color = fg;
        s.fontFamily = FONTS[t.font].css;
        // Um HTML exportado antes desta versão traz font-size inline, que
        // venceria a variável lida pelo CSS.
        s.removeProperty("font-size");
        s.setProperty("--core-font-size", t.size + "px");
        s.fontWeight = t.bold ? "700" : "400";
        s.fontStyle = t.italic ? "italic" : "normal";
        s.textDecoration = t.underline ? "underline" : "none";
        s.textAlign = t.align;
        s.letterSpacing = t.spacing + "em";
        s.lineHeight = String(t.lineHeight);
      }

      // Duas camadas, como no desenho original do tronco: a sombra do painel
      // e, por baixo dela, uma "base" sólida — sem desfoque, um pouco mais
      // curta e bem mais clara — que dá o ar de botão em relevo. A base sai
      // da própria sombra, e é isso que faz o padrão ser exatamente a sombra
      // de antes (0 18px 0 a 13% e 0 22px 45px a 38%). Com distância zero,
      // o brilho em volta, ela fica inteira escondida atrás do círculo.
      const CORE_BASE_REACH = 18 / 22;
      const CORE_BASE_ALPHA = 0.13 / 0.38;

      function applyCoreShadow() {
        const sh = theme.coreShadow;
        if (!sh.on) {
          coreButton.style.boxShadow = "none";
          return;
        }
        const rad = sh.angle * Math.PI / 180;
        const dx = Math.cos(rad) * sh.distance;
        const dy = Math.sin(rad) * sh.distance;
        const rgb = hexToRgb(sh.color);
        const alpha = (100 - sh.transparency) / 100;
        const base = Math.round(dx * CORE_BASE_REACH) + "px " + Math.round(dy * CORE_BASE_REACH) + "px 0 "
          + rgbCss(rgb, Math.round(alpha * CORE_BASE_ALPHA * 100) / 100);
        const soft = Math.round(dx) + "px " + Math.round(dy) + "px " + sh.blur + "px " + rgbCss(rgb, alpha);
        coreButton.style.boxShadow = base + ", " + soft;
      }

      // Fonte, peso, estilo, caixa, espaçamento e cor de um texto que o
      // painel formata por inteiro (título e subtítulo). O tamanho não vem
      // aqui: vai numa variável, que o CSS do celular reduz.
      function applyTextStyle(el, t) {
        const s = el.style;
        s.fontFamily = FONTS[t.font].css;
        s.fontWeight = t.bold ? "700" : "400";
        s.fontStyle = t.italic ? "italic" : "normal";
        s.textTransform = t.upper ? "uppercase" : "none";
        s.letterSpacing = t.spacing + "em";
        // Vazio devolve a cor ao CSS, que já troca entre clara e tinta
        // conforme o fundo (body.on-light).
        s.color = t.color;
      }

      function applyTitle() {
        const t = theme.title;
        if (titleEl.textContent !== t.text) titleEl.textContent = t.text;
        titleEl.style.setProperty("--title-size", t.size + "px");
        applyTextStyle(titleEl, t);
        applySubtitle();
      }

      // Acima ou abaixo do título é a ordem no DOM, e não um `order` do
      // CSS: assim o leitor de tela lê as duas linhas na ordem em que elas
      // aparecem. A distância é a margem do lado que dá para o título.
      function applySubtitle() {
        const t = theme.subtitle;
        subtitleEl.hidden = !t.text.trim();
        if (subtitleEl.textContent !== t.text) subtitleEl.textContent = t.text;
        const above = t.place === "above";
        if (above !== (headingEl.firstElementChild === subtitleEl)) {
          headingEl.insertBefore(subtitleEl, above ? titleEl : null);
        }
        const s = subtitleEl.style;
        s.setProperty("--subtitle-size", t.size + "px");
        applyTextStyle(subtitleEl, t);
        s.marginTop = above ? "" : t.gap + "px";
        s.marginBottom = above ? t.gap + "px" : "";
      }

      // --- Caixa de pesquisa --------------------------------------------------
      // Tudo vira variável CSS na .search: o texto de exemplo mora num
      // pseudo-elemento, onde estilo inline não chega, e os itens da lista
      // são recriados a cada letra digitada. Cor automática que continua a
      // de fábrica não é escrita — vale o segundo valor do var() no CSS.
      const SEARCH_BG_RGB = { r: 10, g: 20, b: 48 };
      // As cores que valem enquanto a do painel está vazia, para o seletor
      // mostrar a cor de verdade (ver effectiveHex). applySearch preenche.
      let searchAuto = {};

      function applySearch() {
        const el = hudItems.search;
        const s = el.style;
        const box = theme.searchBox;
        const input = el.querySelector(".search-input");
        if (input.placeholder !== box.placeholder) input.placeholder = box.placeholder;

        const setVar = (name, value) => {
          if (value) s.setProperty(name, value);
          else s.removeProperty(name);
        };
        [["--search-text", theme.searchText], ["--search-hint", theme.searchHint]].forEach((pair) => {
          const prefix = pair[0];
          const t = pair[1];
          s.setProperty(prefix + "-font", FONTS[t.font].css);
          s.setProperty(prefix + "-size", t.size + "px");
          s.setProperty(prefix + "-weight", t.bold ? "700" : "400");
          s.setProperty(prefix + "-style", t.italic ? "italic" : "normal");
          s.setProperty(prefix + "-case", t.upper ? "uppercase" : "none");
          s.setProperty(prefix + "-spacing", t.spacing + "em");
        });

        // Fundo: a mesma cor em três opacidades — parada, com o foco e na
        // lista de resultados. Com a transparência de fábrica (28%) saem os
        // 0.72, 0.9 e 0.94 de sempre.
        const bg = box.background ? hexToRgb(box.background) : SEARCH_BG_RGB;
        const alpha = (100 - box.transparency) / 100;
        const opacity = (v) => Math.round(Math.min(1, v) * 100) / 100;
        s.setProperty("--search-bg", rgbCss(bg, opacity(alpha)));
        s.setProperty("--search-bg-focus", rgbCss(bg, opacity(alpha + 0.18)));
        s.setProperty("--search-list-bg", rgbCss(bg, opacity(alpha + 0.22)));

        // Caixa clara (a cor dela sobre a página, que aparece através):
        // as cores automáticas viram tinta, senão o texto sumiria.
        const seen = mixRgb(hexToRgb(theme.background), bg, alpha);
        const light = luminance(seen) > 0.45;
        const text = theme.searchText.color ? hexToRgb(theme.searchText.color) : light ? INK_RGB : null;
        setVar("--search-text-color", text && rgbCss(text));
        setVar("--search-item-color", text && rgbCss(text));
        setVar("--search-path-color", text && rgbCss(text, 0.6));
        setVar("--search-note-color", text && rgbCss(text, 0.65));
        const hint = theme.searchHint.color ? rgbCss(hexToRgb(theme.searchHint.color))
          : light ? rgbCss(INK_RGB, 0.5) : "";
        setVar("--search-hint-color", hint);
        const icon = box.icon ? rgbCss(hexToRgb(box.icon)) : light ? rgbCss(INK_RGB, 0.7) : "";
        setVar("--search-icon", icon);
        // A borda de fábrica é bem apagada (28%); uma cor escolhida aparece
        // mais, e inteira com o foco.
        const border = box.border ? hexToRgb(box.border) : null;
        setVar("--search-border", border && rgbCss(border, 0.55));
        setVar("--search-border-focus", border && rgbCss(border));
        setVar("--search-list-border", border && rgbCss(border, 0.55));

        searchAuto = {
          "searchText.color": light ? INK : "rgb(240, 245, 255)",
          "searchHint.color": light ? INK : "rgb(231, 240, 255)",
          "searchBox.icon": light ? INK : "rgb(231, 240, 255)",
          "searchBox.border": "rgb(160, 190, 255)",
          "searchBox.background": rgbCss(SEARCH_BG_RGB),
        };
      }

      // --- Marcas d'água ------------------------------------------------------
      // Uma vaga (.wm-slot) por conjunto — a marca solta e as grudadas nela
      // — e um elemento por marca (<img> ou .wm-text), guardados pelo id: o
      // tema é reaplicado a cada quadro de um arrasto de controle no
      // painel, e recriar imagens de centenas de KB a cada quadro pesaria.
      // O src só é reescrito quando a imagem muda. Tudo em vmin: o lado
      // maior de cada imagem e a letra de cada texto acompanham o lado
      // menor da tela, e as marcas ficam com a mesma presença no celular em
      // pé e no monitor.
      const wmNodes = new Map();   // id da marca → <img> ou .wm-text
      const wmShown = new Map();   // id da marca → data URL posta no src
      const wmSlots = new Map();   // id da principal → { slot, group }
      let wmTextSizes = new Map(); // id da marca de texto → { w, h } em vmin

      function isTextMark(wm) {
        return wm.kind === "text";
      }

      // Tem o que desenhar: imagem, ou texto que não seja só espaço.
      function watermarkShown(wm) {
        return wm.on && (isTextMark(wm) ? !!wm.text.trim() : !!wm.image);
      }

      function watermarkSize(wm) {
        if (isTextMark(wm)) return wmTextSizes.get(wm.id) || { w: 0, h: 0 };
        return wm.ratio >= 1
          ? { w: wm.scale, h: wm.scale / wm.ratio }
          : { w: wm.scale * wm.ratio, h: wm.scale };
      }

      // Toda a aparência de uma marca de texto. Serve ao elemento da tela,
      // ao medidor e — sem o texto — à miniatura do painel. O contorno é
      // pintado por baixo do preenchimento (paint-order), então só a metade
      // de fora aparece: daí a espessura em dobro.
      function applyWatermarkText(el, wm) {
        const s = el.style;
        s.fontFamily = FONTS[wm.font].css;
        s.fontSize = wm.size + "vmin";
        s.fontWeight = wm.bold ? "700" : "400";
        s.fontStyle = wm.italic ? "italic" : "normal";
        s.textDecoration = wm.underline ? "underline" : "none";
        s.textTransform = wm.upper ? "uppercase" : "none";
        s.letterSpacing = wm.spacing + "em";
        s.lineHeight = String(wm.lineHeight);
        s.textAlign = wm.textAlign;
        s.color = wm.color;
        s.backgroundColor = wm.bg ? rgbCss(hexToRgb(wm.bgColor), (100 - wm.bgTransparency) / 100) : "";
        s.padding = wm.bg ? wm.bgPadding + "em" : "";
        s.borderRadius = wm.bg ? wm.bgRadius + "em" : "";
        s.setProperty("-webkit-text-stroke", wm.stroke ? (wm.strokeWidth * 2) + "em " + wm.strokeColor : "");
        s.setProperty("paint-order", wm.stroke ? "stroke fill" : "");
        if (wm.shadow) {
          const rad = wm.shadowAngle * Math.PI / 180;
          const dx = Math.round(Math.cos(rad) * wm.shadowDistance * 1000) / 1000;
          const dy = Math.round(Math.sin(rad) * wm.shadowDistance * 1000) / 1000;
          s.textShadow = dx + "em " + dy + "em " + wm.shadowBlur + "em "
            + rgbCss(hexToRgb(wm.shadowColor), (100 - wm.shadowTransparency) / 100);
        } else {
          s.textShadow = "";
        }
      }

      // O tamanho de cada texto visível, em vmin, medido num elemento à
      // parte: o da tela pode estar numa vaga escondida ou girada, e aí
      // não daria para medir. Letra, espaçamento e fundo são todos em
      // vmin/em, então a medida vale para qualquer tela — só muda um fio
      // com o desenho da fonte, e por isso é refeita ao redimensionar e
      // quando uma fonte termina de chegar.
      let wmMeasure = null;
      function measureWatermarkTexts() {
        wmTextSizes = new Map();
        const texts = theme.watermarks.filter((wm) => isTextMark(wm) && watermarkShown(wm));
        if (!texts.length) return;
        if (!wmMeasure) {
          wmMeasure = document.createElement("div");
          wmMeasure.setAttribute("aria-hidden", "true");
          wmMeasure.style.cssText = "position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;";
          wmMeasure.innerHTML = '<div style="width:100vmin;height:0"></div><div class="wm-text" style="position:static"></div>';
        }
        document.body.appendChild(wmMeasure);
        const unit = wmMeasure.firstChild.getBoundingClientRect().width / 100;
        const probe = wmMeasure.lastChild;
        texts.forEach((wm) => {
          applyWatermarkText(probe, wm);
          probe.textContent = wm.text;
          const r = probe.getBoundingClientRect();
          wmTextSizes.set(wm.id, { w: r.width / unit, h: r.height / unit });
        });
        wmMeasure.remove();
      }

      // Onde fica uma grudada, a partir da caixa da marca em que ela gruda.
      // O alinhamento corre ao longo do lado: topo, centro ou base à
      // esquerda e à direita; esquerda, centro ou direita acima e abaixo.
      function attachBox(parent, wm) {
        const size = watermarkSize(wm);
        const along = (start, length, own) => wm.shift + (
          wm.align === "start" ? start
            : wm.align === "end" ? start + length - own
              : start + (length - own) / 2);
        const box = { wm: wm, x: 0, y: 0, w: size.w, h: size.h };
        if (wm.side === "left" || wm.side === "right") {
          box.x = wm.side === "right" ? parent.x + parent.w + wm.gap : parent.x - wm.gap - size.w;
          box.y = along(parent.y, parent.h, size.h);
        } else {
          box.y = wm.side === "below" ? parent.y + parent.h + wm.gap : parent.y - wm.gap - size.h;
          box.x = along(parent.x, parent.w, size.w);
        }
        return box;
      }

      // Os conjuntos, na ordem das principais na lista. Cada um traz as
      // caixas das marcas visíveis — a principal primeiro, em (0, 0). Uma
      // marca escondida some junto com as grudadas nela e não ocupa lugar.
      function watermarkGroups() {
        const children = {};
        theme.watermarks.forEach((wm) => {
          if (wm.to) (children[wm.to] = children[wm.to] || []).push(wm);
        });
        return theme.watermarks.filter((wm) => !wm.to).map((root) => {
          const boxes = [];
          const seen = new Set();
          const visit = (box) => {
            if (seen.has(box.wm.id)) return;   // defesa contra ciclo
            seen.add(box.wm.id);
            boxes.push(box);
            (children[box.wm.id] || []).forEach((child) => {
              if (watermarkShown(child)) visit(attachBox(box, child));
            });
          };
          if (watermarkShown(root)) {
            const size = watermarkSize(root);
            visit({ wm: root, x: 0, y: 0, w: size.w, h: size.h });
          }
          return { root: root, boxes: boxes };
        });
      }

      function watermarkNodeFor(wm) {
        let node = wmNodes.get(wm.id);
        if (isTextMark(wm)) {
          if (!node) {
            node = document.createElement("div");
            node.className = "wm-text";
            wmNodes.set(wm.id, node);
          }
          applyWatermarkText(node, wm);
          if (node.textContent !== wm.text) node.textContent = wm.text;
          return node;
        }
        if (!node) {
          node = document.createElement("img");
          node.className = "wm-img";
          node.alt = "";
          node.draggable = false;
          wmNodes.set(wm.id, node);
        }
        if (wmShown.get(wm.id) !== wm.image) {
          node.setAttribute("src", wm.image);
          wmShown.set(wm.id, wm.image);
        }
        return node;
      }

      function applyWatermarks() {
        const order = new Map(theme.watermarks.map((wm, i) => [wm.id, i]));
        measureWatermarkTexts();
        const groups = watermarkGroups();
        const roots = new Set(groups.map((g) => g.root.id));
        wmSlots.forEach((view, id) => {
          if (roots.has(id)) return;
          view.slot.remove();
          wmSlots.delete(id);
        });
        const placed = new Set();
        let before = watermarkEl.firstChild;
        groups.forEach((g) => {
          let view = wmSlots.get(g.root.id);
          if (!view) {
            view = { slot: document.createElement("div"), group: document.createElement("div") };
            view.slot.className = "wm-slot";
            view.group.className = "wm-group";
            view.slot.appendChild(view.group);
            wmSlots.set(g.root.id, view);
          }
          // As vagas seguem a ordem da lista, que é a ordem de pintura.
          if (view.slot !== before) watermarkEl.insertBefore(view.slot, before);
          before = view.slot.nextSibling;
          view.slot.hidden = !g.boxes.length;
          if (!g.boxes.length) return;

          const root = g.root;
          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          g.boxes.forEach((b) => {
            minX = Math.min(minX, b.x);
            minY = Math.min(minY, b.y);
            maxX = Math.max(maxX, b.x + b.w);
            maxY = Math.max(maxY, b.y + b.h);
          });
          const place = GRID_POSITIONS[root.position];
          const ss = view.slot.style;
          ss.justifyContent = place.x;
          ss.alignItems = place.y;
          ss.padding = root.margin + "px";
          const gs = view.group.style;
          gs.width = (maxX - minX) + "vmin";
          gs.height = (maxY - minY) + "vmin";
          gs.opacity = String((100 - root.transparency) / 100);
          // O conjunto gira em volta do centro da principal, que está em
          // (0, 0); o ajuste fino desloca tudo depois do giro.
          const rootBox = g.boxes[0];
