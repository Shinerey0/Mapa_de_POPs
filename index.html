      // --- Painel de aparência ---------------------------------------------
      // Cada linha é um <input type="color"> ligado a uma chave do tema.
      // A prévia é imediata (evento "input") e a gravação acontece junto —
      // o tema é pequeno e escrever no localStorage a cada arrasto do
      // seletor não pesa.
      // ---------------------------------------------------------------------
      // `changed` diz se a cor está fora do padrão: é isso que habilita o
      // botão de restaurar. O botão existe sempre, só desabilitado, para a
      // linha não mudar de largura quando a cor volta ao padrão.
      function colorRowMarkup(id, name, value, changed) {
        return `
          <div class="dev-color-row">
            <span class="dev-color-name">${escapeHtml(name)}</span>
            <button type="button" class="dev-reset-btn" data-reset="${id}"${changed ? "" : " disabled"}>Padrão</button>
            <input type="color" class="dev-color-swatch" id="${id}" value="${value}" aria-label="${escapeHtml(name)}" />
          </div>
        `;
      }

      function renderThemeForm() {
        const sectors = treeData.root.children;
        const branchRows = sectors.length
          ? sectors.map((sector) => {
              const current = theme.branches[sector.id];
              const shown = current || rgbToHex(parseRgbString(paletteForSector(sector).bg));
              return colorRowMarkup(
                "theme-branch-" + sector.id,
                shortLabel(sector, 28),
                shown,
                !!current
              );
            }).join("")
          : `<p class="dev-data-hint">O mapa ainda não tem galhos.</p>`;

        devModalBody.innerHTML = `
          <h2 id="dev-modal-title" class="dev-modal-title">Aparência do mapa</h2>
          <p class="dev-data-hint">As cores valem para todo mundo que abrir esta página e viajam junto nas exportações.</p>

          <p class="dev-section-title">Página</p>
          ${colorRowMarkup("theme-background", "Fundo", theme.background, theme.background !== DEFAULT_THEME.background)}
          ${colorRowMarkup("theme-line", "Linhas entre os nós", theme.line, theme.line !== DEFAULT_THEME.line)}

          <p class="dev-section-title">Tronco</p>
          ${colorRowMarkup("theme-core", "Cor inicial", theme.core, theme.core !== DEFAULT_THEME.core)}
          ${colorRowMarkup("theme-coreEnd", "Cor final", theme.coreEnd, theme.coreEnd !== DEFAULT_THEME.coreEnd)}

          <p class="dev-section-title">Círculos decorativos</p>
          <label class="dev-check">
            <input type="checkbox" id="theme-blobs" ${theme.blobs ? "checked" : ""} />
            Mostrar os dois borrões de fundo
          </label>
          ${colorRowMarkup("theme-blobA", "Círculo superior", theme.blobA, theme.blobA !== DEFAULT_THEME.blobA)}
          ${colorRowMarkup("theme-blobB", "Círculo inferior", theme.blobB, theme.blobB !== DEFAULT_THEME.blobB)}

          <p class="dev-section-title">Galhos</p>
          <p class="dev-data-hint" style="margin:0 0 0.2rem;">A cor de um galho vale para todos os seus nós e subnós, menos onde um nó tiver cor própria.</p>
          <div class="dev-branch-list">${branchRows}</div>

          <button type="button" id="theme-reset-all" class="dev-btn dev-btn-ghost" style="margin-top:1rem;">Restaurar todas as cores</button>
        `;

        // Chaves simples do tema: o id do input é "theme-" + a chave.
        ["background", "line", "core", "coreEnd", "blobA", "blobB"].forEach((key) => {
          const input = document.getElementById("theme-" + key);
          input.addEventListener("input", () => {
            theme[key] = input.value;
            applyTheme();
            saveTheme();
            refreshResetButton(key, theme[key] !== DEFAULT_THEME[key]);
          });
        });

        const blobsCheck = document.getElementById("theme-blobs");
        blobsCheck.addEventListener("change", () => {
          theme.blobs = blobsCheck.checked;
          applyTheme();
          saveTheme();
        });

        sectors.forEach((sector) => {
          const input = document.getElementById("theme-branch-" + sector.id);
          if (!input) return;
          input.addEventListener("input", () => {
            theme.branches[sector.id] = input.value;
            applyTheme();
            saveTheme();
            refreshResetButton("branch-" + sector.id, true);
          });
        });

        document.getElementById("theme-reset-all").addEventListener("click", () => {
          theme = Object.assign({}, DEFAULT_THEME, { branches: {} });
          applyTheme();
          saveTheme();
          renderThemeForm();
          status.textContent = "Cores restauradas para o padrão.";
        });
      }

      function refreshResetButton(key, enabled) {
        const btn = devModalBody.querySelector('[data-reset="theme-' + key + '"]');
        if (btn) btn.disabled = !enabled;
      }

      // As cores padrão da PALETTE vêm escritas como "rgb(r, g, b)"; o
      // <input type="color"> só entende hexadecimal.
      function parseRgbString(value) {
        const match = /rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i.exec(String(value));
        if (!match) return hexToRgb(value);
        return { r: +match[1], g: +match[2], b: +match[3] };
      }

      // Delegação registrada uma única vez: renderThemeForm() se redesenha a
      // cada restauração, e prender o listener lá dentro iria empilhando uma
      // cópia nova a cada passagem.
      devModalBody.addEventListener("click", (event) => {
        const btn = event.target.closest("[data-reset]");
        if (!btn) return;
        const key = btn.dataset.reset.replace(/^theme-/, "");
        if (key.indexOf("branch-") === 0) {
          delete theme.branches[key.slice("branch-".length)];
        } else {
          theme[key] = DEFAULT_THEME[key];
        }
        applyTheme();
        saveTheme();
        renderThemeForm();   // redesenha para o seletor mostrar o valor padrão
      });

      themeToggle.addEventListener("click", () => {
        if (!devUnlocked) return;
        renderThemeForm();
        openDevOverlay();
      });

      // --- Carregamento -----------------------------------------------------
      // Ordem: um seed embutido ainda não adotado vence (é um arquivo
      // recém-exportado, aberto talvez numa máquina que já tinha outro mapa
      // salvo); fora isso vale o rascunho do localStorage. Depois de adotado
      // uma vez, o seed sai da frente e as edições locais é que mandam.
      const seedEnvelope = readSeed();
      const seedRoot = readEnvelope(seedEnvelope);
      const seedStampValue = seedEnvelope && seedEnvelope.exportedAt
        ? String(seedEnvelope.exportedAt)
        : "sem-carimbo";
      let seedAdopted = false;
      let seedTheme = null;

      if (seedRoot) {
        let lastSeed = null;
        try {
          lastSeed = localStorage.getItem(SEED_STAMP_KEY);
        } catch (e) {
          lastSeed = null;
        }
        if (seedStampValue !== lastSeed) {
          adoptRoot(seedRoot);
          seedAdopted = true;
          seedTheme = seedEnvelope && seedEnvelope.theme ? seedEnvelope.theme : null;
          saveState();
          try {
            localStorage.setItem(SEED_STAMP_KEY, seedStampValue);
          } catch (e) {
            // localStorage indisponível — o seed será readotado a cada abertura,
            // que é o comportamento certo quando não há onde guardar edições.
          }
        }
      }

      if (!seedAdopted) {
        const saved = readEnvelope(loadState());
        if (saved) adoptRoot(saved);
      }
      normalizeTypes(treeData.root);

      // O tema segue a mesma ordem da árvore: o que veio no arquivo aberto
      // manda sobre o rascunho local; sem nenhum dos dois, valem as cores
      // de fábrica. applyTheme() roda depois do render() porque precisa dos
      // nós já montados para repintá-los.
      if (seedTheme) {
        theme = sanitizeTheme(seedTheme);
        saveTheme();
      } else {
        const savedTheme = loadTheme();
        if (savedTheme) theme = savedTheme;
      }

      // Antes do primeiro render: as medidas decidem a largura das caixas,
      // e medir com o jogo errado obrigaria a desenhar duas vezes.
      setViewportUnit();
      applyMetrics();

      render();
      updateVisibility();
      applyTheme();
      fitCamera(0);
      remeasureOnFontsReady();
    });
  </script>

</body></html>
