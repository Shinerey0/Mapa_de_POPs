      dataToggle.addEventListener("click", () => {
        if (!devUnlocked) return;
        renderDataForm();
        openDevOverlay();
      });

      // --- Painel de aparência ---------------------------------------------
      // Uma aba por assunto. Todo controle declara em data-bind o caminho da
      // chave do tema que ele edita ("coreText.size", "branches.<id>"…), e
      // um só punhado de listeners delegados, registrados uma vez, cuida de
      // todos: lê o valor, grava no tema e agenda a repintura. A prévia é
      // imediata.
      //
      // Um "input" NUNCA redesenha o painel: recriar o <input type="color">
      // no meio da escolha fecharia o seletor nativo. O que precisa
      // acompanhar (leituras, botões de restaurar, amostras de texto) é
      // atualizado no lugar, por refreshThemeWidgets(). Só cliques —
      // restaurar, trocar de aba, enviar imagem — redesenham.
      // ---------------------------------------------------------------------
      const THEME_TABS = [
        { id: "cores", label: "Cores" },
        { id: "textos", label: "Textos" },
        { id: "tronco", label: "Tronco" },
        { id: "titulo", label: "Título" },
        { id: "pesquisa", label: "Pesquisa" },
        { id: "marca", label: "Marca d'água" },
        { id: "tela", label: "Tela" },
      ];

      // O que "Restaurar o padrão desta aba" devolve ao padrão. As imagens
      // das marcas d'água ficam de fora: para tirá-las existe o "Remover".
      const TAB_KEYS = {
        cores: ["background", "line", "blobA", "blobB", "blobs", "branches"],
        textos: ["nodeText", "subText", "branchText"],
        tronco: ["core", "coreEnd", "coreText", "coreShadow"],
        titulo: ["title", "subtitle"],
        pesquisa: ["searchBox", "searchText", "searchHint"],
        marca: ["watermarks"],
        tela: ["hud"],
      };

      let themeTab = "cores";

      // Caminho de uma chave do tema. As partes são codificadas porque o id
      // de um galho vira parte do caminho, e um id com ponto o quebraria.
      function keyPath() {
        return Array.prototype.map.call(arguments, (part) =>
          encodeURIComponent(part).replace(/\./g, "%2E")).join(".");
      }

      function pathParts(path) {
        return String(path).split(".").map(decodeURIComponent);
      }

      function getIn(obj, parts) {
        return parts.reduce(
          (o, key) => (o && typeof o === "object" && hasOwn(o, key) ? o[key] : undefined),
          obj
        );
      }

      function getPath(obj, path) {
        return getIn(obj, pathParts(path));
      }

      // O id de um galho vem da árvore, que pode ter vindo de um arquivo:
      // um "__proto__" ali escreveria no protótipo de todos os objetos.
      function setPath(obj, path, value) {
        const parts = pathParts(path);
        if (parts.some((p) => p === "__proto__" || p === "constructor" || p === "prototype")) return;
        const last = parts.pop();
        const target = parts.reduce((o, key) => {
          if (!hasOwn(o, key) || !o[key] || typeof o[key] !== "object") o[key] = {};
          return o[key];
        }, obj);
        target[last] = value;
      }

      // O padrão de uma chave. As das marcas d'água ("watermarks.2.color")
      // não moram em DEFAULT_THEME: vêm dos padrões da espécie da marca.
      function defaultFor(path) {
        const parts = pathParts(path);
        if (parts[0] === "watermarks") {
          const wm = getIn(theme, parts.slice(0, 2));
          return wm ? watermarkDefaults(wm.kind)[parts[2]] : undefined;
        }
        return getIn(DEFAULT_THEME, parts);
      }

      function isDefaultPath(path) {
        const current = getPath(theme, path);
        const fallback = defaultFor(path);
        if (fallback === undefined) {
          // Chave de um galho só: o padrão é não existir.
          return current === undefined || current === ""
            || (typeof current === "object" && !Object.keys(current).length);
        }
        return JSON.stringify(current) === JSON.stringify(fallback);
      }

      function resetPath(path) {
        const fallback = defaultFor(path);
        if (fallback !== undefined) {
          setPath(theme, path, JSON.parse(JSON.stringify(fallback)));
          return;
        }
        const parts = pathParts(path);
        const last = parts.pop();
        const parent = getIn(theme, parts);
        if (parent && typeof parent === "object" && hasOwn(parent, last)) delete parent[last];
      }

      // Um botão de restaurar pode cuidar de várias chaves, separadas por
      // espaço (o espaço nunca aparece num caminho: ele é codificado).
      function isDefaultPaths(list) {
        return list.split(" ").every(isDefaultPath);
      }

      function resetPaths(list) {
        list.split(" ").forEach(resetPath);
      }

      // Número à brasileira, com vírgula e sem casas à toa.
      function decimal(value) {
        return String(Math.round(value * 100) / 100).replace(".", ",");
      }

      const ARROWS = ["→", "↘", "↓", "↙", "←", "↖", "↑", "↗"];

      // Como cada controle deslizante mostra o próprio valor. Espaço entre
      // letras sai em % do tamanho da letra, que é o que o em quer dizer.
      const READOUTS = {
        "coreText.size": (v) => decimal(v) + "px",
        "coreText.spacing": (v) => Math.round(v * 100) + "%",
        "coreText.lineHeight": (v) => decimal(v) + "×",
        "coreShadow.transparency": (v) => v + "%",
        "coreShadow.blur": (v) => v + "px",
        "coreShadow.distance": (v) => v + "px",
        "coreShadow.angle": (v) => ARROWS[Math.round(v / 45) % 8] + " " + v + "°",
        "title.size": (v) => decimal(v) + "px",
        "title.spacing": (v) => Math.round(v * 100) + "%",
        "subtitle.size": (v) => decimal(v) + "px",
        "subtitle.spacing": (v) => Math.round(v * 100) + "%",
        "subtitle.gap": (v) => v + "px",
        "searchText.size": (v) => decimal(v) + "px",
        "searchText.spacing": (v) => Math.round(v * 100) + "%",
        "searchHint.size": (v) => decimal(v) + "px",
        "searchHint.spacing": (v) => Math.round(v * 100) + "%",
        "searchBox.transparency": (v) => v + "%",
      };
      HUD_ORDER.forEach((key) => {
        READOUTS["hud." + key + ".offset"] = (v) => "+" + v + "px";
        READOUTS["hud." + key + ".scale"] = (v) => v + "%";
      });

      // Os de cada marca d'água recebem também a própria marca: o
      // deslocamento de uma grudada corre na vertical ou na horizontal
      // conforme o lado em que ela gruda.
      function signedPercent(v, minus, plus) {
        return (v > 0 ? plus + " " : v < 0 ? minus + " " : "") + decimal(Math.abs(v)) + "%";
      }
      const WATERMARK_READOUTS = {
        transparency: (v) => v + "%",
        scale: (v) => v + "%",
        margin: (v) => v + "px",
        rotation: (v) => v + "°",
        dx: (v) => signedPercent(v, "←", "→"),
        dy: (v) => signedPercent(v, "↑", "↓"),
        gap: (v) => decimal(v) + "%",
        shift: (v, wm) => (wm.side === "left" || wm.side === "right"
          ? signedPercent(v, "↑", "↓")
          : signedPercent(v, "←", "→")),
        // Texto: a letra em % do lado menor da tela; o resto, em % da
        // própria letra (é o que o em quer dizer).
        size: (v) => decimal(v) + "%",
        spacing: (v) => Math.round(v * 100) + "%",
        lineHeight: (v) => decimal(v) + "×",
        bgTransparency: (v) => v + "%",
        bgPadding: (v) => Math.round(v * 100) + "%",
        bgRadius: (v) => Math.round(v * 100) + "%",
        strokeWidth: (v) => Math.round(v * 100) + "%",
        shadowTransparency: (v) => v + "%",
        shadowBlur: (v) => Math.round(v * 100) + "%",
        shadowDistance: (v) => Math.round(v * 100) + "%",
        shadowAngle: (v) => ARROWS[Math.round(v / 45) % 8] + " " + v + "°",
      };

      function readout(path) {
        const parts = pathParts(path);
        const value = getIn(theme, parts);
        return parts[0] === "watermarks"
          ? WATERMARK_READOUTS[parts[2]](value, getIn(theme, parts.slice(0, 2)))
          : READOUTS[path](value);
      }

      // Faixa de um controle deslizante. Os elementos presos à tela dividem
      // as mesmas faixas (LIMITS.hud), qualquer que seja o elemento, e as
      // marcas d'água, as de LIMITS.watermark.
      function limitsFor(path) {
        const parts = pathParts(path);
        if (parts[0] === "hud") return LIMITS.hud[parts[2]];
        if (parts[0] === "watermarks") return LIMITS.watermark[parts[2]];
        return LIMITS[parts[0]][parts[1]];
      }

      const ALIGN_ICONS = {
        left: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"/></svg>',
        center: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M5.5 18h13"/></svg>',
        right: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M10 12h10M7 18h13"/></svg>',
      };

      // As cores padrão da PALETTE vêm escritas como "rgb(r, g, b)"; o
      // <input type="color"> só entende hexadecimal.
      function parseRgbString(value) {
        const match = /rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i.exec(String(value));
        if (!match) return hexToRgb(value);
        return { r: +match[1], g: +match[2], b: +match[3] };
      }

      function toHex(css) {
        return rgbToHex(parseRgbString(css));
      }

      // Chaves de cor em que vazio quer dizer "automática". O seletor delas
      // mostra a cor que está valendo, e não o preto de um valor vazio.
      const AUTO_COLOR_PATHS = [
        "coreText.color", "title.color", "subtitle.color",
        "searchText.color", "searchHint.color", "searchBox.background", "searchBox.border", "searchBox.icon",
      ];

      function effectiveHex(path) {
        if (path === "coreText.color") {
          return toHex(textOver(mixRgb(hexToRgb(theme.core), hexToRgb(theme.coreEnd), 0.5)));
        }
        if (path === "title.color") return toHex(getComputedStyle(titleEl).color);
        if (path === "subtitle.color") return toHex(getComputedStyle(subtitleEl).color);
        if (hasOwn(searchAuto, path)) return toHex(searchAuto[path]);
        return "#000000";
      }

      // Fundo e texto de uma amostra "Aa". As do mapa inteiro usam as cores
      // do primeiro galho como exemplo de fundo; as de um galho, as dele.
      // O fundo é o que o galho mostra de fato: se o nó do setor tem cor
      // própria, é ela que vale para ele e para a folhagem dele — e é contra
      // ela que o contraste do texto tem de ser visto.
      function chipLook(path) {
        const parts = pathParts(path);
        const sub = parts[0] === "subText" || parts[parts.length - 1] === "sub";
        const perBranch = parts[0] === "branchText";
        const sectors = treeData.root.children;
        const sector = perBranch
          ? sectors.find((s) => s.id === parts[1]) || null
          : sectors[0] || null;
        const palette = !sector ? PALETTE[0]
          : sector.color ? derivePalette(sector.color) : paletteForSector(sector);
        const own = perBranch ? getIn(theme.branchText, [parts[1], sub ? "sub" : "node"]) : "";
        const global = sub ? theme.subText : theme.nodeText;
        return {
          bg: sub ? palette.subBg : palette.bg,
          fg: own || global || (sub ? palette.subFg : palette.fg),
        };
      }

      // --- Peças de marcação ------------------------------------------------
      function bindId(path) {
        return "tb-" + String(path).replace(/[^a-z0-9_-]/gi, "-");
      }

      function sectionTitle(text) {
        return `<p class="dev-section-title">${escapeHtml(text)}</p>`;
      }

      // O botão existe sempre, só desabilitado, para a linha não mudar de
      // largura quando o valor volta ao padrão.
      function resetButtonMarkup(paths, label) {
        return `<button type="button" class="dev-reset-btn" data-reset="${escapeHtml(paths)}"${isDefaultPaths(paths) ? " disabled" : ""}>${label || "Padrão"}</button>`;
      }

      function colorRowMarkup(path, name, shown, resetLabel) {
        return `
          <div class="dev-color-row">
            <label class="dev-color-name" for="${bindId(path)}">${escapeHtml(name)}</label>
            ${resetButtonMarkup(path, resetLabel)}
            <input type="color" class="dev-color-swatch" id="${bindId(path)}" data-bind="${escapeHtml(path)}" value="${shown}" />
          </div>
        `;
      }

      function rangeRowMarkup(path, name) {
        const lim = limitsFor(path);
        const value = getPath(theme, path);
        return `
          <div class="dev-range-row">
            <label for="${bindId(path)}">${escapeHtml(name)}</label>
            <input type="range" class="dev-range" id="${bindId(path)}" data-bind="${escapeHtml(path)}" min="${lim[0]}" max="${lim[1]}" step="${lim[2]}" value="${value}" />
            <output class="dev-range-value" data-out="${escapeHtml(path)}" for="${bindId(path)}">${readout(path)}</output>
          </div>
        `;
      }

      // Grade 3×3 de posições (marca d'água e elementos presos à tela).
      function positionGridMarkup(path, groupLabel) {
        const current = getPath(theme, path);
        const buttons = Object.keys(GRID_POSITIONS).map((key) =>
          `<button type="button" class="dev-pos-btn" data-bind="${escapeHtml(path)}" data-value="${key}" aria-pressed="${current === key}" title="${escapeHtml(GRID_POSITIONS[key].label)}" aria-label="${escapeHtml(GRID_POSITIONS[key].label)}"></button>`
        ).join("");
        return `
          <div class="dev-field-row">
            <span class="dev-color-name">Posição</span>
            <div class="dev-pos-grid" role="group" aria-label="${escapeHtml(groupLabel)}">${buttons}</div>
          </div>
        `;
      }

      function checkRowMarkup(path, text) {
        return `
          <label class="dev-check">
            <input type="checkbox" data-bind="${escapeHtml(path)}"${getPath(theme, path) ? " checked" : ""} />
            ${escapeHtml(text)}
          </label>
        `;
      }

      // Cada opção é escrita na própria fonte (o Chrome e o Firefox do
      // computador mostram; o celular ignora e usa a lista do sistema). As
      // do Google Fonts vêm num grupo à parte: só elas dependem de internet.
      function fontRowMarkup(path) {
        const current = getPath(theme, path);
        const option = (key) =>
          `<option value="${key}"${key === current ? " selected" : ""} style="font-family:${escapeHtml(FONTS[key].css)}">${escapeHtml(FONTS[key].label)}</option>`;
        const keys = Object.keys(FONTS);
        const options = `
          <optgroup label="Da página e do sistema">${keys.filter((k) => !FONTS[k].google).map(option).join("")}</optgroup>
          <optgroup label="Google Fonts (baixadas da internet)">${keys.filter((k) => FONTS[k].google).map(option).join("")}</optgroup>
        `;
        return `
          <div class="dev-field-row">
            <label class="dev-color-name" for="${bindId(path)}">Fonte</label>
            <select class="dev-input dev-select" id="${bindId(path)}" data-bind="${escapeHtml(path)}">${options}</select>
          </div>
        `;
      }

      // Botão de estado: sem `value`, liga e desliga um booleano; com
      // `value`, escolhe aquele valor entre os do grupo. aria-pressed é o
      // estado — para o leitor de tela e para o CSS. Em `opts`: `text` para
      // um botão com palavra em vez de ícone, e `rerender` quando a escolha
      // muda outros controles da aba (o painel se redesenha depois dela).
      function pressButtonMarkup(path, value, content, title, opts) {
        const o = opts || {};
        const current = getPath(theme, path);
        const on = value === undefined ? !!current : current === value;
        const valueAttr = value === undefined ? "" : ` data-value="${escapeHtml(value)}"`;
        const extra = (o.rerender ? " data-rerender" : "");
        return `<button type="button" class="dev-seg${o.text ? " is-text" : ""}" data-bind="${escapeHtml(path)}"${valueAttr}${extra} aria-pressed="${on}" title="${escapeHtml(title)}" aria-label="${escapeHtml(title)}">${content}</button>`;
      }

      // Fonte, estilo, tamanho, cor e espaçamento de um texto formatado por
      // inteiro — o mesmo bloco no título, no subtítulo e na pesquisa.
      function textControlsMarkup(group, what) {
        return `
          ${fontRowMarkup(group + ".font")}
          <div class="dev-field-row">
            <span class="dev-color-name">Estilo</span>
            <div class="dev-seg-group" role="group" aria-label="${escapeHtml("Estilo — " + what)}">
              ${pressButtonMarkup(group + ".bold", undefined, "<b>N</b>", "Negrito")}
              ${pressButtonMarkup(group + ".italic", undefined, "<i>I</i>", "Itálico")}
              ${pressButtonMarkup(group + ".upper", undefined, "AA", "Tudo em maiúsculas")}
            </div>
          </div>
          ${rangeRowMarkup(group + ".size", "Tamanho")}
          ${colorRowMarkup(group + ".color", "Cor", theme[group].color || effectiveHex(group + ".color"), "Automática")}
          ${rangeRowMarkup(group + ".spacing", "Espaço entre letras")}
        `;
      }

      function chipMarkup(path, name, sub) {
        const look = chipLook(path);
        return `<span class="dev-text-chip${sub ? " is-sub" : ""}" data-chip="${escapeHtml(path)}" style="background:${look.bg};color:${look.fg}"><span aria-hidden="true">Aa</span><input type="color" class="dev-chip-input" data-bind="${escapeHtml(path)}" value="${toHex(look.fg)}" aria-label="${escapeHtml(name)}" /></span>`;
      }

      // Uma linha da aba Textos: nome, restaurar, amostra de nó e de subnó.
      function textRowMarkup(name, resetPathList, nodePath, subPath, global) {
        return `
          <div class="dev-color-row${global ? " is-global" : ""}">
            <span class="dev-color-name">${escapeHtml(name)}</span>
            ${resetButtonMarkup(resetPathList, "Automática")}
            ${chipMarkup(nodePath, "Texto dos nós — " + name, false)}
            ${chipMarkup(subPath, "Texto dos subnós — " + name, true)}
          </div>
        `;
      }

      // --- Abas ---------------------------------------------------------------
      function tabCoresMarkup() {
        const sectors = treeData.root.children;
        const branchRows = sectors.length
          ? sectors.map((sector) => colorRowMarkup(
              keyPath("branches", sector.id),
              shortLabel(sector, 28),
              getIn(theme.branches, [sector.id]) || toHex(paletteForSector(sector).bg)
            )).join("")
          : `<p class="dev-data-hint">O mapa ainda não tem galhos.</p>`;
        return `
          ${sectionTitle("Página")}
          ${colorRowMarkup("background", "Fundo", theme.background)}
          ${colorRowMarkup("line", "Linhas entre os nós", theme.line)}

          ${sectionTitle("Círculos decorativos")}
          ${checkRowMarkup("blobs", "Mostrar os dois borrões de fundo")}
          ${colorRowMarkup("blobA", "Círculo superior", theme.blobA)}
          ${colorRowMarkup("blobB", "Círculo inferior", theme.blobB)}

          ${sectionTitle("Galhos")}
          <p class="dev-data-hint" style="margin:0 0 0.2rem;">A cor de um galho vale para todos os seus nós e subnós, menos onde um nó tiver cor própria.</p>
          <div class="dev-branch-list">${branchRows}</div>
        `;
      }

      function tabTextosMarkup() {
        const rows = treeData.root.children.map((sector) => {
          const name = shortLabel(sector, 24);
          return textRowMarkup(
            name,
            keyPath("branchText", sector.id),
            keyPath("branchText", sector.id, "node"),
            keyPath("branchText", sector.id, "sub")
          );
        }).join("");
        return `
          <p class="dev-data-hint">Vale a cor mais específica: a do próprio nó (no lápis dele), depois a do galho, depois a do mapa inteiro. "Automática" escolhe entre branco e azul-escuro pelo contraste com o fundo, como antes. Clique numa amostra "Aa" para escolher a cor.</p>
          <div class="dev-branch-list is-tall">
            <div class="dev-chip-head" aria-hidden="true"><span>Nós</span><span>Subnós</span></div>
            ${textRowMarkup("Mapa inteiro", "nodeText subText", "nodeText", "subText", true)}
            ${rows || `<p class="dev-data-hint">O mapa ainda não tem galhos.</p>`}
          </div>
        `;
      }

      function tabTroncoMarkup() {
        return `
          ${sectionTitle("Texto")}
          <label class="dev-label">Texto do tronco
            <textarea id="theme-core-label" class="dev-input" rows="2" maxlength="${NODE_CHAR_LIMIT}">${escapeHtml(treeData.root.label)}</textarea>
          </label>
          <p class="dev-data-hint" style="margin:0.35rem 0 0.2rem;">Enter quebra a linha. Se o texto não couber, o círculo cresce para acomodá-lo.</p>
          ${fontRowMarkup("coreText.font")}
          <div class="dev-field-row">
            <span class="dev-color-name">Estilo</span>
            <div class="dev-seg-group" role="group" aria-label="Estilo do texto">
              ${pressButtonMarkup("coreText.bold", undefined, "<b>N</b>", "Negrito")}
              ${pressButtonMarkup("coreText.italic", undefined, "<i>I</i>", "Itálico")}
              ${pressButtonMarkup("coreText.underline", undefined, "<u>S</u>", "Sublinhado")}
            </div>
            <div class="dev-seg-group" role="group" aria-label="Alinhamento">
              ${pressButtonMarkup("coreText.align", "left", ALIGN_ICONS.left, "Alinhar à esquerda")}
              ${pressButtonMarkup("coreText.align", "center", ALIGN_ICONS.center, "Centralizar")}
              ${pressButtonMarkup("coreText.align", "right", ALIGN_ICONS.right, "Alinhar à direita")}
            </div>
          </div>
          ${rangeRowMarkup("coreText.size", "Tamanho")}
          ${colorRowMarkup("coreText.color", "Cor do texto", theme.coreText.color || effectiveHex("coreText.color"), "Automática")}
          ${rangeRowMarkup("coreText.spacing", "Espaço entre letras")}
          ${rangeRowMarkup("coreText.lineHeight", "Espaço entre linhas")}

          ${sectionTitle("Círculo")}
          ${colorRowMarkup("core", "Cor inicial", theme.core)}
          ${colorRowMarkup("coreEnd", "Cor final", theme.coreEnd)}

          ${sectionTitle("Sombra")}
          ${checkRowMarkup("coreShadow.on", "Mostrar sombra")}
          ${colorRowMarkup("coreShadow.color", "Cor da sombra", theme.coreShadow.color)}
          ${rangeRowMarkup("coreShadow.transparency", "Transparência")}
          ${rangeRowMarkup("coreShadow.blur", "Desfoque")}
          ${rangeRowMarkup("coreShadow.distance", "Distância")}
          ${rangeRowMarkup("coreShadow.angle", "Direção")}
          <p class="dev-data-hint" style="margin:0.2rem 0 0;">Para um brilho em volta do círculo, use uma cor clara, distância 0 e bastante desfoque.</p>
        `;
      }

      function tabTituloMarkup() {
        return `
          <label class="dev-label">Texto
            <input id="theme-title-text" class="dev-input" type="text" maxlength="${TITLE_CHAR_LIMIT}" data-bind="title.text" value="${escapeHtml(theme.title.text)}" />
          </label>
          <p class="dev-data-hint" style="margin:0.35rem 0 0.2rem;">Posição, distância da borda e mostrar ou esconder ficam na aba Tela, e valem para o título e o subtítulo juntos.</p>
          ${textControlsMarkup("title", "título")}

          ${sectionTitle("Subtítulo")}
          <label class="dev-label">Texto
            <input id="theme-subtitle-text" class="dev-input" type="text" maxlength="${SUBTITLE_CHAR_LIMIT}" data-bind="subtitle.text" value="${escapeHtml(theme.subtitle.text)}" placeholder="Vazio = sem subtítulo" />
          </label>
          <div class="dev-field-row" style="margin-top:0.3rem;">
            <span class="dev-color-name">Lugar</span>
            <div class="dev-seg-group" role="group" aria-label="Lugar do subtítulo">
              ${pressButtonMarkup("subtitle.place", "above", "Acima", "Acima do título", { text: true })}
              ${pressButtonMarkup("subtitle.place", "below", "Abaixo", "Abaixo do título", { text: true })}
            </div>
          </div>
          ${rangeRowMarkup("subtitle.gap", "Distância do título")}
          ${textControlsMarkup("subtitle", "subtítulo")}
        `;
      }

      function tabPesquisaMarkup() {
        const box = theme.searchBox;
        return `
          <p class="dev-data-hint">Posição, tamanho da caixa e mostrar ou esconder ficam na aba Tela.</p>
          ${sectionTitle("Texto de exemplo")}
          <label class="dev-label">Texto
            <input id="theme-search-hint" class="dev-input" type="text" maxlength="${SEARCH_HINT_LIMIT}" data-bind="searchBox.placeholder" value="${escapeHtml(box.placeholder)}" />
          </label>
          <p class="dev-data-hint" style="margin:0.35rem 0 0.2rem;">Aparece enquanto a caixa está vazia.</p>
          ${textControlsMarkup("searchHint", "texto de exemplo")}

          ${sectionTitle("Texto digitado")}
          <p class="dev-data-hint" style="margin:0 0 0.2rem;">A lista de resultados segue esta formatação (nós continuam em negrito, para se distinguirem dos subnós).</p>
          ${textControlsMarkup("searchText", "texto digitado")}

          ${sectionTitle("Caixa")}
          ${colorRowMarkup("searchBox.background", "Fundo", box.background || effectiveHex("searchBox.background"))}
          ${rangeRowMarkup("searchBox.transparency", "Transparência do fundo")}
          ${colorRowMarkup("searchBox.border", "Borda", box.border || effectiveHex("searchBox.border"))}
          ${colorRowMarkup("searchBox.icon", "Ícone da lupa", box.icon || effectiveHex("searchBox.icon"), "Automática")}
          <p class="dev-data-hint" style="margin:0.2rem 0 0;">Com um fundo claro, as cores automáticas do texto e do ícone escurecem sozinhas. No celular a letra da caixa nunca fica menor que 16px: com menos que isso, o iPhone amplia a tela ao tocar nela.</p>
        `;
      }

      // --- Aba Marca d'água -------------------------------------------------
      // Uma lista das marcas e, embaixo, o editor da escolhida (wmSelected).
      // Os controles apontam para a posição da marca na lista
      // ("watermarks.2.scale"): mover ou apagar uma marca redesenha o
      // painel, e os caminhos saem de novo.
      let wmSelected = "";

      function watermarkById(id) {
        return theme.watermarks.find((wm) => wm.id === id) || null;
      }

      // Sem nome dado, um texto se apresenta pela primeira linha dele.
      function watermarkName(wm) {
        if (wm.name) return wm.name;
        if (isTextMark(wm)) {
          const line = wm.text.split("\n").map((l) => l.trim()).find(Boolean) || "";
          if (!line) return "Texto vazio";
          return "“" + (line.length > 28 ? line.slice(0, 27) + "…" : line) + "”";
        }
        return "Marca " + (theme.watermarks.indexOf(wm) + 1);
      }

      // Seções recolhíveis do editor de texto (fundo, contorno, sombra) que
      // estão abertas. Vale para todas as marcas e sobrevive aos redesenhos.
      const wmFolds = new Set();

      // A principal do conjunto: a solta no começo da corrente de grudadas.
      function watermarkRootOf(wm) {
        const seen = new Set();
        let cur = wm;
        while (cur.to && !seen.has(cur.id)) {
          seen.add(cur.id);
          const up = watermarkById(cur.to);
          if (!up) break;
          cur = up;
        }
        return cur;
      }

      // A marca e todas as que dependem dela (grudadas nela, nas grudadas
      // nela...): nenhuma pode virar a principal dela, ou o conjunto
      // grudaria em si mesmo.
      function watermarkFamily(id) {
        const family = new Set([id]);
        let grew = true;
        while (grew) {
          grew = false;
          theme.watermarks.forEach((wm) => {
            if (wm.to && family.has(wm.to) && !family.has(wm.id)) {
              family.add(wm.id);
              grew = true;
            }
          });
        }
        return family;
      }

      const SIDE_LABELS = { above: "acima", below: "abaixo", left: "à esquerda", right: "à direita" };

      // Onde a marca está, numa linha curta: é o que a lista mostra.
      function watermarkWhere(wm) {
        const hidden = wm.on ? "" : " · escondida";
        if (!wm.to) return "Solta · " + GRID_POSITIONS[wm.position].label.toLowerCase() + hidden;
        const parent = watermarkById(wm.to);
        return "Grudada " + SIDE_LABELS[wm.side] + " de " + (parent ? watermarkName(parent) : "?") + hidden;
      }

      // A miniatura de um texto é um "Aa" na fonte, no estilo e nas cores
      // dele (paintTextThumb); a de uma imagem recebe o src depois.
      function watermarkThumbMarkup(wm) {
        if (isTextMark(wm)) {
          return `<span class="dev-wm-thumb is-text" data-wm-text-thumb="${escapeHtml(wm.id)}" aria-hidden="true">Aa</span>`;
        }
        return `<span class="dev-wm-thumb"><img data-wm-thumb="${escapeHtml(wm.id)}" alt="" /></span>`;
      }

      function paintTextThumb(el, wm) {
        const s = el.style;
        s.fontFamily = FONTS[wm.font].css;
        s.fontWeight = wm.bold ? "700" : "400";
        s.fontStyle = wm.italic ? "italic" : "normal";
        s.color = wm.color;
        s.backgroundColor = wm.bg ? wm.bgColor : "";
        s.setProperty("-webkit-text-stroke", wm.stroke ? "1px " + wm.strokeColor : "");
      }

      function tabMarcaMarkup() {
        const list = theme.watermarks;
        const picker = `<input type="file" id="theme-wm-file" class="dev-file-input" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml" />`;
        const full = list.length >= WATERMARK_MAX ? " disabled" : "";
        const addButtons = `
          <div class="dev-inline-actions">
            <button type="button" class="dev-btn ${list.length ? "dev-btn-ghost" : "dev-btn-primary"}" data-theme-action="wm-add"${full}>${list.length ? "+ Imagem…" : "Enviar imagem…"}</button>
            <button type="button" class="dev-btn dev-btn-ghost" data-theme-action="wm-add-text"${full}>${list.length ? "+ Texto" : "Adicionar texto"}</button>
          </div>
        `;
        if (!list.length) {
          return `
            <p class="dev-data-hint">Imagens e textos fixos na tela, por cima do mapa — o logo da unidade, um aviso, a data da última revisão. Eles não atrapalham os cliques e vão junto nas exportações. Cada marca pode ficar solta num ponto da tela ou grudada em outra.</p>
            ${picker}
            ${addButtons}
            <p class="dev-data-hint" style="margin-top:0.6rem;">PNG com fundo transparente fica melhor. Imagens grandes são reduzidas antes de guardar.</p>
          `;
        }
        const selected = watermarkById(wmSelected) || list[0];
        wmSelected = selected.id;
        const rows = list.map((wm, i) => `
          <div class="dev-wm-row">
            <button type="button" class="dev-wm-item${wm.on ? "" : " is-off"}" data-theme-action="wm-select" data-wm="${escapeHtml(wm.id)}" aria-pressed="${wm === selected}">
              ${watermarkThumbMarkup(wm)}
              <span class="dev-wm-info">
                <span class="dev-wm-name" data-wm-name="${escapeHtml(wm.id)}">${escapeHtml(watermarkName(wm))}</span>
                <span class="dev-wm-where" data-wm-where="${escapeHtml(wm.id)}">${escapeHtml(watermarkWhere(wm))}</span>
              </span>
            </button>
            <button type="button" class="dev-icon-btn" data-theme-action="wm-up" data-wm="${escapeHtml(wm.id)}" title="Subir na lista (fica mais para trás)" aria-label="Subir na lista"${i === 0 ? " disabled" : ""}>↑</button>
            <button type="button" class="dev-icon-btn" data-theme-action="wm-down" data-wm="${escapeHtml(wm.id)}" title="Descer na lista (fica mais na frente)" aria-label="Descer na lista"${i === list.length - 1 ? " disabled" : ""}>↓</button>
          </div>
        `).join("");
        return `
          <p class="dev-data-hint">Clique numa marca para ajustá-la. Quando duas se cruzam, a de baixo na lista fica por cima.</p>
          <div class="dev-wm-list" role="group" aria-label="Marcas d'água">${rows}</div>
          ${picker}
          ${addButtons}
          ${full ? `<p class="dev-data-hint" style="margin:0 0 0.4rem;">Limite de ${WATERMARK_MAX} marcas d'água, entre imagens e textos.</p>` : ""}
          ${watermarkEditorMarkup(selected)}
        `;
      }

      // Uma seção recolhível do editor de texto, com a chave que a liga e
      // os controles dela. O resumo diz se está ligada sem precisar abrir.
      function foldMarkup(key, title, onPath, body) {
        const on = getPath(theme, onPath);
        return `
          <details class="dev-fold" data-fold="${key}"${wmFolds.has(key) ? " open" : ""}>
            <summary><span>${escapeHtml(title)}</span><span class="dev-fold-state" data-fold-state="${escapeHtml(onPath)}">${on ? "ligado" : "desligado"}</span></summary>
            ${checkRowMarkup(onPath, "Mostrar " + title.toLowerCase())}
            ${body}
          </details>
        `;
      }

      // A parte de cima do editor de uma marca de texto: o texto, o nome e
      // toda a formatação. O "Onde fica" que vem depois é o mesmo das
      // imagens.
      function textEditorMarkup(wm, p) {
        return `
          <div class="dev-inline-actions">
            <button type="button" class="dev-btn dev-btn-ghost dev-btn-danger" data-theme-action="wm-remove">Remover texto</button>
          </div>
          <label class="dev-label">Texto
            <textarea class="dev-input" rows="3" maxlength="${WATERMARK_TEXT_LIMIT}" data-bind="${escapeHtml(p("text"))}">${escapeHtml(wm.text)}</textarea>
          </label>
          <p class="dev-data-hint" style="margin:0.35rem 0 0.2rem;">Enter quebra a linha; fora isso, o texto não quebra sozinho.</p>
          <label class="dev-label">Nome na lista
            <input class="dev-input" type="text" maxlength="${WATERMARK_NAME_LIMIT}" data-bind="${escapeHtml(p("name"))}" value="${escapeHtml(wm.name)}" placeholder="${escapeHtml(watermarkName(Object.assign({}, wm, { name: "" })))}" />
          </label>
          ${checkRowMarkup(p("on"), "Mostrar esta marca")}

          ${sectionTitle("Letra")}
          ${fontRowMarkup(p("font"))}
          <div class="dev-field-row">
            <span class="dev-color-name">Estilo</span>
            <div class="dev-seg-group" role="group" aria-label="Estilo do texto">
              ${pressButtonMarkup(p("bold"), undefined, "<b>N</b>", "Negrito")}
              ${pressButtonMarkup(p("italic"), undefined, "<i>I</i>", "Itálico")}
              ${pressButtonMarkup(p("underline"), undefined, "<u>S</u>", "Sublinhado")}
              ${pressButtonMarkup(p("upper"), undefined, "AA", "Tudo em maiúsculas")}
            </div>
          </div>
          <div class="dev-field-row">
            <span class="dev-color-name">Linhas</span>
            <div class="dev-seg-group" role="group" aria-label="Alinhamento das linhas">
              ${pressButtonMarkup(p("textAlign"), "left", ALIGN_ICONS.left, "Alinhar à esquerda")}
              ${pressButtonMarkup(p("textAlign"), "center", ALIGN_ICONS.center, "Centralizar")}
              ${pressButtonMarkup(p("textAlign"), "right", ALIGN_ICONS.right, "Alinhar à direita")}
            </div>
          </div>
          ${rangeRowMarkup(p("size"), "Tamanho da letra")}
          <p class="dev-data-hint" style="margin:-0.1rem 0 0.3rem;">Em % do lado menor da tela, como o tamanho das imagens: o texto acompanha a tela.</p>
          ${colorRowMarkup(p("color"), "Cor", wm.color)}
          ${rangeRowMarkup(p("spacing"), "Espaço entre letras")}
          ${rangeRowMarkup(p("lineHeight"), "Espaço entre linhas")}

          ${foldMarkup("bg", "Fundo", p("bg"), `
            ${colorRowMarkup(p("bgColor"), "Cor do fundo", wm.bgColor)}
            ${rangeRowMarkup(p("bgTransparency"), "Transparência")}
            ${rangeRowMarkup(p("bgPadding"), "Margem interna")}
            ${rangeRowMarkup(p("bgRadius"), "Cantos arredondados")}
          `)}
          ${foldMarkup("stroke", "Contorno", p("stroke"), `
            ${colorRowMarkup(p("strokeColor"), "Cor do contorno", wm.strokeColor)}
            ${rangeRowMarkup(p("strokeWidth"), "Espessura")}
          `)}
          ${foldMarkup("shadow", "Sombra", p("shadow"), `
            ${colorRowMarkup(p("shadowColor"), "Cor da sombra", wm.shadowColor)}
            ${rangeRowMarkup(p("shadowTransparency"), "Transparência")}
            ${rangeRowMarkup(p("shadowBlur"), "Desfoque")}
            ${rangeRowMarkup(p("shadowDistance"), "Distância")}
            ${rangeRowMarkup(p("shadowAngle"), "Direção")}
          `)}
          <p class="dev-data-hint" style="margin:0.3rem 0 0.2rem;">Margem, cantos, espessura, desfoque e distância são em % do tamanho da letra: crescem junto com ela.</p>
        `;
      }

      function watermarkEditorMarkup(wm) {
        const index = theme.watermarks.indexOf(wm);
        const p = (key) => keyPath("watermarks", String(index), key);
        const family = watermarkFamily(wm.id);
        const targets = theme.watermarks.filter((other) => !family.has(other.id));
        const hasAttached = theme.watermarks.some((other) => other.to === wm.id);
        const attachTitle = targets.length ? "" : ' title="Adicione outra marca para grudar esta nela"';
        let place;
        if (!wm.to) {
          place = `
            ${hasAttached ? `<p class="dev-data-hint" style="margin:0.1rem 0 0.2rem;">As marcas grudadas nesta vão junto: posição, transparência e rotação valem para o conjunto.</p>` : ""}
            ${rangeRowMarkup(p("transparency"), "Transparência")}
            ${rangeRowMarkup(p("rotation"), "Rotação")}
            ${positionGridMarkup(p("position"), "Posição da marca d'água")}
            ${rangeRowMarkup(p("margin"), "Distância da borda")}
            ${rangeRowMarkup(p("dx"), "Ajuste horizontal")}
            ${rangeRowMarkup(p("dy"), "Ajuste vertical")}
            <p class="dev-data-hint" style="margin:0.1rem 0 0;">O ajuste fino é em % da largura e da altura da tela.</p>
          `;
        } else {
          const vertical = wm.side === "left" || wm.side === "right";
          const alignNames = vertical ? ["Topo", "Centro", "Base"] : ["Esquerda", "Centro", "Direita"];
          const root = watermarkRootOf(wm);
          const parent = watermarkById(wm.to);
          const targetButtons = targets.map((t) => `
            <button type="button" class="dev-wm-target" data-bind="${escapeHtml(p("to"))}" data-value="${escapeHtml(t.id)}" data-rerender aria-pressed="${t.id === wm.to}">
              ${watermarkThumbMarkup(t)}<span data-wm-name="${escapeHtml(t.id)}">${escapeHtml(watermarkName(t))}</span>
            </button>
          `).join("");
          place = `
            <div class="dev-field-row">
              <span class="dev-color-name">Grudada em</span>
              <div class="dev-wm-targets" role="group" aria-label="Marca em que esta gruda">${targetButtons}</div>
            </div>
            <div class="dev-field-row">
              <span class="dev-color-name">Lado</span>
              <div class="dev-seg-group is-wrap" role="group" aria-label="Lado da outra marca">
                ${pressButtonMarkup(p("side"), "above", "Acima", "Acima da outra", { text: true, rerender: true })}
                ${pressButtonMarkup(p("side"), "below", "Abaixo", "Abaixo da outra", { text: true, rerender: true })}
                ${pressButtonMarkup(p("side"), "left", "Esquerda", "À esquerda da outra", { text: true, rerender: true })}
                ${pressButtonMarkup(p("side"), "right", "Direita", "À direita da outra", { text: true, rerender: true })}
              </div>
            </div>
            <div class="dev-field-row">
              <span class="dev-color-name">Alinhamento</span>
              <div class="dev-seg-group" role="group" aria-label="Alinhamento ao longo do lado">
                ${WATERMARK_ALIGNS.map((a, k) => pressButtonMarkup(p("align"), a, alignNames[k], "Alinhar pelo " + alignNames[k].toLowerCase(), { text: true })).join("")}
              </div>
            </div>
            ${rangeRowMarkup(p("gap"), "Distância")}
            ${rangeRowMarkup(p("shift"), "Deslocamento")}
            <p class="dev-data-hint" style="margin:0.1rem 0 0;">Distância e deslocamento são em % do lado menor da tela, como o tamanho: o conjunto fica com a mesma forma em qualquer tela. Distância negativa sobrepõe as duas. Transparência e rotação vêm de ${escapeHtml(watermarkName(root))}, a principal do conjunto, e esconder ${escapeHtml(parent ? watermarkName(parent) : "a outra")} esconde esta também.</p>
          `;
        }
        const top = isTextMark(wm) ? textEditorMarkup(wm, p) : `
          <div class="dev-inline-actions">
            <button type="button" class="dev-btn dev-btn-ghost" data-theme-action="wm-pick">Trocar imagem…</button>
            <button type="button" class="dev-btn dev-btn-ghost dev-btn-danger" data-theme-action="wm-remove">Remover</button>
          </div>
          <label class="dev-label">Nome
            <input class="dev-input" type="text" maxlength="${WATERMARK_NAME_LIMIT}" data-bind="${escapeHtml(p("name"))}" value="${escapeHtml(wm.name)}" placeholder="Marca ${index + 1}" />
          </label>
          ${checkRowMarkup(p("on"), "Mostrar esta marca")}
          ${rangeRowMarkup(p("scale"), "Tamanho")}
          <p class="dev-data-hint" style="margin:-0.1rem 0 0.3rem;">O lado maior da imagem, em % do lado menor da tela.</p>
        `;
        return `
          <div class="dev-wm-editor">
            ${top}
            ${isTextMark(wm) ? sectionTitle("Lugar") : ""}
            <div class="dev-field-row">
              <span class="dev-color-name">Onde fica</span>
              <div class="dev-seg-group" role="group" aria-label="Onde a marca fica">
                <button type="button" class="dev-seg is-text" data-theme-action="wm-free" aria-pressed="${!wm.to}">Solta na tela</button>
                <button type="button" class="dev-seg is-text" data-theme-action="wm-attach" aria-pressed="${!!wm.to}"${targets.length ? "" : " disabled"}${attachTitle}>Grudada em outra</button>
              </div>
            </div>
            ${place}
          </div>
        `;
      }

      const HUD_LABELS = {
        title: "Título e subtítulo",
        search: "Pesquisa",
        zoom: "Controles de zoom",
        legend: "Legenda (Nó / Subnó)",
      };

      // Um bloco por elemento preso à tela. O título não tem "Tamanho" aqui:
      // o dele é o tamanho da letra, na aba Título.
      function tabTelaMarkup() {
        const blocks = HUD_ORDER.map((key) => {
          const cfg = theme.hud[key];
          const name = HUD_LABELS[key];
          return `
            <div class="dev-hud-item${cfg.show ? "" : " is-off"}" data-hud-block="${key}">
              <div class="dev-hud-head">
                <span class="dev-hud-name">${escapeHtml(name)}</span>
                ${checkRowMarkup(keyPath("hud", key, "show"), "Mostrar")}
              </div>
              ${positionGridMarkup(keyPath("hud", key, "position"), "Posição: " + name)}
              ${rangeRowMarkup(keyPath("hud", key, "offset"), "Afastar da borda")}
              ${hasOwn(cfg, "scale") ? rangeRowMarkup(keyPath("hud", key, "scale"), "Tamanho") : ""}
            </div>
          `;
        }).join("");
        return `
          <p class="dev-data-hint">Posição, distância e tamanho valem no computador; no celular a tela se arruma sozinha, como sempre. Esconder vale nos dois. Quem divide o mesmo lugar se empilha. O cadeado e os botões do modo dev ficam sempre no canto de cima.</p>
          ${blocks}
        `;
      }

      const TAB_MARKUP = {
        cores: tabCoresMarkup,
        textos: tabTextosMarkup,
        tronco: tabTroncoMarkup,
        titulo: tabTituloMarkup,
        pesquisa: tabPesquisaMarkup,
        marca: tabMarcaMarkup,
        tela: tabTelaMarkup,
      };

      // `focusSelector` devolve o foco a um controle equivalente depois de
      // redesenhar: trocar de aba ou restaurar não pode jogar o foco do
      // teclado para o começo da página.
      function renderThemeForm(focusSelector) {
        devOverlay.classList.add("is-side");
        const tabs = THEME_TABS.map((tab) =>
          `<button type="button" class="dev-tab" data-theme-tab="${tab.id}" aria-pressed="${tab.id === themeTab}">${escapeHtml(tab.label)}</button>`
        ).join("");
        devModalBody.innerHTML = `
          <h2 id="dev-modal-title" class="dev-modal-title">Aparência do mapa</h2>
          <p class="dev-data-hint">Vale para todo mundo que abrir esta página e vai junto nas exportações.</p>
          <div class="dev-tabs" role="group" aria-label="Partes da aparência">${tabs}</div>
          ${TAB_MARKUP[themeTab]()}
          <button type="button" class="dev-btn dev-btn-ghost" data-theme-action="reset-tab" style="margin-top:1rem;width:100%;">Restaurar o padrão desta aba</button>
        `;
        // As miniaturas recebem o src depois: data URLs de centenas de KB
        // não passam pelo innerHTML.
        devModalBody.querySelectorAll("img[data-wm-thumb]").forEach((img) => {
          const wm = watermarkById(img.dataset.wmThumb);
          if (wm) img.src = wm.image;
        });
        loadFonts(true);
        const coreField = document.getElementById("theme-core-label");
        if (coreField) coreField.addEventListener("input", () => editCoreLabel(coreField.value));
        refreshThemeWidgets();
        if (focusSelector) {
          const target = devModalBody.querySelector(focusSelector);
          if (target) target.focus();
        }
      }

      // O texto do tronco é o rótulo do nó raiz, não uma chave do tema: vai
      // para a árvore, com a regra do formulário do lápis — vazio não vale,
      // e o tronco fica com o último texto não vazio.
      function editCoreLabel(value) {
        const text = value.trim();
        if (!text || text === treeData.root.label) return;
        treeData.root.label = text;
        coreLabel.textContent = text;
        refreshCoreSize();
        markChanged();
      }

      // Um controle mudou o tema. A repintura vai para o próximo quadro: um
      // controle deslizante dispara dezenas de "input" por segundo, e basta
      // desenhar uma vez por quadro.
      let themeFrame = null;
      function themeChanged() {
        markChanged();
        refreshThemeWidgets();
        if (themeFrame) return;
        themeFrame = requestAnimationFrame(() => {
          themeFrame = null;
          applyTheme();
          // As cores automáticas dependem do que applyTheme acabou de
          // aplicar (a do título é lida do CSS da página).
          refreshThemeWidgets();
        });
      }

      function refreshThemeWidgets() {
        devModalBody.querySelectorAll("output[data-out]").forEach((out) => {
          out.textContent = readout(out.dataset.out);
        });
        devModalBody.querySelectorAll("[data-reset]").forEach((btn) => {
          btn.disabled = isDefaultPaths(btn.dataset.reset);
        });
        devModalBody.querySelectorAll("button[data-bind]").forEach((btn) => {
          const current = getPath(theme, btn.dataset.bind);
          const on = btn.hasAttribute("data-value") ? current === btn.dataset.value : !!current;
          btn.setAttribute("aria-pressed", String(on));
        });
        devModalBody.querySelectorAll("[data-chip]").forEach((chip) => {
          const look = chipLook(chip.dataset.chip);
          chip.style.background = look.bg;
          chip.style.color = look.fg;
          const input = chip.querySelector("input");
          if (input && input !== document.activeElement) input.value = toHex(look.fg);
        });
        AUTO_COLOR_PATHS.forEach((path) => {
          const input = devModalBody.querySelector('input[type="color"][data-bind="' + path + '"]');
          if (input && input !== document.activeElement && !getPath(theme, path)) {
            input.value = effectiveHex(path);
          }
        });
        // Aba Tela: bloco esmaecido quando o elemento está escondido, e
        // "Afastar da borda" desligado na vaga do centro, onde não há borda.
        devModalBody.querySelectorAll("[data-hud-block]").forEach((block) => {
          const cfg = theme.hud[block.dataset.hudBlock];
          block.classList.toggle("is-off", !cfg.show);
          const offset = block.querySelector('input[data-bind$=".offset"]');
          if (offset) offset.disabled = cfg.position === "center";
        });
        // Aba Marca d'água: nome, lugar e mostrar/esconder, na lista e nas
        // fichas de "Grudada em", acompanham o editor.
        devModalBody.querySelectorAll("[data-wm-name]").forEach((el) => {
          const wm = watermarkById(el.dataset.wmName);
          if (wm) el.textContent = watermarkName(wm);
        });
        devModalBody.querySelectorAll("[data-wm-where]").forEach((el) => {
          const wm = watermarkById(el.dataset.wmWhere);
          if (wm) el.textContent = watermarkWhere(wm);
        });
        devModalBody.querySelectorAll(".dev-wm-item[data-wm]").forEach((el) => {
          const wm = watermarkById(el.dataset.wm);
          if (wm) el.classList.toggle("is-off", !wm.on);
        });
        devModalBody.querySelectorAll("[data-wm-text-thumb]").forEach((el) => {
          const wm = watermarkById(el.dataset.wmTextThumb);
          if (wm) paintTextThumb(el, wm);
        });
        devModalBody.querySelectorAll("[data-fold-state]").forEach((el) => {
          el.textContent = getPath(theme, el.dataset.foldState) ? "ligado" : "desligado";
        });
      }

      // Delegação registrada uma única vez: renderThemeForm() se redesenha a
      // cada restauração e troca de aba, e prender os listeners lá dentro
      // iria empilhando uma cópia nova a cada passagem. "input" e "change"
      // chegam os dois para quase todo controle; gravar o mesmo valor duas
      // vezes não faz mal nenhum.
      function onThemeControl(event) {
        const el = event.target;
        if (el.id === "theme-wm-file") {
          if (event.type === "change") takeWatermarkFile(el);
          return;
        }
        if (el.tagName === "BUTTON" || !el.dataset || !el.dataset.bind) return;
        const value = el.type === "checkbox" ? el.checked
          : el.type === "range" ? Number(el.value)
            : el.value;
        setPath(theme, el.dataset.bind, value);
        themeChanged();
      }

      devModalBody.addEventListener("input", onThemeControl);
      devModalBody.addEventListener("change", onThemeControl);
      // "toggle" não sobe pela árvore: só a captura enxerga o de cada
      // seção recolhível.
      devModalBody.addEventListener("toggle", (event) => {
        const fold = event.target.dataset && event.target.dataset.fold;
        if (!fold) return;
        if (event.target.open) wmFolds.add(fold);
        else wmFolds.delete(fold);
      }, true);

      devModalBody.addEventListener("click", (event) => {
        const tab = event.target.closest("[data-theme-tab]");
        if (tab) {
          themeTab = tab.dataset.themeTab;
          renderThemeForm('[data-theme-tab="' + themeTab + '"]');
          return;
        }

        const press = event.target.closest("button[data-bind]");
        if (press) {
          const path = press.dataset.bind;
          setPath(theme, path, press.hasAttribute("data-value") ? press.dataset.value : !getPath(theme, path));
          themeChanged();
          // Escolhas que mudam outros controles da aba (o lado de uma marca
          // grudada troca os nomes do alinhamento, por exemplo).
          if (press.hasAttribute("data-rerender")) {
            renderThemeForm('button[data-bind="' + CSS.escape(path) + '"][data-value="' + CSS.escape(press.dataset.value) + '"]');
          }
          return;
        }

        const reset = event.target.closest("[data-reset]");
        if (reset) {
          resetPaths(reset.dataset.reset);
          applyTheme();
          markChanged();
          // Redesenha para o seletor mostrar o valor padrão. O botão fica
          // desabilitado, então o foco vai para o controle da mesma linha.
          const first = reset.dataset.reset.split(" ")[0];
          renderThemeForm('[data-bind^="' + CSS.escape(first) + '"]');
          return;
        }

        const action = event.target.closest("[data-theme-action]");
        if (!action) return;
        const name = action.dataset.themeAction;
        if (name === "reset-tab") {
          resetThemeTab(themeTab);
          applyTheme();
          markChanged();
          renderThemeForm('[data-theme-action="reset-tab"]');
          status.textContent = "Aparência desta aba restaurada para o padrão.";
        } else if (name === "wm-add" || name === "wm-pick") {
          if (name === "wm-add" && theme.watermarks.length >= WATERMARK_MAX) return;
          wmPickTarget = name === "wm-pick" ? wmSelected : "";
          const input = document.getElementById("theme-wm-file");
          if (input) input.click();
        } else if (name === "wm-add-text") {
          if (theme.watermarks.length >= WATERMARK_MAX) return;
          const wm = Object.assign(watermarkDefaults("text"), { id: newWatermarkId() });
          theme.watermarks.push(wm);
          wmSelected = wm.id;
          applyTheme();
          markChanged();
          // O foco vai para o texto, já selecionado: é só digitar por cima.
          const path = keyPath("watermarks", String(theme.watermarks.length - 1), "text");
          renderThemeForm('textarea[data-bind="' + CSS.escape(path) + '"]');
          if (document.activeElement && document.activeElement.tagName === "TEXTAREA") document.activeElement.select();
          status.textContent = "Texto adicionado.";
        } else if (name === "wm-select") {
          wmSelected = action.dataset.wm;
          renderThemeForm('[data-theme-action="wm-select"][data-wm="' + CSS.escape(wmSelected) + '"]');
        } else if (name === "wm-up" || name === "wm-down") {
          const list = theme.watermarks;
          const from = list.findIndex((wm) => wm.id === action.dataset.wm);
          const to = from + (name === "wm-up" ? -1 : 1);
          if (from < 0 || to < 0 || to >= list.length) return;
          list.splice(to, 0, list.splice(from, 1)[0]);
          applyTheme();
          markChanged();
          // Na ponta da lista a seta usada fica desligada: o foco vai para
          // a outra seta da mesma marca.
          const edge = to === 0 || to === list.length - 1;
          const arrow = edge ? (name === "wm-up" ? "wm-down" : "wm-up") : name;
          renderThemeForm('[data-theme-action="' + arrow + '"][data-wm="' + CSS.escape(action.dataset.wm) + '"]');
        } else if (name === "wm-free" || name === "wm-attach") {
          const wm = watermarkById(wmSelected);
          if (!wm || (name === "wm-free") === !wm.to) return;
          if (name === "wm-free") {
            wm.to = "";
          } else {
            const family = watermarkFamily(wm.id);
            const target = theme.watermarks.find((other) => !family.has(other.id));
            if (!target) return;
            wm.to = target.id;
          }
          applyTheme();
          markChanged();
          renderThemeForm('[data-theme-action="' + name + '"]');
        } else if (name === "wm-remove") {
          const wm = watermarkById(wmSelected);
          if (!wm) return;
          const attached = theme.watermarks.filter((other) => other.to === wm.id);
          const question = "Remover a marca d'água “" + watermarkName(wm) + "”?"
            + (attached.length === 1 ? " A marca grudada nela fica no lugar dela."
              : attached.length ? " As " + attached.length + " marcas grudadas nela ficam no lugar dela." : "");
          if (!window.confirm(question)) return;
          const index = theme.watermarks.indexOf(wm);
          theme.watermarks = removeWatermark(theme.watermarks, wm.id);
          const next = attached[0] || theme.watermarks[Math.min(index, theme.watermarks.length - 1)];
          wmSelected = next ? next.id : "";
          applyTheme();
          markChanged();
          renderThemeForm('[data-theme-action="wm-add"]');
          status.textContent = "Marca d'água removida.";
        }
      });

      function resetThemeTab(tabId) {
        const fresh = defaultTheme();
        TAB_KEYS[tabId].forEach((key) => {
          if (key === "watermarks") {
            // As imagens e os textos ficam, e cada marca continua grudada
            // onde estava; o resto volta ao de fábrica.
            theme.watermarks = theme.watermarks.map((wm) => Object.assign(watermarkDefaults(wm.kind), {
              id: wm.id, name: wm.name, image: wm.image, ratio: wm.ratio, to: wm.to, text: wm.text,
            }));
            return;
          }
          theme[key] = fresh[key];
        });
      }

      // --- Imagem da marca d'água -------------------------------------------
      const WM_MAX_SIDE = 1200;           // lado maior de uma imagem reduzida
      const WM_KEEP_BYTES = 400 * 1024;   // até aqui a imagem entra como veio
      const WM_MAX_CHARS = 1500000;       // teto da data URL (~1,1 MB de imagem)
      const WM_EXTENSIONS = /\.(png|jpe?g|webp|gif|svg)$/i;

      // Para onde vai a próxima imagem escolhida: "" é uma marca nova; um
      // id troca a imagem daquela marca.
      let wmPickTarget = "";

      function takeWatermarkFile(input) {
        const file = input.files && input.files[0];
        input.value = "";   // escolher o mesmo arquivo de novo volta a disparar
        if (!file) return;
        const targetId = wmPickTarget;
        readWatermark(file).then((result) => {
          let wm = null;
          if (targetId) {
            wm = watermarkById(targetId);
            if (!wm) return;   // a marca foi removida enquanto a imagem era lida
          } else {
            if (theme.watermarks.length >= WATERMARK_MAX) return;
            wm = Object.assign(watermarkDefaults("image"), {
              id: newWatermarkId(),
              name: file.name.replace(/\.[^.]*$/, "").trim().slice(0, WATERMARK_NAME_LIMIT),
            });
            theme.watermarks.push(wm);
          }
          wm.image = result.image;
          wm.ratio = result.ratio;
          wm.on = true;
          wmSelected = wm.id;
          applyTheme();
          markChanged();
          if (!devOverlay.hidden) renderThemeForm('[data-theme-action="wm-pick"]');
          status.textContent = targetId ? "Imagem da marca d'água trocada." : "Marca d'água adicionada.";
        }).catch((error) => {
          window.alert(error.message);
        });
      }

      // Lê a imagem escolhida e devolve { image: data URL, ratio }. Imagem
      // pequena entra como veio (e um SVG continua vetorial). Grande é
      // redesenhada num canvas com no máximo WM_MAX_SIDE px no lado maior:
      // uma foto de celular tem vários MB e deixaria pesado o HTML exportado.
      function readWatermark(file) {
        return new Promise((resolve, reject) => {
          const known = /^image\/(png|jpeg|webp|gif|svg\+xml)$/.test(file.type)
            || (!file.type && WM_EXTENSIONS.test(file.name));
          if (!known) {
            reject(new Error("Escolha uma imagem PNG, JPG, WebP, GIF ou SVG."));
            return;
          }
          const vector = file.type === "image/svg+xml";
          const reader = new FileReader();
          reader.onerror = () => reject(new Error("Não foi possível ler o arquivo."));
          reader.onload = () => {
            const dataUrl = String(reader.result);
            const img = new Image();
            img.onerror = () => reject(new Error("O arquivo não parece ser uma imagem válida."));
            img.onload = () => {
              const w = img.naturalWidth;
              const h = img.naturalHeight;
              const small = file.size <= WM_KEEP_BYTES && IMAGE_DATA_URL.test(dataUrl);
              if (!w || !h) {
                // SVG sem tamanho próprio: não há como medir nem redesenhar.
                if (small) resolve({ image: dataUrl, ratio: 1 });
                else reject(new Error("Este SVG não informa o próprio tamanho e é grande demais. Tente um PNG."));
                return;
              }
              const ratio = clamp(w / h, LIMITS.watermark.ratio[0], LIMITS.watermark.ratio[1]);
              if (small && (vector || Math.max(w, h) <= WM_MAX_SIDE * 1.5)) {
                resolve({ image: dataUrl, ratio: ratio });
                return;
              }
              const shrunk = shrinkImage(img, w, h, vector);
              if (shrunk) resolve({ image: shrunk, ratio: ratio });
              else reject(new Error("A imagem é grande demais, mesmo reduzida. Tente uma menor."));
            };
            img.src = dataUrl;
          };
          reader.readAsDataURL(file);
        });
      }

      // Redesenha a imagem menor, em WebP (guarda a transparência e comprime
      // bem); onde o navegador não sabe gerar WebP, sai PNG. Se nem assim
      // couber, tenta lados menores.
      function shrinkImage(img, w, h, vector) {
        const sides = [WM_MAX_SIDE, 900, 600];
        for (let i = 0; i < sides.length; i += 1) {
          // Um SVG pode crescer sem perder nitidez; um bitmap, não.
          const k = vector
            ? sides[i] / Math.max(w, h)
            : Math.min(1, sides[i] / Math.max(w, h));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(w * k));
          canvas.height = Math.max(1, Math.round(h * k));
          let url;
          try {
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            url = canvas.toDataURL("image/webp", 0.9);
            if (url.indexOf("data:image/webp") !== 0) url = canvas.toDataURL("image/png");
          } catch (e) {
            return null;   // canvas bloqueado (SVG que puxa conteúdo de fora)
          }
          if (url.length <= WM_MAX_CHARS && IMAGE_DATA_URL.test(url)) return url;
        }
        return null;
      }

      themeToggle.addEventListener("click", () => {
        if (!devUnlocked) return;
        renderThemeForm();
        openDevOverlay();
      });

      // --- Carregamento -----------------------------------------------------
      // Toda abertura parte do seed embutido no arquivo — o mapa que está no
      // servidor —, com a árvore e o tema dele. Sem seed (uma cópia do
      // programa sem mapa), valem o mapa e as cores de fábrica; um seed sem
      // tema (mapa da v2) fica com as cores de fábrica. Nada vem do navegador.
      clearOldDrafts();
      const seedEnvelope = readSeed();
      const seedRoot = readEnvelope(seedEnvelope);
      if (seedRoot) {
        adoptRoot(seedRoot);
        if (seedEnvelope.theme) theme = sanitizeTheme(seedEnvelope.theme);
      }
      normalizeTypes(treeData.root);

      // Antes do primeiro render: as medidas decidem a largura das caixas,
      // e medir com o jogo errado obrigaria a desenhar duas vezes. O tema
      // também vem antes, porque a formatação do tronco decide o raio dele
      // (fitCoreSize), e o raio decide onde os galhos nascem. Os nós não
      // precisam dele depois: mountNodeEl() já os monta com colorFor().
      setViewportUnit();
      applyMetrics();
      applyTheme();

      render();
      updateVisibility();
      fitCamera(0);
      remeasureOnFontsReady();
    });
  </script>
