  <meta charset="UTF-8">

  <title>Organização de POPs</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --ink: #0b1736;
      --paper: #edf3ff;
      --line: rgba(160, 190, 255, 0.56);
      --focus: #ffffff;
      /* Os dois borrões decorativos do fundo. Viram variáveis porque moram
         em pseudo-elementos, onde não dá para escrever estilo inline. */
      --blob-a: rgba(25, 183, 187, 0.24);
      --blob-b: rgba(245, 177, 75, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    .mindmap-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      position: relative;
      overflow: hidden;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.25rem 1.25rem;
    }

    .mindmap-shell::before,
    .mindmap-shell::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: -1;
      border-radius: 999px;
      filter: blur(2px);
    }

    .mindmap-shell::before {
      width: 29rem;
      height: 29rem;
      top: -16rem;
      right: -10rem;
      background: radial-gradient(circle, var(--blob-a), transparent 69%);
    }

    .mindmap-shell::after {
      width: 26rem;
      height: 26rem;
      bottom: -14rem;
      left: -9rem;
      background: radial-gradient(circle, var(--blob-b), transparent 69%);
    }

    body.no-blobs .mindmap-shell::before,
    body.no-blobs .mindmap-shell::after {
      display: none;
    }

    /* Fundo claro: o que é escrito diretamente sobre o fundo troca de cor
       para não sumir. A instrução do tronco carrega cor inline vinda do
       template, e por isso precisa do !important. */
    body.on-light .eyebrow {
      color: rgba(11, 23, 54, 0.75);
    }

    body.on-light .instruction {
      color: rgba(11, 23, 54, 0.72) !important;
    }

    body.on-light .camera-legend {
      color: rgba(11, 23, 54, 0.6);
    }

    body.on-light .dev-toggle {
      color: rgba(11, 23, 54, 0.8);
      border-color: rgba(11, 23, 54, 0.22);
      background: rgba(11, 23, 54, 0.06);
    }

    body.on-light .dev-toggle:hover,
    body.on-light .dev-toggle:focus-visible {
      background: rgba(11, 23, 54, 0.12);
    }

    .eyebrow {
      position: absolute;
      top: 1.65rem;
      left: 1.8rem;
      z-index: 20;
      color: rgba(231, 240, 255, 0.78);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: 700;
      pointer-events: none;
    }

    .map-stage {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
    }

    .camera-viewport {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .world {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      transition: transform 700ms cubic-bezier(.22, .8, .28, 1);
      will-change: transform;
    }

    .connectors {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
      z-index: 1;
    }

    .connector {
      fill: none;
      stroke: var(--line);
      stroke-width: 2.5px;
      opacity: 0;
      transition: opacity 320ms ease, stroke-dashoffset 700ms cubic-bezier(.22, .8, .28, 1);
    }

    .connector.is-visible {
      opacity: 1;
    }

    .core-area {
      position: absolute;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
    }

    .dev-node-controls {
      position: absolute;
      top: -10px;
      right: -10px;
      display: flex;
      gap: 4px;
      z-index: 6;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 200ms ease, transform 200ms ease;
    }

    body.dev-mode .dev-node-controls {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .dev-node-btn {
      width: 24px;
      height: 24px;
      min-width: 24px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: #101d40;
      color: rgb(230, 238, 255);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      transition: transform 160ms ease, background 160ms ease;
    }

    .dev-node-btn:hover,
    .dev-node-btn:focus-visible {
      transform: scale(1.12);
      background: #16244d;
    }

    .dev-node-btn-danger {
      color: rgb(255, 150, 150);
      border-color: rgba(255, 120, 120, 0.45);
    }

    /* --- Religar galho: arrastar um nó por cima de outro troca o pai. ---
       Só existe no modo dev. */
    body.dev-mode .branch-button {
      cursor: grab;
    }

    /* Enquanto arrasta, o texto não deve ser selecionado em lugar nenhum
       (o gesto passa por cima de rótulos longos de subnó). */
    body.is-reparenting,
    body.is-reparenting .branch-button {
      user-select: none;
    }

    .core-button,
    .branch-button {
      border: 0;
      cursor: pointer;
      transition: transform 260ms ease, box-shadow 260ms ease, filter 260ms ease;
    }

    .core-button {
      width: 168px;
      min-height: 168px;
      padding: 1.2rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      box-shadow: 0 18px 0 rgba(2, 9, 31, 0.13), 0 22px 45px rgba(2, 9, 31, 0.38);
      position: relative;
    }

    .core-button::after {
      content: "";
      position: absolute;
      inset: -10px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: inherit;
      transition: transform 300ms ease, opacity 300ms ease;
    }

    .core-button:hover,
    .core-button:focus-visible {
      transform: translateY(-5px) scale(1.02);
      filter: brightness(1.08);
    }

    .core-button:hover::after,
    .core-button:focus-visible::after {
      transform: scale(1.08);
      opacity: 0.8;
    }

    .node-label {
      font-family: "Fraunces", serif;
      text-align: center;
      line-height: 1.05;
    }

    .instruction {
      color: rgba(235, 243, 255, 0.76);
      font-size: 0.82rem;
      letter-spacing: 0.025em;
      white-space: nowrap;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .map-stage.is-open .instruction {
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
    }

    .branch {
      position: absolute;
      z-index: 2;
      width: 214px;
      opacity: 0;
      pointer-events: none;
      /* Cresce a partir do próprio centro: no layout radial os galhos saem
         em qualquer direção, então nenhum deslocamento lateral serviria. */
      transform: scale(0.82);
      transition: opacity 420ms ease, transform 480ms cubic-bezier(.2, .8, .2, 1);
    }

    .branch.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    /* --- Nó em arrasto (religar galho) ---------------------------------
       Precisa vir DEPOIS de .branch.is-visible: as duas regras têm a mesma
       especificidade, então quem ganha o pointer-events é a última escrita.
       O nó arrastado tem de ficar transparente ao ponteiro para que o
       elementFromPoint enxergue o alvo embaixo dele, e sai das transições
       para acompanhar o cursor em vez de deslizar atrás dele. */
    .branch.is-dragging {
      z-index: 40;
      pointer-events: none;
      transition: none !important;
      cursor: grabbing;
    }

    /* pointer-events:none no pai não alcança um filho que pede "auto" — e
       os botões de edição pedem. */
    .branch.is-dragging .dev-node-controls {
      pointer-events: none;
    }

    .branch.is-dragging .branch-button {
      transform: scale(1.04);
      box-shadow: 0 18px 38px rgba(2, 9, 31, 0.55);
      opacity: 0.9;
    }

    .branch.is-drop-ok .branch-button,
    .core-area.is-drop-ok .core-button {
      outline: 3px solid rgb(120, 235, 170);
      outline-offset: 3px;
    }

    .branch.is-drop-blocked .branch-button,
    .core-area.is-drop-blocked .core-button {
      outline: 3px solid rgb(255, 120, 120);
      outline-offset: 3px;
    }

    /* Ordem: a barra na borda de cima ou de baixo diz em que posição entre
       os irmãos o nó vai entrar. Usa box-shadow inset para acompanhar o
       arredondamento da caixa sem mexer no layout. */
    .branch.is-drop-before .branch-button {
      box-shadow: inset 0 6px 0 rgb(120, 235, 170), 0 8px 18px rgba(1, 10, 31, 0.18);
    }

    .branch.is-drop-after .branch-button {
      box-shadow: inset 0 -6px 0 rgb(120, 235, 170), 0 8px 18px rgba(1, 10, 31, 0.18);
    }

    /* Legenda do arrasto: diz o que vai acontecer ao soltar. Fica presa ao
       topo da viewport e é transparente ao ponteiro, para nunca virar ela
       própria o alvo do elementFromPoint. */
    .drag-hint {
      position: absolute;
      top: 0.9rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      pointer-events: none;
      max-width: min(90%, 460px);
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      background: rgba(10, 20, 48, 0.9);
      border: 1px solid rgba(120, 235, 170, 0.55);
      color: rgb(231, 240, 255);
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 10px 24px rgba(2, 9, 31, 0.45);
    }

    .drag-hint.is-blocked {
      border-color: rgba(255, 120, 120, 0.65);
      color: rgb(255, 197, 197);
    }

    .branch-button {
      width: 100%;
      min-height: 70px;
      border-radius: 18px;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      box-shadow: 0 12px 25px rgba(1, 10, 31, 0.24);
    }

    .branch-button:hover,
    .branch-button:focus-visible {
      transform: translateY(-3px);
      filter: brightness(1.08);
    }

    .branch-button svg {
      flex: 0 0 auto;
      transition: transform 240ms ease;
    }

    .branch.is-expanded .branch-button svg {
      transform: rotate(45deg);
    }

    .branch-name {
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.15;
    }

    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    .screen-reader-status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .dev-toggle {
      position: absolute;
      top: 1.5rem;
      right: 1.8rem;
      z-index: 20;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      color: rgba(231, 240, 255, 0.85);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 200ms ease, transform 200ms ease, color 200ms ease, border-color 200ms ease;
    }

    .dev-toggle:hover,
    .dev-toggle:focus-visible {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    .dev-toggle.is-unlocked {
      border-color: rgba(120, 220, 160, 0.6);
      color: rgb(150, 240, 190);
    }

    .dev-toggle-icon-unlocked {
      display: none;
    }

    .dev-toggle.is-unlocked .dev-toggle-icon-locked {
      display: none;
    }

    .dev-toggle.is-unlocked .dev-toggle-icon-unlocked {
      display: block;
    }

    .dev-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 20, 0.66);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1.25rem;
    }

    .dev-overlay[hidden] {
      display: none;
    }

    .dev-modal {
      position: relative;
      width: min(100%, 380px);
      max-height: 88vh;
      overflow-y: auto;
      background: #101d40;
      border: 1px solid rgba(160, 190, 255, 0.28);
      border-radius: 20px;
      padding: 1.6rem 1.5rem 1.5rem;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
      color: rgb(230, 238, 255);
    }

    .dev-modal-close {
      position: absolute;
      top: 0.7rem;
      right: 0.8rem;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: transparent;
      color: rgba(230, 238, 255, 0.7);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      border: 0;
    }

    .dev-modal-close:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .dev-modal-title {
      font-family: "Fraunces", serif;
      font-size: 1.25rem;
      margin: 0 0 0.4rem;
    }

    .dev-modal-desc {
      font-size: 0.85rem;
      color: rgba(230, 238, 255, 0.7);
      margin: 0 0 1.1rem;
    }

    .dev-form {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .dev-label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(230, 238, 255, 0.8);
    }

    .dev-input {
      font: inherit;
      padding: 0.55rem 0.7rem;
      border-radius: 10px;
      border: 1px solid rgba(160, 190, 255, 0.35);
      background: rgba(255, 255, 255, 0.06);
      color: rgb(240, 245, 255);
      resize: vertical;
    }

    .dev-input:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .dev-btn {
      font: inherit;
      font-weight: 700;
      padding: 0.65rem 1rem;
      border-radius: 12px;
      border: 0;
      cursor: pointer;
      transition: transform 200ms ease, filter 200ms ease;
    }

    .dev-btn:hover,
    .dev-btn:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .dev-btn-primary {
      background: linear-gradient(135deg, rgb(246, 190, 88), rgb(239, 136, 84));
      color: rgb(11, 23, 54);
    }

    .dev-error {
      color: rgb(255, 150, 150);
      font-size: 0.8rem;
      margin: 0;
    }

    /* --- Câmera controlada pelo usuário: roda do mouse, arrasto e botões.
       O #world recebe um transform escrito em JS a partir do estado
       `camera`; a transição é ligada/desligada inline conforme o
       movimento seja programático (enquadrar) ou manual (arrastar). --- */
    .camera-viewport {
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .camera-viewport.is-panning {
      cursor: grabbing;
    }

    .camera-controls {
      position: absolute;
      right: 0.85rem;
      bottom: 0.85rem;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 0.2rem;
      padding: 0.28rem;
      border-radius: 999px;
      background: rgba(10, 20, 48, 0.72);
      border: 1px solid rgba(160, 190, 255, 0.28);
      box-shadow: 0 10px 24px rgba(2, 9, 31, 0.4);
      backdrop-filter: blur(6px);
    }

    .camera-btn {
      width: 30px;
      height: 30px;
      min-width: 30px;
      padding: 0;
      border-radius: 50%;
      border: 0;
      background: transparent;
      color: rgba(231, 240, 255, 0.85);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .camera-btn:hover,
    .camera-btn:focus-visible {
      background: rgba(255, 255, 255, 0.14);
      color: rgb(255, 255, 255);
      transform: translateY(-1px);
    }

    .camera-btn.is-active {
      color: rgb(150, 240, 190);
    }

    .camera-zoom-readout {
      min-width: 44px;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: rgba(231, 240, 255, 0.8);
      font-variant-numeric: tabular-nums;
    }

    .camera-legend {
      position: absolute;
      left: 1rem;
      bottom: 1.1rem;
      z-index: 30;
      display: flex;
      gap: 0.9rem;
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(231, 240, 255, 0.5);
      pointer-events: none;
    }

    .camera-legend span {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .camera-legend b {
      width: 11px;
      height: 11px;
      flex: none;
      border-radius: 3px;
      background: rgb(72, 111, 197);
    }

    .camera-legend .legend-sub b {
      border-radius: 999px;
      background: rgb(224, 233, 255);
    }

    /* --- Subnós: a folhagem do galho. Mesma largura dos nós, na cor clara
       da paleta do galho. A caixa cresce com o texto (até 400 palavras) e
       rola por dentro depois do teto; enquanto for curta mantém o formato
       de pílula, que vira um oval feio quando a caixa fica alta. --- */
    .branch.is-subnode .branch-button {
      min-height: 54px;
      max-height: 320px;
      overflow-y: auto;
      overscroll-behavior: contain;
      align-items: flex-start;
      border-radius: 999px;
      padding: 0.6rem 1.15rem;
      box-shadow: 0 8px 18px rgba(1, 10, 31, 0.18);
    }

    /* Só o raio muda: mexer no padding alteraria a altura já medida por
       measureNodes() e obrigaria a remedir. */
    .branch.is-subnode.is-tall .branch-button {
      border-radius: 18px;
    }

    .branch.is-subnode .branch-name {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: pre-wrap;
      text-align: left;
      /* min-width:0 é o que deixa o texto realmente quebrar dentro do flex,
         em vez de esticar a caixa até caber a maior palavra. */
      flex: 1 1 auto;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .connector.is-subnode {
      stroke-width: 1.6px;
    }

    .connector.is-subnode.is-visible {
      opacity: 0.72;
    }

    /* O botão que cria subnós usa a própria aparência de subnó, para que a
       categoria se aprenda olhando, sem precisar de legenda no botão. */
    .dev-node-btn-sub {
      background: rgb(226, 235, 255);
      color: rgb(23, 52, 105);
      border-color: rgba(255, 255, 255, 0.6);
    }

    .dev-node-btn-sub:hover,
    .dev-node-btn-sub:focus-visible {
      background: rgb(255, 255, 255);
    }

    /* --- Dados do mapa: exportar/importar. Fica ao lado do cadeado e só
       aparece no modo dev, porque importar substitui o mapa inteiro. --- */
    .data-toggle {
      right: 4.4rem;
      display: none;
    }

    body.dev-mode .data-toggle {
      display: grid;
    }

    /* Aparência: mesmo padrão do botão de dados, uma posição adiante. */
    .theme-toggle {
      right: 7.3rem;
      display: none;
    }

    body.dev-mode .theme-toggle {
      display: grid;
    }

    .dev-btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(160, 190, 255, 0.35);
      color: rgb(230, 238, 255);
    }

    .dev-data-actions {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .dev-data-hint {
      font-size: 0.76rem;
      color: rgba(230, 238, 255, 0.6);
      margin: 0.1rem 0 0.6rem;
      line-height: 1.4;
    }

    .dev-word-count {
      font-size: 0.74rem;
      font-weight: 600;
      color: rgba(230, 238, 255, 0.6);
      margin: -0.5rem 0 0;
      font-variant-numeric: tabular-nums;
    }

    .dev-word-count.is-over {
      color: rgb(255, 150, 150);
    }

    .dev-input-long {
      min-height: 190px;
      line-height: 1.45;
    }

    .dev-file-input {
      display: none;
    }

    /* --- Painel de aparência: uma linha por item colorível. O <input
       type=color> é pequeno e sem moldura em quase todo navegador, então
       ganha uma caixa própria para virar um alvo de clique decente. --- */
    .dev-color-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.32rem 0;
    }

    .dev-color-row .dev-color-name {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 0.82rem;
      color: rgba(230, 238, 255, 0.9);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dev-color-swatch {
      width: 40px;
      height: 26px;
      flex: none;
      padding: 0;
      border: 1px solid rgba(160, 190, 255, 0.4);
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
    }

    .dev-color-swatch::-webkit-color-swatch-wrapper {
      padding: 2px;
    }

    .dev-color-swatch::-webkit-color-swatch {
      border: 0;
      border-radius: 4px;
    }

    .dev-color-swatch::-moz-color-swatch {
      border: 0;
      border-radius: 4px;
    }

    .dev-reset-btn {
      flex: none;
      padding: 0.2rem 0.5rem;
      font-size: 0.7rem;
      border-radius: 6px;
      border: 1px solid rgba(160, 190, 255, 0.3);
      background: transparent;
      color: rgba(230, 238, 255, 0.65);
      cursor: pointer;
    }

    .dev-reset-btn:hover:not(:disabled),
    .dev-reset-btn:focus-visible:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
      color: rgb(255, 255, 255);
    }

    .dev-reset-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .dev-section-title {
      margin: 1rem 0 0.2rem;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(230, 238, 255, 0.55);
    }

    .dev-check {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: rgba(230, 238, 255, 0.9);
      cursor: pointer;
      padding: 0.32rem 0;
    }

    /* A lista de galhos pode passar de uma dezena: rola por dentro em vez
       de esticar o modal para fora da tela. */
    .dev-branch-list {
      max-height: 240px;
      overflow-y: auto;
      overscroll-behavior: contain;
      margin: 0;
      padding-right: 0.2rem;
    }

    @media (max-width: 720px) {
      .mindmap-shell {
        min-height: auto;
        padding: 4.4rem 1rem 2rem;
      }

        top: 1.35rem;
        left: 1.2rem;
      }

    }

      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

":"node","children":[]},{"id":"node-mtn8o2us-13","label":"FARMÁCIA","url":"","pdf":"","color":"","type":"node","children":[]},{"id":"node-mtn8o8bf-14","label":"COORDENAÇÃO","url":"","pdf":"","color":"","type":"node","children":[{"id":"node-mtyoi3wm-147","label":"TRANSPORTE","url":"","pdf":"","color":"","type":"node","children":[{"id":"node-mtyojjvt-151","label":"COMO SOLICITAR TRANSPORTE PARA FUNCIONÁRIO","url":"","pdf":"","color":"","type":"subnode","children":[]},{"id":"node-mtyok2io-152","label":"COMO SOLICITAR, APROVAR E PRESTAR CONTAS DE DIÁRIA","url":"","pdf":"","color":"","type":"subnode","children":[]},{"id":"node-mtypdvsm-194","label":"RENOVAÇÃO DO BENEFICIO PASSE LIVRE","url":"","pdf":"","color":"","type":"subnode","children":[]}]},{"id":"node-mtyoie6w-148","label":"BOLSA FAMÍLIA","url":"","pdf":"","color":"","type":"node","children":[{"id":"node-mtyokxsx-153","label":"REGISTRO DE ACOMPANHAMENTO DO BOLSA FAMÍLIA NO E-GESTOR","url":"","pdf":"","color":"","type":"subnode","children":[]},{"id":"node-mtyolbi8-154","label":"GERAR MAPA DE ACOMPANHAMENTO","url":"","pdf":"","color":"","type":"subnode","children":[]}]},{"id":"node-mtyoihzs-149","label":"PSE","url":"","pdf":"","color":"","type":"node","children":[]},{"id":"node-mtyolmnc-155","label":"COORDENAÇÃO DO CUIDADO","url":"","pdf":"","color":"","type":"node","children":[{"id":"node-mtyolykg-156","label":"COMO SOLICITAR CUIDADO COMPARTILHADO","url":"","pdf":"","color":"","type":"subnode","children":[]}]},{"id":"node-mtyomnju-157","label":"PICS","url":"","pdf":"","color":"","type":"node","children":[{"id":"node-mtyon5e9-158","label":"CADASTRO PARA PROFISSIONAIS COM CAPACITAÇÃO EM PICS","url":"","pdf":"","color":"","type":"subnode","children":[]}]},{"id":"node-mtyonpwi-159","label":"SOLICITAÇÕES AO NGA","url":"","pdf":"","color":"","type":"node","children":[{"id":"node-mtyouilq-166","label":"MANUAL DO AGENTE ADM DO NGA","url":"","pdf":"","color":"","type":"subnode","children":[]},{"id":"node-mtyouvb1-167","label":"MANUAL DO TÉCNICO DO NGA","url":"","pdf":"","color":"","type":"subnode","children":[]},{"id":"node-mtyov8wt-168","label":"MANUAL DO COORDENADOR","url":"","pdf":"","color":"","type":"subnode","children":[]}]},{"id":"node-mtyoohnu-160","label":"APPS E PROGRAMAS","url":"","pdf":"","color":"","type":"node","children":[{"id":"node-mtyoppyz-161","label":"PAGINA WIKI","url":"","pdf":"","color":"","type":"node","children":[]},{"id":"node-mtyoqhos-162","label":"INSTALAÇÃO DO GOOGLE MEET","url":"","pdf":"","color":"","type":"node","children":[]}]},{"id":"node-mtyoruyd-163","label":"ALVARÁS E LICENÇAS","url":"","pdf":"","color":"","type":"node","children":[{"id":"node-mtyos2mt-164","label":"VIGILÂNCIA SANITÁRIA","url":"","pdf":"","color":"","type":"node","children":[]},{"id":"node-mtyosbn0-165","label":"RT","url":"","pdf":"","color":"","type":"node","children":[{"id":"node-mtyoz3di-173","label":"ALTERAÇÃO DE RT","url":"","pdf":"","color":"","type":"subnode","children":[]},{"id":"node-mtyp05ts-174","label":"ELABORAÇÃO E PUBLICAÇÃO NA PÁGINA \"PROTOCOLOS, POP's E OUTROS DOCUMENTOS DA SAÚDE","url":"","pdf":"","color":"","type":"subnode","children":[]}]}]},{"id":"node-mtyovlat-169","label":"ESF","url":"","pdf":"","color":"","type":"node","children":[{"id":"node-mtyowgpa-170","label":"FLUXOGRAMA DE AMPLIAÇÃO E CREDENCIAMENTO DA ESF","url":"","pdf":"","color":"","type":"subnode","children":[]},{"id":"node-mtyoxa9f-171","label":"FLUXOGRAMA DE IDENTIFICAÇÃO E DIRECIONAMENTO DAS PENDÊNCIAS FINANCEIRAS NA APS","url":"","pdf":"","color":"","type":"subnode","children":[]},{"id":"node-mtyoxyhz-172","label":"FLUXOGRAMA DO PROCESSO DE GLOSA NA PRODUÇÃO DA APS","url":"","pdf":"","color":"","type":"subnode","children":[]}]}]}]}}</script>
  <script src="/_sdk/0b5911494a4ff060.editing_sdk.js" integrity="sha512-/vyQ+jNH4Q/uooDsnMcX6o3IxIcmA7RW0TJmBR88seymBCMyLn9QjvQ8qpBP5hx5JmcAoEFUTuGK9amUMyPFpA=="></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const stage = document.getElementById("map-stage");
      const viewport = document.getElementById("camera-viewport");
      const world = document.getElementById("world");
      const branchesLayer = document.getElementById("branches-layer");
      const connectorsSvg = document.querySelector(".connectors");
      const coreArea = document.getElementById("core-area");
      const coreButton = document.getElementById("core-button");
      const coreLabel = coreButton.querySelector(".node-label");
      const status = document.getElementById("map-status");

      const zoomInBtn = document.getElementById("camera-zoom-in");
      const zoomOutBtn = document.getElementById("camera-zoom-out");
      const fitBtn = document.getElementById("camera-fit");
      const zoomReadout = document.getElementById("camera-zoom-readout");
      const dragHint = document.getElementById("drag-hint");

      const DEV_PASSWORD = "2387";
      const devToggle = document.getElementById("dev-toggle");
      const dataToggle = document.getElementById("data-toggle");
      const themeToggle = document.getElementById("theme-toggle");
      const importFile = document.getElementById("import-file");
      const devOverlay = document.getElementById("dev-overlay");
      const devModalClose = document.getElementById("dev-modal-close");
      const devModalBody = document.getElementById("dev-modal-body");
      let devUnlocked = false;

      // --- PDFs do projeto: cada subnó pode apontar para um arquivo salvo
      // em pdfs/ na raiz do site. Como a página é estática, não há como
      // listar a pasta em tempo real — pdfs/manifest.json funciona como o
      // índice: um array de nomes de arquivo, atualizado à mão sempre que
      // um PDF novo é colocado na pasta. O campo de PDF no formulário
      // aceita qualquer nome digitado (funciona mesmo sem o manifesto,
      // como ao abrir o arquivo direto do disco), e usa esse índice só
      // para sugerir os nomes já conhecidos via <datalist>.
      let pdfLibrary = [];
      function refreshPdfDatalist() {
        const list = document.getElementById("pdf-library-list");
        if (!list) return;
        list.innerHTML = pdfLibrary.map(
          (name) => `<option value="${escapeHtml(name)}"></option>`
        ).join("");
      }
      fetch("pdfs/manifest.json")
        .then((res) => (res.ok ? res.json() : []))
        .then((list) => {
          pdfLibrary = Array.isArray(list) ? list : [];
          refreshPdfDatalist();
        })
        .catch(() => { pdfLibrary = []; });

      // Geometria: o tronco fica no centro e só os setores que saem dele se
      // espalham em 360°. Dali para dentro, cada galho cresce na horizontal
      // para o lado em que nasceu, com os irmãos empilhados na vertical —
      // é o que mantém a largura do galho independente do ângulo. Só nós
      // visíveis ocupam espaço: quem está fechado não reserva lugar nenhum.
      const ROOT = { x: 0, y: 0, r: 84 };
      const NODE_W = 214;
      const NODE_H = 70;
      const SUB_H = 54;

      const RING_FIRST = 300;      // raio mínimo do anel dos setores
      const RING_PAD = 34;         // folga entre setores vizinhos, no anel
      const STEP_X = 254;          // avanço horizontal por geração dentro do galho
      const SIBLING_GAP = 24;      // folga vertical entre irmãos dentro do galho
      const WORLD_MARGIN = 160;
      const TWEEN_MS = 450;        // duração da reacomodação do mapa

      const SUB_TALL_AT = 96;      // acima disso o subnó perde o formato de pílula
      const SUB_WORD_LIMIT = 400;
      const NODE_CHAR_LIMIT = 80;

      const PALETTE = [
        { bg: "rgb(26, 157, 158)", fg: "rgb(255, 255, 255)", subBg: "rgb(217, 245, 241)", subFg: "rgb(18, 60, 66)" },
        { bg: "rgb(72, 111, 197)", fg: "rgb(255, 255, 255)", subBg: "rgb(224, 233, 255)", subFg: "rgb(23, 52, 105)" },
        { bg: "rgb(164, 74, 119)", fg: "rgb(255, 255, 255)", subBg: "rgb(249, 225, 235)", subFg: "rgb(100, 33, 63)" },
        { bg: "rgb(214, 109, 64)", fg: "rgb(255, 255, 255)", subBg: "rgb(255, 233, 216)", subFg: "rgb(109, 43, 23)" },
        { bg: "rgb(90, 150, 90)", fg: "rgb(255, 255, 255)", subBg: "rgb(224, 245, 224)", subFg: "rgb(30, 80, 30)" },
        { bg: "rgb(120, 90, 190)", fg: "rgb(255, 255, 255)", subBg: "rgb(232, 224, 250)", subFg: "rgb(55, 30, 100)" },
      ];

      // === Aparência ======================================================
      // O tema guarda só o que foge do padrão. Enquanto um galho não tem cor
      // escolhida, ele segue a PALETTE pelo índice — é assim que o mapa
      // continua com exatamente as mesmas cores de antes deste recurso.
      // As cores dos galhos são indexadas pelo id do nó do setor, e não pela
      // posição: apagar ou criar um setor não deve embaralhar as cores dos
      // outros.
      // ====================================================================
      const DEFAULT_THEME = {
        background: "#0b1736",
        core: "#f6be58",       // primeira parada do gradiente do tronco
        coreEnd: "#ef8854",    // segunda parada
        line: "#a0beff",       // conectores (aplicados com o alfa de --line)
        blobA: "#19b7bb",
        blobB: "#f5b14b",
        blobs: true,
        branches: {},          // { [id do setor]: "#rrggbb" }
      };
      const LINE_ALPHA = 0.56;
      const BLOB_A_ALPHA = 0.24;
      const BLOB_B_ALPHA = 0.18;

      let theme = Object.assign({}, DEFAULT_THEME, { branches: {} });

      // --- Aritmética de cor ----------------------------------------------
      function hexToRgb(hex) {
        const clean = String(hex || "").trim().replace("#", "");
        const full = clean.length === 3
          ? clean[0] + clean[0] + clean[1] + clean[1] + clean[2] + clean[2]
          : clean;
        const num = parseInt(full, 16);
        if (full.length !== 6 || isNaN(num)) return { r: 0, g: 0, b: 0 };
        return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
      }

      function rgbToHex(c) {
        const part = (v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, "0");
        return "#" + part(c.r) + part(c.g) + part(c.b);
      }

      function rgbCss(c, alpha) {
        const r = Math.round(c.r), g = Math.round(c.g), b = Math.round(c.b);
        return alpha === undefined
          ? `rgb(${r}, ${g}, ${b})`
          : `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      function mixRgb(a, b, t) {
        return {
          r: a.r + (b.r - a.r) * t,
          g: a.g + (b.g - a.g) * t,
          b: a.b + (b.b - a.b) * t,
        };
      }

      // Luminância relativa (WCAG) — decide entre texto branco e texto
      // escuro por cima da cor escolhida, para o rótulo nunca sumir.
      function luminance(c) {
        const chan = (v) => {
          const s = v / 255;
          return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
        };
        return 0.2126 * chan(c.r) + 0.7152 * chan(c.g) + 0.0722 * chan(c.b);
      }

      const WHITE = { r: 255, g: 255, b: 255 };
      const BLACK = { r: 0, g: 0, b: 0 };
      const INK_RGB = { r: 11, g: 23, b: 54 };
      const INK = rgbCss(INK_RGB);     // o azul-tinta do tema, para texto escuro

      function contrast(a, b) {
        const la = luminance(a);
        const lb = luminance(b);
        return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
      }

      // Texto por cima de uma cor escolhida à mão. O branco tem preferência
      // — é o que a paleta padrão usa, e trocá-lo à toa deixaria um galho
      // personalizado destoando dos outros —, mas cede para a tinta quando
      // não alcança 4.5:1, o mínimo legível para texto desse tamanho.
      function textOver(bg) {
        const onWhite = contrast(WHITE, bg);
        if (onWhite >= 4.5) return rgbCss(WHITE);
        return contrast(INK_RGB, bg) > onWhite ? INK : rgbCss(WHITE);
      }

      // Deriva as quatro cores de um galho a partir de uma cor só: a forte
      // do nó, o texto que a acompanha, e o par claro usado pelos subnós.
      function derivePalette(hex) {
        const base = hexToRgb(hex);
        return {
          bg: rgbCss(base),
          fg: textOver(base),
          subBg: rgbCss(mixRgb(base, WHITE, 0.86)),
          subFg: rgbCss(mixRgb(base, BLACK, 0.62)),
        };
      }

      // Escreve o tema na página. Tudo o que o tema toca vira estilo inline
      // ou variável CSS — nada some quando o mapa é reconstruído, e o HTML
      // exportado já nasce com as cores certas, antes mesmo do script rodar.
      function applyTheme() {
        const rootStyle = document.documentElement.style;
        const bg = hexToRgb(theme.background);
        document.body.style.background = rgbCss(bg);
        // Fundo claro inverte os textos que vivem por cima dele (eyebrow,
        // legenda, instrução, botões do topo), senão eles somem.
        document.body.classList.toggle("on-light", luminance(bg) > 0.45);

        rootStyle.setProperty("--line", rgbCss(hexToRgb(theme.line), LINE_ALPHA));
        rootStyle.setProperty("--blob-a", rgbCss(hexToRgb(theme.blobA), BLOB_A_ALPHA));
        rootStyle.setProperty("--blob-b", rgbCss(hexToRgb(theme.blobB), BLOB_B_ALPHA));
        document.body.classList.toggle("no-blobs", !theme.blobs);

        const coreA = hexToRgb(theme.core);
        const coreB = hexToRgb(theme.coreEnd);
        coreButton.style.background =
          "linear-gradient(135deg, " + rgbCss(coreA) + ", " + rgbCss(coreB) + ")";
        const coreFg = textOver(mixRgb(coreA, coreB, 0.5));
        coreButton.style.color = coreFg;
        coreLabel.style.color = coreFg;

        applyNodeColors();
      }

      // Repinta os nós já montados sem reconstruir a árvore: mudar cor não
      // mexe em tamanho nem em posição, então não há por que remedir.
      function applyNodeColors() {
        nodeById.forEach((node) => {
          if (node.depth === 0 || !node.el) return;
          const button = node.el.querySelector(".branch-button");
          if (!button) return;
          const color = colorFor(node);
          button.style.background = color.bg;
          button.style.color = color.fg;
          const name = button.querySelector(".branch-name");
          if (name) name.style.color = color.fg;
        });
      }

      // --- Categorias ---------------------------------------------------
      // "node"    : galho. Nasce de qualquer nó e continua a árvore.
      // "subnode" : folha do galho. Só nasce de um nó-folha (um nó que
      //             ainda não tem nenhum filho do tipo "node") e é sempre
      //             terminal — não recebe filhos de espécie alguma.
      // Consequência das duas regras juntas: um nó ou continua o galho com
      // nós, ou o encerra com subnós. Nunca as duas coisas ao mesmo tempo.
      const NODE = "node";
      const SUBNODE = "subnode";

      const treeData = {
        root: {
          id: "root", label: "BUCAREIN", url: "", type: NODE,
          children: [
            {
              id: "objective", label: "Objetivo", url: "", type: NODE, children: [
                { id: "objective-sub-1", label: "Resultado desejado", url: "", type: SUBNODE, children: [] },
                { id: "objective-sub-2", label: "Critério de sucesso", url: "", type: SUBNODE, children: [] },
              ],
            },
            {
              id: "ideas", label: "Ideias", url: "", type: NODE, children: [
                { id: "ideas-sub-1", label: "Possibilidades", url: "", type: SUBNODE, children: [] },
                { id: "ideas-sub-2", label: "Perguntas-chave", url: "", type: SUBNODE, children: [] },
              ],
            },
            {
              id: "resources", label: "Recursos", url: "", type: NODE, children: [
                { id: "resources-sub-1", label: "Pessoas e apoio", url: "", type: SUBNODE, children: [] },
                { id: "resources-sub-2", label: "Ferramentas", url: "", type: SUBNODE, children: [] },
              ],
            },
            {
              id: "next", label: "Próximos passos", url: "", type: NODE, children: [
                { id: "next-sub-1", label: "Primeira ação", url: "", type: SUBNODE, children: [] },
                { id: "next-sub-2", label: "Prazo e revisão", url: "", type: SUBNODE, children: [] },
              ],
            },
          ],
        },
      };

      function isSub(node) {
        return node.type === SUBNODE;
      }

      function hasNodeChild(node) {
        return node.children.some((child) => !isSub(child));
      }

      function hasSubChild(node) {
        return node.children.some(isSub);
      }

      // Um nó aceita novos nós enquanto não tiver encerrado o galho com
      // subnós. Subnós nunca aceitam filhos.
      function canAddNode(node) {
        return !isSub(node) && !hasSubChild(node);
      }

      // Subnós só pendem da ponta de um galho. A raiz é o tronco: ela
      // sempre inicia galhos, nunca recebe folhagem direto.
      function canAddSub(node) {
        return !isSub(node) && node !== treeData.root && !hasNodeChild(node);
      }

      // Meia-largura e meia-altura da caixa. A altura do subnó depende do
      // texto renderizado, então vem de measureNodes(); as constantes só
      // valem como estimativa antes da primeira medição.
      function halfW(node) {
        return node.depth === 0 ? ROOT.r : (node.w || NODE_W) / 2;
      }

      function halfH(node) {
        if (node.depth === 0) return ROOT.r;
        return (node.h || (isSub(node) ? SUB_H : NODE_H)) / 2;
      }

      function countWords(text) {
        const trimmed = String(text).trim();
        return trimmed ? trimmed.split(/\s+/).length : 0;
      }

      // Rótulos de subnó podem ter centenas de palavras; onde o texto é lido
      // fora da caixa (leitor de tela, aviso de remoção) entra só um resumo.
      function shortLabel(node, max) {
        const limit = max || 60;
        const flat = String(node.label).replace(/\s+/g, " ").trim();
        return flat.length > limit ? flat.slice(0, limit - 1) + "…" : flat;
      }

      let nodeById = new Map();
      let nodeCounter = 0;
      function newNodeId() {
        nodeCounter += 1;
        return "node-" + Date.now().toString(36) + "-" + nodeCounter;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, (ch) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[ch]));
      }

      // --- Persistência: o localStorage é o rascunho automático (salva a
      // cada mudança do modo dev, no mesmo navegador/perfil). O mapa
      // portátil sai por exportação, em .json ou em .html autocontido. ---
      const STORAGE_KEY = "mapaPOPs.treeData.v1";
      const THEME_KEY = "mapaPOPs.theme.v1";
      const SEED_STAMP_KEY = "mapaPOPs.seedStamp.v1";
      const MAP_FORMAT = "mapaPOPs";
      const MAP_FORMAT_VERSION = 3;

      function serializeNode(node) {
        return {
          id: node.id,
          label: node.label,
          url: node.url || "",
          pdf: node.pdf || "",
          color: node.color || "",
          type: isSub(node) ? SUBNODE : NODE,
          children: node.children.map(serializeNode),
        };
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeNode(treeData.root)));
        } catch (e) {
          // localStorage indisponível (ex.: navegação privada) — ignora.
        }
      }

      // O tema é guardado à parte da árvore: são coisas com ciclos de vida
      // diferentes (importar um mapa não precisa levar junto as cores de
      // quem exportou, mas pode). Só sobrevivem as chaves conhecidas.
      function sanitizeTheme(raw) {
        const clean = Object.assign({}, DEFAULT_THEME, { branches: {} });
        if (!raw || typeof raw !== "object") return clean;
        ["background", "core", "coreEnd", "line", "blobA", "blobB"].forEach((key) => {
          if (typeof raw[key] === "string" && /^#[0-9a-f]{3,6}$/i.test(raw[key].trim())) {
            clean[key] = rgbToHex(hexToRgb(raw[key]));
          }
        });
        if (typeof raw.blobs === "boolean") clean.blobs = raw.blobs;
        if (raw.branches && typeof raw.branches === "object") {
          Object.keys(raw.branches).forEach((id) => {
            const value = raw.branches[id];
            if (typeof value === "string" && /^#[0-9a-f]{3,6}$/i.test(value.trim())) {
              clean.branches[id] = rgbToHex(hexToRgb(value));
            }
          });
        }
        return clean;
      }

      function saveTheme() {
        try {
          localStorage.setItem(THEME_KEY, JSON.stringify(theme));
        } catch (e) {
          // sem localStorage o tema vale só para esta sessão.
        }
      }

      function loadTheme() {
        try {
          const raw = localStorage.getItem(THEME_KEY);
          return raw ? sanitizeTheme(JSON.parse(raw)) : null;
        } catch (e) {
          return null;
        }
      }

      // Mapas salvos antes das categorias não têm `type`. Nesses casos a
      // categoria é inferida da aparência que o nó já tinha: da segunda
      // geração em diante, quem não tinha filhos era desenhado na cor
      // clara — ou seja, já era um subnó na prática.
      function reviveChildren(list, depth) {
        if (!Array.isArray(list)) return [];
        return list.map((n) => {
          const children = reviveChildren(n && n.children, depth + 1);
          let type = n && (n.type === SUBNODE || n.type === NODE) ? n.type : null;
          if (!type) type = depth >= 2 && children.length === 0 ? SUBNODE : NODE;
          if (children.length) type = NODE; // subnó é sempre terminal
          return {
            id: (n && n.id) || newNodeId(),
            label: (n && n.label) || "",
            url: (n && n.url) || "",
            pdf: (n && n.pdf) || "",
            color: (n && typeof n.color === "string" && /^#[0-9a-f]{3,6}$/i.test(n.color.trim()))
              ? rgbToHex(hexToRgb(n.color))
              : "",
            type: type,
            children: children,
          };
        });
      }

      // Garante a exclusividade entre as categorias em dados antigos: se um
      // nó ficou com filhos das duas espécies, os subnós são promovidos a
      // nós — assim nada some do mapa e a regra volta a valer.
      function normalizeTypes(node) {
        if (node.children.length && hasNodeChild(node)) {
          node.children.forEach((child) => { child.type = NODE; });
        }
        node.children.forEach(normalizeTypes);
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return null;
          return parsed;
        } catch (e) {
          return null;
        }
      }

      // Aceita tanto o envelope de exportação quanto um nó solto — que é o
      // formato gravado no localStorage desde a v05. Assim um mapa antigo
      // continua abrindo sem conversão.
      function readEnvelope(parsed) {
        if (!parsed || typeof parsed !== "object") return null;
        if (parsed.format === MAP_FORMAT && parsed.root && typeof parsed.root === "object") {
          return parsed.root;
        }
        if (Array.isArray(parsed.children) || typeof parsed.label === "string") return parsed;
        return null;
      }

      function buildEnvelope() {
        return {
          format: MAP_FORMAT,
          version: MAP_FORMAT_VERSION,
          exportedAt: new Date().toISOString(),
          theme: theme,
          root: serializeNode(treeData.root),
        };
      }

      // O tema viaja no envelope, mas só é adotado se vier de fato — mapas
      // da v2 não têm esse campo e devem manter as cores de quem importa.
      function adoptTheme(envelope) {
        if (!envelope || typeof envelope !== "object" || !envelope.theme) return false;
        theme = sanitizeTheme(envelope.theme);
        applyTheme();
        saveTheme();
        return true;
      }

      // Substitui a árvore inteira por um nó-raiz vindo de arquivo ou do
      // seed embutido, passando pelo mesmo saneamento do carregamento
      // normal (tipos inferidos e exclusividade nó/subnó reimposta).
      function adoptRoot(rootData) {
        treeData.root.label = rootData.label || treeData.root.label;
        treeData.root.url = "";
        treeData.root.pdf = "";
        treeData.root.type = NODE;
        treeData.root.children = reviveChildren(rootData.children, 1);
        normalizeTypes(treeData.root);
        coreLabel.textContent = treeData.root.label;
      }

      function readSeed() {
        const el = document.getElementById("map-seed");
        if (!el || !el.textContent.trim()) return null;
        try {
          return JSON.parse(el.textContent);
        } catch (e) {
          return null;
        }
      }

      function downloadFile(filename, mime, text) {
        const blob = new Blob([text], { type: mime });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function stamp() {
        const d = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      }

      // --- Layout: anel radial no tronco, galhos lineares ------------------
      // Só os setores que saem do tronco se espalham em 360°. De cada setor
      // para dentro o galho cresce na horizontal, para o lado em que nasceu,
      // com os irmãos empilhados na vertical — assim a largura do galho não
      // depende do ângulo (uma caixa tem 214px de largura contra 70px de
      // altura: empilhada de lado ficaria três vezes mais larga).
      //
      // Só nós VISÍVEIS ocupam espaço. Reservar lugar para galhos fechados
      // era o que abria os buracos no anel: um setor com 7 filhos ocultos
      // pesava sete vezes mais que o vizinho fechado e engolia um terço do
      // círculo. Nós ocultos herdam a posição do pai, para emergirem de
      // dentro dele quando abrem.
      //
      // As caixas não giram: rótulo inclinado seria ilegível.
      // ---------------------------------------------------------------------
      function layoutTree() {
        nodeById = new Map();

        // Índice e parentesco primeiro: computeVisibility() e colorFor()
        // dependem de depth/parent, e as duas rodam antes do posicionamento.
        (function index(node, depth, parent) {
          node.depth = depth;
          node.parent = parent;
          nodeById.set(node.id, node);
          node.children.forEach((child) => index(child, depth + 1, node));
        })(treeData.root, 0, null);

        computeVisibility();

        const sectors = treeData.root.children.filter((node) => node.visible);
        if (!sectors.length) {
          treeData.root.x = WORLD_MARGIN + ROOT.r;
          treeData.root.y = WORLD_MARGIN + ROOT.r;
          nodeById.forEach((node) => {
            if (node.depth === 0) return;
            node.x = treeData.root.x;
            node.y = treeData.root.y;
          });
          return;
        }

        function visibleChildren(node) {
          return node.children.filter((child) => child.visible);
        }

        // Altura que o galho ocupa na vertical, empilhando irmãos visíveis.
        function branchHeight(node) {
          const kids = visibleChildren(node);
          if (!kids.length) return node.h || (isSub(node) ? SUB_H : NODE_H);
          const total = kids.reduce((sum, kid) => sum + branchHeight(kid), 0)
            + SIBLING_GAP * (kids.length - 1);
          return Math.max(node.h || NODE_H, total);
        }

        // Quantas gerações visíveis o galho tem, para saber sua largura.
        function branchDepth(node) {
          const kids = visibleChildren(node);
          if (!kids.length) return 1;
          return 1 + Math.max.apply(null, kids.map(branchDepth));
        }

        // Posiciona um galho inteiro no eixo horizontal, a partir do setor.
        // `dir` é +1 para a metade direita do anel e -1 para a esquerda.
        function placeBranch(node, dir) {
          const kids = visibleChildren(node);
          if (!kids.length) return;
          const heights = kids.map(branchHeight);
          const total = heights.reduce((a, b) => a + b, 0) + SIBLING_GAP * (kids.length - 1);
          let cursor = node.y - total / 2;
          kids.forEach((kid, i) => {
            kid.x = node.x + dir * STEP_X;
            kid.y = cursor + heights[i] / 2;
            cursor += heights[i] + SIBLING_GAP;
            placeBranch(kid, dir);
          });
        }

        // Espaço que o setor ocupa na direção tangente ao anel. Um galho
        // deitado (setor à direita ou à esquerda) gasta a própria altura;
        // um galho no topo ou embaixo atravessa o anel de lado e gasta a
        // largura. Daí o W·|sen θ| + H·|cos θ|.
        function tangentialNeed(node, angle) {
          const w = (branchDepth(node) - 1) * STEP_X + NODE_W;
          const h = branchHeight(node);
          return Math.abs(w * Math.sin(angle)) + Math.abs(h * Math.cos(angle)) + RING_PAD;
        }

        // A necessidade depende do ângulo e o ângulo depende da necessidade:
        // duas passadas resolvem — ângulos iguais como chute, mede, realoca.
        const start = -Math.PI / 2;
        let angles = sectors.map((_, i) => start + (Math.PI * 2 * (i + 0.5)) / sectors.length);
        let radius = RING_FIRST;

        for (let pass = 0; pass < 2; pass += 1) {
          const needs = sectors.map((node, i) => tangentialNeed(node, angles[i]));
          const totalNeed = needs.reduce((a, b) => a + b, 0) || 1;
          // R·ângulo_i >= necessidade_i para todo i equivale a R >= Σ/2π,
          // quando o ângulo é repartido proporcional à necessidade.
          radius = Math.max(RING_FIRST, totalNeed / (Math.PI * 2));
          let cursor = start;
          angles = needs.map((need) => {
            const span = (Math.PI * 2 * need) / totalNeed;
            const mid = cursor + span / 2;
            cursor += span;
            return mid;
          });
        }

        treeData.root.x = 0;
        treeData.root.y = 0;
        sectors.forEach((node, i) => {
          node.angle = angles[i];
          node.x = Math.cos(angles[i]) * radius;
          node.y = Math.sin(angles[i]) * radius;
          placeBranch(node, Math.cos(angles[i]) >= 0 ? 1 : -1);
        });

        // Quem está oculto nasce e morre na posição do pai.
        (function settleHidden(node) {
          node.children.forEach((child) => {
            if (!child.visible) {
              child.x = node.x;
              child.y = node.y;
            }
            settleHidden(child);
          });
        })(treeData.root);

        // Desloca tudo para o canvas ficar em números positivos; o centro se
        // move conforme o mapa abre e fecha.
        let minX = -ROOT.r;
        let minY = -ROOT.r;
        nodeById.forEach((node) => {
          if (node.depth === 0 || !node.visible) return;
          minX = Math.min(minX, node.x - halfW(node));
          minY = Math.min(minY, node.y - halfH(node));
        });

        const offsetX = WORLD_MARGIN - minX;
        const offsetY = WORLD_MARGIN - minY;
        nodeById.forEach((node) => {
          node.x += offsetX;
          node.y += offsetY;
        });
      }

      // O setor (galho) a que o nó pertence: o ancestral logo abaixo do
      // tronco. É ele quem carrega a cor no painel de aparência.
      function sectorOf(node) {
        let top = node;
        while (top.depth > 1) top = top.parent;
        return top;
      }

      function paletteForSector(sector) {
        const custom = sector && theme.branches[sector.id];
        if (custom) return derivePalette(custom);
        const idx = Math.max(0, treeData.root.children.indexOf(sector));
        return PALETTE[idx % PALETTE.length];
      }

      // A cor vem do galho a que o nó pertence; a categoria escolhe entre a
      // versão forte (nó) e a clara (subnó) dessa mesma cor.
      // Um nó pode ter cor própria (node.color): ela vale para ele e para os
      // descendentes, até que outro descendente declare a sua. Ou seja, o
      // dono da cor é o ancestral mais próximo que tiver escolhido uma —
      // sem ninguém na linhagem, manda a paleta do setor.
      function colorFor(node) {
        let owner = node;
        while (owner && owner.depth > 0 && !owner.color) owner = owner.parent;
        const palette = owner && owner.depth > 0 && owner.color
          ? derivePalette(owner.color)
          : paletteForSector(sectorOf(node));
        return isSub(node)
          ? { bg: palette.subBg, fg: palette.subFg }
          : { bg: palette.bg, fg: palette.fg };
      }

      // Onde a reta centro→centro cruza a borda da caixa. No radial os nós
      // se ligam em qualquer direção, então não dá para fixar "sai pela
      // direita, entra pela esquerda" como no layout anterior.
      function borderPoint(node, towardX, towardY) {
        const dx = towardX - node.x;
        const dy = towardY - node.y;
        if (!dx && !dy) return { x: node.x, y: node.y };

        if (node.depth === 0) {
          const len = Math.hypot(dx, dy);
          return { x: node.x + (dx / len) * ROOT.r, y: node.y + (dy / len) * ROOT.r };
        }

        const hw = halfW(node);
        const hh = halfH(node);
        const scaleX = dx ? hw / Math.abs(dx) : Infinity;
        const scaleY = dy ? hh / Math.abs(dy) : Infinity;
        const s = Math.min(scaleX, scaleY);
        return { x: node.x + dx * s, y: node.y + dy * s };
      }

      function refreshAriaControls() {
        coreButton.setAttribute(
          "aria-controls",
          treeData.root.children.map((c) => "node-" + c.id).join(" ")
        );
      }

      function refreshWorldSize() {
        let maxX = treeData.root.x + ROOT.r;
        let maxY = treeData.root.y + ROOT.r;
        nodeById.forEach((node) => {
          if (node.depth === 0) return;
          maxX = Math.max(maxX, node.x + halfW(node));
          maxY = Math.max(maxY, node.y + halfH(node));
        });
        world.style.width = Math.max(1040, maxX + WORLD_MARGIN) + "px";
        world.style.height = Math.max(920, maxY + WORLD_MARGIN) + "px";
      }

      // O conector é criado uma vez e depois só tem o `d` reescrito. Recriar
      // trinta paths a cada quadro da reacomodação seria desperdício, e o
      // comprimento — que a animação de traçado precisa — sai de um hypot,
      // já que a linha é reta: getTotalLength() num laço de animação custa
      // caro à toa.
      function addConnectorFor(node) {
        if (!node.parent) return;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("id", "line-" + node.id);
        path.setAttribute("class", "connector" + (isSub(node) ? " is-subnode" : ""));
        connectorsSvg.appendChild(path);
        node.path = path;
      }

      function drawConnector(node) {
        const parent = node.parent;
        if (!parent || !node.path) return;
        const start = borderPoint(parent, node.x, node.y);
        const end = borderPoint(node, parent.x, parent.y);
        const length = Math.hypot(end.x - start.x, end.y - start.y);
        node.path.setAttribute("d", "M " + start.x + " " + start.y + " L " + end.x + " " + end.y);
        node.lineLength = length;
        node.path.style.strokeDasharray = String(length);
        node.path.style.strokeDashoffset = node.visible ? "0" : String(length);
      }

      // Os botões de criação aparecem só quando a regra da categoria
      // permite: o de "novo nó" some depois que o galho foi encerrado com
      // subnós, e o de "novo subnó" só existe na ponta de um galho. A regra
      // vira algo que se lê na tela, em vez de virar mensagem de erro.
      function buildDevControls(node) {
        const actions = [{ action: "edit", icon: "pencil", title: "Editar" }];
        if (canAddNode(node)) {
          actions.push({ action: "add-node", icon: "git-branch", title: "Novo nó (continua o galho)" });
        }
        if (canAddSub(node)) {
          actions.push({ action: "add-subnode", icon: "plus", title: "Novo subnó (folha do galho)", sub: true });
        }
        if (node !== treeData.root) {
          actions.push({ action: "delete", icon: "trash-2", title: "Remover", danger: true });
        }

        const wrap = document.createElement("div");
        wrap.className = "dev-node-controls";
        actions.forEach((a) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "dev-node-btn"
            + (a.danger ? " dev-node-btn-danger" : "")
            + (a.sub ? " dev-node-btn-sub" : "");
          btn.dataset.devAction = a.action;
          btn.dataset.nodeId = node.id;
          btn.title = a.title;
          btn.setAttribute("aria-label", a.title);

          const icon = document.createElement("i");
          icon.setAttribute("data-lucide", a.icon);
          icon.setAttribute("width", "13");
          icon.setAttribute("height", "13");
          icon.setAttribute("aria-hidden", "true");
          btn.appendChild(icon);

          wrap.appendChild(btn);
        });
        return wrap;
      }

      function mountNodeEl(node) {
        const article = document.createElement("article");
        article.id = "node-" + node.id;
        article.className = "branch" + (isSub(node) ? " is-subnode" : "");
        article.setAttribute("aria-label", (isSub(node) ? "Subnó " : "Nó ") + shortLabel(node));
        article.style.transitionDelay = (20 + Math.min(node.depth, 6) * 40) + "ms";

        const button = document.createElement("button");
        button.type = "button";
        button.className = "canva-button branch-button";
        button.setAttribute("aria-expanded", "false");
        const color = colorFor(node);
        button.style.background = color.bg;
        button.style.color = color.fg;

        const nameSpan = document.createElement("span");
        nameSpan.className = "canva-text branch-name";
        nameSpan.style.color = color.fg;
        nameSpan.textContent = node.label;
        button.appendChild(nameSpan);

        if (node.children.length > 0) {
          const icon = document.createElement("i");
          icon.className = "branch-toggle-icon";
          icon.setAttribute("data-lucide", "plus");
          icon.setAttribute("aria-hidden", "true");
          icon.setAttribute("width", "19");
          icon.setAttribute("height", "19");
          button.appendChild(icon);
        } else if (node.pdf) {
          const icon = document.createElement("i");
          icon.setAttribute("data-lucide", "file-text");
          icon.setAttribute("aria-hidden", "true");
          icon.setAttribute("width", "16");
          icon.setAttribute("height", "16");
          button.appendChild(icon);
        } else if (node.url) {
          const icon = document.createElement("i");
          icon.setAttribute("data-lucide", "external-link");
          icon.setAttribute("aria-hidden", "true");
          icon.setAttribute("width", "16");
          icon.setAttribute("height", "16");
          button.appendChild(icon);
        }

        article.appendChild(button);
        article.appendChild(buildDevControls(node));
        branchesLayer.appendChild(article);

        node.el = article;
      }

      function mountChildren(node) {
        node.children.forEach((child) => {
          mountNodeEl(child);
          mountChildren(child);
        });
      }

      // === Pipeline de desenho ============================================
      // A altura de um subnó depende do texto já renderizado, então a ordem
      // é montar → medir → posicionar. Inverter isso (posicionar com alturas
      // constantes, como fazia a v05) faz o layout radial errar o raio dos
      // anéis e os conectores pararem na borda errada.
      // ====================================================================

      function measureNodes() {
        nodeById.forEach((node) => {
          if (node.depth === 0 || !node.el) return;
          node.w = node.el.offsetWidth || NODE_W;
          node.h = node.el.offsetHeight || (isSub(node) ? SUB_H : NODE_H);
          // Puramente cosmético: não altera a altura, então não obriga a
          // remedir. Se algum dia mudar tamanho, medir de novo.
          if (isSub(node)) node.el.classList.toggle("is-tall", node.h > SUB_TALL_AT);
        });
      }

      // Escreve na tela a posição EXIBIDA (dx, dy), que durante a
      // reacomodação fica atrás da posição alvo (x, y) calculada pelo layout.
      function applyPositions() {
        const root = treeData.root;
        coreArea.style.left = ((root.dx === undefined ? root.x : root.dx) - ROOT.r) + "px";
        coreArea.style.top = ((root.dy === undefined ? root.y : root.dy) - ROOT.r) + "px";
        coreArea.style.width = (ROOT.r * 2) + "px";

        nodeById.forEach((node) => {
          if (node.depth === 0 || !node.el) return;
          node.el.style.left = (node.dx - halfW(node)) + "px";
          node.el.style.top = (node.dy - halfH(node)) + "px";
        });
        // Os conectores leem dx/dy pelas mesmas propriedades x/y que
        // borderPoint() consulta, então a troca acontece aqui dentro.
        withDisplayedCoords(() => {
          nodeById.forEach((node) => drawConnector(node));
        });
        refreshWorldSize();
      }

      // borderPoint() e refreshWorldSize() falam em node.x/node.y. Durante o
      // tween o que vale é a posição exibida, então x/y são trocados pelo par
      // exibido só enquanto o desenho acontece, e devolvidos em seguida.
      function withDisplayedCoords(fn) {
        const saved = [];
        nodeById.forEach((node) => {
          saved.push([node, node.x, node.y]);
          if (node.dx !== undefined) node.x = node.dx;
          if (node.dy !== undefined) node.y = node.dy;
        });
        try {
          fn();
        } finally {
          saved.forEach((entry) => { entry[0].x = entry[1]; entry[0].y = entry[2]; });
        }
      }

      function snapDisplayed() {
        nodeById.forEach((node) => { node.dx = node.x; node.dy = node.y; });
      }

      // Reacomodação animada: as caixas deslizam até a posição nova e os
      // conectores são redesenhados no MESMO quadro, senão linha e caixa se
      // descolam durante o movimento. Um tween só por vez — abrir outro nó no
      // meio cancela o anterior e parte de onde as caixas estão.
      let tweenFrame = null;
      function tweenTo(duration) {
        if (tweenFrame) cancelAnimationFrame(tweenFrame);
        const from = [];
        nodeById.forEach((node) => {
          if (node.dx === undefined) { node.dx = node.x; node.dy = node.y; }
          from.push([node, node.dx, node.dy]);
        });
        if (!duration) {
          snapDisplayed();
          applyPositions();
          return;
        }

        const t0 = performance.now();
        const step = (now) => {
          const p = Math.min(1, (now - t0) / duration);
          const e = 1 - Math.pow(1 - p, 3); // desaceleração cúbica
          from.forEach((entry) => {
            const node = entry[0];
            node.dx = entry[1] + (node.x - entry[1]) * e;
            node.dy = entry[2] + (node.y - entry[2]) * e;
          });
          applyPositions();
          if (p < 1) {
            tweenFrame = requestAnimationFrame(step);
          } else {
            tweenFrame = null;
            snapDisplayed();
            applyPositions();
          }
        };
        tweenFrame = requestAnimationFrame(step);
      }

      // Recalcula o layout com a visibilidade atual e desliza até ele.
      function relayout(duration) {
        measureNodes();
        layoutTree();
        tweenTo(duration);
      }

      function render() {
        branchesLayer.innerHTML = "";
        connectorsSvg.innerHTML = "";
        if (tweenFrame) { cancelAnimationFrame(tweenFrame); tweenFrame = null; }
        layoutTree();            // 1ª passada: registra nodeById, depth e parent
        mountChildren(treeData.root);
        lucide.createIcons();    // antes de medir: os ícones entram no fluxo
        measureNodes();
        layoutTree();            // 2ª passada: agora com as alturas reais
        snapDisplayed();
        nodeById.forEach((node) => addConnectorFor(node));
        applyPositions();
        refreshAriaControls();
      }

      // As fontes chegam depois do primeiro desenho e mudam a quebra de
      // linha; sem remedir, subnós longos ficam com a altura errada.
      function remeasureOnFontsReady() {
        if (!document.fonts || !document.fonts.ready) return;
        document.fonts.ready.then(() => {
          relayout(0);
          updateVisibility();
          autoFit(0);
        });
      }

      // A expansão vive no dado (`node.expanded`) e não mais numa classe do
      // DOM. O layout precisa saber quem está visível para não reservar
      // espaço a quem está fechado, e ler isso de volta do DOM tornaria a
      // ordem entre desenhar e posicionar frágil. A classe continua, só que
      // como reflexo, para o CSS.
      function computeVisibility() {
        const isOpen = stage.classList.contains("is-open");
        function walk(node, parentVisible) {
          node.visible = node.depth === 0 ? true : parentVisible;
          const childrenVisible = node.depth === 0 ? isOpen : (node.visible && !!node.expanded);
          node.children.forEach((child) => walk(child, childrenVisible));
        }
        walk(treeData.root, true);
      }

      function updateVisibility() {
        computeVisibility();
        nodeById.forEach((node) => {
          if (node.depth === 0) return;
          if (node.el) {
            node.el.classList.toggle("is-visible", node.visible);
            node.el.classList.toggle("is-expanded", !!node.expanded);
          }
          if (node.path) {
            node.path.classList.toggle("is-visible", node.visible);
            node.path.style.strokeDashoffset = node.visible ? "0" : String(node.lineLength || 0);
          }
        });
      }

      // =====================================================================
      // Câmera
      // ---------------------------------------------------------------------
      // A câmera deixou de ser derivada do conteúdo e passou a ter estado
      // próprio: `camera` guarda o deslocamento e a escala, e o transform do
      // #world é apenas o reflexo desse estado. Enquanto o usuário não
      // encosta nela, o mapa continua se enquadrando sozinho ao abrir e
      // fechar; no primeiro gesto (roda, arrasto ou +/−) o enquadramento
      // automático se desliga e só volta pelo botão "recentrar".
      // =====================================================================
      const MIN_SCALE = 0.2;
      const MAX_SCALE = 2.5;
      const FIT_MAX_SCALE = 1.2;
      const KEEP_ON_SCREEN = 120;

      // Limiar para o gesto virar arrasto. O toque-para-clicar do touchpad
      // se apresenta como "mouse" no Windows e tem pouco tremor; dedo e
      // caneta precisam de folga maior para não virar arrasto sem querer.
      const DRAG_THRESHOLD_MOUSE = 4;
      const DRAG_THRESHOLD_TOUCH = 10;

      // A pinça do touchpad chega como wheel com ctrlKey e deltaY pequeno
      // (ordem de 1 a 10), enquanto a rodinha manda ~100 por entalhe. Cada
      // gesto precisa da sua própria sensibilidade para os dois darem a
      // mesma sensação de zoom.
      const WHEEL_ZOOM_SENS = 0.0015;
      const PINCH_ZOOM_SENS = 0.012;
      const MAX_ZOOM_STEP = 1.35;

      const camera = { x: 0, y: 0, scale: 1 };
      let cameraIsManual = false;

      function applyCamera(ms) {
        world.style.transition = ms ? "transform " + ms + "ms cubic-bezier(.22,.8,.28,1)" : "none";
        world.style.transform = "translate(" + camera.x + "px, " + camera.y + "px) scale(" + camera.scale + ")";
        zoomReadout.textContent = Math.round(camera.scale * 100) + "%";
      }

      // Caixa que envolve tudo o que está visível agora. `pad` é a folga
      // usada ao enquadrar; para travar o arrasto usamos pad 0.
      function boxOf(node) {
        return {
          l: node.x - halfW(node), r: node.x + halfW(node),
          t: node.y - halfH(node), b: node.y + halfH(node),
        };
      }

      function unionBox(boxes, pad) {
        return {
          l: Math.min.apply(null, boxes.map((b) => b.l)) - pad,
          r: Math.max.apply(null, boxes.map((b) => b.r)) + pad,
          t: Math.min.apply(null, boxes.map((b) => b.t)) - pad,
          b: Math.max.apply(null, boxes.map((b) => b.b)) + pad,
        };
      }

      function getActiveBox(pad) {
        const p = pad === undefined ? 60 : pad;
        const root = treeData.root;
        const boxes = [{
          l: root.x - ROOT.r, r: root.x + ROOT.r,
          t: root.y - ROOT.r, b: root.y + ROOT.r,
        }];
        nodeById.forEach((node) => {
          if (node.depth === 0 || !node.visible) return;
          boxes.push(boxOf(node));
        });
        return {
          l: Math.min.apply(null, boxes.map((b) => b.l)) - p,
          r: Math.max.apply(null, boxes.map((b) => b.r)) + p,
          t: Math.min.apply(null, boxes.map((b) => b.t)) - p,
          b: Math.max.apply(null, boxes.map((b) => b.b)) + p,
        };
      }

      // Trava suave: o usuário pode arrastar à vontade, mas nunca a ponto de
      // jogar o mapa inteiro para fora da tela.
      function clampCamera() {
        const box = getActiveBox(0);
        const vw = viewport.clientWidth;
        const vh = viewport.clientHeight;
        camera.x = clamp(camera.x, KEEP_ON_SCREEN - box.r * camera.scale, vw - KEEP_ON_SCREEN - box.l * camera.scale);
        camera.y = clamp(camera.y, KEEP_ON_SCREEN - box.b * camera.scale, vh - KEEP_ON_SCREEN - box.t * camera.scale);
      }

      function fitCamera(ms) {
        const box = getActiveBox();
        const vw = viewport.clientWidth;
        const vh = viewport.clientHeight;
        const scale = clamp(
          Math.min(vw / (box.r - box.l), vh / (box.b - box.t)),
          MIN_SCALE,
          FIT_MAX_SCALE
        );
        camera.scale = scale;
        camera.x = vw / 2 - ((box.l + box.r) / 2) * scale;
        camera.y = vh / 2 - ((box.t + box.b) / 2) * scale;
        applyCamera(ms);
      }

      // Leva a câmera até o nó recém-aberto e o que ele acabou de revelar,
      // ajustando o zoom nos dois sentidos: aproxima quando o grupo é
      // pequeno, afasta quando é grande. Num mapa de 14 setores a visão
      // geral fica perto do piso de escala, e é este enquadramento que
      // devolve a legibilidade ao abrir um galho.
      // Roda mesmo com cameraIsManual ligado: clicar num nó é um pedido
      // explícito de atenção, diferente do reenquadramento passivo.
      function focusOn(node, ms) {
        if (!node) return;
        const boxes = [node.depth === 0
          ? { l: node.x - ROOT.r, r: node.x + ROOT.r, t: node.y - ROOT.r, b: node.y + ROOT.r }
          : boxOf(node)];
        node.children.forEach((child) => {
          if (child.visible) boxes.push(boxOf(child));
        });

        const box = unionBox(boxes, 90);
        const vw = viewport.clientWidth;
        const vh = viewport.clientHeight;
        camera.scale = clamp(
          Math.min(vw / (box.r - box.l), vh / (box.b - box.t)),
          MIN_SCALE,
          FIT_MAX_SCALE
        );

        camera.x = vw / 2 - ((box.l + box.r) / 2) * camera.scale;
        camera.y = vh / 2 - ((box.t + box.b) / 2) * camera.scale;
        clampCamera();
        applyCamera(ms);
      }

      // Zoom ancorado num ponto da viewport: o que estava sob o cursor
      // continua sob o cursor depois da mudança de escala.
      function zoomAt(px, py, factor, ms) {
        const next = clamp(camera.scale * factor, MIN_SCALE, MAX_SCALE);
        if (next === camera.scale) return;
        const worldX = (px - camera.x) / camera.scale;
        const worldY = (py - camera.y) / camera.scale;
        camera.scale = next;
        camera.x = px - worldX * next;
        camera.y = py - worldY * next;
        clampCamera();
        applyCamera(ms);
      }

      function takeCameraControl() {
        if (cameraIsManual) return;
        cameraIsManual = true;
        fitBtn.classList.add("is-active");
        fitBtn.title = "Recentrar o mapa e voltar ao enquadramento automático (tecla 0)";
      }

      function releaseCameraControl() {
        cameraIsManual = false;
        fitBtn.classList.remove("is-active");
        fitBtn.title = "Recentrar o mapa (tecla 0)";
      }

      // Chamado depois de abrir/fechar/expandir/reconstruir: reenquadra
      // enquanto a câmera for automática, e apenas revalida a trava quando
      // ela já pertence ao usuário.
      function autoFit(ms) {
        if (cameraIsManual) {
          clampCamera();
          applyCamera(ms);
          return;
        }
        fitCamera(ms);
      }

      function zoomFromCenter(factor) {
        takeCameraControl();
        zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, factor, 220);
      }

      zoomInBtn.addEventListener("click", () => zoomFromCenter(1.25));
      zoomOutBtn.addEventListener("click", () => zoomFromCenter(1 / 1.25));
      fitBtn.addEventListener("click", () => {
        releaseCameraControl();
        fitCamera(420);
        status.textContent = "Mapa recentrado.";
      });

      // Zoom por rodinha (mouse), por dois dedos e por pinça (touchpad). O
      // preventDefault é incondicional de propósito: sem ele o navegador dá
      // zoom na página inteira na pinça e no Ctrl+rolagem.
      // deltaX é ignorado: num gesto diagonal, misturar deslocamento lateral
      // com zoom deixaria o movimento errático.
      // Um subnó longo rola por dentro. Enquanto ele ainda tiver texto para
      // percorrer naquela direção, a roda pertence ao texto e não ao zoom;
      // ao chegar ao fim, o zoom volta a assumir.
      function scrollableUnder(event) {
        const box = event.target.closest(".branch.is-subnode .branch-button");
        if (!box) return false;
        const room = box.scrollHeight - box.clientHeight;
        if (room <= 1) return false;
        if (event.deltaY < 0) return box.scrollTop > 0;
        if (event.deltaY > 0) return box.scrollTop < room - 1;
        return false;
      }

      viewport.addEventListener("wheel", (event) => {
        if (scrollableUnder(event)) return;
        event.preventDefault();
        takeCameraControl();

        let delta = event.deltaY;
        if (event.deltaMode === 1) delta *= 16;          // roda em linhas
        else if (event.deltaMode === 2) delta *= viewport.clientHeight; // em páginas

        const sens = event.ctrlKey ? PINCH_ZOOM_SENS : WHEEL_ZOOM_SENS;
        // O limite fica no fator, e não no delta: o touchpad manda muitos
        // eventos minúsculos e a rodinha manda poucos e grandes: limitar o
        // resultado aproxima a sensação dos dois sem travar nenhum.
        const factor = clamp(Math.exp(-delta * sens), 1 / MAX_ZOOM_STEP, MAX_ZOOM_STEP);

        const rect = viewport.getBoundingClientRect();
        zoomAt(event.clientX - rect.left, event.clientY - rect.top, factor, 0);
      }, { passive: false });

      // Arrasto: começa em qualquer ponto da viewport, inclusive em cima de
      // um nó, mas só vira arrasto depois do limiar de alguns pixels — abaixo
      // disso continua sendo um clique normal no nó. O clique que o navegador
      // dispara ao fim de um arrasto é engolido na fase de captura, senão
      // arrastar por cima de um nó acabaria expandindo ou abrindo o link.
      //
      // IMPORTANTE: a captura do ponteiro é feita só quando o gesto vira
      // arrasto de fato, nunca no pointerdown. Enquanto um elemento tem o
      // ponteiro capturado, o navegador redireciona para ele também o
      // "click" — o evento chegaria com target = #camera-viewport e nunca
      // com o botão do nó, o que faz o clique no tronco (listener no próprio
      // botão) e o clique nos demais nós (delegado por closest) pararem de
      // funcionar. Mover esta chamada de volta para o pointerdown reintroduz
      // exatamente esse bug.
      let activePointerId = null;
      let dragOrigin = null;
      let didDrag = false;

      viewport.addEventListener("pointerdown", (event) => {
        didDrag = false;
        if (event.button !== 0) return;
        if (event.target.closest(".camera-controls")) return;
        if (event.target.closest(".dev-node-btn")) return;
        activePointerId = event.pointerId;

        // No modo dev, o gesto que nasce em cima de um nó pertence ao nó:
        // arrastá-lo religa o galho. O tronco fica de fora — ele não tem
