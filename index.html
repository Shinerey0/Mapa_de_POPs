            viewport.releasePointerCapture(activePointerId);
          }
        } catch (e) {
          // captura já liberada — nada a fazer.
        }
      }

      // Aborta o arrasto de nó sem religar nada: o nó volta de onde saiu.
      function cancelNodeDrag() {
        if (!nodeDrag) return;
        nodeDrag.plan = null;
        nodeDrag.motivo = null;
        finishNodeDrag();
      }

      viewport.addEventListener("pointerdown", (event) => {
        // Gesto novo começa limpo: o clique que vem depois só é engolido se
        // ESTE gesto virar arrasto. Precisa vir antes de qualquer saída
        // antecipada — inclusive a dos botões de edição dos nós. Depois de
        // arrastar o mapa com o dedo, o navegador pode não mandar clique
        // nenhum, e o didDrag ficaria ligado: o primeiro toque num desses
        // botões seria engolido no lugar dele. Durante a pinça o sinalizador
        // é preservado, senão um terceiro dedo o apagaria no meio do gesto.
        // (Os controles de zoom moram fora da câmera, numa vaga da tela, e
        // nem passam por aqui.)
        if (!pinch) didDrag = false;
        if (event.target.closest(".dev-node-btn")) return;

        // O mouse fica de fora da contagem: ele não tem como pinçar, e um
        // botão do meio ou da direita sem pointerup deixaria um ponteiro
        // fantasma que faria o próximo clique virar pinça.
        if (event.pointerType !== "mouse") {
          pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        }

        // Chegou o segundo dedo: o gesto deixa de ser arrasto e vira pinça.
        // O que estava em curso é desfeito antes, senão os dois disputariam
        // a câmera (ou o nó) a cada quadro.
        if (pointers.size === 2) {
          cancelNodeDrag();
          releaseCapture();
          dragOrigin = null;
          viewport.classList.remove("is-panning");
          startPinch();
          return;
        }
        if (pointers.size > 2) return;

        if (event.button !== 0) return;
        activePointerId = event.pointerId;

        // No modo dev, o gesto que nasce em cima de um nó pertence ao nó:
        // arrastá-lo religa o galho. O tronco fica de fora — ele não tem
        // para onde ser religado — e continua arrastando a câmera.
        const branchEl = devUnlocked ? event.target.closest(".branch") : null;
        const dragged = branchEl ? nodeById.get(branchEl.id.slice("node-".length)) : null;
        if (dragged) {
          nodeDrag = {
            node: dragged,
            px: event.clientX,
            py: event.clientY,
            ox: dragged.dx,
            oy: dragged.dy,
            threshold: event.pointerType === "mouse" ? DRAG_THRESHOLD_MOUSE : DRAG_THRESHOLD_TOUCH,
            active: false,
            target: null,
            targetEl: null,
          };
          return;
        }

        dragOrigin = {
          px: event.clientX,
          py: event.clientY,
          cx: camera.x,
          cy: camera.y,
          threshold: event.pointerType === "mouse" ? DRAG_THRESHOLD_MOUSE : DRAG_THRESHOLD_TOUCH,
        };
      });

      viewport.addEventListener("pointermove", (event) => {
        if (pointers.has(event.pointerId)) {
          pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        }
        if (pinch) {
          movePinch();
          return;
        }
        if (nodeDrag && event.pointerId === activePointerId) {
          if (!(event.buttons & 1)) endDrag(event);
          else moveNodeDrag(event);
          return;
        }
        if (!dragOrigin || event.pointerId !== activePointerId) return;
        // Antes da captura existir, um movimento rápido para fora da viewport
        // pode levar o pointerup embora junto. Sem esta guarda, o ponteiro
        // voltaria para o mapa com o botão já solto e continuaria arrastando.
        if (!(event.buttons & 1)) {
          endDrag(event);
          return;
        }
        const dx = event.clientX - dragOrigin.px;
        const dy = event.clientY - dragOrigin.py;
        if (!didDrag) {
          if (Math.hypot(dx, dy) < dragOrigin.threshold) return;
          didDrag = true;
          takeCameraControl();
          viewport.classList.add("is-panning");
          // Só agora: a partir daqui o gesto é arrasto, o clique resultante
          // já será descartado, e a captura garante que o mapa continue
          // seguindo o cursor mesmo se ele sair da viewport.
          try {
            viewport.setPointerCapture(activePointerId);
          } catch (e) {
            // alguns navegadores recusam a captura; o arrasto ainda funciona.
          }
        }
        camera.x = dragOrigin.cx + dx;
        camera.y = dragOrigin.cy + dy;
        clampCamera();
        applyCamera(0);
      });

      // --- Arrasto de nó (religar galho) ------------------------------------
      // Só vive no modo dev. O nó segue o cursor mexendo em dx/dy — as
      // coordenadas "exibidas", as mesmas que a animação de reacomodação
      // usa — e não num transform próprio: assim os conectores acompanham
      // o movimento de graça, inclusive os dos filhos, que ficam esticados
      // mostrando que a subárvore vem junto.
      // ---------------------------------------------------------------------
      let nodeDrag = null;

      const DROP_CLASSES = ["is-drop-ok", "is-drop-blocked", "is-drop-before", "is-drop-after"];

      function clearDropHighlight() {
        if (nodeDrag && nodeDrag.targetEl) {
          nodeDrag.targetEl.classList.remove.apply(nodeDrag.targetEl.classList, DROP_CLASSES);
        }
      }

      // Aviso visível do que vai acontecer ao soltar. O #map-status é só
      // para leitor de tela (fica fora da tela), então o arrasto precisa da
      // sua própria legenda — sem ela o verde e o vermelho não explicam
      // entre "vira filho" e "entra antes do irmão".
      function showDragHint(texto, bloqueado) {
        dragHint.textContent = texto;
        dragHint.classList.toggle("is-blocked", !!bloqueado);
        dragHint.hidden = false;
      }

      function hideDragHint() {
        dragHint.hidden = true;
      }

      function elementUnder(event) {
        const el = document.elementFromPoint(event.clientX, event.clientY);
        return el ? el.closest(".branch, .core-area") : null;
      }

      function moveNodeDrag(event) {
        const dx = event.clientX - nodeDrag.px;
        const dy = event.clientY - nodeDrag.py;

        if (!nodeDrag.active) {
          if (Math.hypot(dx, dy) < nodeDrag.threshold) return;
          nodeDrag.active = true;
          didDrag = true;   // o clique que vem depois do arrasto é engolido
          // Uma reacomodação ainda em curso reescreveria dx/dy a cada
          // quadro e brigaria com o arrasto pelo controle do nó.
          if (tweenFrame) { cancelAnimationFrame(tweenFrame); tweenFrame = null; }
          document.body.classList.add("is-reparenting");
          nodeDrag.node.el.classList.add("is-dragging");
          try {
            viewport.setPointerCapture(activePointerId);
          } catch (e) {
            // alguns navegadores recusam a captura; o arrasto ainda funciona.
          }
        }

        // O cursor anda em pixels de tela; o mundo está sob zoom.
        nodeDrag.node.dx = nodeDrag.ox + dx / camera.scale;
        nodeDrag.node.dy = nodeDrag.oy + dy / camera.scale;
        applyPositions();

        const targetEl = elementUnder(event);
        const target = !targetEl ? null
          : targetEl.classList.contains("core-area")
            ? treeData.root
            : nodeById.get(targetEl.id.slice("node-".length));

        // O plano muda dentro do mesmo alvo conforme o cursor sobe ou desce,
        // então é recalculado a cada movimento — e não só quando troca de
        // elemento, como a marcação fazia antes.
        const plan = target ? dropPlan(nodeDrag.node, target, targetEl, event.clientY) : null;
        const motivo = plan ? planRejection(nodeDrag.node, target, plan) : null;

        clearDropHighlight();
        nodeDrag.targetEl = targetEl;
        if (targetEl && plan) {
          targetEl.classList.add(
            motivo ? "is-drop-blocked"
              : plan.mode === "child" ? "is-drop-ok"
                : plan.mode === "before" ? "is-drop-before" : "is-drop-after"
          );
          showDragHint(motivo || dropHintText(nodeDrag.node, target, plan), !!motivo);
        } else {
          showDragHint("Solte sobre um nó para religar ou reordenar.", false);
        }

        nodeDrag.target = target;
        nodeDrag.plan = motivo ? null : plan;
        nodeDrag.motivo = motivo;
      }

      function dropHintText(node, target, plan) {
        const alvo = shortLabel(target, 26);
        if (plan.mode === "child") return "Entrar em " + alvo + " (no fim)";
        const mesmoPai = plan.parent === node.parent;
        const verbo = mesmoPai ? "Reordenar" : "Mover para";
        return verbo + (plan.mode === "before" ? " antes de " : " depois de ") + alvo;
      }

      function finishNodeDrag() {
        const drag = nodeDrag;
        clearDropHighlight();
        nodeDrag = null;
        if (!drag) return;

        document.body.classList.remove("is-reparenting");
        hideDragHint();
        if (drag.node.el) drag.node.el.classList.remove("is-dragging");

        if (!drag.active) return;   // foi só um clique que tremeu

        // `plan` só chega preenchido quando o destino passou na validação.
        if (drag.plan) {
          reparent(drag.node, drag.plan.parent, drag.plan.before);
          return;
        }
        // Sem destino válido o nó volta para o lugar de onde saiu.
        snapDisplayed();
        applyPositions();
        if (drag.motivo) status.textContent = drag.motivo;
      }

      function endDrag(event) {
        if (event && event.pointerId !== activePointerId) return;
        if (nodeDrag) {
          releaseCapture();
          finishNodeDrag();
          activePointerId = null;
          return;
        }
        if (!dragOrigin) return;
        releaseCapture();
        dragOrigin = null;
        activePointerId = null;
        viewport.classList.remove("is-panning");
        // didDrag continua ligado até o clique seguinte ser engolido; se
        // nenhum clique vier, o proximo pointerdown o desarma.
      }

      // Tirar um dedo da tela: a contagem vem primeiro, porque é ela que
      // decide se o que termina é a pinça ou o arrasto.
      function releasePointer(event) {
        const wasPinching = !!pinch;
        pointers.delete(event.pointerId);
        if (!wasPinching) {
          endDrag(event);
          return;
        }
        endPinch();
        // Enquanto sobrar dedo na tela o gesto ainda é da câmera; só quando
        // o último sai é que o estado de arrasto é zerado.
        if (pointers.size) return;
        releaseCapture();
        activePointerId = null;
        viewport.classList.remove("is-panning");
      }

      viewport.addEventListener("pointerup", releasePointer);
      viewport.addEventListener("pointercancel", releasePointer);

      viewport.addEventListener("click", (event) => {
        if (!didDrag) return;
        didDrag = false;
        event.stopPropagation();
        event.preventDefault();
      }, true);

      viewport.addEventListener("dragstart", (event) => event.preventDefault());

      function setAllNodesClosed() {
        nodeById.forEach((node) => {
          node.expanded = false;
          const btn = node.el && node.el.querySelector(".branch-button");
          if (btn) btn.setAttribute("aria-expanded", "false");
        });
        lastExpanded = null;
      }

      // Reconstrói toda a árvore visual a partir dos dados (necessário
      // sempre que a estrutura muda: criar ou remover nós desloca a
      // posição dos irmãos e pode mudar quais botões de criação existem).
      // A expansão mora no dado, então sobrevive à reconstrução sozinha —
      // não precisa mais ser recolhida do DOM antes e devolvida depois.
      function rebuildPreservingExpanded(forceExpandId, focusId) {
        if (forceExpandId) {
          const forced = nodeById.get(forceExpandId);
          if (forced) {
            forced.expanded = true;
            lastExpanded = forced;
            if (oneBranchMode()) closeSiblings(forced);
          }
        }

        render();
        updateVisibility();

        const target = focusId ? nodeById.get(focusId) : null;
        if (target) focusOn(target, 420);
        else autoFit(420);
      }

      function addChild(parentNode, label, url, pdf, type, color, textColor) {
        const allowed = type === SUBNODE ? canAddSub(parentNode) : canAddNode(parentNode);
        if (!allowed) return false;
        const node = {
          id: newNodeId(), label: label, url: url || "", pdf: pdf || "",
          color: color || "", textColor: textColor || "", type: type, children: [],
        };
        parentNode.children.push(node);
        rebuildPreservingExpanded(parentNode.id, parentNode.id);
        markChanged();
        status.textContent = (type === SUBNODE ? "Subnó" : "Nó")
          + " criado em " + shortLabel(parentNode, 40) + ".";
        return true;
      }

      function removeNode(node) {
        const parent = node.parent;
        if (!parent) return;
        const idx = parent.children.indexOf(node);
        if (idx === -1) return;
        parent.children.splice(idx, 1);
        rebuildPreservingExpanded();
        markChanged();
        status.textContent = (isSub(node) ? "Subnó" : "Nó") + " removido.";
      }

      // --- Religar um galho -------------------------------------------------
      // Arrastar um nó por cima de outro troca o pai. A subárvore vai junto
      // de graça: `node.children` não é tocado, só muda de quem o nó pende.
      // ---------------------------------------------------------------------
      function isDescendant(possibleAncestor, node) {
        let walker = node.parent;
        while (walker) {
          if (walker === possibleAncestor) return true;
          walker = walker.parent;
        }
        return false;
      }

      // Onde o ponteiro está dentro da caixa do alvo decide a intenção, como
      // num explorador de arquivos: no meio, o nó entra COMO FILHO; nas
      // bordas de cima e de baixo, entra como IRMÃO antes ou depois — e é
      // isso que dá o controle da ordem. A faixa da borda tem teto em
      // pixels porque um subnó pode ter 300px de altura, e 30% dali seria
      // uma faixa enorme.
      const EDGE_BAND = 22;

      function dropModeFor(target, targetEl, clientY) {
        if (target === treeData.root) return "child";   // o tronco não tem irmãos
        const rect = targetEl.getBoundingClientRect();
        if (!rect.height) return "child";
        const rel = (clientY - rect.top) / rect.height;
        // Subnó não recebe filhos: a caixa inteira vira "antes ou depois",
        // senão metade dela seria uma zona morta.
        if (isSub(target)) return rel < 0.5 ? "before" : "after";
        const band = Math.min(0.3, EDGE_BAND / rect.height);
        if (rel < band) return "before";
        if (rel > 1 - band) return "after";
        return "child";
      }

      // O irmão que deve ficar logo DEPOIS do nó movido. Pular o próprio nó
      // arrastado é o que faz "soltar depois do irmão de cima" devolver o
      // nó ao mesmo lugar em vez de mandá-lo para o fim da lista.
      function siblingAfter(target, dragged) {
        const irmaos = target.parent ? target.parent.children : [];
        for (let i = irmaos.indexOf(target) + 1; i < irmaos.length; i++) {
          if (irmaos[i] !== dragged) return irmaos[i];
        }
        return null;
      }

      // Traduz "cursor em cima deste elemento" em "para onde o nó vai":
      // quem será o pai e antes de qual irmão ele entra (null = no fim).
      function dropPlan(node, target, targetEl, clientY) {
        const mode = dropModeFor(target, targetEl, clientY);
        if (mode === "child") return { mode: mode, parent: target, before: null };
        return {
          mode: mode,
          parent: target.parent,
          before: mode === "before" ? target : siblingAfter(target, node),
        };
      }

      // Por que um destino recusa o nó. Devolve null quando o drop é válido
      // — a mensagem é usada tanto no aviso quanto no motivo do bloqueio.
      function planRejection(node, target, plan) {
        if (!node || !target || !plan || !plan.parent) return "Destino inválido.";
        if (target === node) return "Um nó não pode se ligar a si mesmo.";
        if (plan.parent === node || isDescendant(node, plan.parent)) {
          return "Um nó não pode se ligar a um descendente dele.";
        }
        if (isSub(plan.parent)) return "Subnós não recebem filhos.";
        // Reordenar entre os irmãos atuais é sempre legítimo: as regras de
        // categoria já valiam antes e continuam valendo depois.
        if (plan.parent === node.parent) {
          return plan.mode === "child" ? "O nó já está ligado aqui." : null;
        }
        if (isSub(node)) {
          if (plan.parent === treeData.root) return "O tronco não recebe subnós direto.";
          if (hasNodeChild(plan.parent)) return "Este galho já continua com nós: não aceita subnós.";
        } else if (hasSubChild(plan.parent)) {
          return "Este galho já terminou em subnós: não aceita nós.";
        }
        return null;
      }

      // Move o nó (com a subárvore inteira) para um novo pai, numa posição
      // escolhida. `before` é o irmão que deve ficar logo depois dele; sem
      // ele o nó entra no fim. A posição é resolvida DEPOIS da remoção, para
      // não errar o índice quando origem e destino são o mesmo pai.
      function reparent(node, newParent, before) {
        const oldParent = node.parent;
        if (!oldParent || !newParent) return false;
        const mesmaPosicao = oldParent === newParent;
        oldParent.children.splice(oldParent.children.indexOf(node), 1);
        const at = before ? newParent.children.indexOf(before) : -1;
        if (at === -1) newParent.children.push(node);
        else newParent.children.splice(at, 0, node);
        node.parent = newParent;
        // O novo pai abre para o nó recém-chegado aparecer no lugar novo.
        rebuildPreservingExpanded(newParent.id, node.id);
        markChanged();
        const carga = node.children.length
          ? " com " + node.children.length + (node.children.length > 1 ? " filhos" : " filho")
          : "";
        const posicao = before
          ? " antes de " + shortLabel(before, 24)
          : " no fim";
        status.textContent = mesmaPosicao
          ? shortLabel(node, 30) + " reordenado" + posicao + "."
          : shortLabel(node, 30) + carga + " agora pende de "
            + shortLabel(newParent, 30) + posicao + ".";
        return true;
      }

      // O nó central abre com o enquadramento geral (é a revelação do mapa
      // inteiro), e não com o foco pontual usado ao expandir um galho.
      function toggleCore() {
        const isOpen = stage.classList.toggle("is-open");
        coreButton.setAttribute("aria-expanded", String(isOpen));
        if (!isOpen) setAllNodesClosed();
        updateVisibility();
        relayout(TWEEN_MS);
        releaseCameraControl();
        fitCamera(TWEEN_MS);
        status.textContent = isOpen
          ? "Mapa de POPs. Selecione um nó para revelar seus detalhes."
          : "Mapa de POPs recolhido.";
      }

      function saveNodeEdits(node, label, url, pdf, color, textColor) {
        node.label = label;
        node.url = url || "";
        node.pdf = pdf || "";
        node.color = color || "";
        node.textColor = textColor || "";
        if (node === treeData.root) {
          coreLabel.textContent = label;
          refreshCoreSize();
        } else {
          rebuildPreservingExpanded();
        }
        markChanged();
      }

      coreButton.addEventListener("click", toggleCore);

      stage.addEventListener("click", (event) => {
        const button = event.target.closest(".branch-button");
        if (!button) return;
        if (!stage.classList.contains("is-open")) return;

        const article = button.closest(".branch");
        const nodeId = article.id.slice("node-".length);
        const node = nodeById.get(nodeId);
        if (!node) return;

        const clickedToggle = event.target.closest(".branch-toggle-icon");
        const linkHref = node.pdf ? "pdfs/" + node.pdf : (node.url || "");

        if (linkHref && !clickedToggle) {
          window.open(linkHref, "_blank", "noopener,noreferrer");
          return;
        }
        if (node.children.length === 0) return;

        if (node.expanded) {
          // No modo de um galho por vez, fechar fecha também o que havia
          // aberto dentro: reabrir mostra os filhos todos, e não um caminho
          // escondido lá no fundo.
          if (oneBranchMode()) collapseTree(node);
          else node.expanded = false;
          if (lastExpanded && (lastExpanded === node || isDescendant(node, lastExpanded))) {
            lastExpanded = node.parent && node.parent.depth > 0 ? node.parent : null;
          }
        } else {
          node.expanded = true;
          lastExpanded = node;
          if (oneBranchMode()) closeSiblings(node);
        }
        button.setAttribute("aria-expanded", String(node.expanded));
        updateVisibility();
        // O que abriu passou a ocupar espaço e o que fechou devolveu o seu:
        // o mapa inteiro se reacomoda deslizando antes da câmera enquadrar.
        relayout(TWEEN_MS);
        // Expandir leva a câmera até o que acabou de aparecer; recolher só
        // revalida o enquadramento, sem puxar a vista para lugar nenhum.
        if (node.expanded) focusOn(node, TWEEN_MS);
        else autoFit(TWEEN_MS);
        status.textContent = node.expanded ? "Nó expandido." : "Nó recolhido.";
      });

      // Redimensionar pode trocar o jogo de medidas — girar o celular é o
      // caso comum. Quando troca, o mapa precisa ser MEDIDO de novo (as
      // caixas mudaram de largura, o texto quebra em outro lugar e a altura
      // vem do DOM), e não só reenquadrado. --vh acompanha a barra do
      // navegador do celular, que aparece e some durante a rolagem.
      function setViewportUnit() {
        document.documentElement.style.setProperty(
          "--vh", (window.innerHeight / 100) + "px"
        );
      }

      function handleViewportChange() {
        setViewportUnit();
        const metricsChanged = applyMetrics();
        // Entrar ou sair do modo celular troca as vagas dos elementos presos
        // à tela (no celular valem as de fábrica).
        if (metricsChanged) applyHud();
        // A medida dos textos das marcas d'água muda um fio com a tela.
        if (theme.watermarks.some(isTextMark)) applyWatermarks();
        // Sempre depois das medidas: o piso do círculo vem delas.
        const coreChanged = fitCoreSize();
        if (metricsChanged || coreChanged) {
          relayout(0);
          updateVisibility();
        }
        autoFit(0);
      }

      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(handleViewportChange, 120);
      });
      // A troca de orientação chega antes de o navegador terminar de
      // remontar a janela: medir cedo demais devolve a altura antiga.
      window.addEventListener("orientationchange", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(handleViewportChange, 260);
      });

      // =====================================================================
      // Pesquisa
      // ---------------------------------------------------------------------
      // A caixa procura em todos os nós e subnós, abertos ou não. Escolher
      // um resultado faz o mapa percorrer o caminho até ele, abrindo um
      // nível de cada vez com a mesma animação do clique — a câmera vai
      // junto — e marca o nó encontrado ao chegar. O que já estava aberto
      // continua aberto: a pesquisa só abre o que falta no caminho.
      //
      // A comparação ignora acentos e maiúsculas, e cada palavra digitada
      // tem de aparecer no rótulo, em qualquer ordem ("mulher saude" acha
      // "SAÚDE DA MULHER").
      // =====================================================================
      const searchInput = document.getElementById("search-input");
      const searchList = document.getElementById("search-results");
      const SEARCH_MIN_CHARS = 2;
      const SEARCH_MAX_SHOWN = 8;
      const FOUND_MS = 2800;       // quanto tempo o destaque do nó dura

      let searchHits = [];
      let searchActive = -1;
      let revealToken = 0;         // cada pesquisa nova invalida a anterior

      // Dobra um caractere para a comparação: sem acento, minúsculo.
      function foldChar(ch) {
        return ch.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
      }

      // Texto dobrado junto com o mapa de volta para o original: é o que
      // permite marcar o trecho encontrado no rótulo COM acento, mesmo a
      // busca tendo sido feita sem eles.
      function foldWithMap(text) {
        let folded = "";
        const map = [];
        let origin = 0;   // posição no original, em unidades de UTF-16
        for (const ch of text) {
          const f = foldChar(ch);
          for (let k = 0; k < f.length; k += 1) map.push(origin);
          folded += f;
          origin += ch.length;
        }
        map.push(text.length);
        return { folded: folded, map: map };
      }

      function searchTokens(query) {
        return foldWithMap(query.trim()).folded.split(/\s+/).filter(Boolean);
      }

      function flatLabel(node) {
        return String(node.label).replace(/\s+/g, " ").trim();
      }

      // Envolve em <mark> a primeira ocorrência de cada palavra buscada.
      function highlight(text, tokens) {
        const f = foldWithMap(text);
        const ranges = [];
        tokens.forEach((t) => {
          const at = f.folded.indexOf(t);
          if (at >= 0) ranges.push([f.map[at], f.map[at + t.length]]);
        });
        ranges.sort((a, b) => a[0] - b[0]);
        let out = "";
        let cursor = 0;
        ranges.forEach((r) => {
          if (r[0] < cursor) return;   // sobreposto a uma marca anterior
          out += escapeHtml(text.slice(cursor, r[0]))
            + "<mark>" + escapeHtml(text.slice(r[0], r[1])) + "</mark>";
          cursor = r[1];
        });
        return out + escapeHtml(text.slice(cursor));
      }

      // Subnós podem ter centenas de palavras: o item mostra só o trecho
      // em volta da primeira palavra encontrada.
      function labelSnippet(text, tokens) {
        const LIMIT = 90;
        if (text.length <= LIMIT) return text;
        const f = foldWithMap(text);
        const at = tokens.length ? f.folded.indexOf(tokens[0]) : -1;
        const start = at < 0 ? 0 : f.map[at];
        if (start < 50) return text.slice(0, LIMIT - 1) + "…";
        const from = Math.max(0, start - 30);
        const end = Math.min(text.length, from + LIMIT);
        return "…" + text.slice(from, end) + (end < text.length ? "…" : "");
      }

      function pathOf(node) {
        const parts = [];
        let walker = node.parent;
        while (walker && walker.depth > 0) {
          parts.unshift(shortLabel(walker, 28));
          walker = walker.parent;
        }
        return parts;
      }

      // Ordem: rótulo que começa com o termo, depois termo no começo de
      // uma palavra, depois no meio. No empate, o mais raso primeiro — é
      // o que a pessoa mais provavelmente quis — e nós antes de subnós.
      function runSearch(query) {
        const tokens = searchTokens(query);
        if (!tokens.length || query.trim().length < SEARCH_MIN_CHARS) return { tokens: tokens, hits: [] };
        const hits = [];
        (function walk(node) {
          node.children.forEach((child) => {
            const folded = foldWithMap(flatLabel(child)).folded;
            if (tokens.every((t) => folded.includes(t))) {
              const at = folded.indexOf(tokens[0]);
              const rank = at === 0 ? 0 : (/[a-z0-9]/.test(folded[at - 1]) ? 2 : 1);
              hits.push({ node: child, rank: rank });
            }
            walk(child);
          });
        })(treeData.root);
        hits.sort((a, b) => a.rank - b.rank
          || a.node.depth - b.node.depth
          || Number(isSub(a.node)) - Number(isSub(b.node))
          || flatLabel(a.node).length - flatLabel(b.node).length);
        return { tokens: tokens, hits: hits };
      }

      function closeSearchList() {
        searchList.hidden = true;
        searchList.innerHTML = "";
        searchInput.setAttribute("aria-expanded", "false");
        searchInput.removeAttribute("aria-activedescendant");
        searchHits = [];
        searchActive = -1;
      }

      function setActive(i) {
        const items = searchList.querySelectorAll(".search-item");
        if (!items.length) return;
        searchActive = (i + items.length) % items.length;
        items.forEach((el, k) => {
          el.classList.toggle("is-active", k === searchActive);
          el.setAttribute("aria-selected", String(k === searchActive));
        });
        const el = items[searchActive];
        searchInput.setAttribute("aria-activedescendant", el.id);
        el.scrollIntoView({ block: "nearest" });
      }

      function renderSearchList() {
        const query = searchInput.value;
        if (query.trim().length < SEARCH_MIN_CHARS) {
          closeSearchList();
          return;
        }
        const result = runSearch(query);
        searchHits = result.hits.slice(0, SEARCH_MAX_SHOWN).map((h) => h.node);
        searchActive = -1;

        if (!searchHits.length) {
          searchList.innerHTML = '<li class="search-empty" role="presentation">Nenhum nó encontrado.</li>';
        } else {
          searchList.innerHTML = searchHits.map((node, i) => {
            const path = pathOf(node);
            const color = colorFor(node).bg;
            return '<li id="search-opt-' + i + '" class="search-item' + (isSub(node) ? " is-sub" : "")
              + '" role="option" aria-selected="false" data-index="' + i + '">'
              + '<span class="search-dot" style="background:' + color + '"></span>'
              + '<span class="search-text">'
              + '<span class="search-label">' + highlight(labelSnippet(flatLabel(node), result.tokens), result.tokens) + "</span>"
              + '<span class="search-path">' + (path.length ? escapeHtml(path.join(" › ")) : "Galho principal") + "</span>"
              + "</span></li>";
          }).join("")
            + (result.hits.length > SEARCH_MAX_SHOWN
              ? '<li class="search-more" role="presentation">+ ' + (result.hits.length - SEARCH_MAX_SHOWN)
                + " outros — refine a pesquisa</li>"
              : "");
        }
        searchList.hidden = false;
        searchInput.setAttribute("aria-expanded", "true");
        status.textContent = searchHits.length
          ? result.hits.length + (result.hits.length === 1 ? " resultado." : " resultados.")
          : "Nenhum nó encontrado.";
      }

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      // Percorre o caminho até o nó, abrindo um nível por vez. Cada passo
      // é exatamente o que o clique no nó faz (expande, reacomoda, a câmera
      // vai até ele) e só então o próximo começa, para que a abertura seja
      // vista em sequência e não num salto só.
      //
      // Um token por pesquisa: escolher outro resultado no meio do caminho
      // (ou apertar Esc) abandona este percurso no próximo passo, em vez de
      // dois percursos disputarem a câmera.
      async function revealNode(target) {
        const token = ++revealToken;
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const step = reduce ? 0 : TWEEN_MS;
        const pause = reduce ? 0 : TWEEN_MS + 120;

        // O caminho do setor até o pai do alvo.
        const path = [];
        for (let walker = target.parent; walker && walker.depth > 0; walker = walker.parent) {
          path.unshift(walker);
        }

        if (!stage.classList.contains("is-open")) {
          stage.classList.add("is-open");
          coreButton.setAttribute("aria-expanded", "true");
          updateVisibility();
          relayout(step);
          focusOn(treeData.root, step);
          await wait(pause);
          if (token !== revealToken) return;
        }

        for (const node of path) {
          if (node.expanded) continue;   // já aberto: nada a animar
          node.expanded = true;
          lastExpanded = node;
          // Um galho por vez: o caminho da pesquisa fecha os galhos que
          // estavam abertos ao lado dele, nível a nível.
          if (oneBranchMode()) closeSiblings(node);
          const btn = node.el && node.el.querySelector(".branch-button");
          if (btn) btn.setAttribute("aria-expanded", "true");
          updateVisibility();
          relayout(step);
          focusOn(node, step);
          await wait(pause);
          if (token !== revealToken) return;
        }

        // Um irmão aberto do alvo esconderia o próprio alvo: ele fecha antes.
        if (oneBranchMode() && closeSiblings(target)) {
          updateVisibility();
          relayout(step);
        }

        // Chegou: enquadra o alvo (e os filhos dele, se estiver aberto) e
        // marca a caixa. O foco do teclado vai para o nó — Enter ali já
        // abre o galho ou o PDF —, sem deixar o navegador rolar a viewport.
        focusOn(target, step || 0);
        const el = target.el;
        if (el) {
          el.classList.remove("is-found");
          void el.offsetWidth;   // reinicia a animação se já estava marcado
          el.classList.add("is-found");
          setTimeout(() => el.classList.remove("is-found"), FOUND_MS);
          const btn = el.querySelector(".branch-button");
          if (btn) btn.focus({ preventScroll: true });
        }
        const where = pathOf(target);
        status.textContent = shortLabel(target, 60) + " encontrado"
          + (where.length ? " em " + where.join(", ") : "") + ".";
      }

      function chooseHit(i) {
        const node = searchHits[i];
        if (!node) return;
        searchInput.value = shortLabel(node, 60);
        closeSearchList();
        // Tira o foco da caixa: no celular isso fecha o teclado, que de
        // outro modo cobriria metade do mapa durante o percurso.
        searchInput.blur();
        revealNode(node);
      }

      searchInput.addEventListener("input", renderSearchList);
      searchInput.addEventListener("focus", () => {
        if (searchInput.value.trim().length >= SEARCH_MIN_CHARS) renderSearchList();
      });
      // A lista fecha ao sair da caixa — com um respiro, senão o clique num
      // item perderia a corrida para o blur.
      searchInput.addEventListener("blur", () => setTimeout(() => {
        if (document.activeElement !== searchInput) closeSearchList();
      }, 150));

      searchInput.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          if (searchList.hidden) renderSearchList();
          if (!searchHits.length) return;
          event.preventDefault();
          setActive(searchActive + (event.key === "ArrowDown" ? 1 : -1));
        } else if (event.key === "Enter") {
          if (!searchHits.length) return;
          event.preventDefault();
          chooseHit(searchActive >= 0 ? searchActive : 0);
        } else if (event.key === "Escape") {
          event.preventDefault();
          revealToken += 1;              // abandona um percurso em andamento
          if (!searchList.hidden) closeSearchList();
          else { searchInput.value = ""; searchInput.blur(); }
        }
      });

      // pointerdown com preventDefault mantém o foco na caixa até o clique
      // terminar, tanto no mouse quanto no toque.
      searchList.addEventListener("pointerdown", (event) => event.preventDefault());
      searchList.addEventListener("click", (event) => {
        const item = event.target.closest(".search-item");
        if (item) chooseHit(Number(item.dataset.index));
      });
      searchList.addEventListener("pointermove", (event) => {
        const item = event.target.closest(".search-item");
        if (item && event.pointerType === "mouse") setActive(Number(item.dataset.index));
      });

      // Atalhos de câmera. Ficam desligados enquanto um formulário do modo
      // dev estiver aberto, para não roubar as teclas de quem está digitando.
      document.addEventListener("keydown", (event) => {
        if (!devOverlay.hidden) return;
        const tag = (event.target.tagName || "").toLowerCase();
        if (tag === "input" || tag === "textarea" || event.target.isContentEditable) return;
        if (event.ctrlKey || event.metaKey || event.altKey) return;

        if (event.key === "/") {
          if (!theme.hud.search.show) return;   // pesquisa escondida no painel
          event.preventDefault();
          searchInput.focus();
          searchInput.select();
        } else if (event.key === "+" || event.key === "=") {
          event.preventDefault();
          zoomFromCenter(1.25);
        } else if (event.key === "-" || event.key === "_") {
          event.preventDefault();
          zoomFromCenter(1 / 1.25);
        } else if (event.key === "0") {
          event.preventDefault();
          releaseCameraControl();
          fitCamera(420);
        }
      });

      // --- Módulo de desenvolvedor: protegido por senha. Uma vez
      // desbloqueado, pequenos botões escondidos em cada nó ficam visíveis,
      // permitindo criar, editar e remover diretamente no lugar. Quais
      // botões de criação aparecem depende da categoria do nó e das regras
      // de nó/subnó. No modo usuário (padrão) esses controles ficam ocultos
      // e a página serve apenas para consulta. ---

      function openDevOverlay() {
        devOverlay.hidden = false;
      }

      function closeDevOverlay() {
        devOverlay.hidden = true;
        devOverlay.classList.remove("is-side");
      }

      function setDevMode(unlocked) {
        devUnlocked = unlocked;
        document.body.classList.toggle("dev-mode", unlocked);
        devToggle.classList.toggle("is-unlocked", unlocked);
        devToggle.setAttribute(
          "aria-label",
          unlocked ? "Modo desenvolvedor ativo — clique para bloquear" : "Modo desenvolvedor"
        );
        status.textContent = unlocked
          ? "Modo desenvolvedor ativado. Os controles de edição estão visíveis nos nós."
          : "Modo desenvolvedor desativado.";
        // O cadeado troca a regra de quem aparece (ver oneBranchMode): no
        // modo dev os irmãos escondidos voltam à tela; fora dele, sobra um
        // caminho só.
        if (!unlocked) keepSinglePath();
        updateVisibility();
        relayout(TWEEN_MS);
        autoFit(TWEEN_MS);
      }

      function renderPasswordForm(errorMsg) {
        devModalBody.innerHTML = `
          <h2 id="dev-modal-title" class="dev-modal-title">Área do desenvolvedor</h2>
          <p class="dev-modal-desc">Digite a senha para revelar os controles de edição nos nós.</p>
          <form id="dev-password-form" class="dev-form">
            <input id="dev-password-input" type="password" inputmode="numeric" autocomplete="off" placeholder="Senha" class="dev-input" />
            ${errorMsg ? `<p class="dev-error">${escapeHtml(errorMsg)}</p>` : ""}
            <button type="submit" class="dev-btn dev-btn-primary">Entrar</button>
          </form>
        `;
        const form = document.getElementById("dev-password-form");
        const input = document.getElementById("dev-password-input");
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          if (input.value === DEV_PASSWORD) {
            setDevMode(true);
            closeDevOverlay();
          } else {
            renderPasswordForm("Senha incorreta.");
          }
        });
        input.focus();
      }

      // Campo de texto: nós seguem com 80 caracteres, subnós passam a
      // aceitar até 400 PALAVRAS. maxlength conta caracteres e por isso não
      // serve para o subnó — o limite vira um contador ao vivo que trava o
      // envio quando estoura.
      function textFieldMarkup(forSub) {
        if (!forSub) {
          return `<label class="dev-label">Texto
              <textarea id="dev-node-text" class="dev-input" rows="2" maxlength="${NODE_CHAR_LIMIT}"></textarea>
            </label>`;
        }
        return `<label class="dev-label">Texto do subnó
              <textarea id="dev-node-text" class="dev-input dev-input-long" rows="9"></textarea>
            </label>
            <p id="dev-word-count" class="dev-word-count">0 / ${SUB_WORD_LIMIT} palavras</p>`;
      }

      // Liga o contador e devolve a função que diz se o envio pode passar.
      function wireWordCounter(textarea, forSub) {
        if (!forSub) return () => true;
        const counter = document.getElementById("dev-word-count");
        const refresh = () => {
          const n = countWords(textarea.value);
          counter.textContent = n + " / " + SUB_WORD_LIMIT + " palavras";
          counter.classList.toggle("is-over", n > SUB_WORD_LIMIT);
        };
        textarea.addEventListener("input", refresh);
        refresh();
        return () => {
          const ok = countWords(textarea.value) <= SUB_WORD_LIMIT;
          if (!ok) counter.classList.add("is-over");
          return ok;
        };
      }

      // Campo de PDF: só aparece para subnós. O arquivo precisa estar salvo
      // em pdfs/ na raiz do projeto; a <datalist> só sugere nomes já
      // listados em pdfs/manifest.json, mas o campo aceita qualquer nome
      // digitado.
      function pdfFieldMarkup() {
        return `
            <label class="dev-label">PDF do projeto (opcional)
              <input id="dev-node-pdf" class="dev-input" type="text" list="pdf-library-list" placeholder="ex.: manual-operacional.pdf" />
            </label>
            <p class="dev-modal-desc" style="margin:-0.3rem 0 0;">Arquivo deve estar salvo na pasta pdfs/ do projeto. Se preenchido, clicar no subnó abre o PDF em vez de expandir (tem prioridade sobre o link externo).</p>
        `;
      }

      function readPdfInput() {
        const input = document.getElementById("dev-node-pdf");
        if (!input) return "";
        const raw = input.value.trim();
        return raw ? raw.split(/[\\/]/).pop() : "";
      }

      // Cor própria do nó. O <input type="color"> não tem estado "vazio",
      // então quem representa o "sem cor própria" é a caixa de herança: com
      // ela marcada o seletor fica desabilitado e o nó volta a seguir o
      // galho.
      // `reference` é o nó de quem se tira a cor mostrada no seletor quando
      // ainda não há cor própria: o próprio nó ao editar, o pai ao criar.
      function colorFieldMarkup(node, reference) {
        const inherits = !node || !node.color;
        const shown = (node && node.color)
          || rgbToHex(parseRgbString(colorFor(node || reference).bg));
        return `
            <p class="dev-section-title" style="margin-top:0.7rem;">Cor</p>
            <label class="dev-check">
              <input type="checkbox" id="dev-node-color-inherit" ${inherits ? "checked" : ""} />
              Usar a cor do galho
            </label>
            <div class="dev-color-row">
              <span class="dev-color-name">Cor própria deste nó</span>
              <input type="color" class="dev-color-swatch" id="dev-node-color" value="${shown}" ${inherits ? "disabled" : ""} aria-label="Cor própria deste nó" />
            </div>
            <p class="dev-modal-desc" style="margin:-0.1rem 0 0;">A cor própria vale também para os descendentes, até que algum deles defina a sua.</p>
        `;
      }

      // Cor do texto deste nó. Diferente da cor de fundo, vale só para ele:
      // nó e subnó têm fundos opostos (forte e claro), e uma cor de texto
      // herdada ficaria ilegível numa das duas categorias. `preview` é o
      // nó cuja cor atual o seletor mostra: o próprio, ou um filho de
      // mentira ao criar (ver previewChild).
      function textColorFieldMarkup(node, preview) {
        const inherits = !node || !node.textColor;
        const shown = (node && node.textColor) || rgbToHex(parseRgbString(colorFor(preview).fg));
        return `
            <p class="dev-section-title" style="margin-top:0.7rem;">Cor do texto</p>
            <label class="dev-check">
              <input type="checkbox" id="dev-node-text-inherit" ${inherits ? "checked" : ""} />
              Automática (segue o galho e o mapa)
            </label>
            <div class="dev-color-row">
              <span class="dev-color-name">Cor do texto deste nó</span>
              <input type="color" class="dev-color-swatch" id="dev-node-text-color" value="${shown}" ${inherits ? "disabled" : ""} aria-label="Cor do texto deste nó" />
            </div>
        `;
      }

      // O nó que ainda vai ser criado, só para colorFor() dizer com que
      // cor de texto ele nasceria.
      function previewChild(parentNode, type) {
        return {
          id: "", label: "", type: type, color: "", textColor: "", children: [],
          parent: parentNode, depth: parentNode.depth + 1,
        };
      }

      function wireColorField(checkId, inputId) {
        const check = document.getElementById(checkId || "dev-node-color-inherit");
        const input = document.getElementById(inputId || "dev-node-color");
        if (!check || !input) return () => "";
        check.addEventListener("change", () => { input.disabled = check.checked; });
        return () => (check.checked ? "" : input.value);
      }

      // --- Dados do mapa: exportar e importar ------------------------------
      // O navegador não guarda nada: o mapa só sobrevive à aba saindo daqui.
      // Um .json para backup e troca, e um .html que já abre montado em
      // qualquer computador — é ele que vai para o servidor.
      // ---------------------------------------------------------------------

      // Nome que o painel de dados sugere para os arquivos exportados.
      function defaultExportName() {
        return "MOP-" + stamp();
      }

      // O nome vem de um campo livre. A extensão quem põe é o botão, então
      // uma digitada junto sai (senão viria "index.html.json"), e caem os
      // caracteres que o Windows recusa em nome de arquivo. Campo vazio
      // volta ao nome sugerido.
      function exportFileName(typed, ext) {
        const base = String(typed || "")
          .trim()
          .replace(/\.(html?|json)$/i, "")
          .replace(/[\\/:*?"<>|\u0000-\u001f]/g, "-")
          .replace(/[. ]+$/, "");
        return (base || defaultExportName()) + ext;
      }

      function exportJson(name) {
        const filename = exportFileName(name, ".json");
        const text = JSON.stringify(buildEnvelope(), null, 2);
        // Antes do download: o clique no link não pode achar edição pendente.
        unsavedChanges = false;
        downloadFile(filename, "application/json", text);
        status.textContent = "Mapa exportado em JSON: " + filename + ".";
      }

      // Captura o arquivo com o DOM limpo: os nós montados são removidos
      // antes de serializar e reconstruídos logo depois. Sem isso, o HTML
      // exportado abriria com os nós duplicados, porque o script de
      // inicialização monta a árvore por cima do que já estiver no DOM.
      // Devolve o DOM ao estado do arquivo original, roda `capture`, e
      // restaura tudo. O que o navegador escreve na página durante o uso —
      // modal aberto, cadeado destravado, texto de status, leitura do zoom,
      // nós montados — sairia gravado no arquivo exportado se a captura
      // acontecesse com a página como está. Foi assim que a "tela de
      // salvamento" acabou embutida no export anterior: exportHtml roda com
      // o modal ainda aberto, e os botões gravados nele chegam ao arquivo
      // sem listener nenhum, porque as ligações só existem em memória.
      // Qualquer estado novo que apareça no futuro entra nesta lista.
      function withPristineDom(capture) {
        const saved = {
          worldStyle: world.getAttribute("style"),
          coreStyle: coreArea.getAttribute("style"),
          open: stage.classList.contains("is-open"),
          dev: document.body.classList.contains("dev-mode"),
          unlocked: devToggle.classList.contains("is-unlocked"),
          devLabel: devToggle.getAttribute("aria-label"),
          overlayHidden: devOverlay.hidden,
          modalBody: devModalBody.innerHTML,
          statusText: status.textContent,
          zoomText: zoomReadout.textContent,
          coreExpanded: coreButton.getAttribute("aria-expanded"),
          overlaySide: devOverlay.classList.contains("is-side"),
          watermarkHidden: watermarkEl.hidden,
          watermarkNodes: Array.from(watermarkEl.childNodes),
          // As fontes que o painel baixou só para mostrar a lista. As em
          // uso ficam: assim o arquivo já pede a fonte antes do script rodar.
          spareFonts: (() => {
            const used = fontsInUse();
            return Array.from(document.head.querySelectorAll("link[data-font]"))
              .filter((link) => !used.has(link.dataset.font));
          })(),
        };

        branchesLayer.innerHTML = "";
        connectorsSvg.innerHTML = "";
        stage.classList.remove("is-open");
        coreButton.setAttribute("aria-expanded", "false");
        document.body.classList.remove("dev-mode");
        devToggle.classList.remove("is-unlocked");
        devToggle.setAttribute("aria-label", "Modo desenvolvedor");
        devOverlay.hidden = true;
        devOverlay.classList.remove("is-side");
        devModalBody.innerHTML = "";
        status.textContent = "";
        zoomReadout.textContent = "100%";
        world.removeAttribute("style");
        coreArea.removeAttribute("style");
        // As imagens das marcas d'água já vão no seed (tema); deixá-las
        // também no DOM dobraria o tamanho do arquivo. O script as remonta
        // ao abrir. Os mesmos elementos voltam depois, com o src intacto.
        watermarkEl.hidden = true;
        saved.watermarkNodes.forEach((node) => node.remove());
        saved.spareFonts.forEach((link) => link.remove());

        let result;
        try {
          result = capture();
        } finally {
          if (saved.worldStyle) world.setAttribute("style", saved.worldStyle);
          if (saved.coreStyle) coreArea.setAttribute("style", saved.coreStyle);
          stage.classList.toggle("is-open", saved.open);
          coreButton.setAttribute("aria-expanded", saved.coreExpanded || "false");
          document.body.classList.toggle("dev-mode", saved.dev);
          devToggle.classList.toggle("is-unlocked", saved.unlocked);
          if (saved.devLabel) devToggle.setAttribute("aria-label", saved.devLabel);
          devOverlay.hidden = saved.overlayHidden;
          devOverlay.classList.toggle("is-side", saved.overlaySide);
          devModalBody.innerHTML = saved.modalBody;
          status.textContent = saved.statusText;
          zoomReadout.textContent = saved.zoomText;
          watermarkEl.hidden = saved.watermarkHidden;
          saved.watermarkNodes.forEach((node) => watermarkEl.appendChild(node));
          saved.spareFonts.forEach((link) => document.head.appendChild(link));
          render();
          updateVisibility();
          applyCamera(0);
        }
        return result;
      }

      function exportHtml(name) {
        const filename = exportFileName(name, ".html");
        const seedEl = document.getElementById("map-seed");
        const html = withPristineDom(() => {
          // Escapar "<" impede que um rótulo contendo uma tag de fechamento
          // de script encerre o bloco do seed e quebre o arquivo exportado —
          // o parser HTML fecha no primeiro que encontrar, mesmo dentro de
          // uma string. < é JSON válido e volta como "<" no parse.
          seedEl.textContent = JSON.stringify(buildEnvelope()).replace(/</g, "\\u003c");
          return "<!doctype html>\n" + document.documentElement.outerHTML;
        });

        unsavedChanges = false;   // antes do download, como em exportJson
        downloadFile(filename, "text/html;charset=utf-8", html);
        status.textContent = "Mapa exportado como página autocontida: " + filename + ".";
      }

      function applyImportedRoot(rootData, origem) {
        adoptRoot(rootData);
        fitCoreSize();   // rótulo novo no tronco: o render já sai com o raio certo
        render();
        updateVisibility();
        releaseCameraControl();
        fitCamera(420);
        markChanged();
        status.textContent = "Mapa importado de " + origem + ".";
      }

      importFile.addEventListener("change", () => {
        const file = importFile.files && importFile.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          let envelope = null;
          let rootData = null;
          try {
            envelope = JSON.parse(String(reader.result));
            rootData = readEnvelope(envelope);
          } catch (e) {
            rootData = null;
          }
          if (!rootData) {
            window.alert("Arquivo inválido: não parece um mapa exportado por esta página.");
          } else if (window.confirm("Importar substitui o mapa atual por inteiro. Continuar?")) {
            adoptTheme(envelope);
            applyImportedRoot(rootData, file.name);
            closeDevOverlay();
          }
          importFile.value = "";
        };
        reader.readAsText(file);
      });

          <form id="data-export-form" class="dev-data-actions">

            <button id="data-export-html" type="submit" class="dev-btn dev-btn-primary">Exportar página autocontida (.html)</button>
            <p class="dev-data-hint" style="margin:-0.35rem 0 0.2rem;">Baixa uma cópia do programa com o mapa embutido: abre pronto em qualquer computador, sem importar nada.</p>
            <button id="data-export-json" type="button" class="dev-btn dev-btn-ghost">Exportar dados (.json)</button>
            <button id="data-import-json" type="button" class="dev-btn dev-btn-ghost">Importar dados (.json)</button>
          </form>
        `;
        // O nome é lido antes de exportar: exportHtml esvazia o painel para
        // capturar a página, e o campo some junto. Enter no campo exporta o
        // .html, que é o botão principal.
        const nameInput = document.getElementById("data-export-name");
